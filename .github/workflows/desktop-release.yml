# Build Throughline Desktop for macOS, Windows, and Linux.
# Trigger: push a tag like v0.1.1, or run manually from Actions.
#
# macOS notarization (optional): set repo secrets
#   APPLE_ID, APPLE_PASSWORD (app-specific), APPLE_TEAM_ID=WC44W2QVE4
# plus APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD if the runner
# does not already have Developer ID Application in its keychain.
# Local Mac builds use the signingIdentity in tauri.conf.json.

name: Desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/update (e.g. v0.1.1). Leave empty to upload artifacts only."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            args: "--target aarch64-apple-darwin"
            name: macOS (Apple Silicon)
          - platform: macos-13
            args: "--target x86_64-apple-darwin"
            name: macOS (Intel)
          - platform: windows-latest
            args: ""
            name: Windows
          - platform: ubuntu-22.04
            args: ""
            name: Linux

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install Rust (macOS Apple Silicon)
        if: matrix.platform == 'macos-14'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install Rust (macOS Intel)
        if: matrix.platform == 'macos-13'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Install Rust
        if: ${{ !startsWith(matrix.platform, 'macos') }}
        uses: dtolnay/rust-toolchain@stable

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2.8" --locked

      - name: Sync web app into desktop shell
        run: bash ./scripts/sync-desktop.sh

      - name: Build
        working-directory: desktop
        env:
          # Hosted runners lack the local Developer ID. Override conf to ad-hoc
          # unless secrets supply a real identity + (usually) a .p12.
          # Notarization runs only when APPLE_ID / PASSWORD / TEAM_ID are set.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || (startsWith(matrix.platform, 'macos') && '-' || '') }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: cargo tauri build ${{ matrix.args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: throughline-${{ matrix.platform }}
          path: |
            desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/**/release/bundle/macos/*.app
            desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            desktop/src-tauri/target/**/release/bundle/deb/*.deb
            desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Collect installers
        run: |
          mkdir -p release
          find dist -type f \( \
            -name '*.dmg' -o -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' \
          \) -exec cp -v {} release/ \;
          ls -la release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Throughline Desktop ${{ inputs.tag || github.ref_name }}
          draft: true
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
