  <button class="card${nb.featured?' featured':''}${isPhoneFriendly(nb)?' phone-ok':''}" data-nb="${nb.id}"
    style="--i:${Math.min(i,24)}">
    <p class="eyebrow"><span class="gl">${REALMS[nb.realm]?.icon ?? ''}</span>${esc(nb.teaches)}</p>
    <h3>${esc(nb.title)}</h3>
    <p>${esc(nb.blurb)}</p>
    <div class="card-foot">
      <span>${esc(t('cells',{n:nb.cells.length}))}</span>
      ${isPhoneFriendly(nb)?'<span class="tag phone">Phone</span>':''}
      ${nb.cells.some(c=>c.gate)?'<span class="tag loop">↩ loops</span>':''}
      ${nb.cells.some(c=>c.choice || c.output?.type==='choice')?'<span class="tag loop">⌥ choice</span>':''}
      ${nb.cells.some(c=>c.map)?'<span class="tag loop">⇉ map</span>':''}
      ${nb.cells.some(c=>c.ask)?'<span class="tag loop">✎ ask</span>':''}
      ${nb.persona && PERSONAS[nb.persona]?`<span class="tag">${esc(PERSONAS[nb.persona].name)}</span>`:''}
      ${nb.tags.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}
    </div>
  </button>`;

const matches = nb => {
  if (F.pace === 'phone' && !isPhoneFriendly(nb)) return false;
  if (F.realm && nb.realm !== F.realm) return false;
  if (F.concept && nb.concept !== F.concept) return false;
  if (F.persona && nb.persona !== F.persona) return false;
  if (!F.q) return true;
  const hay = `${nb.title} ${nb.blurb} ${nb.teaches} ${(nb.tags||[]).join(' ')} ${PERSONAS[nb.persona]?.name||''}`.toLowerCase();
  return F.q.toLowerCase().split(/\s+/).every(w => hay.includes(w));
};

const SORTS = {
  default:  {name:'Curated',      fn:(a,b)=>0},
  az:       {name:'A–Z',          fn:(a,b)=>a.title.localeCompare(b.title)},
  shortest: {name:'Fewest cells', fn:(a,b)=>a.cells.length-b.cells.length},
  longest:  {name:'Most cells',   fn:(a,b)=>b.cells.length-a.cells.length},
  phone:    {name:'Phone-friendly first', fn:(a,b)=>(isPhoneFriendly(b)|0)-(isPhoneFriendly(a)|0) || a.cells.length-b.cells.length}
};

/* Counts come from the CURRENT result set, not the whole library, so a chip
   never offers a filter that would return nothing. */
function facetCounts(){
  /* Counts over the whole filtered set (query + other axes), never the
     visible page slice — chips must not lie when the grid is windowed. */
  const r = {}, c = {}, p = {};
  for (const nb of NOTEBOOKS){
    if (F.pace === 'phone' && !isPhoneFriendly(nb)) continue;
    const qOk = !F.q || matches({...nb, realm:null, concept:null, persona:null});
    if (!qOk) continue;
    const realmOk = !F.realm || nb.realm === F.realm;
    const conceptOk = !F.concept || nb.concept === F.concept;
    const personaOk = !F.persona || nb.persona === F.persona;
    if (conceptOk && personaOk) r[nb.realm] = (r[nb.realm]??0)+1;
    if (realmOk && personaOk) c[nb.concept] = (c[nb.concept]??0)+1;
    if (realmOk && conceptOk) p[nb.persona] = (p[nb.persona]??0)+1;
  }
  return {r, c, p};
}

function renderLibrary(){
  const results = NOTEBOOKS.filter(matches).sort(SORTS[F.sort].fn);
  const {r:rc, c:cc, p:pc} = facetCounts();
  const filtering = !!(F.q || F.realm || F.concept || F.persona || F.sort !== 'default' || F.pace);
  const phoneCount = NOTEBOOKS.filter(isPhoneFriendly).length;
  const shown = results.slice(0, S.libShown || LIB_PAGE);
  view.innerHTML = `
    <header class="hero">
      <p class="eyebrow">${esc(t('libEyebrow'))}</p>
      <h1>${esc(t('libTitle'))}</h1>
      <p class="lede">${esc(t('libLede'))}</p>
      <p class="hero-count">${NOTEBOOKS.length} notebooks · ${
        new Set(NOTEBOOKS.map(n=>n.persona).filter(Boolean)).size} personas · ${
        new Set(NOTEBOOKS.map(n=>n.realm)).size} realms · ${
        new Set(NOTEBOOKS.map(n=>n.concept)).size} kinds of thinking · nothing to install</p>
      ${libraryStatus==='loading' ? '<p class="fine">Loading the rest of the library…</p>' : ''}
      ${libraryStatus==='error' ? '<p class="error-box" style="margin-block-start:var(--p-space-3)">The full library could not be loaded. These ' + SEED_NOTEBOOKS.length + ' notebooks still run. Check that library.json is next to this page.</p>' : ''}
      ${isMobileClient() ? `<p class="phone-banner" role="status">
        <strong>On a phone:</strong> showing <b>Phone-friendly</b> notebooks by default
        (${phoneCount} short runs — no loops or maps). Downloaded models work; for Run all,
        the guided demo stays the smoothest way to explore. Turn the filter off anytime to see everything.
      </p>` : ''}
      ${(!isMobileClient() && !isDesktopShell()) ? `<p class="phone-banner desktop-cta" role="complementary">
        <strong>Want the version that can do everything?</strong>
        Throughline Desktop is free — company gateways, every provider (no CORS),
        notebooks as real files, keys in your keychain. Nothing we host ever sees your work.
        <a class="btn" style="margin-block-start:var(--p-space-3); display:inline-flex"
           href="https://github.com/mhsenkow/throughline/releases/latest"
           target="_blank" rel="noopener noreferrer">Download for Mac ↗</a>
      </p>` : ''}
      ${isDesktopShell() ? `<p class="phone-banner" role="status">
        <strong>Desktop · free forever.</strong> Native HTTP, disk library, OS keychain.
        Work account gateways are unlocked in Connect.
      </p>` : ''}
    </header>

    ${(() => {
      const marked = NOTEBOOKS.filter(n => markOf(n.id));
      if (!marked.length) return '';
      return `<section class="collection">
        <div class="collection-head">
          <h2>Your marks</h2>
          <p>On this device only. Open one to restore the exact setup you marked.</p>
        </div>
        <div class="shelf">${marked.map(n=>{
          const m = markOf(n.id);
          return `<button class="card mark-card" data-nb="${n.id}" data-restore="1">
            <p class="eyebrow"><span class="verdict v-${m.verdict}"></span>${
              m.verdict==='works'?'Worked':m.verdict==='mixed'?'Mixed':'Didn\u2019t work'}</p>
            <h3>${esc(n.title)}</h3>
            <p>${m.note ? esc(m.note) : esc(n.blurb)}</p>
            <div class="card-foot">
              <span>${esc(BRANDS[m.setup?.brand]?.name ?? '—')}</span>
              <span>${esc(LOCALES[m.setup?.locale]?.name ?? '—')}</span>
              <span>${esc(new Date(m.at).toLocaleDateString())}</span>
            </div>
          </button>`;}).join('')}</div>
      </section>`;
    })()}

    ${(() => {
      const shelf = NOTEBOOKS.filter(n => n.featured);
      if (!shelf.length) return '';
      const mobile = isMobileClient() || F.pace === 'phone';
      const phoneShelf = shelf.filter(isPhoneFriendly);
      const lead = (mobile && phoneShelf[0])
        || shelf.find(n => n.id === 'until-it-holds')
        || shelf[0];
      const rest = (mobile ? phoneShelf : shelf).filter(n => n.id !== lead.id);
      const aside = (mobile && isPhoneFriendly(lead))
        ? `<p class="eyebrow">Why this one on a phone</p>
        <p>Short, linear, no loops. You can Run all with the guided demo in seconds,
        or try your downloaded model cell by cell. Looping notebooks are still in the
        full library when you turn off <b>Phone-friendly</b>.</p>`
        : `<p class="eyebrow">What makes it different</p>
        <p>Most notebooks run top to bottom once. This one has a <b>gate</b>: a cell
        that judges the work and, if it does not hold, sends the run back to an
        earlier cell with a revision — up to three times, every pass visible.
        A loop is still a cell type, not a canvas.</p>`;
      return `<section class="feature">
      <div class="feature-body">
        <p class="eyebrow">${mobile && isPhoneFriendly(lead) ? 'Start here on a phone' : 'Start here'}</p>
        <h2>${esc(lead.title)}</h2>
        <p>${esc(lead.blurb)}</p>
        <button class="btn" data-nb="${lead.id}">Open ${esc(lead.title)}</button>
      </div>
      <div class="feature-aside">${aside}</div>
    </section>
    ${rest.length ? `<section class="collection">
      <div class="collection-head">
        <h2>${mobile ? 'Phone-friendly picks' : 'Curated shelf'}</h2>
        <p>${mobile
          ? 'Short notebooks that explore cleanly on Android and iPhone — including with a downloaded model.'
          : 'Hand-picked for distinct capabilities — critique, choice, ask, map, money, teaching, and authorship.'}</p>
      </div>
      <div class="shelf">${rest.map((n,i) => cardHTML(n, i)).join('')}</div>
    </section>` : ''}`;
    })()}

    <div class="browse" id="browse">
      <div class="filter-bar">
        <div class="search">
          <input type="search" id="q" placeholder="Search ${NOTEBOOKS.length} notebooks…" value="${esc(F.q)}" aria-label="Search notebooks">
        </div>
        <label class="sort">
          <span class="eyebrow">Sort</span>
          <select id="sort">${Object.entries(SORTS).map(([k,v])=>
            `<option value="${k}" ${F.sort===k?'selected':''}>${esc(v.name)}</option>`).join('')}</select>
        </label>
        ${filtering ? `<button class="ghost" id="clear-filters">Clear</button>` : ''}
      </div>

      <div class="facet">
        <span class="facet-label">Pace</span>
        <div class="chips">
          <button class="chip-btn" data-pace="phone" aria-pressed="${F.pace==='phone'}"
            title="At most four cells, no loops or maps — kinder to phone browsers">
            Phone-friendly<span class="ct">${phoneCount}</span></button>
          <button class="chip-btn" data-pace="" aria-pressed="${!F.pace}"
            title="Show every notebook">All<span class="ct">${NOTEBOOKS.length}</span></button>
        </div>
      </div>
      ${Object.keys(rc).length || F.realm ? `<div class="facet">
        <span class="facet-label">Realm</span>
        <div class="chips">
          ${Object.entries(REALMS).filter(([k])=>rc[k] || F.realm===k).map(([k,v])=>`
            <button class="chip-btn" data-realm="${k}" aria-pressed="${F.realm===k}">
              <span class="gl">${v.icon}</span>${esc(v.name)}<span class="ct">${rc[k] ?? 0}</span></button>`).join('')}
        </div>
      </div>` : ''}
      ${Object.keys(pc).length || F.persona ? `<div class="facet">
        <span class="facet-label">Persona</span>
        <div class="chips">
          ${Object.entries(PERSONAS).filter(([k])=>pc[k] || F.persona===k).map(([k,v])=>`
            <button class="chip-btn" data-persona="${k}" aria-pressed="${F.persona===k}"
              title="${esc(v.note)}">${esc(v.name)}<span class="ct">${pc[k] ?? 0}</span></button>`).join('')}
        </div>
      </div>` : ''}
      ${Object.keys(cc).length || F.concept ? `<div class="facet">
        <span class="facet-label">Concept</span>
        <div class="chips">
          ${Object.entries(CONCEPTS).filter(([k])=>cc[k] || F.concept===k).map(([k,v])=>`
            <button class="chip-btn" data-concept="${k}" aria-pressed="${F.concept===k}"
              title="${esc(v.note)}">${esc(v.name)}<span class="ct">${cc[k] ?? 0}</span></button>`).join('')}
        </div>
      </div>` : ''}

      <p class="result-count">${results.length} of ${NOTEBOOKS.length}${
        F.pace==='phone'?` · Phone-friendly`:''}${
        F.persona?` · ${esc(PERSONAS[F.persona].name)}`:''}${
        F.realm?` · ${esc(REALMS[F.realm].name)}`:''}${F.concept?` · ${esc(CONCEPTS[F.concept].name)}`:''}</p>

      ${results.length ? `<div class="shelf" id="grid">${
        shown.map((nb,i)=>cardHTML(nb,i)).join('')}</div>
        ${shown.length < results.length ? `<p class="result-count" id="lib-more">Showing ${shown.length} of ${results.length} — scroll for more</p>` : ''}`
      : `<div class="empty">
          <p>Nothing matches all of those at once.</p>
          <div class="empty-outs">
            ${F.q ? `<button class="btn secondary" data-drop="q">Drop “${esc(F.q)}”</button>`:''}
            ${F.persona ? `<button class="btn secondary" data-drop="persona">Drop ${esc(PERSONAS[F.persona].name)}</button>`:''}
            ${F.realm ? `<button class="btn secondary" data-drop="realm">Drop ${esc(REALMS[F.realm].name)}</button>`:''}
            ${F.concept ? `<button class="btn secondary" data-drop="concept">Drop ${esc(CONCEPTS[F.concept].name)}</button>`:''}
            <button class="btn secondary" id="clear-empty">Clear all</button>
          </div>
        </div>`}
    </div>

    ${desktopStrip()}
    ${footer()}`;
  /* Re-render through a view transition where available: the browser
     cross-fades and slides the cards that moved, for free and correctly.
     Everywhere else the stagger below carries it. */
  const refilter = () => {
    if (!document.startViewTransition || matchMedia('(prefers-reduced-motion: reduce)').matches)
      return render();
    const vt = document.startViewTransition(() => render());
    /* An interrupted transition REJECTS. Clicking two chips quickly is normal
       use, not an error — and an uncaught rejection here would surface as a
       console error on a page that is working correctly. */
    vt.finished.catch(() => {});
    vt.ready.catch(() => {});
  };
  const q = $('#q');
  if (q){
    let timer;
    q.oninput = () => { clearTimeout(timer); timer = setTimeout(() => {
      F.q = q.value; render();
      const f = $('#q'); if (f){ f.focus(); f.setSelectionRange(f.value.length, f.value.length); }
    }, 160); };
  }
  const sort = $('#sort');
  if (sort) sort.onchange = () => { F.sort = sort.value; refilter(); };
  view.querySelectorAll('[data-concept]').forEach(b => b.onclick = () => {
    F.concept = F.concept === b.dataset.concept ? null : b.dataset.concept; S.libShown = LIB_PAGE; refilter(); });
  view.querySelectorAll('[data-persona]').forEach(b => b.onclick = () => {
    F.persona = F.persona === b.dataset.persona ? null : b.dataset.persona; S.libShown = LIB_PAGE; refilter(); });
  view.querySelectorAll('[data-realm]').forEach(b => b.onclick = () => {
    F.realm = F.realm === b.dataset.realm ? null : b.dataset.realm; S.libShown = LIB_PAGE; refilter(); });
  view.querySelectorAll('[data-pace]').forEach(b => b.onclick = () => {
    const v = b.dataset.pace;
    F.pace = v === 'phone' ? 'phone' : null;
    S.libShown = LIB_PAGE; refilter();
  });
  const clearF = () => {
    F.q=''; F.realm=null; F.concept=null; F.persona=null; F.sort='default';
    F.pace = null; S.libShown = LIB_PAGE; refilter();
  };
  $('#clear-filters') && ($('#clear-filters').onclick = clearF);
  $('#clear-empty')   && ($('#clear-empty').onclick   = clearF);
  /* Undo one filter at a time — a dead end should offer the step back, not
     only a full reset. */
  view.querySelectorAll('[data-drop]').forEach(b => b.onclick = () => {
    F[b.dataset.drop] = b.dataset.drop === 'q' ? '' : null; S.libShown = LIB_PAGE; refilter(); });

  view.querySelectorAll('[data-nb]').forEach(el =>
    el.onclick = () => {
      S.nbId = el.dataset.nb; S.view='notebook';
      if (el.dataset.restore) restoreMark(NOTEBOOKS.find(n=>n.id===S.nbId));
      render(); scrollTop();
    });

  /* Extend the card window as the user scrolls the workspace. */
  const onScroll = () => {
    if ((S.libShown || LIB_PAGE) >= results.length) return;
    const near = workspace.scrollTop + workspace.clientHeight > workspace.scrollHeight - 400;
    if (near){ S.libShown = (S.libShown || LIB_PAGE) + LIB_PAGE; render(); }
  };
  workspace.onscroll = onScroll;
}

/* ── Notebook view ──────────────────────────────────────────────────── */
function renderNotebook(){
  const nb = NOTEBOOKS.find(n=>n.id===S.nbId);
  if (!nb){
    view.innerHTML = `<p class="error-box">Notebook not loaded yet. ${libraryStatus==='loading'?'Still fetching the library…':'Return to the library and try again.'}</p>
      <button class="ghost" id="back">${esc(t('back'))}</button>`;
    $('#back').onclick = () => { S.view='library'; S.nbId=null; render(); scrollTop(); };
    return;
  }
  const run = getRun(nb);
  const inKey = 'input.' + nb.input.id;
  const wantsImage = nb.input.accepts === 'image';
  const curImage = isImageVal(run.bag[inKey]) ? run.bag[inKey] : null;
  const busy = Object.values(run.cells).some(c=>c.state==='running'||c.state==='streaming'||c.state==='waiting');
  view.innerHTML = `
    <button class="ghost" id="back" style="margin-block-end:var(--p-space-4)">${esc(t('back'))}</button>
    <article class="doc">
    <!-- Tools live with the document and travel with it. The rail straddles
         the sheet's edge: half on the page, half on the canvas — present
         without taking a place in the reading column. -->
    <div class="doc-rail" aria-hidden="false">
      <div class="doc-tools" role="group" aria-label="Notebook actions">
        <button class="tool" id="share"><span class="lbl">Share</span>${ICONS.share}</button>
        <button class="tool" id="export"><span class="lbl">${esc(t('exportNb'))}</span>${ICONS.save}</button>
        <button class="tool" id="clear"><span class="lbl">${esc(t('clearRun'))}</span>${ICONS.clear}</button>
        <button class="tool ${S.editing?'on':''}" id="edit" aria-pressed="${!!S.editing}">
          <span class="lbl">Customise</span>${ICONS.edit}</button>
      </div>
    </div>
    <div class="doc-head">
    <div class="nb-head">
      <div class="nb-title">
        <p class="eyebrow">${esc(nb.teaches)}</p>
        <h1 style="margin-block-start:var(--p-space-2)">${esc(nb.title)}</h1>
        <p class="lede">${esc(nb.blurb)}</p>
        ${isEdited(nb.id) ? `<p class="forked">
          <span class="verdict v-mixed"></span>Your copy — ${
            Object.keys(editsFor(nb.id)).length} cell${Object.keys(editsFor(nb.id)).length===1?'':'s'} changed.
          <button class="linkbtn" id="reset-edits">Reset to the original</button>
        </p>`:''}
      </div>
      <div class="nb-actions">
        <button class="btn primary" id="run-all" ${busy?'disabled':''}>
          ${ICONS.run}<span class="lbl">${esc(busy?t('running'):t('runAll'))}</span></button>

      </div>
    </div>
    ${isMobileClient() ? `<p class="phone-banner compact" role="note">
      ${isPhoneFriendly(nb)
        ? 'Phone-friendly notebook — Run all is happiest with the <b>guided demo</b>; your downloaded model is fine cell by cell.'
        : 'This one loops or runs long. On a phone, prefer the <b>guided demo</b> for Run all, or run cells one at a time with your downloaded model.'}
    </p>` : ''}

    </div>

    <div class="cell">
      <div class="cell-head">
        <span class="cell-index">00</span>
        <div class="cell-titles">
          <h3>${esc(nb.input.label)}</h3>
          <div class="io-line"><span><b>out</b> input.${esc(nb.input.id)} · ${wantsImage ? 'image' : 'text'}</span></div>
        </div>
      </div>
      <div class="cell-body">
        ${wantsImage ? `
        <div class="attach" id="attach">
          <label class="dropzone ${curImage ? 'has' : ''}" for="nb-image" id="dropzone">
            ${curImage ? `<img src="${esc(curImage.src)}" alt="${esc(curImage.alt || '')}">` : ''}
            <span class="dz-hint">${curImage
              ? esc(curImage.source === 'sample' ? 'Sample picture — drop your own over it' : curImage.alt || 'Your picture')
              : 'Drop a picture here, paste one, or choose a file'}</span>
          </label>
          <input type="file" id="nb-image" accept="image/*" hidden>
          <p class="fine">Pictures are scaled to ${ATTACH_MAX}px and held in this tab.
            They are sent only to the model you pick for a cell that reads them, and only when you run it.
            ${curImage && curImage.source !== 'sample' ? '<button type="button" class="linkbtn" id="attach-reset">Put the sample back</button>' : ''}</p>
        </div>` : ''}
        <textarea id="nb-input" placeholder="${esc(nb.input.placeholder)}">${esc(
          wantsImage ? (curImage?.note ?? '') : (run.bag['input.'+nb.input.id] ?? nb.input.seed))}</textarea>
      </div>
    </div>

    <div class="cells">${nb.cells.map((c,i)=>cellHTML(nb,c,i,run)).join('')}</div>
    ${markHTML(nb)}
    </article>

    <details class="vars"><summary>${esc(t('vars'))}</summary>
      <div class="var-table">${varRows(nb,run)}</div></details>
    ${desktopStrip()}
    ${footer()}`;

  $('#back').onclick = () => { S.view='library'; S.nbId=null; render(); scrollTop(); };
  const ta = $('#nb-input');
  const staleFromInput = () => {
    for (const c of nb.cells) if (c.inputs.includes(inKey)){
      for (const id of [c.id, ...downstream(nb,c.id)]){
        const st = run.cells[id]; if (st.state==='done') st.state='stale';
      }
    }
  };
  const commit = () => {
    const prev = run.bag[inKey];
    /* With a picture attached the note is one field of one typed value, not a
       second variable — so a cell still declares exactly one input. */
    const next = wantsImage
      ? {...(isImageVal(prev) ? prev : seedValue(nb)), note: ta.value}
      : ta.value;
    const same = wantsImage
      ? (isImageVal(prev) && prev.src === next.src && prev.note === next.note)
      : prev === next;
    if (same) return;
    run.bag[inKey] = next;
    staleFromInput();
    render();
  };
  ta.onblur = commit;

  if (wantsImage){
    const dz = $('#dropzone'), file = $('#nb-image');
    const take = async (f) => {
      try {
        run.bag[inKey] = await fileToImageValue(f, ta.value);
        staleFromInput(); render();
      } catch(e){ toast(e.message || String(e)); }
    };
    file.onchange = () => { if (file.files?.[0]) take(file.files[0]); };
    dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('over'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('over'));
    dz.addEventListener('drop', e => {
      e.preventDefault(); dz.classList.remove('over');
      const f = e.dataTransfer?.files?.[0]; if (f) take(f);
    });
    /* Paste anywhere in the notebook, because that is how a screenshot
       actually arrives — from the clipboard, not from a file dialog. */
    view.addEventListener('paste', e => {
      const item = [...(e.clipboardData?.items ?? [])].find(i => i.type.startsWith('image/'));
      if (!item) return;
      e.preventDefault();
      const f = item.getAsFile(); if (f) take(f);
    });
    const rst = $('#attach-reset');
    if (rst) rst.onclick = () => { run.bag[inKey] = seedValue(nb); staleFromInput(); render(); };
  }

  $('#run-all').onclick = async () => {
    commit();
    const mode = await confirmMobileRunAll(nb);
    const prev = S.provider;
    if (mode === 'demo') S.provider = 'demo';
    try {
      await runAll(nb, run, render);
    } finally {
      if (mode === 'demo') S.provider = prev;
      render();
    }
  };
  view.querySelectorAll('[data-mark]').forEach(b => b.onclick = () => {
    const v = b.dataset.mark;
    saveMark(nb, v === 'clear' ? null : v, markOf(nb.id)?.note);
  });
  const note = $('#mark-note');
  if (note) note.onblur = () => {
    const m = markOf(nb.id); if (m && m.note !== note.value) saveMark(nb, m.verdict, note.value);
  };
  $('#share').onclick = e => copyShare(nb, e.currentTarget);
  $('#export').onclick = () => exportNotebook(nb, run);
  $('#clear').onclick = () => { delete S.runs[nb.id]; render(); };
  $('#edit').onclick = () => { S.editing = !S.editing; render(); };
  const rst = $('#reset-edits');
  if (rst) rst.onclick = () => resetEdits(nb.id);
  view.querySelectorAll('[data-toggle]').forEach(b => b.onclick = () => {
    const id = b.dataset.toggle;
    const turningOff = !isOff(nb.id, {id});
    if (turningOff) invalidateFrom(nb, getRun(nb), id);
    setEdit(nb.id, id, {off: turningOff ? true : null});
  });
  view.querySelectorAll('[data-revert]').forEach(b => b.onclick = () => {
    delete (S.edits[nb.id] ?? {})[b.dataset.revert];
    if (!Object.keys(S.edits[nb.id] ?? {}).length) delete S.edits[nb.id];
    saveEdits(); render();
  });
  view.querySelectorAll('[data-type]').forEach(el => el.onchange = () => {
    const raw = nb.cells.find(c=>c.id===el.dataset.type);
    setEdit(nb.id, el.dataset.type, {outType: el.value === raw.output.type ? null : el.value});
  });
  view.querySelectorAll('[data-prompt]').forEach(el => el.onblur = () => {
    const raw = nb.cells.find(c=>c.id===el.dataset.prompt);
    setEdit(nb.id, el.dataset.prompt, {prompt: el.value.trim() === raw.prompt.trim() ? null : el.value});
  });
  view.querySelectorAll('[data-cellprov]').forEach(el => el.onchange = () => {
    const id = el.dataset.cellprov;
    if (el.value) S.cellProvider[id] = el.value; else delete S.cellProvider[id];
    render();
  });
  view.querySelectorAll('[data-upgrade]').forEach(el => el.onclick = () => {
    S.sheet = 'settings'; renderSheet();
  });
  view.querySelectorAll('[data-run]').forEach(el => el.onclick = async () => {
    commit();
    const cell = nb.cells.find(c=>c.id===el.dataset.run);
    await execCell(nb, cell, getRun(nb), render);
  });
  const valueOf = id => getRun(nb).cells[id]?.value;
  const slug = str => String(str).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  view.querySelectorAll('[data-scene-mode]').forEach(b => b.onclick = () => {
    const cam = S.scenes[b.dataset.sceneMode] ??= defaultView();
    cam.solid = !cam.solid; render();
  });
  view.querySelectorAll('[data-scene-reset]').forEach(b => b.onclick = () => {
    S.scenes[b.dataset.sceneReset] = defaultView(); render();
  });
  view.querySelectorAll('[data-scene-obj]').forEach(b => b.onclick = () => {
    const id = b.dataset.sceneObj, v = valueOf(id);
    if (isSceneVal(v)) saveFile(`${nb.id}-${slug(id)}.obj`, sceneOBJ(v, nb.title), 'model/obj');
  });
  view.querySelectorAll('[data-scene-stl]').forEach(b => b.onclick = () => {
    const id = b.dataset.sceneStl, v = valueOf(id);
    if (isSceneVal(v)) saveFile(`${nb.id}-${slug(id)}.stl`, sceneSTL(v, nb.title), 'model/stl');
  });
  view.querySelectorAll('[data-img-save]').forEach(b => b.onclick = () => {
    const id = b.dataset.imgSave;
    const v = id === '__input' ? getRun(nb).bag['input.' + nb.input.id] : valueOf(id);
    if (isImageVal(v)){
      const ext = (dataUrlParts(v.src)?.mime.split('/')[1] || 'png').replace('svg+xml', 'svg');
      saveDataURL(`${nb.id}-${slug(id)}.${ext}`, v.src);
    }
  });
  view.querySelectorAll('[data-choose]').forEach(btn => btn.onclick = async () => {
    const cell = nb.cells.find(c=>c.id===btn.dataset.choose);
    const run = getRun(nb);
    const st = run.cells[cell.id];
    const val = {...(st.value || {}), selected: btn.dataset.opt};
    st.value = val; st.state = 'done';
    run.bag[cell.output.name] = val;
    if (cell.choice?.writes){
      const opt = (val.options||[]).find(o=>o.id===val.selected);
      run.bag[cell.choice.writes] = opt ? opt.label : val.selected;
    }
    for (const id of downstream(nb, cell.id)){
      const d = run.cells[id];
      if (d.state==='done' || d.state==='streaming') d.state='stale';
    }
    render();
    /* Resume after this cell — restarting at 0 would re-run the choice and
       wipe selected back to null. */
    const next = nb.cells.findIndex(c => c.id === cell.id) + 1;
    await runAll(nb, run, render, next);
  });
  view.querySelectorAll('[data-ask-go]').forEach(btn => btn.onclick = async () => {
    const id = btn.dataset.askGo;
    const cell = nb.cells.find(c=>c.id===id);
    const ta = view.querySelector(`[data-ask="${id}"]`);
    const text = (ta?.value || '').trim();
    if (!text) return;
    const run = getRun(nb);
    const st = run.cells[id];
    st.value = text; st.state = 'done';
    run.bag[cell.output.name] = text;
    for (const did of downstream(nb, id)){
      const d = run.cells[did];
      if (d.state==='done' || d.state==='streaming') d.state='stale';
    }
    render();
    const next = nb.cells.findIndex(c => c.id === id) + 1;
    await runAll(nb, run, render, next);
  });
}

function cellHTML(nb, raw, i, run){
  const cell = eff(nb.id, raw);
  const off = isOff(nb.id, raw);
  const o = editsFor(nb.id)[raw.id] ?? {};
  const st = run.cells[cell.id];
  if (off) return `
    <section class="cell off" data-state="off">
      <div class="cell-head">
        <span class="cell-index">${String(i+1).padStart(2,'0')}</span>
        <div class="cell-titles"><h3>${esc(cell.title)}</h3>
          <p class="cell-intent">Skipped. Cells that read <code>${esc(cell.output.name)}</code> cannot run.</p></div>
        <button class="btn secondary tiny" data-toggle="${raw.id}">Re-enable</button>
      </div>
    </section>`;
  const canRun = ready(nb, cell, run) && !st.ctrl && !anyBusy(run);
  const ins = cell.inputs.map(r=>`<span><b>in</b> ${esc(r)}</span>`).join('');
  return `
  <section class="cell" data-state="${st.state}">
    <div class="cell-head">
      <span class="cell-index">${String(i+1).padStart(2,'0')}</span>
      <div class="cell-titles">
        <h3>${esc(cell.title)}</h3>
        <p class="cell-intent">${esc(cell.intent)}</p>
        <div class="io-line">${ins}<span><b>out</b> ${esc(cell.output.name)} · ${esc(cell.output.type)}</span><span><b>needs</b> ${esc(cell.requires)}</span></div>
      </div>
      ${st.pass > 1 ? `<span class="badge pass-badge">pass ${st.pass}</span>` : ''}
      <span class="badge" data-s="${st.state}">${esc(st.state)}</span>
    </div>
    <div class="cell-body">
      ${st.state==='stale' ? `<div class="stale-note">⚠ ${esc(t('staleNote'))}</div>`:''}
      ${st.error ? `<div class="error-box">${esc(st.error)}</div>` : ''}
      ${belowClass(cell) && st.state!=='error' ? classNotice(cell) : ''}
      ${st.raw ? `<pre class="raw">${esc(st.raw)}<span class="caret"></span></pre>` : ''}
      ${st.state==='waiting' && cell.ask ? outputHTML(st.value ?? '', 'prose', false, cell, st)
        : st.value!=null ? outputHTML(st.value, cell.output.type, st.state==='streaming'||st.state==='waiting', cell, st)
        : (st.raw ? '' : st.state==='running'?'<p class="meta">…</p>':`<p class="meta">${esc(t('emptyOut'))}</p>`)}
    </div>
    ${S.editing ? `
    <div class="cell-edit">
      <div class="edit-row">
        ${raw.gate || ['gate','choice','score','diff','ranking','timeline','image','scene','diagram','chart'].includes(raw.output.type) || raw.ask || raw.map
          ? `<span class="field-inline"><span class="eyebrow">Output as</span><span>${esc(raw.output.type)}${raw.map?' · map':''}${raw.ask?' · ask':''}</span></span>`
          : `<label class="field-inline">
          <span class="eyebrow">Output as</span>
          <select data-type="${raw.id}">
            ${['prose','list','table','markdown'].map(x=>
              `<option value="${x}" ${cell.output.type===x?'selected':''}>${x}</option>`).join('')}
          </select>
        </label>`}
        <button class="btn secondary tiny" data-toggle="${raw.id}">Skip this cell</button>
        ${Object.keys(o).length ? `<button class="btn secondary tiny" data-revert="${raw.id}">Revert cell</button>`:''}
        <span class="spacer"></span>
        ${Object.keys(o).length ? '<span class="badge pass-badge">edited</span>':''}
      </div>
      <details class="edit-prompt" ${o.prompt?'open':''}>
        <summary>Prompt</summary>
        <textarea data-prompt="${raw.id}" rows="5">${esc(cell.prompt)}</textarea>
        <p class="hint">Changes what a connected model is asked. The guided demo replays its script whatever you write here — that is what makes it a demo.</p>
      </details>
    </div>` : ''}
    <div class="cell-foot">
      <button class="btn secondary tiny" data-run="${cell.id}" ${canRun?'':'disabled'}>
        ${esc(st.state==='done'||st.state==='stale' ? t('reRun') : t('run'))}</button>
      ${st.ms ? `<span class="meta">${st.ms} ms</span>`:''}
      <span class="spacer"></span>
      ${cellPicker(cell)}
    </div>
  </section>`;
}

/* The picker shows the RESOLUTION, not the question. Auto is the default and
   names what it chose; the override is one level down for people who care.
   This is §5.4's demotion, kept intact now that there is something to pick. */
function cellPicker(cell){
  const chosen = resolveFor(cell);
  const auto = !S.cellProvider[cell.id];
  const opts = connected().map(id =>
    `<option value="${id}" ${!auto && S.cellProvider[cell.id]===id ? 'selected':''}>${esc(PROVIDERS[id].label)}</option>`).join('');
  return `<label class="picker" title="Model for this cell">
    <span class="meta">${auto ? 'auto →' : 'pinned'}</span>
    <select data-cellprov="${cell.id}">
      <option value="" ${auto?'selected':''}>Auto — ${esc(PROVIDERS[chosen].label)}</option>
      ${opts}
    </select></label>`;
}

/* Shown only where the ceiling is actually felt: a cell written for a
   capability class the resolved model does not serve. The upgrade belongs
   here, at the point of friction, not in a banner. */
function classNotice(cell){
  const p = PROVIDERS[resolveFor(cell)];
  const better = Object.keys(PROVIDERS)
    .filter(id => PROVIDERS[id].classes.includes(cell.requires) && PROVIDERS[id].tier !== 'blocked' && PROVIDERS[id].tier !== 'demo')
    .sort((a,b)=>TIER_RANK[PROVIDERS[b].tier]-TIER_RANK[PROVIDERS[a].tier])[0];
  return `<div class="class-note">
    <span>This cell asks for <b>${esc(cell.requires)}</b>. ${esc(p.label)} serves ${esc(p.classes.join(', '))} — the answer will be thinner than the cell was written for.</span>
    ${better ? `<button class="btn tiny" data-upgrade="${cell.id}">Connect ${esc(PROVIDERS[better].label)}</button>` : ''}
  </div>`;
}

/* ═════════ ui/media — drawing the non-text outputs ═════════════════════
   Three renderers, no libraries. That is not asceticism: script-src is pinned
   to a hash of this one inline script, so a charting or 3D library could not
   execute here even if it were bundled. What it buys is that a scene, a
   diagram and a chart are all just the typed value drawn with the page's own
   tokens — they re-theme with everything else and there is no second styling
   system to keep in sync. */

const cssVar = (el, name, fallback) => {
  const v = getComputedStyle(el).getPropertyValue(name).trim();
  return v || fallback;
};

/* Wrap a label into short lines. SVG has no text wrapping, and a diagram
   whose labels run off the node is not a diagram. */
function wrapLabel(text, per = 18, max = 3){
  const words = String(text ?? '').split(/\s+/).filter(Boolean);
  const lines = [];
  let cur = '';
  for (const w of words){
    if (!cur) cur = w;
    else if ((cur + ' ' + w).length <= per) cur += ' ' + w;
    else { lines.push(cur); cur = w; if (lines.length === max) break; }
  }
  if (cur && lines.length < max) lines.push(cur);
  const shown = lines.join(' ');
  if (shown.length < words.join(' ').length && lines.length)
    lines[lines.length-1] = lines[lines.length-1].slice(0, per - 1) + '…';
  return lines.length ? lines : ['—'];
}

/* ── Diagram ─────────────────────────────────────────────────────────
   Longest-path layering, which is the standard cheap answer and the right
   one here: these graphs are small, mostly acyclic, and read top to bottom.
   A cycle cannot hang the layout — the depth is capped and a back edge is
   simply drawn as a back edge. */
const NODE_W = 156, NODE_PAD = 12, LINE_H = 15, GAP_X = 26, GAP_Y = 62;

function layoutDiagram(d){
  const adj = new Map(d.nodes.map(n => [n.id, []]));
  const indeg = new Map(d.nodes.map(n => [n.id, 0]));
  for (const e of d.edges){ adj.get(e.from).push(e.to); indeg.set(e.to, indeg.get(e.to) + 1); }
  const layer = new Map();
  const roots = d.nodes.filter(n => !indeg.get(n.id)).map(n => n.id);
  const seeds = roots.length ? roots : d.nodes.slice(0, 1).map(n => n.id);
  const queue = [...seeds];
  for (const id of seeds) layer.set(id, 0);
  let guard = 0;
  while (queue.length && guard++ < 4000){
    const id = queue.shift();
    for (const to of adj.get(id) ?? []){
      const want = (layer.get(id) ?? 0) + 1;
      if (want < 24 && (layer.get(to) ?? -1) < want){ layer.set(to, want); queue.push(to); }
    }
  }
  for (const n of d.nodes) if (!layer.has(n.id)) layer.set(n.id, 0);

  const rows = new Map();
  for (const n of d.nodes){
    const l = layer.get(n.id);
    if (!rows.has(l)) rows.set(l, []);
    rows.get(l).push(n);
  }
  const levels = [...rows.keys()].sort((a,b) => a - b);
  const widest = Math.max(1, ...levels.map(l => rows.get(l).length));
  const W = widest * NODE_W + (widest - 1) * GAP_X;
  const box = new Map();
  let y = 0;
  for (const l of levels){
    const row = rows.get(l);
    const rowW = row.length * NODE_W + (row.length - 1) * GAP_X;
    let x = (W - rowW) / 2;
    let tallest = 0;
    for (const n of row){
      /* A diamond holds about half the text a rectangle of the same size does,
         so decisions get shorter lines and more room rather than overflowing. */
      const diamond = n.kind === 'decision';
      const lines = wrapLabel(n.label, diamond ? 13 : 20, 3);
      const h = NODE_PAD * 2 + lines.length * LINE_H + (n.note ? LINE_H : 0)
        + (diamond ? 26 : 0);
      box.set(n.id, {x, y, w: NODE_W, h, lines, node: n});
      x += NODE_W + GAP_X;
      tallest = Math.max(tallest, h);
    }
    y += tallest + GAP_Y;
  }
  return {box, W, H: Math.max(y - GAP_Y, 1)};
}

function diagramSVG(d){
  if (!d.nodes.length) return '<p class="meta">No diagram came back.</p>';
  const {box, W, H} = layoutDiagram(d);
  const PAD = 14;
  const shape = (b) => {
    const {x, y, w, h, node} = b;
    if (node.kind === 'decision'){
      const cx = x + w/2, cy = y + h/2;
      return `<polygon class="dg-shape dg-decision" points="${cx},${y} ${x+w},${cy} ${cx},${y+h} ${x},${cy}"/>`;
    }
    /* A full h/2 pill on a three-line node curves in under its own text. */
    const r = node.kind === 'start' || node.kind === 'end' ? Math.min(16, h/2) : 7;
    return `<rect class="dg-shape dg-${esc(node.kind)}" x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}"/>`;
  };
  const nodes = [...box.values()].map(b => {
    const block = b.lines.length * LINE_H + (b.node.note ? LINE_H : 0);
    const top = b.y + (b.h - block) / 2 + 11;
    const lines = b.lines.map((ln, i) =>
      `<tspan x="${b.x + b.w/2}" dy="${i ? LINE_H : 0}">${esc(ln)}</tspan>`).join('');
    return `<g>${shape(b)}
      <text class="dg-label" x="${b.x + b.w/2}" y="${top}">${lines}</text>
      ${b.node.note ? `<text class="dg-note" x="${b.x + b.w/2}" y="${top + b.lines.length * LINE_H + 2}">${esc(wrapLabel(b.node.note, 26, 1)[0])}</text>` : ''}
    </g>`;
  }).join('');
  const edges = d.edges.map(e => {
    const a = box.get(e.from), b = box.get(e.to);
    if (!a || !b) return '';
    const forward = b.y > a.y;
    const x1 = a.x + a.w/2, y1 = forward ? a.y + a.h : a.y;
    const x2 = b.x + b.w/2, y2 = forward ? b.y : b.y + b.h;
    const my = (y1 + y2) / 2;
    const path = forward
      ? `M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`
      /* A back edge takes the outside so it cannot be mistaken for the flow. */
      : `M${x1},${y1} C${x1 - 90},${y1} ${x2 - 90},${y2} ${x2},${y2}`;
    const label = e.label
      ? `<text class="dg-edge-label" x="${(x1 + x2)/2}" y="${my - 3}">${esc(wrapLabel(e.label, 16, 1)[0])}</text>` : '';
    return `<path class="dg-edge ${forward ? '' : 'back'}" d="${path}" marker-end="url(#dg-arrow)"/>${label}`;
  }).join('');
  /* Natural size, capped to the column. Fitting a tall flow into a fixed box
     shrinks the labels below readable and gains nothing — a long process is
     long, and scrolling it is the honest answer. */
  return `<div class="diagram-wrap"><svg class="diagram" viewBox="${-PAD} ${-PAD} ${W + PAD*2} ${H + PAD*2}"
    width="${W + PAD*2}" height="${H + PAD*2}"
    role="img" aria-label="Diagram of ${esc(String(d.nodes.length))} steps" preserveAspectRatio="xMidYMid meet">
    <defs><marker id="dg-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" class="dg-arrowhead"/></marker></defs>
    ${edges}${nodes}
  </svg></div>`;
}

/* ── Chart ───────────────────────────────────────────────────────────── */
function niceCeil(x){
  if (!(x > 0)) return 1;
  const e = Math.pow(10, Math.floor(Math.log10(x)));
  const f = x / e;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e;
}
function chartSVG(c){
  if (!c.labels.length || !c.series.length) return `<p class="meta">${esc(c.note || 'No data came back.')}</p>`;
  const W = 720, H = 300, L = 52, R = 14, T = 16, B = 46;
  const all = c.series.flatMap(se => se.values).filter(v => v != null);
  const lo = Math.min(0, ...all), hiRaw = Math.max(0, ...all);
  const hi = niceCeil(hiRaw) || 1;
  const span = (hi - lo) || 1;
  const px = i => L + (c.labels.length === 1 ? (W - L - R)/2
    : (i * (W - L - R)) / (c.labels.length - (c.kind === 'bar' ? 0 : 1)) + (c.kind === 'bar' ? 0 : 0));
  const py = v => T + (H - T - B) * (1 - ((v - lo) / span));
  const ticks = [0, 0.25, 0.5, 0.75, 1].map(f => lo + f * span);
  const grid = ticks.map(v => `<g><line class="ch-grid" x1="${L}" y1="${py(v)}" x2="${W - R}" y2="${py(v)}"/>
    <text class="ch-tick" x="${L - 8}" y="${py(v) + 4}" text-anchor="end">${esc(String(Math.round(v * 100) / 100))}</text></g>`).join('');
  const band = (W - L - R) / c.labels.length;
  const xLabels = c.labels.map((l, i) => {
    const x = c.kind === 'bar' ? L + band * (i + 0.5) : px(i);
    return `<text class="ch-xlabel" x="${x}" y="${H - B + 18}" text-anchor="middle">${esc(wrapLabel(l, 12, 1)[0])}</text>`;
  }).join('');
  let marks = '';
  if (c.kind === 'bar'){
    const n = c.series.length;
    const bw = Math.max(3, (band * 0.72) / n);
    marks = c.series.map((se, si) => se.values.map((v, i) => {
      if (v == null) return '';
      const x = L + band * (i + 0.5) - (bw * n)/2 + bw * si;
      const y0 = py(0), y1 = py(v);
      return `<rect class="ch-bar s${si % 5}" x="${x}" y="${Math.min(y0, y1)}" width="${bw}"
        height="${Math.max(1, Math.abs(y1 - y0))}"><title>${esc(`${se.name} · ${c.labels[i]}: ${v}${c.unit ? ' ' + c.unit : ''}`)}</title></rect>`;
    }).join('')).join('');
  } else {
    marks = c.series.map((se, si) => {
      const pts = se.values.map((v, i) => v == null ? null : `${px(i)},${py(v)}`).filter(Boolean).join(' ');
      const dots = se.values.map((v, i) => v == null ? '' :
        `<circle class="ch-dot s${si % 5}" cx="${px(i)}" cy="${py(v)}" r="3.2"><title>${esc(`${se.name} · ${c.labels[i]}: ${v}${c.unit ? ' ' + c.unit : ''}`)}</title></circle>`).join('');
      return `<polyline class="ch-line s${si % 5}" points="${pts}"/>${dots}`;
    }).join('');
  }
  const legend = c.series.length > 1
    ? `<div class="ch-legend">${c.series.map((se, i) =>
        `<span class="ch-key"><i class="s${i % 5}"></i>${esc(se.name)}</span>`).join('')}</div>` : '';
  return `<div class="chart-wrap">
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img"
      aria-label="${esc(`${c.kind} chart of ${c.series.map(se=>se.name).join(', ')}`)}">
      ${grid}
      <line class="ch-axis" x1="${L}" y1="${py(Math.max(lo, 0))}" x2="${W - R}" y2="${py(Math.max(lo, 0))}"/>
      ${marks}${xLabels}
    </svg>
    ${legend}
    ${c.unit || c.note ? `<p class="ch-note">${esc([c.unit && `Measured in ${c.unit}.`, c.note].filter(Boolean).join(' '))}</p>` : ''}
  </div>`;
}

/* ── Scene ───────────────────────────────────────────────────────────
   Typed geometry, drawn by a painter's-algorithm rasteriser about eighty
   lines long. The point is not the renderer; it is that the value is real
   geometry, so .obj and .stl are a formatting step and not a second feature.
   Every downstream thing — export, re-theme, a text cell reading the scene —
   works off the same objects the model returned. */
const SCENE_PALETTE = ['#8a8fa3','#b08968','#7a9b8e','#a3859b','#98a37a','#6f8fae'];
const SEG = 16;

function shadeHex(hex, k){
  const n = parseInt(hex.slice(1), 16);
  const ch = [(n >> 16) & 255, (n >> 8) & 255, n & 255]
    .map(v => Math.max(0, Math.min(255, Math.round(v * k))));
  return `rgb(${ch.join(',')})`;
}

function sceneTris(scene){
  const tris = [];
  const push = (a, b, c, color) => tris.push({a, b, c, color});
  scene.objects.forEach((o, idx) => {
    const [cx, cy, cz] = o.at;
    const [sx, sy, sz] = o.size;
    const col = o.color || SCENE_PALETTE[idx % SCENE_PALETTE.length];
    const rx = sx/2, rz = sz/2, hy = (o.shape === 'plane' ? 0.002 : sy/2);
    if (o.shape === 'box' || o.shape === 'plane'){
      const v = [[cx-rx,cy-hy,cz-rz],[cx+rx,cy-hy,cz-rz],[cx+rx,cy-hy,cz+rz],[cx-rx,cy-hy,cz+rz],
                 [cx-rx,cy+hy,cz-rz],[cx+rx,cy+hy,cz-rz],[cx+rx,cy+hy,cz+rz],[cx-rx,cy+hy,cz+rz]];
      for (const f of [[0,2,1],[0,3,2],[4,5,6],[4,6,7],[0,1,5],[0,5,4],
                       [1,2,6],[1,6,5],[2,3,7],[2,7,6],[3,0,4],[3,4,7]])
        push(v[f[0]], v[f[1]], v[f[2]], col);
    } else if (o.shape === 'sphere'){
      const RS = 9, SS = 14;
      const at = (i, j) => { const th = Math.PI * i / RS, ph = 2 * Math.PI * j / SS;
        return [cx + rx * Math.sin(th) * Math.cos(ph), cy + hy * Math.cos(th), cz + rz * Math.sin(th) * Math.sin(ph)]; };
      for (let i = 0; i < RS; i++) for (let j = 0; j < SS; j++){
        push(at(i,j), at(i+1,j), at(i+1,j+1), col);
        push(at(i,j), at(i+1,j+1), at(i,j+1), col);
      }
    } else {
      const top = [cx, cy + hy, cz], bot = [cx, cy - hy, cz];
      for (let j = 0; j < SEG; j++){
        const a0 = 2*Math.PI*j/SEG, a1 = 2*Math.PI*(j+1)/SEG;
        const b0 = [cx + rx*Math.cos(a0), cy - hy, cz + rz*Math.sin(a0)];
        const b1 = [cx + rx*Math.cos(a1), cy - hy, cz + rz*Math.sin(a1)];
        push(bot, b1, b0, col);
        if (o.shape === 'cone'){ push(b0, b1, top, col); }
        else {
          const t0 = [b0[0], cy + hy, b0[2]], t1 = [b1[0], cy + hy, b1[2]];
          push(b0, b1, t1, col); push(b0, t1, t0, col);
          push(top, t0, t1, col);
        }
      }
    }
  });
  return tris;
}

function sceneBounds(scene){
  if (!scene.objects.length) return {cx:0, cy:0, cz:0, r:1, span:[0,0,0]};
  let lo = [Infinity,Infinity,Infinity], hi = [-Infinity,-Infinity,-Infinity];
  for (const o of scene.objects) for (let k = 0; k < 3; k++){
    lo[k] = Math.min(lo[k], o.at[k] - o.size[k]/2);
    hi[k] = Math.max(hi[k], o.at[k] + o.size[k]/2);
  }
  const span = [hi[0]-lo[0], hi[1]-lo[1], hi[2]-lo[2]];
  return {cx:(lo[0]+hi[0])/2, cy:(lo[1]+hi[1])/2, cz:(lo[2]+hi[2])/2,
    r: Math.max(0.5, Math.hypot(...span)/2), span, lo, hi};
}

const defaultView = () => ({yaw: -0.62, pitch: 0.42, zoom: 1, solid: true});

function drawScene(canvas, scene, view){
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = Math.max(240, canvas.clientWidth || 480);
  const h = Math.max(200, Math.round(w * 0.58));
  canvas.width = w * dpr; canvas.height = h * dpr;
  canvas.style.height = h + 'px';
  const g = canvas.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);

  const ink = cssVar(canvas, '--ink-primary', '#222');
  const rule = cssVar(canvas, '--border-subtle', '#ddd');
  const b = sceneBounds(scene);
  const scale = view.zoom * Math.min(w, h) / (b.r * 2.5);
  const cy_ = Math.cos(view.yaw), sy_ = Math.sin(view.yaw);
  const cp = Math.cos(view.pitch), sp = Math.sin(view.pitch);
  const proj = (p) => {
    const x = p[0] - b.cx, y = p[1] - b.cy, z = p[2] - b.cz;
    const X = x * cy_ + z * sy_, Z = -x * sy_ + z * cy_;
    const Y2 = y * cp - Z * sp, Z2 = y * sp + Z * cp;
    return [w/2 + X * scale, h/2 - Y2 * scale, Z2];
  };

  /* Ground grid, one line per unit, so the scale is readable without a ruler. */
  if (scene.objects.length){
    const step = Math.max(0.25, niceCeil(Math.max(b.span[0], b.span[2]) / 6));
    const ext = Math.max(b.span[0], b.span[2]) / 2 + step;
    g.strokeStyle = rule; g.lineWidth = 1; g.globalAlpha = 0.75;
    for (let t = -Math.ceil(ext/step); t <= Math.ceil(ext/step); t++){
      const u = t * step;
      for (const seg of [[[b.cx + u, 0, b.cz - ext], [b.cx + u, 0, b.cz + ext]],
                         [[b.cx - ext, 0, b.cz + u], [b.cx + ext, 0, b.cz + u]]]){
        const a = proj(seg[0]), c = proj(seg[1]);
        g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(c[0], c[1]); g.stroke();
      }
    }
    g.globalAlpha = 1;
  }

  const L = [0.38, 0.82, 0.43];
  const tris = sceneTris(scene).map(t => {
    const A = proj(t.a), B = proj(t.b), C = proj(t.c);
    return {A, B, C, color: t.color, z: (A[2] + B[2] + C[2]) / 3,
      n: (() => {
        const u = [t.b[0]-t.a[0], t.b[1]-t.a[1], t.b[2]-t.a[2]];
        const v = [t.c[0]-t.a[0], t.c[1]-t.a[1], t.c[2]-t.a[2]];
        const n = [u[1]*v[2]-u[2]*v[1], u[2]*v[0]-u[0]*v[2], u[0]*v[1]-u[1]*v[0]];
        const m = Math.hypot(...n) || 1;
        return [n[0]/m, n[1]/m, n[2]/m];
      })()};
  });
  /* Painter's algorithm: farthest first. Small scenes of convex primitives are
     exactly the case where this is right and a depth buffer is overkill. */
  tris.sort((p, q) => p.z - q.z);
  for (const t of tris){
    const lam = Math.abs(t.n[0]*L[0] + t.n[1]*L[1] + t.n[2]*L[2]);
    /* Ceiling of 1.0 — past it every light face clips to white and the model
       loses its edges exactly where the light is best. */
    const k = 0.42 + 0.58 * lam;
    g.beginPath();
    g.moveTo(t.A[0], t.A[1]); g.lineTo(t.B[0], t.B[1]); g.lineTo(t.C[0], t.C[1]); g.closePath();
    if (view.solid){ g.fillStyle = shadeHex(t.color, k); g.fill(); }
    else { g.strokeStyle = ink; g.globalAlpha = 0.28; g.lineWidth = 1; g.stroke(); g.globalAlpha = 1; }
  }
  /* Labels last, at each object's top, so a scene reads as a parts list too.
     Nearest first, and a label that would land on one already placed is
     dropped rather than stacked — an unreadable pile of names is worse than
     a few unnamed parts, and the parts list under the canvas has them all. */
  if (view.solid){
    g.font = '500 11px ' + cssVar(canvas, '--font-body', 'system-ui');
    g.textAlign = 'center';
    const placed = [];
    const labels = scene.objects
      .map(o => ({o, p: proj([o.at[0], o.at[1] + o.size[1]/2, o.at[2]])}))
      .sort((a, b) => b.p[2] - a.p[2]);
    for (const {o, p} of labels){
      const text = wrapLabel(o.label, 22, 1)[0];
      const tw = g.measureText(text).width;
      const box = {x: p[0] - tw/2 - 4, y: p[1] - 20, w: tw + 8, h: 14};
      if (box.x < 0 || box.x + box.w > w || box.y < 0) continue;
      if (placed.some(q => box.x < q.x + q.w && box.x + box.w > q.x
                        && box.y < q.y + q.h && box.y + box.h > q.y)) continue;
      placed.push(box);
      g.fillStyle = cssVar(canvas, '--surface-raised', '#fff');
      g.globalAlpha = 0.82;
      g.fillRect(box.x, box.y, box.w, box.h);
      g.globalAlpha = 1;
      g.fillStyle = ink;
      g.fillText(text, p[0], p[1] - 9);
    }
  }
}

/* Geometry out. Same triangles the canvas drew — the picture and the file
   cannot disagree. */
function sceneOBJ(scene, title){
  const tris = sceneTris(scene);
  const lines = [`# ${title} — exported from Throughline`, `# units: ${scene.units}`];
  for (const t of tris) for (const p of [t.a, t.b, t.c])
    lines.push(`v ${p.map(n => n.toFixed(4)).join(' ')}`);
  for (let i = 0; i < tris.length; i++)
    lines.push(`f ${i*3+1} ${i*3+2} ${i*3+3}`);
  return lines.join('\n') + '\n';
}
function sceneSTL(scene, title){
  const tris = sceneTris(scene);
  const out = [`solid ${title.replace(/\s+/g, '_')}`];
  for (const t of tris){
    const u = [t.b[0]-t.a[0], t.b[1]-t.a[1], t.b[2]-t.a[2]];
    const v = [t.c[0]-t.a[0], t.c[1]-t.a[1], t.c[2]-t.a[2]];
    const n = [u[1]*v[2]-u[2]*v[1], u[2]*v[0]-u[0]*v[2], u[0]*v[1]-u[1]*v[0]];
    const m = Math.hypot(...n) || 1;
    out.push(`  facet normal ${(n[0]/m).toFixed(6)} ${(n[1]/m).toFixed(6)} ${(n[2]/m).toFixed(6)}`);
    out.push('    outer loop');
    for (const p of [t.a, t.b, t.c]) out.push(`      vertex ${p.map(x => x.toFixed(4)).join(' ')}`);
    out.push('    endloop');
    out.push('  endfacet');
  }
  out.push(`endsolid ${title.replace(/\s+/g, '_')}`);
  return out.join('\n') + '\n';
}

function sceneHTML(v, cell){
  const b = sceneBounds(v);
  const view = S.scenes[cell.id] ??= defaultView();
  const dims = v.objects.length
    ? `${b.span.map(n => Math.round(n * 100) / 100).join(' × ')} ${v.units}` : '—';
  return `<div class="scene" data-scene="${esc(cell.id)}">
    <canvas class="scene-canvas" data-scene-canvas="${esc(cell.id)}"
      aria-label="3D view of ${esc(String(v.objects.length))} parts. Drag to orbit."></canvas>
    <div class="scene-bar">
      <span class="meta">${esc(String(v.objects.length))} part${v.objects.length === 1 ? '' : 's'} · ${esc(dims)}</span>
      <span class="spacer"></span>
      <button class="btn secondary tiny" data-scene-mode="${esc(cell.id)}">${view.solid ? 'Wireframe' : 'Solid'}</button>
      <button class="btn secondary tiny" data-scene-reset="${esc(cell.id)}">Reset view</button>
      <button class="btn secondary tiny" data-scene-obj="${esc(cell.id)}">.obj</button>
      <button class="btn secondary tiny" data-scene-stl="${esc(cell.id)}">.stl</button>
    </div>
    <p class="scene-hint meta">Drag to orbit · scroll to zoom. The file exports the same triangles you are looking at.</p>
    ${v.notes ? `<p class="scene-notes">${inline(v.notes)}</p>` : ''}
  </div>`;
}

function imageHTML(v, cell, st){
  /* Nothing renders from a remote origin, ever — see the note on the image
     adapters. A value that is not data: is a bug or an injection attempt, and
     either way it is shown as text rather than fetched. */
  if (!/^data:image\//.test(v.src))
    return `<div class="error-box">That picture is not embedded bytes (${esc(String(v.src).slice(0, 40))}…), so it will not be loaded.</div>`;
  return `<figure class="img-out">
    <img src="${esc(v.src)}" alt="${esc(imageAlt(v))}" ${v.w ? `width="${esc(String(v.w))}" height="${esc(String(v.h))}"` : ''}>
    <figcaption>
      <span class="img-alt">${esc(imageAlt(v).slice(0, 220))}</span>
      <span class="img-foot">
        <span class="meta">${esc(v.via || (v.source === 'attached' ? 'Attached by you' : 'Guided demo — drawn by hand, not by a model'))}</span>
        <span class="spacer"></span>
        <button class="btn secondary tiny" data-img-save="${esc(cell?.id ?? '')}">Save picture</button>
      </span>
    </figcaption>
  </figure>`;
}

function outputHTML(v, type, streaming, cell, st){
  const c = streaming ? '<span class="caret"></span>' : '';
  if (type==='image')
    return isImageVal(v)
      ? imageHTML(v, cell, st) + c
      : `<p class="meta">${esc(bagText(v) || 'No picture yet.')}</p>${c}`;
  if (type==='scene')
    return sceneHTML(isSceneVal(v) ? v : {units:'m', objects:[], notes:String(v ?? '')}, cell) + c;
  if (type==='diagram')
    return diagramSVG(isDiagramVal(v) ? v : {nodes:[], edges:[], note:''}) + c;
  if (type==='chart')
    return chartSVG(isChartVal(v) ? v : {kind:'bar', unit:'', labels:[], series:[], note:String(v ?? '')}) + c;
  if (type==='gate'){
    const back = v.verdict==='revise' && !st?.exhausted;
    return `<div class="gate ${back?'back':'through'}">
      <div class="gate-verdict">${back
        ? `↩ Sending this back — pass ${esc(String(st?.pass ?? 2))} of ${esc(String(cell.gate.maxPasses))}`
        : st?.exhausted ? '→ Out of passes. Continuing with what we have.' : '→ It holds. Continuing.'}</div>
      <p>${inline(v.reason)}</p>
      ${back && v.revision ? `<div class="gate-rev"><span class="eyebrow">Revised for the next pass</span><p>${inline(v.revision)}</p></div>` : ''}
    </div>${c}`;
  }
  if (type==='score'){
    return `<div class="score">
      <div class="score-n">${esc(String(v.value))}<small>/${esc(String(v.max))}</small></div>
      <div class="score-meta">
        <p class="score-band">${esc(v.band || '')}</p>
        <p class="score-basis">${inline(v.basis || '')}</p>
      </div>
    </div>${c}`;
  }
  if (type==='diff'){
    return `<div class="diff">
      <div class="diff-pair">
        <div class="diff-pane"><span class="eyebrow">Before</span>${inline(v.before||'')}</div>
        <div class="diff-pane"><span class="eyebrow">After</span>${inline(v.after||'')}</div>
      </div>
      ${(v.changes||[]).length ? `<ul class="diff-changes">${v.changes.map(ch=>`
        <li><span class="was">${esc(ch.was||'')}</span> → <span class="now">${esc(ch.now||'')}</span>
        ${ch.why?`<div class="note">${inline(ch.why)}</div>`:''}</li>`).join('')}</ul>` : ''}
    </div>${c}`;
  }
  if (type==='ranking'){
    return `<div class="ranking">
      ${(v.criteria||[]).length ? `<p class="rank-criteria">Criteria: ${esc(v.criteria.join(' · '))}</p>` : ''}
      ${(v.items||[]).map((it,i)=>`
        <div class="rank-item">
          <span class="rank-n">${i+1}</span>
          <div><strong>${esc(it.name)}</strong>${it.note?`<span class="note">${inline(it.note)}</span>`:''}</div>
          <span class="rank-total">${esc(String(it.total))}</span>
        </div>`).join('')}
    </div>${c}`;
  }
  if (type==='timeline'){
    return `<div class="timeline">${(v.events||[]).map(e=>`
      <div class="tl-event">
        <span class="tl-when">${esc(e.when||'')}</span>
        <span class="tl-what">${esc(e.what||'')}</span>
        ${e.why?`<p class="tl-why">${inline(e.why)}</p>`:''}
      </div>`).join('')}</div>${c}`;
  }
  if (type==='choice'){
    const opts = v.options || [];
    const locked = !!v.selected && st?.state === 'done';
    return `<div class="choice">${opts.map(o=>`
      <button type="button" class="choice-opt${v.selected===o.id?' sel':''}" data-choose="${esc(cell.id)}" data-opt="${esc(o.id)}" ${locked?'disabled':''}>
        <strong>${esc(o.label)}</strong>
        ${o.cost?`<span class="cost">${esc(o.cost)}</span>`:''}
        ${o.note?`<span class="note">${inline(o.note)}</span>`:''}
      </button>`).join('')}</div>${c}`;
  }
  if (cell?.ask && (st?.state === 'waiting' || (type==='prose' && st?.state==='waiting'))){
    return `<div class="ask-box">
      <label for="ask-${esc(cell.id)}">${esc(cell.ask.label || 'Your answer')}</label>
      <textarea id="ask-${esc(cell.id)}" data-ask="${esc(cell.id)}" placeholder="${esc(cell.ask.placeholder || '')}">${esc(typeof v==='string'?v:'')}</textarea>
      <div class="row"><button class="btn" data-ask-go="${esc(cell.id)}">Continue</button></div>
    </div>`;
  }
  if (type==='table'){
    if (!v || !v.cols) v = reshape(v, 'table');
    return `<div class="table-wrap"><table class="out-table">
      <thead><tr>${v.cols.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead>
      <tbody>${v.rows.map(r=>`<tr>${r.map((x,i)=>
        `<td data-col="${esc(v.cols[i] ?? '')}">${inline(x)}</td>`).join('')}</tr>`).join('')}</tbody>
    </table></div>${c}`;
  }
  if (type==='list'){
    const items = Array.isArray(v) ? v : reshape(v, 'list');
    return `<div class="out"><ul>${items.map(x=>`<li>${inline(x)}</li>`).join('')}</ul></div>${c}`;
  }
  return `<div class="out">${String(v).split(/\n\n+/).map(p=>`<p>${inline(p).replace(/\n/g,'<br>')}</p>`).join('')}${c}</div>`;
}

function varTypeLabel(v){
  if (Array.isArray(v)) return `list[${v.length}]`;
  if (v?.cols) return `table[${v.rows.length}]`;
  if (isImageVal(v)) return 'image';
  if (isSceneVal(v)) return `scene[${v.objects.length}]`;
  if (isDiagramVal(v)) return `diagram[${v.nodes.length}]`;
  if (isChartVal(v)) return `chart[${v.labels.length}]`;
  if (v && typeof v === 'object'){
    if ('verdict' in v) return 'gate';
    if ('value' in v && 'max' in v) return 'score';
    if ('before' in v && 'after' in v) return 'diff';
    if (Array.isArray(v.items) && Array.isArray(v.criteria)) return `ranking[${v.items.length}]`;
    if (Array.isArray(v.events)) return `timeline[${v.events.length}]`;
    if (Array.isArray(v.options)) return `choice[${v.options.length}]`;
  }
  return 'text';
}
function varPreview(v){
  if (Array.isArray(v)) return v.join(' · ');
  if (v?.cols) return v.rows.map(r=>r[0]).join(' · ');
  if (isImageVal(v)) return imageAlt(v);
  if (isSceneVal(v)) return v.objects.map(o=>o.label).join(' · ');
  if (isDiagramVal(v)) return v.nodes.map(n=>n.label).join(' · ');
  if (isChartVal(v)) return v.labels.join(' · ');
  if (v && typeof v === 'object'){
    if ('verdict' in v) return `${v.verdict}: ${v.reason||''}`;
    if ('value' in v && 'max' in v) return `${v.value}/${v.max} (${v.band||''})`;
    if ('before' in v && 'after' in v) return v.after;
    if (Array.isArray(v.items)) return v.items.map(it=>it.name).join(' · ');
    if (Array.isArray(v.events)) return v.events.map(e=>e.what).join(' · ');
    if (Array.isArray(v.options)){
      const sel = v.selected && v.options.find(o=>o.id===v.selected);
      return sel ? sel.label : v.options.map(o=>o.label).join(' · ');
    }
  }
  return String(v);
}
function varRows(nb, run){
  const rows = Object.entries(run.bag);
  if (!rows.length) return '<span class="v">—</span><span></span><span></span>';
  return rows.map(([k,v])=>{
    return `<span class="k">${esc(k)}</span><span class="t">${esc(varTypeLabel(v))}</span><span class="v">${esc(varPreview(v).slice(0,140))}</span>`;
  }).join('');
}

/* Export is infrastructure, not a feature (ENG-BRIEF §4.3 / R9).
   The file is the durable artifact; local storage is a cache in front of it. */
/* One save path for every file the app hands over: mediated in the artifact
   host, a blob link when self-hosted. */
async function saveFile(filename, text, mime = 'application/json'){
  let mediated = null;
  try { mediated = await window.claude?.use?.('downloads') ?? null; } catch { mediated = null; }
  if (mediated){
    try { await mediated.save({ filename, data: text }); }
    catch(e){ if (e?.code && e.code !== 'declined') exportFailed(e.message || e.code); }
    return;
  }
  const url = URL.createObjectURL(new Blob([text], {type:mime}));
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

/* A picture is bytes, not text, so it takes the blob path rather than
   saveFile's string one. Same download affordance, different payload. */
/* Photographs are enormous and models do not need the pixels. Scaling on the
   way in keeps the prompt, the export and the browser's memory sane; it is
   said out loud in the UI rather than done quietly. Vectors are left alone —
   rasterising an SVG to "shrink" it would make it bigger and worse. */
const ATTACH_MAX = 1280;
function shrinkDataURL(src, max = ATTACH_MAX){
  if (/^data:image\/svg/.test(src)) return Promise.resolve({src, w:0, h:0});
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      if (scale === 1) return resolve({src, w:img.naturalWidth, h:img.naturalHeight});
      const w = Math.round(img.naturalWidth * scale), h = Math.round(img.naturalHeight * scale);
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve({src: cv.toDataURL('image/jpeg', 0.86), w, h});
    };
    img.onerror = () => resolve({src, w:0, h:0});
    img.src = src;
  });
}
async function fileToImageValue(file, note){
  if (!file || !file.type.startsWith('image/'))
    throw new Error('That is not a picture this browser can read.');
  const raw = await blobToDataURL(file);
  const {src, w, h} = await shrinkDataURL(raw);
  return {kind:'image', src, alt:file.name || 'Attached picture', note: note ?? '',
    source:'attached', w, h};
}

async function saveDataURL(filename, dataUrl){
  const d = dataUrlParts(dataUrl);
  if (!d){ exportFailed('That picture is not embedded bytes.'); return; }
  const bin = atob(d.b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const url = URL.createObjectURL(new Blob([bytes], {type:d.mime}));
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function exportNotebook(nb, run){
  const doc = { schemaVersion:nb.schemaVersion, exported:new Date().toISOString(),
    notebook:{id:nb.id, title:nb.title}, locale:S.locale, defaultProvider:S.provider,
    input:run.bag['input.'+nb.input.id] ?? '',
    /* Record which model each cell actually ran on — with per-cell resolution
       a single top-level provider would be a lie. */
    edited: isEdited(nb.id) || undefined,
    edits: isEdited(nb.id) ? editsFor(nb.id) : undefined,
    cells:nb.cells.map(raw=>{ const c = eff(nb.id, raw); return ({ id:c.id, title:c.title, output:c.output, requires:c.requires,
      via:run.cells[c.id].via ?? null,
      skipped: isOff(nb.id, raw) || undefined,
      state:run.cells[c.id].state, value:run.cells[c.id].value }); }) };
  await saveFile(`${nb.id}.throughline.json`, JSON.stringify(doc, null, 2));
}

/* Representational nav. In the library there is nothing to represent, so it
   collapses and the canvas goes full width. */
function renderRail(){
  const wrap = document.querySelector('.workspace-in');
  if (S.view !== 'notebook'){
    observer?.disconnect(); observer = null;
    wrap.classList.add('solo'); rail.innerHTML=''; return;
  }
  wrap.classList.remove('solo');
  const nb = NOTEBOOKS.find(n=>n.id===S.nbId), run = getRun(nb);
  rail.innerHTML = `
    <div class="rail-label">${esc(nb.title)}</div>
    <div class="rail-list">
      <button class="pip" data-goto="__input">
        <span class="node" data-s="done"></span><span class="n">00</span>
        <span class="lbl">${esc(nb.input.label)}</span>
      </button>
    ${nb.cells.map((c,i)=>{
      /* A cell is inside a loop if some gate below it can send the run back
         to it or above it. Drawn on the spine so the shape is legible before
         it ever runs. */
      const g = nb.cells.find(x => x.gate && (() => {
        const from = nb.cells.findIndex(y=>y.id===x.gate.to);
        const to = nb.cells.findIndex(y=>y.id===x.id);
        return i >= from && i <= to;
      })());
      const loopCls = g ? ['in-loop',
        nb.cells.findIndex(y=>y.id===g.gate.to) === i ? 'loop-start' : '',
        g.id === c.id ? 'loop-end' : ''].filter(Boolean).join(' ') : '';
      const st = run.cells[c.id];
      return `
      <button class="pip ${loopCls}${isOff(nb.id,c)?' off':''}" data-goto="${c.id}">
        <span class="node" data-s="${st.state==='idle'?'':st.state}"></span>
        <span class="n">${String(i+1).padStart(2,'0')}</span>
        <span class="lbl">${esc(c.title)}</span>
        ${st.pass > 1 ? `<span class="pass">×${st.pass}</span>` : ''}
      </button>`;}).join('')}
    </div>`;
  rail.querySelectorAll('[data-goto]').forEach(b => b.onclick = () => {
    const id = b.dataset.goto;
    const el = id === '__input' ? view.querySelector('.cell') : view.querySelector(`[data-run="${id}"]`)?.closest('.cell');
    el?.scrollIntoView({block:'start'});
  });
  spy(nb);
}

/* Scroll spy. Without it the rail is a list; with it, it is a position.
   Rebuilt on every render, so the old observer must be released or they
   accumulate and fight over aria-current. */
let observer = null;
function spy(nb){
  observer?.disconnect();
  const cells = [...view.querySelectorAll('.cell')];
  if (!cells.length) return;
  const ids = ['__input', ...nb.cells.map(c=>c.id)];
  const visible = new Map();
  observer = new IntersectionObserver(entries => {
    for (const e of entries) visible.set(e.target, e.isIntersecting ? e.intersectionRatio : 0);
    let best = null, bestRatio = 0;
    cells.forEach((el, i) => {
      const r = visible.get(el) ?? 0;
      if (r > bestRatio){ bestRatio = r; best = ids[i]; }
    });
    rail.querySelectorAll('[data-goto]').forEach(b =>
      b.setAttribute('aria-current', String(b.dataset.goto === best)));
  }, { root: workspace, threshold: [0, 0.25, 0.5, 0.75, 1], rootMargin: '-15% 0px -55% 0px' });
  cells.forEach(el => observer.observe(el));
}

function wireSheet(el){
  el.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => {
    S.lookTab = Number(b.dataset.tab); renderSheet(); });
  const pick = (attr, apply) => el.querySelectorAll(`[data-${attr}]`).forEach(b =>
    b.onclick = () => { apply(b.dataset[attr]); applyTheme(); renderSheet(); render(); });
  pick('brand',   v => S.brand = v);
  pick('typeset', v => S.typeset = v);
  pick('density', v => S.density = v);
  pick('locale',  v => S.locale = v);
  pick('mode',    v => {
    S.modePref = v;
    S.mode = v === 'system' ? resolveMode() : v;
  });
  const mOut = el.querySelector('#marks-out');
  if (mOut) mOut.onclick = () => saveFile('throughline-marks.json',
    JSON.stringify({kind:'throughline.marks', v:1, exported:new Date().toISOString(), items:S.marks}, null, 2));
  const mIn = el.querySelector('#marks-in'), mFile = el.querySelector('#marks-file');
  if (mIn) mIn.onclick = () => mFile.click();
  if (mFile) mFile.onchange = async () => {
    const f = mFile.files?.[0]; if (!f) return;
    try {
      const doc = JSON.parse(await f.text());
      if (doc?.kind !== 'throughline.marks') throw new Error('Not a marks file.');
      /* Merge rather than replace — importing from a second device should not
         silently delete what is already here. Newer wins on conflict. */
      for (const [k, v] of Object.entries(doc.items ?? {}))
        if (!S.marks[k] || (v.at ?? 0) > (S.marks[k].at ?? 0)) S.marks[k] = v;
      await S.storage?.write(MARK_DOC, {title:'Marks', items:S.marks});
      renderSheet(); render();
    } catch(e){ alert(`Could not import: ${e.message}`); }
  };
  const def = el.querySelector('#defprov');
  if (def) def.onchange = () => { S.provider = def.value; renderSheet(); render(); };
  el.querySelectorAll('[data-sel]').forEach(b => b.onclick = () => {
    S.connectSel = b.dataset.sel; renderSheet(); });
  el.querySelectorAll('[data-jump]').forEach(b => b.onclick = () => {
    const id = b.dataset.jump;
    S.connectSel = id;
    if (id === 'demo'){ S.provider = 'demo'; render(); }
    renderSheet();
  });

  /* Test automatically once a key looks complete. Nobody should have to know
     that a separate "Test" button exists, or which error means what. */
  el.querySelectorAll('[data-key]').forEach(inp => {
    let t;
    inp.oninput = () => {
      const id = inp.dataset.key;
      if (inp.value.trim()) S.keys[id] = inp.value.trim(); else delete S.keys[id];
      if (isDesktopShell()) desktopSaveKey(id, inp.value.trim()).catch(()=>{});
      clearTimeout(t);
      if ((inp.value.trim().length) < 12) return;
      t = setTimeout(async () => {
        S.testing = id; renderSheet();
        const r = await testProvider(id);
        S.tests[id] = r.ok ? r : {ok:false, msg:humanError(r.msg, id)};
        S.testing = null; renderSheet(); render();
      }, 700);
    };
  });
  el.querySelectorAll('[data-base]').forEach(inp => {
    inp.oninput = () => {
      const id = inp.dataset.base;
      S.bases[id] = inp.value.trim();
      if (PROVIDERS[id]) PROVIDERS[id].base = S.bases[id] || PROVIDERS[id].base;
    };
  });
  el.querySelectorAll('[data-model]').forEach(inp => {
    inp.oninput = () => { S.models[inp.dataset.model] = inp.value; };
  });
  el.querySelectorAll('[data-imagemodel]').forEach(inp => {
    inp.oninput = () => { S.imageModels[inp.dataset.imagemodel] = inp.value; };
  });
  el.querySelectorAll('[data-local-model]').forEach(b => b.onclick = () => {
    S.models.localdl = b.dataset.localModel;
    if (_localPipes[S.models.localdl])
      S.local = { status:'ready', progress:100, file:null, err:null, ready:S.models.localdl };
    renderSheet(); render();
  });
  const dlLocal = el.querySelector('#dl-local');
  if (dlLocal) dlLocal.onclick = async () => {
    const id = S.models.localdl || recommendLocalModel(S.device).id;
    dlLocal.disabled = true;
    try {
      let last = -1;
      await downloadLocalModel(id, () => {
        const pct = S.local?.progress ?? 0;
        if (pct === last) return;
        last = pct; renderSheet();
      });
    } catch (e){
      S.tests.localdl = {ok:false, msg:humanError(e.message || String(e), 'localdl')};
      if (S.local) S.local.err = S.tests.localdl.msg;
    }
    renderSheet(); render();
  };
  const dl = el.querySelector('#dl-builtin');
  if (dl) dl.onclick = async () => {
    try {
      let last = -1;
      await downloadBuiltIn((loaded, total) => {
        const pct = total ? Math.round(loaded/total*100) : Math.round(loaded*100);
        if (pct === last) return;
        last = pct; S.dl = pct; renderSheet();
      });
    } catch(e){
      S.tests.chrome = {ok:false, msg:e.message || String(e)};
      /* Re-probe instead of forcing 'unavailable' — a failed download should
         still leave a retry path when the API reports downloadable. */
      await probeBuiltIn();
    }
    S.dl = null; renderSheet(); render();
  };
  el.querySelectorAll('[data-test]').forEach(btn => btn.onclick = async () => {
    const id = btn.dataset.test;
    btn.disabled = true; btn.textContent = 'Testing…';
    const r = await testProvider(id);
    S.tests[id] = r.ok ? r : {ok:false, msg:humanError(r.msg, id)};
    renderSheet(); render();
  });
}

/* ── Universal model switcher ───────────────────────────────────────────
   Always visible, one click from anywhere. Shows what is actually in use
   rather than making you go find out. */
const READY_LABEL = () => {

  return PROVIDERS[S.provider]?.label ?? 'Auto';
};

function statusOf(id){
  if (isConnected(id)) return {cls:'ok', txt:'ready'};
  if (id === 'localdl'){
    if (S.local?.status === 'downloading')
      return {cls:'warn', txt:`downloading${S.local.progress!=null?` ${S.local.progress}%`:'…'}`};
    const rec = recommendLocalModel(S.device);
    if (isMobileClient())
      return {cls:'warn', txt:`recommended — ${rec.label} (${rec.size})`};
    return {cls:'warn', txt:`one download — try ${rec.label}`};
  }
  if (id === 'chrome'){
    if (S.builtin === 'downloadable') return {cls:'warn', txt:'one download, then free forever'};
    if (S.builtin === 'downloading')  return {cls:'warn', txt:`downloading${S.dl!=null?` ${S.dl}%`:'…'}`};
    if (isMobileClient()) return {cls:'off', txt:'desktop Chrome only — not on phones'};
    if (S.builtin === 'unavailable') return {cls:'off', txt:'unavailable on this machine'};
    return {cls:'off', txt:'not available in this browser'};
  }
  if (phoneSurfaceNote(id)) return {cls:'off', txt:'desktop only — not on phones'};
  if (PROVIDERS[id].reach === 'blocked') return {cls:'off', txt:'desktop build only'};
  if (PROVIDERS[id].key === 'free')  return {cls:'off', txt:'add a free key'};
  if (PROVIDERS[id].key === 'paid')  return {cls:'off', txt:'add a key'};
  return {cls:'off', txt:'not connected'};
}

      ${sel?'<span class="tick">✓</span>':''}

  /* On phones, lead with downloadable on-device models; keep Chrome visible
     so the desktop Nano path stays discoverable with honest status copy. */
  const order = isMobileClient()

  menu.innerHTML =
    `<div class="menu-label">Use for every cell</div>` +
    row('auto', 'Auto', {cls: 'ok', txt: 'best connected model per cell'}, S.provider==='auto', false) +
    `<div class="menu-sep"></div>` +
    order.map(id => row(id, PROVIDERS[id].label, statusOf(id),
                        S.provider===id, false)).join('') +
    (!isConnected('localdl')
      ? `<div class="menu-sep"></div><button class="menu-item" id="menu-local-dl">
           <span class="dot warn"></span><span class="grow">Download ${esc(rec.label)}
           <span class="sub">${esc(rec.size)} · best fit for ${esc(S.device?.label || 'this device')}</span></span></button>`
      : '') +
    (S.builtin === 'downloadable' && !isMobileClient()
      ? `<div class="menu-sep"></div><button class="menu-item" id="menu-dl">
           <span class="dot warn"></span><span class="grow">Download Chrome on-device model
           <span class="sub">A few GB, once. Then free, offline, no key, forever.</span></span></button>`
      : '') +
    `<div class="menu-sep"></div>
     <button class="menu-item" id="menu-connect"><span class="dot off"></span>
       <span class="grow">Connect…<span class="sub">${isMobileClient() ? 'Download a model or paste a free key' : 'Free options available'}</span></span></button>`;

  menu.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => {
    const id = b.dataset.pick;
    if (id === 'auto' || isConnected(id)){
      S.provider = id; S.cellProvider = {}; closeMenu(); render();
      return;
    }
    closeMenu();
    S.sheet = 'settings';
    S.connectSel = id;
    renderSheet();
  });
  const menuLocal = menu.querySelector('#menu-local-dl');
  if (menuLocal) menuLocal.onclick = () => {
    closeMenu(); S.sheet='settings'; S.connectSel='localdl';
    S.models.localdl = rec.id; renderSheet();
  };
  const dl = menu.querySelector('#menu-dl');
  if (dl) dl.onclick = async () => {
    closeMenu();
    try { await downloadBuiltIn((l,t)=>{ S.dl = t ? Math.round(l/t*100) : null; renderSwitcher(); }); }
    catch(e){
      S.tests.chrome = {ok:false, msg:e.message};
      await probeBuiltIn();
    }
    S.dl = null;
    if (isConnected('chrome')) S.provider = 'chrome';
    render();
  };
  menu.querySelector('#menu-connect').onclick = () => {
    closeMenu();
    S.sheet='settings';
    if (!S.connectSel) S.connectSel = isMobileClient() ? 'localdl' : 'google';
    renderSheet();
  };
}
const closeMenu = () => {
