/* Transformers.js is loaded on demand — keeps the first paint zero-dep until
   someone chooses an on-device download. */
let _tfMod = null;
const _localPipes = Object.create(null);
const TF_CDN = 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.1/+esm';

async function loadTransformers(){
  if (_tfMod) return _tfMod;
  _tfMod = await import(/* @vite-ignore */ TF_CDN);
  _tfMod.env.allowLocalModels = false;
  _tfMod.env.useBrowserCache = true;
  return _tfMod;
}

async function ensureLocalPipe(modelId, onProgress){
  const spec = LOCAL_MODELS[modelId] || LOCAL_MODELS.smol135;
  if (_localPipes[spec.id]) return _localPipes[spec.id];
  const tf = await loadTransformers();
  const profile = await deviceProfile();
  const device = (spec.needsGpu || (profile.webgpu && spec.mb >= 350)) && profile.webgpu
    ? 'webgpu' : 'wasm';
  const pipe = await tf.pipeline('text-generation', spec.hf, {
    dtype: spec.dtype,
    device,
    progress_callback: (info) => {
      if (!onProgress) return;
      if (info?.status === 'progress' && info.total)
        onProgress(info.loaded / info.total, info.file || info.name || '');
      else if (info?.status === 'done' || info?.status === 'ready')
        onProgress(1, info.file || '');
    }
  });
  _localPipes[spec.id] = pipe;
  return pipe;
}

async function downloadLocalModel(modelId, onProgress){
  S.local = { ...(S.local || {}), status:'downloading', progress:0, file:null, err:null, ready:null };
  try {
    await ensureLocalPipe(modelId, (frac, file) => {
      S.local.progress = Math.round(frac * 100);
      S.local.file = file ? String(file).split('/').pop() : null;
      onProgress?.(frac, file);
    });
    S.models.localdl = modelId;
    S.local = { status:'ready', progress:100, file:null, err:null, ready:modelId };
    S.provider = 'localdl';
    return true;
  } catch (e){
    const raw = e.message || String(e);
    const err = /failed to fetch|networkerror|load failed|csp|content security/i.test(raw)
      ? 'Download was blocked before the files arrived. Check your connection, stay on this page, and try the smallest model (SmolLM2 135M). If it keeps failing, use a free cloud key instead.'
      : /memory|out of memory|oom|wasm/i.test(raw)
      ? 'This device ran out of memory loading that model. Pick a smaller one (SmolLM2 135M) or use a free cloud key.'
      : raw;
    S.local = { status:'error', progress:null, file:null, err, ready:null };
    throw new Error(err);
  }
}

/* Chrome's built-in model has three states, and conflating them is a trap:
   the API can be present while the weights are not, and calling create() in
   that state silently starts a multi-gigabyte download. So it counts as
   connected only once 'available', and the download is an explicit choice. */
async function probeBuiltIn(){
  const LM = builtIn();
  if (!LM){ S.builtin = 'absent'; return; }
  try {
    const a = await (LM.availability?.() ?? LM.capabilities?.().then(c=>c.available) ?? 'unavailable');
    S.builtin = String(a);
  } catch { S.builtin = 'unavailable'; }
}
async function downloadBuiltIn(onProgress){
  const LM = builtIn();
  if (!LM) throw new Error(isMobileClient()
    ? 'On-device model is not available in phone browsers. Use Download a model, the guided demo, or a free cloud key.'
    : 'No built-in model in this browser.');
  S.builtin = 'downloading';
  const session = await LM.create({ monitor(m){
    m.addEventListener('downloadprogress', e => onProgress(e.loaded, e.total));
  }});
  session.destroy?.();
  await probeBuiltIn();
  /* On-device is the default when it is genuinely ready: free, no key, and
     nothing leaves the machine. Otherwise Auto, which falls back to the
     scripted demo so the library is never gated behind setup. */
  if (isConnected('chrome')) S.provider = 'chrome';
}

const isConnected = id => {
  if (id === 'demo') return true;
  if (id === 'chrome') return S.builtin === 'available' || S.builtin === 'readily';
  if (id === 'localdl'){
    const want = S.models.localdl || PROVIDERS.localdl.model;
    return !!_localPipes[want] || (S.local?.ready === want && S.local?.status === 'ready');
  }
  /* Keyless network providers (Ollama) cannot be detected — only reached.
     A passing test is the evidence; there is nothing else to go on. */
  if (PROVIDERS[id].key === 'none') return S.tests[id]?.ok === true;
  /* A key that just failed its reachability test is not connected — otherwise
     Auto keeps routing to a provider that will 401 every cell. */
  if (!S.keys[id]) return false;
  if (S.tests[id] && S.tests[id].ok === false) return false;
  return true;
};
const connected = () => Object.keys(PROVIDERS).filter(isConnected);

/* Auto-resolution. The cell declares a capability class; the system picks the
   best connected provider that can serve it. The picker below shows the
   resolution rather than posing the question — PRODUCT-BRIEF §5.4. */
function autoPick(cell){
  const able = connected().filter(id => PROVIDERS[id].classes.includes(cell.requires) && PROVIDERS[id].tier !== 'blocked');
  const pool = able.length ? able : connected();
  return pool.sort((a,b) => TIER_RANK[PROVIDERS[b].tier] - TIER_RANK[PROVIDERS[a].tier])[0] ?? 'demo';
}
/* If the default or a pin points at something that is not connected (share
   link with m=chrome on a phone, key cleared, Nano absent), fall back to
   Auto so Run never dead-ends on a provider the client cannot use. */
const resolveFor = cell => {
  const pinned = S.cellProvider[cell.id];
  if (pinned && isConnected(pinned)) return pinned;
  if (S.provider !== 'auto' && isConnected(S.provider)) return S.provider;
  return autoPick(cell);
};

/* True when the cell is running below the class it was written for. This is
   the moment the ceiling is actually felt, so it is where the upgrade lives. */
const belowClass = cell => {
  const p = PROVIDERS[resolveFor(cell)];
  return p.tier !== 'demo' && !p.classes.includes(cell.requires);
};

const sleep = ms => new Promise(r=>setTimeout(r,ms));

/* Scripted provider. Streams by *unit of the output type* — prose by clause,
   lists by item, tables by row — which is a small demonstration that the
   contract is typed all the way down rather than text pretending to be data. */
/* When the output type is overridden, the scripted value is RE-PRESENTED in
   the new shape — never regenerated. A demo that invented new content to fill
   a table you asked for would be lying about what the model would do. */
function reshape(v, to){
  const isTable = v && !Array.isArray(v) && typeof v === 'object' && v.cols;
  const isScore = v && typeof v === 'object' && 'value' in v && 'max' in v && 'basis' in v;
  const isDiff = v && typeof v === 'object' && 'before' in v && 'after' in v;
  const isRank = v && typeof v === 'object' && Array.isArray(v?.items) && Array.isArray(v?.criteria);
  const isTime = v && typeof v === 'object' && Array.isArray(v?.events);
  if (to === 'list'){
    if (Array.isArray(v)) return v;
    if (isTable) return v.rows.map(r => `**${r[0]}** — ${r.slice(1).join(' · ')}`);
    if (isRank) return v.items.map(it => `**${it.name}** (${it.total}) — ${it.note || ''}`);
    if (isTime) return v.events.map(e => `**${e.when}** — ${e.what}`);
    if (isScore) return [`${v.value}/${v.max} (${v.band})`, v.basis];
    if (isDiff) return [v.after, ...((v.changes||[]).map(c => c.now))];
    return String(v).split(/\n\n+/).filter(Boolean);
  }
  if (to === 'table'){
    if (isTable) return v;
    if (isRank) return {cols:['Rank','Item','Total','Note'], rows: v.items.map((it,i)=>[String(i+1), it.name, String(it.total), it.note||''])};
    if (isTime) return {cols:['When','What','Why'], rows: v.events.map(e=>[e.when, e.what, e.why||''])};
    const rows = (Array.isArray(v) ? v : String(v).split(/\n\n+/)).filter(Boolean);
    return {cols:['—'], rows: rows.map(x=>[String(x)])};
  }
  if (to === 'prose' || to === 'markdown'){
    if (typeof v === 'string') return v;
    if (Array.isArray(v)) return v.map(x=>`- ${x}`).join('\n');
    if (isTable) return v.rows.map(r=>`- **${r[0]}** — ${r.slice(1).join(' · ')}`).join('\n');
    if (isScore) return `Score: ${v.value}/${v.max} (${v.band}). ${v.basis}`;
    if (isDiff) return v.after;
    if (isRank) return v.items.map((it,i)=>`${i+1}. ${it.name} (${it.total})`).join('\n');
    if (isTime) return v.events.map(e=>`${e.when}: ${e.what}`).join('\n');
    try { return JSON.stringify(v, null, 2); } catch { return String(v); }
  }
  if (Array.isArray(v)) return v.map(x=>`- ${x}`).join('\n');
  if (isTable) return v.rows.map(r=>`- **${r[0]}** — ${r.slice(1).join(' · ')}`).join('\n');
  return v;
}

async function runDemo(cell, bag, onDelta, signal){
  let value = cell.demo(bag);
  if (cell._reshapeTo) value = reshape(value, cell._reshapeTo);
  await sleep(180 + Math.random()*220);
  if (typeof value === 'string'){
    /* Reveal by slicing the original, never by re-joining fragments —
       re-joining silently eats paragraph breaks. */
    const stops = []; const re = /(?<=[.!?])\s+|\n\n+/g; let m;
    while ((m = re.exec(value))) stops.push(m.index + m[0].length);
    stops.push(value.length);
    for (const i of stops){ if(signal?.aborted) throw new Error('aborted');
      onDelta(value.slice(0, i)); await sleep(26 + Math.random()*48); }
    return value;
  }
  if (value && typeof value === 'object' && 'verdict' in value){
    await sleep(320); onDelta(value); return value;
  }
  if (value && typeof value === 'object' && ('value' in value && 'max' in value || 'before' in value || 'events' in value || 'options' in value || (Array.isArray(value.items) && Array.isArray(value.criteria)))){
    await sleep(280); onDelta(value); return value;
  }
  if (Array.isArray(value)){
    const acc=[]; for(const it of value){ if(signal?.aborted) throw new Error('aborted');
      acc.push(it); onDelta([...acc]); await sleep(160 + Math.random()*180); }
    return acc;
  }
  if (value?.cols && value?.rows){
    const acc={cols:value.cols, rows:[]};
    for(const r of value.rows){ if(signal?.aborted) throw new Error('aborted');
      acc.rows.push(r); onDelta({cols:acc.cols, rows:[...acc.rows]}); await sleep(180 + Math.random()*160); }
    return acc;
  }
  await sleep(200); onDelta(value); return value;
}

const SHAPE = {
  prose:'Respond with plain prose. No preamble, no headings, no markdown fences.',
  markdown:'Respond in markdown. No preamble.',
  list:'Respond with a JSON array of strings and nothing else. No fences, no commentary.',
  table:'Respond with JSON of the form {"cols":["..."],"rows":[["..."]]} and nothing else. No fences, no commentary.',
  gate:'Respond with JSON of the form {"verdict":"continue"|"revise","reason":"...","revision":"..."} and nothing else. Use "revise" only if the work genuinely fails; put the improved version in "revision".',
  score:'Respond with JSON of the form {"value":number,"max":number,"basis":"...","band":"..."} and nothing else. band is a short label for the score range.',
  diff:'Respond with JSON of the form {"before":"...","after":"...","changes":[{"was":"...","now":"...","why":"..."}]} and nothing else.',
  ranking:'Respond with JSON of the form {"criteria":["..."],"items":[{"name":"...","scores":[number],"total":number,"note":"..."}]} and nothing else. Order items best-first.',
  timeline:'Respond with JSON of the form {"events":[{"when":"...","what":"...","why":"..."}]} and nothing else. Order events earliest-first.',
  choice:'Respond with JSON of the form {"options":[{"id":"...","label":"...","cost":"...","note":"..."}],"selected":null} and nothing else. Offer 2–4 real options with honest costs. Leave selected null.'
};

function coerce(text, type){
  if (type==='gate'){
    const m = text.match(/\{[\s\S]*\}/);
    if (m){ try{
      const v = JSON.parse(m[0]);
      if (v?.verdict) return {verdict:v.verdict==='revise'?'revise':'continue', reason:String(v.reason??''), revision:String(v.revision??'')};
    }catch{} }
    return {verdict:'continue', reason:text.trim().slice(0,300), revision:''};
  }
  if (type==='prose' || type==='markdown') return text.replace(/^```[a-z]*\n?|\n?```$/g,'').trim();
  const m = text.match(/[\[{][\s\S]*[\]}]/);
  if (m){ try{ const v = JSON.parse(m[0]);
    if (type==='list' && Array.isArray(v)) return v.map(String);
    if (type==='table' && v?.cols && v?.rows) return v;
    if (type==='list' && v?.rows) return v.rows.map(r=>r.join(' — '));
    if (type==='score' && v && typeof v.value === 'number') return {value:v.value, max:Number(v.max??10), basis:String(v.basis??''), band:String(v.band??'')};
    if (type==='diff' && v && 'before' in v && 'after' in v) return {before:String(v.before), after:String(v.after), changes:Array.isArray(v.changes)?v.changes.map(c=>({was:String(c.was??''), now:String(c.now??''), why:String(c.why??'')})) : []};
    if (type==='ranking' && Array.isArray(v?.items)) return {criteria: (v.criteria||[]).map(String), items: v.items.map(it=>({name:String(it.name??''), scores:(it.scores||[]).map(Number), total:Number(it.total??0), note:String(it.note??'')}))};
    if (type==='timeline' && Array.isArray(v?.events)) return {events: v.events.map(e=>({when:String(e.when??''), what:String(e.what??''), why:String(e.why??'')}))};
    if (type==='choice' && Array.isArray(v?.options)) return {options: v.options.map(o=>({id:String(o.id??''), label:String(o.label??''), cost:String(o.cost??''), note:String(o.note??'')})), selected: v.selected ?? null};
  }catch{} }
  if (type==='list') return text.split('\n').map(l=>l.replace(/^\s*[-•*\d.]+\s*/,'').trim()).filter(Boolean);
  if (type==='score') return {value:0, max:10, basis:text.trim().slice(0,300), band:'unparsed'};
  if (type==='diff') return {before:'', after:text.trim(), changes:[]};
  if (type==='ranking') return {criteria:[], items:[{name:'Result', scores:[], total:0, note:text.trim().slice(0,200)}]};
  if (type==='timeline') return {events:[{when:'—', what:text.trim().slice(0,200), why:''}]};
  if (type==='choice') return {options:[{id:'a', label:text.trim().slice(0,120), cost:'', note:''}], selected:null};
  return {cols:['Result'], rows:[[text.trim()]]};
}

/* ── Transport helpers ──────────────────────────────────────────────── */
async function* sseLines(res){
  const reader = res.body.getReader(), dec = new TextDecoder(); let buf='';
  for(;;){ const {done, value} = await reader.read(); if (done) break;
    buf += dec.decode(value,{stream:true});
    const lines = buf.split('\n'); buf = lines.pop() ?? '';
    for (const line of lines){
      const s = line.trim();
      if (!s || s.startsWith(':')) continue;
      if (!s.startsWith('data:')) continue;
      const d = s.slice(5).trim();
      if (d === '[DONE]') return;
      try { yield JSON.parse(d); } catch {}
    }
  }
}
async function* ndjson(res){
  const reader = res.body.getReader(), dec = new TextDecoder(); let buf='';
  for(;;){ const {done, value} = await reader.read(); if (done) break;
    buf += dec.decode(value,{stream:true});
    const lines = buf.split('\n'); buf = lines.pop() ?? '';
    for (const line of lines){ if (!line.trim()) continue;
      try { yield JSON.parse(line); } catch {} }
  }
}
async function fail(res, label){
  const body = await res.text().catch(()=>'');
  let msg = body;
  try { const j = JSON.parse(body); msg = j.error?.message ?? j.message ?? body; } catch {}
  throw new Error(`${label} returned ${res.status}. ${String(msg).slice(0,200)}`);
}

/* ── Adapters. One shape in, text out. ──────────────────────────────── */
const ADAPTERS = {
  async chrome({sys, prompt, onText, signal}){
    const LM = self.LanguageModel ?? self.ai?.languageModel;
    if (!LM) throw new Error(isMobileClient()
      ? 'On-device model is not available in phone browsers. Use the guided demo or a free cloud key.'
      : 'This browser exposes no built-in model. Chrome 138+ on supported hardware does.');
    const avail = await (LM.availability?.() ?? LM.capabilities?.().then(c=>c.available) ?? 'unavailable');
    if (String(avail).includes('unavailable'))
      throw new Error('The built-in model is unavailable on this device — hardware or OS requirements are not met.');
    if (String(avail) === 'downloadable' || String(avail) === 'downloading')
      throw new Error('The built-in model has not downloaded yet. Open Connect and download it first — it is a few gigabytes, so it should be your choice, not a side effect of pressing Run.');
    const session = await LM.create({ initialPrompts:[{role:'system', content:sys}] });
    try {
      if (session.promptStreaming){
        let acc = '';
        for await (const chunk of session.promptStreaming(prompt, {signal})){
          if (signal?.aborted) throw new Error('aborted');
          /* Chrome has shipped both cumulative and delta chunks. Handle both. */
          acc = (chunk.length >= acc.length && chunk.startsWith(acc)) ? chunk : acc + chunk;
          onText(acc);
        }
        return acc;
      }
      const out = await session.prompt(prompt, {signal}); onText(out); return out;
    } finally { session.destroy?.(); }
  },

  async localdl({sys, prompt, onText, signal, cfg}){
    const modelId = cfg._model || S.models.localdl || 'smol135';
    if (S.local?.ready !== modelId){
      throw new Error('That model is not downloaded yet. Open Connect → Download a model and download it first.');
    }
    const pipe = await ensureLocalPipe(modelId);
    if (signal?.aborted) throw new Error('aborted');
    const tf = await loadTransformers();
    const messages = [
      { role:'system', content:sys },
      { role:'user', content:prompt }
    ];
    let acc = '';
    const streamer = new tf.TextStreamer(pipe.tokenizer, {
      skip_prompt: true,
      skip_special_tokens: true,
      callback_function: (tok) => {
        if (signal?.aborted) return;
        acc += tok;
        onText(acc);
      }
    });
    const out = await pipe(messages, {
      max_new_tokens: 512,
      do_sample: false,
      streamer,
    });
    if (signal?.aborted) throw new Error('aborted');
    if (!acc){
      const row = Array.isArray(out) ? out[0] : out;
      const full = row?.generated_text;
      if (typeof full === 'string') acc = full;
      else if (Array.isArray(full)){
        const last = full.filter(m => m.role === 'assistant').pop();
        acc = last?.content ?? '';
      }
      onText(acc);
    }
    return acc;
  },

  async ollama({sys, prompt, onText, signal, cfg}){
    let res;
    try {
      res = await fetch('http://localhost:11434/api/chat', { method:'POST', signal,
        headers:{'content-type':'application/json'},
        body: JSON.stringify({ model:cfg._model, stream:true,
          messages:[{role:'system',content:sys},{role:'user',content:prompt}] }) });
    } catch {
      throw new Error('Could not reach Ollama on localhost:11434. Either it is not running, or it is refusing this origin — start it with OLLAMA_ORIGINS set to allow this page. An https page also cannot call http://localhost at all.');
    }
    if (!res.ok) await fail(res, 'Ollama');
    let acc='';
    for await (const j of ndjson(res)){
      if (signal?.aborted) throw new Error('aborted');
      acc += j.message?.content ?? ''; onText(acc);
    }
    return acc;
  },

  async google({sys, prompt, onText, signal, cfg, key}){
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(cfg._model)}:streamGenerateContent?alt=sse`;
    /* Key travels in a header, never the query string. */
    const res = await fetch(url, { method:'POST', signal,
      headers:{'content-type':'application/json','x-goog-api-key':key},
      body: JSON.stringify({ systemInstruction:{parts:[{text:sys}]},
        contents:[{role:'user', parts:[{text:prompt}]}] }) });
    if (!res.ok) await fail(res, 'Google AI Studio');
    let acc='';
    for await (const j of sseLines(res)){
      if (signal?.aborted) throw new Error('aborted');
      for (const part of j.candidates?.[0]?.content?.parts ?? []) acc += part.text ?? '';
      onText(acc);
    }
    return acc;
  },

  async anthropic({sys, prompt, onText, signal, cfg, key}){
    const res = await fetch('https://api.anthropic.com/v1/messages', { method:'POST', signal,
      headers:{ 'content-type':'application/json', 'x-api-key':key,
        'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' },
      body: JSON.stringify({ model:cfg._model, max_tokens:2000, system:sys, stream:true,
        messages:[{role:'user', content:prompt}] }) });
    if (!res.ok) await fail(res, 'Anthropic');
    let acc='';
    for await (const j of sseLines(res)){
      if (signal?.aborted) throw new Error('aborted');
      if (j.type === 'content_block_delta' && j.delta?.text){ acc += j.delta.text; onText(acc); }
    }
    return acc;
  },

  /* Groq, OpenRouter and OpenAI all speak the same wire format. */
  async openaiCompatible({sys, prompt, onText, signal, cfg, key, label}){
    const res = await fetch(`${cfg.base}/chat/completions`, { method:'POST', signal,
      headers:{ 'content-type':'application/json', 'authorization':`Bearer ${key}` },
      body: JSON.stringify({ model:cfg._model, stream:true, messages:[
        {role:'system', content:sys},{role:'user', content:prompt}] }) });
    if (!res.ok) await fail(res, label);
    let acc='';
    for await (const j of sseLines(res)){
      if (signal?.aborted) throw new Error('aborted');
      acc += j.choices?.[0]?.delta?.content ?? ''; onText(acc);
    }
    return acc;
  }
};

/* Almost everything speaks the OpenAI wire format now, which is the single
   biggest reason this list could grow at all. */
const ADAPTER_FOR = { chrome:'chrome', localdl:'localdl', ollama:'ollama', google:'google', anthropic:'anthropic',
  groq:'openaiCompatible', openrouter:'openaiCompatible', openai:'openaiCompatible',
  huggingface:'openaiCompatible', cerebras:'openaiCompatible', mistral:'openaiCompatible',
  deepseek:'openaiCompatible', together:'openaiCompatible', xai:'openaiCompatible',
  lmstudio:'openaiCompatible' };

/* Provider errors are written for developers. These are the four that
   actually happen, said the way a person would say them. */
function humanError(msg, id){
  const m = String(msg);
  if (/401|403|invalid.*key|unauthor/i.test(m))
    return 'That key was not accepted. Check you copied all of it, with no spaces.';
  if (/429|rate.?limit|quota/i.test(m))
    return 'The key works, but you have hit the free limit for now. Try again shortly.';
  if (/404|model|not found/i.test(m))
    return `The key works, but that model name was not recognised. Pick a different one from the list.`;
  if (/failed to fetch|networkerror|cors|load failed/i.test(m))
    return id === 'localdl'
      ? 'Could not download the model files. Stay on this page, try the smallest size, or paste a free cloud key instead.'
      : `Could not reach ${PROVIDERS[id]?.label ?? 'the service'} from a web page. This is a browser restriction, not a problem with your key.`;
  return m.slice(0, 240);
}

async function runLive(providerId, prompt, type, onDelta, onText, signal){
  const cfg = PROVIDERS[providerId];
  if (cfg.reach === 'blocked')
    throw new Error(`${cfg.label} does not permit browser requests (CORS). This is not a key problem — no credential changes it. Use the desktop build or a self-hosted deployment.`);
  const fn = ADAPTERS[ADAPTER_FOR[providerId]];
  if (!fn) throw new Error(`No adapter for ${cfg.label}.`);
  const runCfg = {...cfg, _model: modelOf(providerId)};
  const sys = `${SHAPE[type]}\nAnswer in ${LOCALES[S.locale].outputLanguage}.`;
  const structured = type === 'list' || type === 'table' || type === 'gate' || type === 'score' || type === 'diff' || type === 'ranking' || type === 'timeline' || type === 'choice';
  const text = await fn({ sys, prompt, signal, cfg:runCfg, key:S.keys[providerId] ?? '', label:cfg.label,
    /* Prose streams straight into the cell. Structured output cannot be
       parsed half-formed, so its raw text streams into a progress view and
       the typed value lands once. */
    onText: acc => structured ? onText(acc) : onDelta(acc) });
  const value = coerce(text, type);
  onDelta(value);
  return value;
}

/* Operationalises ENG-BRIEF spike #1: does a browser actually reach this
   provider with this key? The only way to know is to try. */
async function testProvider(id){
  const cfg = PROVIDERS[id];
  if (id === 'demo') return {ok:true, msg:'Always available. No network involved.'};
  if (cfg.reach === 'blocked') return {ok:false, msg:'Blocked from any browser by CORS. Not a key problem.'};
  const t0 = performance.now();
  try {
    const out = await runLive(id, 'Reply with the single word: ready', 'prose', ()=>{}, ()=>{},
      AbortSignal.timeout(30000));
    return {ok:true, msg:`Reachable — ${Math.round(performance.now()-t0)} ms. Replied "${String(out).slice(0,40)}".`};
  } catch(e){ return {ok:false, msg:e.message || String(e)}; }
}

/* ═════════ packages/engine — run loop, variable bag, staleness
   NO DOM. NO FRAMEWORK. This is the seam that makes T3/T4/CLI cheap.
   ═════════ */

const producerOf = (nb, ref) => ref.startsWith('input.')
  ? null : nb.cells.find(c => eff(nb.id, c).output.name === ref)?.id ?? null;
const isOff = (nbId, cell) => !!editsFor(nbId)[cell.id]?.off;

/* Downstream closure of a cell. Trivially small graph on a linear list,
   but computed properly so branching cell types stay cheap to add later. */
function downstream(nb, cellId){
  const out = new Set(); const q=[cellId];
  while(q.length){ const cur=q.pop();
    for(const c of nb.cells){
      if (out.has(c.id) || c.id === cellId) continue;
      const deps = c.inputs.map(r=>producerOf(nb,r)).filter(Boolean);
      if (deps.includes(cur)){ out.add(c.id); q.push(c.id); }
    }
  }
  return [...out];
}

function bagText(v){
  if (v == null) return '';
  if (typeof v === 'string') return v;
  if (Array.isArray(v)) return v.map(x=>`- ${x}`).join('\n');
  if (typeof v === 'object' && 'verdict' in v){
    const parts = [`Verdict: ${v.verdict}`];
    if (v.reason) parts.push(`Reason: ${v.reason}`);
    if (v.revision) parts.push(`Revision: ${v.revision}`);
    return parts.join('\n');
  }
  if (typeof v === 'object' && 'value' in v && 'max' in v)
    return `Score: ${v.value}/${v.max} (${v.band || ''}). ${v.basis || ''}`;
  if (typeof v === 'object' && 'before' in v && 'after' in v){
    const ch = (v.changes||[]).map(c=>`- ${c.was} → ${c.now}${c.why?` (${c.why})`:''}`).join('\n');
    return `Before:\n${v.before}\n\nAfter:\n${v.after}${ch?`\n\nChanges:\n${ch}`:''}`;
  }
  if (typeof v === 'object' && Array.isArray(v.items) && Array.isArray(v.criteria))
    return [`Criteria: ${v.criteria.join(', ')}`, ...v.items.map((it,i)=>`${i+1}. ${it.name} (${it.total}) — ${it.note||''}`)].join('\n');
  if (typeof v === 'object' && Array.isArray(v.events))
    return v.events.map(e=>`${e.when}: ${e.what}${e.why?` — ${e.why}`:''}`).join('\n');
  if (typeof v === 'object' && Array.isArray(v.options)){
    const sel = v.selected ? v.options.find(o=>o.id===v.selected) : null;
    return (sel ? `Selected: ${sel.label}\n\n` : '') + v.options.map(o=>`- ${o.label}${o.cost?` [${o.cost}]`:''}: ${o.note||''}`).join('\n');
  }
  if (v.cols && v.rows)
    return [v.cols.join(' | '), ...v.rows.map(r=>r.join(' | '))].join('\n');
  try { return JSON.stringify(v); } catch { return String(v); }
}

function renderPrompt(tpl, nb, run){
  return tpl.replace(/\{\{([\w.]+)\}\}/g, (_,ref)=>{
    if (ref === 'locale.outputLanguage') return LOCALES[S.locale].outputLanguage;
    return bagText(run.bag[ref]);
  });
}

const bagPresent = v => {
  if (v == null) return false;
  if (typeof v === 'string') return v.length > 0;
  if (Array.isArray(v)) return v.length > 0;
  return true;
};
const ready = (nb, cell, run) => cell.inputs.every(r => bagPresent(run.bag[r]));

/* Drop a cell's output (and everything that depended on it) from the bag.
   Skip and clear both call this so readiness matches what the UI claims. */
function invalidateFrom(nb, run, cellId){
  const drop = id => {
    const raw = nb.cells.find(c => c.id === id);
    if (!raw) return;
    delete run.bag[eff(nb.id, raw).output.name];
    const st = run.cells[id];
    if (st && st.state !== 'idle' && !st.ctrl) st.state = 'idle';
  };
  drop(cellId);
  for (const id of downstream(nb, cellId)) drop(id);
}

const anyBusy = run => Object.values(run.cells).some(c =>
  c.ctrl || c.state === 'running' || c.state === 'streaming');

async function execCell(nb, rawCell, run, onChange){
  const cell = eff(nb.id, rawCell);
  const cs = run.cells[cell.id];
  const providerId = resolveFor(cell);
  cs.state='running'; cs.error=null; cs.value=null; cs.raw=''; cs.via=providerId; onChange();
  const ctrl = new AbortController(); cs.ctrl = ctrl;
  const t0 = performance.now();
  try {
    const onDelta = v => { cs.value = v; cs.state='streaming'; onChange(); };
    const onText  = txt => { cs.raw = txt; cs.state='streaming'; onChange(); };
    const original = rawCell.output.type;

    /* ask: pause for a human answer. Demo fills a sample; live waits. */
    if (cell.ask){
      if (providerId === 'demo'){
        const demoCell = cell.output.type !== original ? {...cell, _reshapeTo: cell.output.type} : cell;
        const value = await runDemo(demoCell, {...run.bag, __pass: run.passes[cell.id] ?? 1}, onDelta, ctrl.signal);
        cs.value = value; cs.raw=''; cs.state='done'; cs.ms = Math.round(performance.now()-t0);
        run.bag[cell.output.name] = value;
      } else {
        cs.state='waiting'; cs.value = run.bag[cell.output.name] ?? '';
        onChange();
        return;
      }
    } else if (cell.map){
      /* map: run the prompt once per item in bag[over], collect results. */
      const items = run.bag[cell.map.over];
      const list = Array.isArray(items) ? items : (items == null ? [] : [items]);
      const as = cell.map.as || 'item';
      if (providerId === 'demo'){
        const demoCell = cell.output.type !== original ? {...cell, _reshapeTo: cell.output.type} : cell;
        const value = await runDemo(demoCell, {...run.bag, __pass: run.passes[cell.id] ?? 1}, onDelta, ctrl.signal);
        cs.value = value; cs.raw=''; cs.state='done'; cs.ms = Math.round(performance.now()-t0);
        run.bag[cell.output.name] = value;
      } else {
        const out = [];
        for (let i = 0; i < list.length; i++){
          if (ctrl.signal.aborted) throw new Error('aborted');
          const bag = {...run.bag, [as]: typeof list[i] === 'string' ? list[i] : bagText(list[i])};
          const prompt = renderPrompt(cell.prompt, nb, {bag});
          /* Force list-item as prose fragment then push; if output is list, coerce each. */
          const itemType = cell.output.type === 'list' ? 'prose' : cell.output.type;
          let piece;
          await runLive(providerId, prompt, itemType,
            v => { piece = v; cs.value = cell.output.type==='list' ? [...out, v] : v; cs.state='streaming'; onChange(); },
            t => { cs.raw = t; onChange(); }, ctrl.signal);
          out.push(typeof piece === 'string' ? piece : bagText(piece));
          onDelta(cell.output.type==='list' ? [...out] : out.join('\n\n'));
        }
        const value = cell.output.type==='list' ? out : out.join('\n\n');
        cs.value = value; cs.raw=''; cs.state='done'; cs.ms = Math.round(performance.now()-t0);
        run.bag[cell.output.name] = value;
      }
    } else {
      const demoCell = cell.output.type !== original
        ? {...cell, _reshapeTo: cell.output.type} : cell;
      const value = providerId === 'demo'
        ? await runDemo(demoCell, {...run.bag, __pass: run.passes[cell.id] ?? 1}, onDelta, ctrl.signal)
        : await runLive(providerId, renderPrompt(cell.prompt, nb, run), cell.output.type,
                        onDelta, onText, ctrl.signal);
      cs.value = value; cs.raw=''; cs.state='done'; cs.ms = Math.round(performance.now()-t0);
      run.bag[cell.output.name] = value;
      /* choice: pause until the user picks, unless demo auto-selects later via UI. */
      if (cell.output.type === 'choice' && value && value.selected == null){
        cs.state = 'waiting';
      }
    }
    /* Stale is a DISPLAY state, never an auto re-run. Never silently
       re-execute something the user paid for. (ENG-BRIEF §5.2) */
    if (cs.state === 'done'){
      for (const id of downstream(nb, cell.id)){
        const d = run.cells[id];
        if (d.state==='done' || d.state==='streaming') d.state='stale';
      }
    }
  } catch(e){
    cs.state='error'; cs.error = e.message || String(e);
  } finally { cs.ctrl=null; onChange(); }
}

/* ── Recursion ───────────────────────────────────────────────────────────
   A gate cell judges the work so far and either lets the run continue or
   sends it back to an earlier cell with a revision. Per PRODUCT-BRIEF P1
   this is a CELL TYPE, not a change of topology: the notebook is still a
   linear list you read top to bottom. It just may run parts of it twice.

   Two rules make this safe rather than clever:
   - maxPasses is hard. When it is spent the gate continues anyway and says
     so, rather than looping or silently giving up.
   - Every pass is visible. Nothing re-runs without the reason on screen. */

const gateTargetIndex = (nb, cell) => nb.cells.findIndex(c => c.id === cell.gate.to);

async function runAll(nb, run, onChange, from = 0){
  let i = Math.max(0, from), steps = 0;
  const HARD_CAP = nb.cells.length * 6;   // belt and braces against a cycle
  while (i < nb.cells.length && steps++ < HARD_CAP){
    const raw = nb.cells[i];
    if (isOff(nb.id, raw)){ i++; continue; }      // skipped cells are simply not run
    const cell = eff(nb.id, raw);
    if (!ready(nb, cell, run)) break;
    /* execCell must receive the RAW cell — it derives the effective one itself,
       and it needs the original to know whether the output type was overridden.
       Handing it the effective cell made the override invisible, so the demo
       returned its original shape while the cell claimed the new one. */
    await execCell(nb, raw, run, onChange);
    const st = run.cells[cell.id];
    if (st.state === 'error') break;
    /* ask / choice pause the linear walk until the human answers. */
    if (st.state === 'waiting') break;

    if (cell.gate && st.value?.verdict === 'revise'){
      const passes = (run.passes[cell.id] ?? 1);
      if (passes < cell.gate.maxPasses){
        run.passes[cell.id] = passes + 1;
        /* The revision becomes the input the loop re-reads. */
        run.bag[cell.gate.writes] = st.value.revision;
        const back = gateTargetIndex(nb, cell);
        for (let k = back; k <= i; k++){
          const c = nb.cells[k];
          if (c.id !== cell.id) run.cells[c.id].state = 'idle';
          run.cells[c.id].pass = run.passes[cell.id];
        }
        onChange();
        i = back;
        continue;
      }
      st.exhausted = true;   // out of passes: continue, and say so
    }
    i++;
  }
  onChange();
}

/* Model output is untrusted input (ENG-BRIEF §6.2). Escape first, then
   allow a deliberately tiny inline subset. No raw HTML passthrough, ever.
   In the monorepo this becomes rehype-sanitize with a strict allowlist. */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inline = s => esc(s)
  .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
  .replace(/(^|\s)\*([^*]+)\*/g,'$1<em>$2</em>');

function applyTheme(){
  const b = BRANDS[S.brand], html = document.documentElement;
  html.dataset.mode = S.mode;
  html.dir = LOCALES[S.locale].dir;
  html.lang = S.locale;
  for (const k of [...html.style].filter(k=>k.startsWith('--'))) html.style.removeProperty(k);
  for (const [k,v] of Object.entries({...(b.light||{}), ...(S.mode==='dark' ? (b.dark||{}) : {})}))
    html.style.setProperty(k, v);

  /* Type and density are layered ON TOP of the brand, so either can be
     changed without touching the other. */
  const ts = TYPESETS[S.typeset]?.tokens;
  if (ts) for (const [k,v] of Object.entries(ts)) html.style.setProperty(k, v);

  const d = DENSITY[S.density]?.scale ?? 1;
  if (d !== 1){
    for (const [tok, base] of [['--p-space-3',0.75],['--p-space-4',1],['--p-space-5',1.5],
                               ['--p-space-6',2],['--p-space-7',3]])
      html.style.setProperty(tok, `${(base*d).toFixed(3)}rem`);
    html.style.setProperty('--line', d < 1 ? '1.45' : d > 1 ? '1.7' : '1.55');
  } else html.style.setProperty('--line','1.55');
}

/* Theme resolution has three states, not two: an explicit host choice stamps

};

/* Counts come from the CURRENT result set, not the whole library, so a chip
   never offers a filter that would return nothing. */
function facetCounts(){
  /* Counts over the whole filtered set (query + other axes), never the
     visible page slice — chips must not lie when the grid is windowed. */
  const r = {}, c = {}, p = {};
  for (const nb of NOTEBOOKS){
    const qOk = !F.q || matches({...nb, realm:null, concept:null, persona:null});
    if (!qOk) continue;
    const realmOk = !F.realm || nb.realm === F.realm;
    const conceptOk = !F.concept || nb.concept === F.concept;
    const personaOk = !F.persona || nb.persona === F.persona;
    if (conceptOk && personaOk) r[nb.realm] = (r[nb.realm]??0)+1;
    if (realmOk && personaOk) c[nb.concept] = (c[nb.concept]??0)+1;
    if (realmOk && conceptOk) p[nb.persona] = (p[nb.persona]??0)+1;
  }
  return {r, c, p};
}

    const vt = document.startViewTransition(() => render());
    /* An interrupted transition REJECTS. Clicking two chips quickly is normal
       use, not an error — and an uncaught rejection here would surface as a
       console error on a page that is working correctly. */
    vt.finished.catch(() => {});
    vt.ready.catch(() => {});

  $('#clear-filters') && ($('#clear-filters').onclick = clearF);

  /* Undo one filter at a time — a dead end should offer the step back, not

  view.querySelectorAll('[data-drop]').forEach(b => b.onclick = () => {
    F[b.dataset.drop] = b.dataset.drop === 'q' ? '' : null; S.libShown = LIB_PAGE; refilter(); });

  view.querySelectorAll('[data-nb]').forEach(el =>
    el.onclick = () => {
      S.nbId = el.dataset.nb; S.view='notebook';
      if (el.dataset.restore) restoreMark(NOTEBOOKS.find(n=>n.id===S.nbId));
      render(); scrollTop();

  /* Extend the card window as the user scrolls the workspace. */
  const onScroll = () => {
    if ((S.libShown || LIB_PAGE) >= results.length) return;
    const near = workspace.scrollTop + workspace.clientHeight > workspace.scrollHeight - 400;
    if (near){ S.libShown = (S.libShown || LIB_PAGE) + LIB_PAGE; render(); }
  };
  workspace.onscroll = onScroll;
}

          ${ICONS.run}<span class="lbl">${esc(busy?t('running'):t('runAll'))}</span></button>

      </div>
    </div>

    </div>

    <div class="cell">
      <div class="cell-head">
        <span class="cell-index">00</span>
        <div class="cell-titles">
          <h3>${esc(nb.input.label)}</h3>
          <div class="io-line"><span><b>out</b> input.${esc(nb.input.id)} · text</span></div>
        </div>
      </div>
      <div class="cell-body">
        <textarea id="nb-input" placeholder="${esc(nb.input.placeholder)}">${esc(run.bag['input.'+nb.input.id] ?? nb.input.seed)}</textarea>
      </div>
    </div>

    <div class="cells">${nb.cells.map((c,i)=>cellHTML(nb,c,i,run)).join('')}</div>
    ${markHTML(nb)}
    </article>

    <details class="vars"><summary>${esc(t('vars'))}</summary>
      <div class="var-table">${varRows(nb,run)}</div></details>
    ${desktopStrip()}
    ${footer()}`;

  $('#back').onclick = () => { S.view='library'; S.nbId=null; render(); scrollTop(); };
  const ta = $('#nb-input');
  const commit = () => {
    const key = 'input.'+nb.input.id;
    if (run.bag[key] === ta.value) return;
    run.bag[key] = ta.value;
    for (const c of nb.cells) if (c.inputs.includes(key)){
      for (const id of [c.id, ...downstream(nb,c.id)]){
        const st = run.cells[id]; if (st.state==='done') st.state='stale';
      }
    }
    render();
  };
  ta.onblur = commit;

  $('#run-all').onclick = async () => { commit(); await runAll(nb, run, render); };
  view.querySelectorAll('[data-mark]').forEach(b => b.onclick = () => {
    const v = b.dataset.mark;
    saveMark(nb, v === 'clear' ? null : v, markOf(nb.id)?.note);
  });
  const note = $('#mark-note');
  if (note) note.onblur = () => {
    const m = markOf(nb.id); if (m && m.note !== note.value) saveMark(nb, m.verdict, note.value);
  };
  $('#share').onclick = e => copyShare(nb, e.currentTarget);
  $('#export').onclick = () => exportNotebook(nb, run);
  $('#clear').onclick = () => { delete S.runs[nb.id]; render(); };
  $('#edit').onclick = () => { S.editing = !S.editing; render(); };
  const rst = $('#reset-edits');
  if (rst) rst.onclick = () => resetEdits(nb.id);
  view.querySelectorAll('[data-toggle]').forEach(b => b.onclick = () => {
    const id = b.dataset.toggle;
    const turningOff = !isOff(nb.id, {id});
    if (turningOff) invalidateFrom(nb, getRun(nb), id);
    setEdit(nb.id, id, {off: turningOff ? true : null});
  });
  view.querySelectorAll('[data-revert]').forEach(b => b.onclick = () => {
    delete (S.edits[nb.id] ?? {})[b.dataset.revert];
    if (!Object.keys(S.edits[nb.id] ?? {}).length) delete S.edits[nb.id];
    saveEdits(); render();
  });
  view.querySelectorAll('[data-type]').forEach(el => el.onchange = () => {
    const raw = nb.cells.find(c=>c.id===el.dataset.type);
    setEdit(nb.id, el.dataset.type, {outType: el.value === raw.output.type ? null : el.value});
  });
  view.querySelectorAll('[data-prompt]').forEach(el => el.onblur = () => {
    const raw = nb.cells.find(c=>c.id===el.dataset.prompt);
    setEdit(nb.id, el.dataset.prompt, {prompt: el.value.trim() === raw.prompt.trim() ? null : el.value});
  });
  view.querySelectorAll('[data-cellprov]').forEach(el => el.onchange = () => {
    const id = el.dataset.cellprov;
    if (el.value) S.cellProvider[id] = el.value; else delete S.cellProvider[id];
    render();
  });
  view.querySelectorAll('[data-upgrade]').forEach(el => el.onclick = () => {
    S.sheet = 'settings'; renderSheet();
  });
  view.querySelectorAll('[data-run]').forEach(el => el.onclick = async () => {
    commit();
    const cell = nb.cells.find(c=>c.id===el.dataset.run);
    await execCell(nb, cell, getRun(nb), render);
  });
  view.querySelectorAll('[data-choose]').forEach(btn => btn.onclick = async () => {
    const cell = nb.cells.find(c=>c.id===btn.dataset.choose);
    const run = getRun(nb);
    const st = run.cells[cell.id];
    const val = {...(st.value || {}), selected: btn.dataset.opt};
    st.value = val; st.state = 'done';
    run.bag[cell.output.name] = val;
    if (cell.choice?.writes){
      const opt = (val.options||[]).find(o=>o.id===val.selected);
      run.bag[cell.choice.writes] = opt ? opt.label : val.selected;
    }
    for (const id of downstream(nb, cell.id)){
      const d = run.cells[id];
      if (d.state==='done' || d.state==='streaming') d.state='stale';
    }
    render();
    /* Resume after this cell — restarting at 0 would re-run the choice and
       wipe selected back to null. */
    const next = nb.cells.findIndex(c => c.id === cell.id) + 1;
    await runAll(nb, run, render, next);
  });
  view.querySelectorAll('[data-ask-go]').forEach(btn => btn.onclick = async () => {
    const id = btn.dataset.askGo;
    const cell = nb.cells.find(c=>c.id===id);
    const ta = view.querySelector(`[data-ask="${id}"]`);
    const text = (ta?.value || '').trim();
    if (!text) return;
    const run = getRun(nb);
    const st = run.cells[id];
    st.value = text; st.state = 'done';
    run.bag[cell.output.name] = text;
    for (const did of downstream(nb, id)){
      const d = run.cells[did];
      if (d.state==='done' || d.state==='streaming') d.state='stale';
    }
    render();
    const next = nb.cells.findIndex(c => c.id === id) + 1;
    await runAll(nb, run, render, next);
  });
}

function cellHTML(nb, raw, i, run){
  const cell = eff(nb.id, raw);
  const off = isOff(nb.id, raw);
  const o = editsFor(nb.id)[raw.id] ?? {};
  const st = run.cells[cell.id];
  if (off) return `
    <section class="cell off" data-state="off">
      <div class="cell-head">
        <span class="cell-index">${String(i+1).padStart(2,'0')}</span>
        <div class="cell-titles"><h3>${esc(cell.title)}</h3>
          <p class="cell-intent">Skipped. Cells that read <code>${esc(cell.output.name)}</code> cannot run.</p></div>
        <button class="btn secondary tiny" data-toggle="${raw.id}">Re-enable</button>
      </div>
    </section>`;
  const canRun = ready(nb, cell, run) && !st.ctrl && !anyBusy(run);
  const ins = cell.inputs.map(r=>`<span><b>in</b> ${esc(r)}</span>`).join('');
  return `
  <section class="cell" data-state="${st.state}">
    <div class="cell-head">
      <span class="cell-index">${String(i+1).padStart(2,'0')}</span>
      <div class="cell-titles">
        <h3>${esc(cell.title)}</h3>
        <p class="cell-intent">${esc(cell.intent)}</p>
        <div class="io-line">${ins}<span><b>out</b> ${esc(cell.output.name)} · ${esc(cell.output.type)}</span><span><b>needs</b> ${esc(cell.requires)}</span></div>
      </div>
      ${st.pass > 1 ? `<span class="badge pass-badge">pass ${st.pass}</span>` : ''}
      <span class="badge" data-s="${st.state}">${esc(st.state)}</span>
    </div>
    <div class="cell-body">
      ${st.state==='stale' ? `<div class="stale-note">⚠ ${esc(t('staleNote'))}</div>`:''}
      ${st.error ? `<div class="error-box">${esc(st.error)}</div>` : ''}
      ${belowClass(cell) && st.state!=='error' ? classNotice(cell) : ''}
      ${st.raw ? `<pre class="raw">${esc(st.raw)}<span class="caret"></span></pre>` : ''}
      ${st.state==='waiting' && cell.ask ? outputHTML(st.value ?? '', 'prose', false, cell, st)
        : st.value!=null ? outputHTML(st.value, cell.output.type, st.state==='streaming'||st.state==='waiting', cell, st)
        : (st.raw ? '' : st.state==='running'?'<p class="meta">…</p>':`<p class="meta">${esc(t('emptyOut'))}</p>`)}
    </div>
    ${S.editing ? `
    <div class="cell-edit">
      <div class="edit-row">
        ${raw.gate || ['gate','choice','score','diff','ranking','timeline'].includes(raw.output.type) || raw.ask || raw.map
          ? `<span class="field-inline"><span class="eyebrow">Output as</span><span>${esc(raw.output.type)}${raw.map?' · map':''}${raw.ask?' · ask':''}</span></span>`
          : `<label class="field-inline">
          <span class="eyebrow">Output as</span>
          <select data-type="${raw.id}">
            ${['prose','list','table','markdown'].map(x=>
              `<option value="${x}" ${cell.output.type===x?'selected':''}>${x}</option>`).join('')}
          </select>
        </label>`}
        <button class="btn secondary tiny" data-toggle="${raw.id}">Skip this cell</button>
        ${Object.keys(o).length ? `<button class="btn secondary tiny" data-revert="${raw.id}">Revert cell</button>`:''}
        <span class="spacer"></span>
        ${Object.keys(o).length ? '<span class="badge pass-badge">edited</span>':''}
      </div>
      <details class="edit-prompt" ${o.prompt?'open':''}>
        <summary>Prompt</summary>
        <textarea data-prompt="${raw.id}" rows="5">${esc(cell.prompt)}</textarea>
        <p class="hint">Changes what a connected model is asked. The guided demo replays its script whatever you write here — that is what makes it a demo.</p>
      </details>
    </div>` : ''}
    <div class="cell-foot">
      <button class="btn secondary tiny" data-run="${cell.id}" ${canRun?'':'disabled'}>
        ${esc(st.state==='done'||st.state==='stale' ? t('reRun') : t('run'))}</button>
      ${st.ms ? `<span class="meta">${st.ms} ms</span>`:''}
      <span class="spacer"></span>
      ${cellPicker(cell)}
    </div>
  </section>`;
}

/* The picker shows the RESOLUTION, not the question. Auto is the default and
   names what it chose; the override is one level down for people who care.
   This is §5.4's demotion, kept intact now that there is something to pick. */
function cellPicker(cell){
  const chosen = resolveFor(cell);
  const auto = !S.cellProvider[cell.id];
  const opts = connected().map(id =>
    `<option value="${id}" ${!auto && S.cellProvider[cell.id]===id ? 'selected':''}>${esc(PROVIDERS[id].label)}</option>`).join('');
  return `<label class="picker" title="Model for this cell">
    <span class="meta">${auto ? 'auto →' : 'pinned'}</span>
    <select data-cellprov="${cell.id}">
      <option value="" ${auto?'selected':''}>Auto — ${esc(PROVIDERS[chosen].label)}</option>
      ${opts}
    </select></label>`;
}

/* Shown only where the ceiling is actually felt: a cell written for a
   capability class the resolved model does not serve. The upgrade belongs
   here, at the point of friction, not in a banner. */
function classNotice(cell){
  const p = PROVIDERS[resolveFor(cell)];
  const better = Object.keys(PROVIDERS)
    .filter(id => PROVIDERS[id].classes.includes(cell.requires) && PROVIDERS[id].tier !== 'blocked' && PROVIDERS[id].tier !== 'demo')
    .sort((a,b)=>TIER_RANK[PROVIDERS[b].tier]-TIER_RANK[PROVIDERS[a].tier])[0];
  return `<div class="class-note">
    <span>This cell asks for <b>${esc(cell.requires)}</b>. ${esc(p.label)} serves ${esc(p.classes.join(', '))} — the answer will be thinner than the cell was written for.</span>
    ${better ? `<button class="btn tiny" data-upgrade="${cell.id}">Connect ${esc(PROVIDERS[better].label)}</button>` : ''}
  </div>`;
}

function outputHTML(v, type, streaming, cell, st){
  const c = streaming ? '<span class="caret"></span>' : '';
  if (type==='gate'){
    const back = v.verdict==='revise' && !st?.exhausted;
    return `<div class="gate ${back?'back':'through'}">
      <div class="gate-verdict">${back
        ? `↩ Sending this back — pass ${esc(String(st?.pass ?? 2))} of ${esc(String(cell.gate.maxPasses))}`
        : st?.exhausted ? '→ Out of passes. Continuing with what we have.' : '→ It holds. Continuing.'}</div>
      <p>${inline(v.reason)}</p>
      ${back && v.revision ? `<div class="gate-rev"><span class="eyebrow">Revised for the next pass</span><p>${inline(v.revision)}</p></div>` : ''}
    </div>${c}`;
  }
  if (type==='score'){
    return `<div class="score">
      <div class="score-n">${esc(String(v.value))}<small>/${esc(String(v.max))}</small></div>
      <div class="score-meta">
        <p class="score-band">${esc(v.band || '')}</p>
        <p class="score-basis">${inline(v.basis || '')}</p>
      </div>
    </div>${c}`;
  }
  if (type==='diff'){
    return `<div class="diff">
      <div class="diff-pair">
        <div class="diff-pane"><span class="eyebrow">Before</span>${inline(v.before||'')}</div>
        <div class="diff-pane"><span class="eyebrow">After</span>${inline(v.after||'')}</div>
      </div>
      ${(v.changes||[]).length ? `<ul class="diff-changes">${v.changes.map(ch=>`
        <li><span class="was">${esc(ch.was||'')}</span> → <span class="now">${esc(ch.now||'')}</span>
        ${ch.why?`<div class="note">${inline(ch.why)}</div>`:''}</li>`).join('')}</ul>` : ''}
    </div>${c}`;
  }
  if (type==='ranking'){
    return `<div class="ranking">
      ${(v.criteria||[]).length ? `<p class="rank-criteria">Criteria: ${esc(v.criteria.join(' · '))}</p>` : ''}
      ${(v.items||[]).map((it,i)=>`
        <div class="rank-item">
          <span class="rank-n">${i+1}</span>
          <div><strong>${esc(it.name)}</strong>${it.note?`<span class="note">${inline(it.note)}</span>`:''}</div>
          <span class="rank-total">${esc(String(it.total))}</span>
        </div>`).join('')}
    </div>${c}`;
  }
  if (type==='timeline'){
    return `<div class="timeline">${(v.events||[]).map(e=>`
      <div class="tl-event">
        <span class="tl-when">${esc(e.when||'')}</span>
        <span class="tl-what">${esc(e.what||'')}</span>
        ${e.why?`<p class="tl-why">${inline(e.why)}</p>`:''}
      </div>`).join('')}</div>${c}`;
  }
  if (type==='choice'){
    const opts = v.options || [];
    const locked = !!v.selected && st?.state === 'done';
    return `<div class="choice">${opts.map(o=>`
      <button type="button" class="choice-opt${v.selected===o.id?' sel':''}" data-choose="${esc(cell.id)}" data-opt="${esc(o.id)}" ${locked?'disabled':''}>
        <strong>${esc(o.label)}</strong>
        ${o.cost?`<span class="cost">${esc(o.cost)}</span>`:''}
        ${o.note?`<span class="note">${inline(o.note)}</span>`:''}
      </button>`).join('')}</div>${c}`;
  }
  if (cell?.ask && (st?.state === 'waiting' || (type==='prose' && st?.state==='waiting'))){
    return `<div class="ask-box">
      <label for="ask-${esc(cell.id)}">${esc(cell.ask.label || 'Your answer')}</label>
      <textarea id="ask-${esc(cell.id)}" data-ask="${esc(cell.id)}" placeholder="${esc(cell.ask.placeholder || '')}">${esc(typeof v==='string'?v:'')}</textarea>
      <div class="row"><button class="btn" data-ask-go="${esc(cell.id)}">Continue</button></div>
    </div>`;
  }
  if (type==='table'){
    if (!v || !v.cols) v = reshape(v, 'table');
    return `<div class="table-wrap"><table class="out-table">
      <thead><tr>${v.cols.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead>
      <tbody>${v.rows.map(r=>`<tr>${r.map((x,i)=>
        `<td data-col="${esc(v.cols[i] ?? '')}">${inline(x)}</td>`).join('')}</tr>`).join('')}</tbody>
    </table></div>${c}`;
  }
  if (type==='list'){
    const items = Array.isArray(v) ? v : reshape(v, 'list');
    return `<div class="out"><ul>${items.map(x=>`<li>${inline(x)}</li>`).join('')}</ul></div>${c}`;
  }
  return `<div class="out">${String(v).split(/\n\n+/).map(p=>`<p>${inline(p).replace(/\n/g,'<br>')}</p>`).join('')}${c}</div>`;
}

function varTypeLabel(v){
  if (Array.isArray(v)) return `list[${v.length}]`;
  if (v?.cols) return `table[${v.rows.length}]`;
  if (v && typeof v === 'object'){
    if ('verdict' in v) return 'gate';
    if ('value' in v && 'max' in v) return 'score';
    if ('before' in v && 'after' in v) return 'diff';
    if (Array.isArray(v.items) && Array.isArray(v.criteria)) return `ranking[${v.items.length}]`;
    if (Array.isArray(v.events)) return `timeline[${v.events.length}]`;
    if (Array.isArray(v.options)) return `choice[${v.options.length}]`;
  }
  return 'text';
}
function varPreview(v){
  if (Array.isArray(v)) return v.join(' · ');
  if (v?.cols) return v.rows.map(r=>r[0]).join(' · ');
  if (v && typeof v === 'object'){
    if ('verdict' in v) return `${v.verdict}: ${v.reason||''}`;
    if ('value' in v && 'max' in v) return `${v.value}/${v.max} (${v.band||''})`;
    if ('before' in v && 'after' in v) return v.after;
    if (Array.isArray(v.items)) return v.items.map(it=>it.name).join(' · ');
    if (Array.isArray(v.events)) return v.events.map(e=>e.what).join(' · ');
    if (Array.isArray(v.options)){
      const sel = v.selected && v.options.find(o=>o.id===v.selected);
      return sel ? sel.label : v.options.map(o=>o.label).join(' · ');
    }
  }
  return String(v);
}
function varRows(nb, run){
  const rows = Object.entries(run.bag);
  if (!rows.length) return '<span class="v">—</span><span></span><span></span>';
  return rows.map(([k,v])=>{
    return `<span class="k">${esc(k)}</span><span class="t">${esc(varTypeLabel(v))}</span><span class="v">${esc(varPreview(v).slice(0,140))}</span>`;
  }).join('');
}

/* Export is infrastructure, not a feature (ENG-BRIEF §4.3 / R9).
   The file is the durable artifact; local storage is a cache in front of it. */
/* One save path for every file the app hands over: mediated in the artifact
   host, a blob link when self-hosted. */
async function saveFile(filename, text){
  let mediated = null;
  try { mediated = await window.claude?.use?.('downloads') ?? null; } catch { mediated = null; }
  if (mediated){
    try { await mediated.save({ filename, data: text }); }
    catch(e){ if (e?.code && e.code !== 'declined') exportFailed(e.message || e.code); }
    return;
  }
  const url = URL.createObjectURL(new Blob([text], {type:'application/json'}));
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

async function exportNotebook(nb, run){
  const doc = { schemaVersion:nb.schemaVersion, exported:new Date().toISOString(),
    notebook:{id:nb.id, title:nb.title}, locale:S.locale, defaultProvider:S.provider,
    input:run.bag['input.'+nb.input.id] ?? '',
    /* Record which model each cell actually ran on — with per-cell resolution
       a single top-level provider would be a lie. */
    edited: isEdited(nb.id) || undefined,
    edits: isEdited(nb.id) ? editsFor(nb.id) : undefined,
    cells:nb.cells.map(raw=>{ const c = eff(nb.id, raw); return ({ id:c.id, title:c.title, output:c.output, requires:c.requires,
      via:run.cells[c.id].via ?? null,
      skipped: isOff(nb.id, raw) || undefined,
      state:run.cells[c.id].state, value:run.cells[c.id].value }); }) };
  await saveFile(`${nb.id}.throughline.json`, JSON.stringify(doc, null, 2));
}

function exportFailed(msg){
  const el = document.createElement('div');
  el.className = 'error-box';
  el.style.cssText = 'position:fixed;inset-block-end:var(--p-space-5);inset-inline-start:50%;transform:translateX(-50%);z-index:60';
  el.textContent = `Export did not complete. ${msg}`;
  root.appendChild(el);
  setTimeout(()=>el.remove(), 5000);
}

/* The old in-page footer is now the persistent status bar, so the view
   itself renders nothing at the bottom. */
function footer(){ return ''; }

function renderStatusbar(){
  const cap = S.storage?.capabilities() ?? {durable:false, label:'—'};
  const nb = S.nbId ? NOTEBOOKS.find(n=>n.id===S.nbId) : null;
  let progress = '';
  if (nb){
    const run = getRun(nb);
    const done = nb.cells.filter(c=>run.cells[c.id].state==='done').length;
    const busy = nb.cells.some(c=>['running','streaming'].includes(run.cells[c.id].state));
    const pct = Math.round(done / nb.cells.length * 100);
    progress = `<span class="seg">
      <span class="progress"><i style="inline-size:${pct}%"></i></span>
      <span>${busy ? esc(t('running')) : `${done} / ${nb.cells.length} complete`}</span>
    </span><span class="seg" aria-hidden="true">·</span>`;
  }
  const active = S.provider === 'auto' ? autoPick({requires:'reasoning'}) : S.provider;
  statusbar.innerHTML = `
    ${progress}
    <span class="seg storage"><span class="dot ${cap.durable?'ok':'warn'}"></span>
      <span class="full">${esc(cap.label)}</span>
      <span class="short">${esc(cap.durable ? 'On this device' : 'May be cleared')}</span>
    </span>
    <span class="spacer"></span>
    <span class="seg">${esc(PROVIDERS[active]?.label ?? '—')}</span>
    <span class="seg status-src" aria-hidden="true">·</span>
    <span class="seg status-src"><a href="https://github.com/mhsenkow/throughline" target="_blank" rel="noopener noreferrer">Source</a></span>`;
}

/* Representational nav. In the library there is nothing to represent, so it
   collapses and the canvas goes full width. */
function renderRail(){
  const wrap = document.querySelector('.workspace-in');
  if (S.view !== 'notebook'){
    observer?.disconnect(); observer = null;
    wrap.classList.add('solo'); rail.innerHTML=''; return;
  }
  wrap.classList.remove('solo');
  const nb = NOTEBOOKS.find(n=>n.id===S.nbId), run = getRun(nb);
  rail.innerHTML = `
    <div class="rail-label">${esc(nb.title)}</div>
    <div class="rail-list">
      <button class="pip" data-goto="__input">
        <span class="node" data-s="done"></span><span class="n">00</span>
        <span class="lbl">${esc(nb.input.label)}</span>
      </button>
    ${nb.cells.map((c,i)=>{
      /* A cell is inside a loop if some gate below it can send the run back
         to it or above it. Drawn on the spine so the shape is legible before
         it ever runs. */
      const g = nb.cells.find(x => x.gate && (() => {
        const from = nb.cells.findIndex(y=>y.id===x.gate.to);
        const to = nb.cells.findIndex(y=>y.id===x.id);
        return i >= from && i <= to;
      })());
      const loopCls = g ? ['in-loop',
        nb.cells.findIndex(y=>y.id===g.gate.to) === i ? 'loop-start' : '',
        g.id === c.id ? 'loop-end' : ''].filter(Boolean).join(' ') : '';
      const st = run.cells[c.id];
      return `
      <button class="pip ${loopCls}${isOff(nb.id,c)?' off':''}" data-goto="${c.id}">
        <span class="node" data-s="${st.state==='idle'?'':st.state}"></span>
        <span class="n">${String(i+1).padStart(2,'0')}</span>
        <span class="lbl">${esc(c.title)}</span>
        ${st.pass > 1 ? `<span class="pass">×${st.pass}</span>` : ''}
      </button>`;}).join('')}
    </div>`;
  rail.querySelectorAll('[data-goto]').forEach(b => b.onclick = () => {
    const id = b.dataset.goto;
    const el = id === '__input' ? view.querySelector('.cell') : view.querySelector(`[data-run="${id}"]`)?.closest('.cell');
    el?.scrollIntoView({block:'start'});
  });
  spy(nb);
}

/* Scroll spy. Without it the rail is a list; with it, it is a position.
   Rebuilt on every render, so the old observer must be released or they
   accumulate and fight over aria-current. */
let observer = null;
function spy(nb){
  observer?.disconnect();
  const cells = [...view.querySelectorAll('.cell')];
  if (!cells.length) return;
  const ids = ['__input', ...nb.cells.map(c=>c.id)];
  const visible = new Map();
  observer = new IntersectionObserver(entries => {
    for (const e of entries) visible.set(e.target, e.isIntersecting ? e.intersectionRatio : 0);
    let best = null, bestRatio = 0;
    cells.forEach((el, i) => {
      const r = visible.get(el) ?? 0;
      if (r > bestRatio){ bestRatio = r; best = ids[i]; }
    });
    rail.querySelectorAll('[data-goto]').forEach(b =>
      b.setAttribute('aria-current', String(b.dataset.goto === best)));
  }, { root: workspace, threshold: [0, 0.25, 0.5, 0.75, 1], rootMargin: '-15% 0px -55% 0px' });
  cells.forEach(el => observer.observe(el));
}

}

/* One provider at a time, with a single next step visible. The old version
   showed nine cards each with a key field and a model id — accurate, and a
   wall. This asks a question and then does one thing at a time. */
function connectDetail(id){
  const p = PROVIDERS[id];
  const on = isConnected(id), test = S.tests[id];
  const needsKey = p.key !== 'none';
  const step = on ? 3 : (needsKey && S.keys[id]) ? 2 : 1;
  const phoneBlocked = !on && !!phoneSurfaceNote(id);

  const built = id === 'chrome';
  const chromeState = built ? S.builtin : null;

  return `
  <div class="detail">
    <div class="detail-head">
      <div>
        <h3>${esc(p.label)}</h3>
        <p class="detail-vendor">${esc(p.vendor)} · ${esc(TIER_LABEL[p.tier])}</p>
      </div>
      <span class="status ${on?'ok':(p.reach==='blocked'||phoneBlocked)?'off':'warn'}">
        ${(() => {
          if (on) return 'Ready';
          if (p.reach==='blocked' || phoneBlocked) return 'Unavailable';
          if (id === 'localdl'){
            if (S.local?.status === 'downloading')
              return S.local.progress!=null ? `Downloading ${S.local.progress}%` : 'Downloading…';
            if (S.local?.status === 'error') return 'Download failed';
            return 'Needs download';
          }
          if (id === 'chrome' && S.builtin === 'downloadable') return 'Needs download';
          if (p.key === 'free' || p.key === 'paid') return 'Needs a key';
          if (p.key === 'none') return 'Needs a check';
          return 'Not ready';
        })()}</span>
    </div>
    <p class="detail-plain">${esc(p.plain)}</p>

    ${p.reach === 'blocked' ? `
      <div class="step done"><p>${esc(p.note)}</p></div>` : ''}

    ${built ? `
      <div class="step ${chromeState==='available'||chromeState==='readily'?'done':''}">
        <span class="step-n">1</span>
        <div class="step-body">
          ${chromeState==='absent'
            ? (isMobileClient()
              ? `<p><b>Not available on phones.</b> ${esc(phoneSurfaceNote('chrome'))}</p>
                 <div class="row">
                   <button class="btn" data-jump="localdl">Download a model</button>
                   <button class="btn secondary" data-jump="google">Free cloud key</button>
                 </div>`
              : `<p><b>This browser does not have it.</b> You need Chrome 138 or newer on a
                   computer with enough memory. Everything else on this list still works.</p>`)
            : chromeState==='downloadable'
            ? `<p><b>Download the model once.</b> A few gigabytes. After that it runs offline,
                 free, forever, and nothing you type leaves this computer.</p>

            : chromeState==='downloading'
            ? `<p>Downloading${S.dl!=null?` — ${S.dl}%`:'…'} You can close this and carry on.</p>`

            ? `<p>Downloaded and ready.</p><button class="btn secondary" data-test="${id}">Check it works</button>`
            : `<p><b>Not available on this machine.</b> Hardware or OS requirements are not met
                 (desktop Chrome on Windows, macOS, Linux, or Chromebook Plus).</p>
               <div class="row">
                 <button class="btn" data-jump="localdl">Download a small model</button>
                 <button class="btn secondary" data-jump="google">Free cloud key</button>

    ${id==='localdl' ? (() => {
      const ranked = rankedLocalModels(S.device);

               <button class="btn" id="dl-local">Download ${esc(spec.label)}</button>`}

          </div>`
    ) : ''}

    ${needsKey && p.reach !== 'blocked' ? `
      <div class="step ${step>1?'done':''}">
        <span class="step-n">1</span>
        <div class="step-body">
          <p>Get a key from ${esc(p.label)}. It opens in a new tab.</p>
          <a class="btn" href="${p.signup}" target="_blank" rel="noopener noreferrer">

          <p>Paste it here. It stays in this tab and is never sent anywhere but ${esc(p.label)}.</p>
          <input type="password" data-key="${id}" value="${esc(S.keys[id] ?? '')}"
                 placeholder="Paste your key" autocomplete="off" spellcheck="false"
                 aria-label="${esc(p.label)} key">

          <p>Pick a model. The first one is a good default.</p>

    ${test ? `<div class="result ${test.ok?'ok':'bad'}">${esc(test.msg)}</div>` : ''}
    ${p.note && !built && id!=='localdl' && p.reach !== 'blocked' && id!=='ollama' && id!=='lmstudio'
      ? `<p class="fine">${esc(p.note)}</p>` : ''}
  </div>`;
}

function modelPicker(id){

  const cur = modelOf(id), known = p.models.includes(cur);
  const label = m => {

    return spec ? `${spec.label} (${spec.size})` : m;

  return `<select data-model="${id}" aria-label="Model">
    ${p.models.map(m=>`<option value="${esc(m)}" ${cur===m?'selected':''}>${esc(label(m))}</option>`).join('')}
    ${known ? '' : `<option value="${esc(cur)}" selected>${esc(label(cur))} (custom)</option>`}
  </select>`;
}

function wireSheet(el){
  el.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => {
    S.lookTab = Number(b.dataset.tab); renderSheet(); });
  const pick = (attr, apply) => el.querySelectorAll(`[data-${attr}]`).forEach(b =>
    b.onclick = () => { apply(b.dataset[attr]); applyTheme(); renderSheet(); render(); });
  pick('brand',   v => S.brand = v);
  pick('typeset', v => S.typeset = v);
  pick('density', v => S.density = v);
  pick('locale',  v => S.locale = v);
  pick('mode',    v => {
    S.modePref = v;
    S.mode = v === 'system' ? resolveMode() : v;
  });
  const mOut = el.querySelector('#marks-out');
  if (mOut) mOut.onclick = () => saveFile('throughline-marks.json',
    JSON.stringify({kind:'throughline.marks', v:1, exported:new Date().toISOString(), items:S.marks}, null, 2));
  const mIn = el.querySelector('#marks-in'), mFile = el.querySelector('#marks-file');
  if (mIn) mIn.onclick = () => mFile.click();
  if (mFile) mFile.onchange = async () => {
    const f = mFile.files?.[0]; if (!f) return;
    try {
      const doc = JSON.parse(await f.text());
      if (doc?.kind !== 'throughline.marks') throw new Error('Not a marks file.');
      /* Merge rather than replace — importing from a second device should not
         silently delete what is already here. Newer wins on conflict. */
      for (const [k, v] of Object.entries(doc.items ?? {}))
        if (!S.marks[k] || (v.at ?? 0) > (S.marks[k].at ?? 0)) S.marks[k] = v;
      await S.storage?.write(MARK_DOC, {title:'Marks', items:S.marks});
      renderSheet(); render();
    } catch(e){ alert(`Could not import: ${e.message}`); }
  };
  const def = el.querySelector('#defprov');
  if (def) def.onchange = () => { S.provider = def.value; renderSheet(); render(); };
  el.querySelectorAll('[data-sel]').forEach(b => b.onclick = () => {
    S.connectSel = b.dataset.sel; renderSheet(); });
  el.querySelectorAll('[data-jump]').forEach(b => b.onclick = () => {
    const id = b.dataset.jump;
    S.connectSel = id;
    if (id === 'demo'){ S.provider = 'demo'; render(); }
    renderSheet();
  });

  /* Test automatically once a key looks complete. Nobody should have to know
     that a separate "Test" button exists, or which error means what. */
  el.querySelectorAll('[data-key]').forEach(inp => {
    let t;
    inp.oninput = () => {
      const id = inp.dataset.key;
      if (inp.value.trim()) S.keys[id] = inp.value.trim(); else delete S.keys[id];
      clearTimeout(t);
      if ((inp.value.trim().length) < 12) return;
      t = setTimeout(async () => {
        S.testing = id; renderSheet();
        const r = await testProvider(id);
        S.tests[id] = r.ok ? r : {ok:false, msg:humanError(r.msg, id)};
        S.testing = null; renderSheet(); render();
      }, 700);
    };
  });
  el.querySelectorAll('[data-model]').forEach(inp => {
    inp.oninput = () => { S.models[inp.dataset.model] = inp.value; };
  });
  el.querySelectorAll('[data-local-model]').forEach(b => b.onclick = () => {
    S.models.localdl = b.dataset.localModel;
    if (_localPipes[S.models.localdl])
      S.local = { status:'ready', progress:100, file:null, err:null, ready:S.models.localdl };
    renderSheet(); render();
  });
  const dlLocal = el.querySelector('#dl-local');
  if (dlLocal) dlLocal.onclick = async () => {
    const id = S.models.localdl || recommendLocalModel(S.device).id;
    dlLocal.disabled = true;
    try {
      let last = -1;
      await downloadLocalModel(id, () => {
        const pct = S.local?.progress ?? 0;
        if (pct === last) return;
        last = pct; renderSheet();
      });
    } catch (e){
      S.tests.localdl = {ok:false, msg:humanError(e.message || String(e), 'localdl')};
      if (S.local) S.local.err = S.tests.localdl.msg;
    }
    renderSheet(); render();
  };
  const dl = el.querySelector('#dl-builtin');
  if (dl) dl.onclick = async () => {
    try {
      let last = -1;
      await downloadBuiltIn((loaded, total) => {
        const pct = total ? Math.round(loaded/total*100) : Math.round(loaded*100);
        if (pct === last) return;
        last = pct; S.dl = pct; renderSheet();
      });
    } catch(e){
      S.tests.chrome = {ok:false, msg:e.message || String(e)};
      /* Re-probe instead of forcing 'unavailable' — a failed download should
         still leave a retry path when the API reports downloadable. */
      await probeBuiltIn();
    }
    S.dl = null; renderSheet(); render();
  };
  el.querySelectorAll('[data-test]').forEach(btn => btn.onclick = async () => {
    const id = btn.dataset.test;
    btn.disabled = true; btn.textContent = 'Testing…';
    const r = await testProvider(id);
    S.tests[id] = r.ok ? r : {ok:false, msg:humanError(r.msg, id)};
    renderSheet(); render();
  });
}
