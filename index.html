<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Throughline</title>
<meta name="description" content="Runnable notebooks that show you what AI can actually do.">
<meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141312" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
/* Baseline reset — harmless duplication when this file is published as an
   Artifact (which supplies its own), required when it is served standalone
   from a static host at any path. */
html,body{margin:0}
img{max-width:100%}

/* A class that sets `display` outranks the UA stylesheet's [hidden] rule, so
   `el.hidden = true` silently does nothing. This has already caused two bugs
   (the model popover, the appearance tabs) — fix the pattern once. */
[hidden]{display:none !important}

/* ═══════════════════════════════════════════════════════════════════════
   TIER 1 — PRIMITIVES
   Raw values. Never referenced by a component rule. Brands replace these
   wholesale. Everything below Tier 2 is the brand contract.
   ═══════════════════════════════════════════════════════════════════════ */
:root {
  --p-gray-0:#ffffff; --p-gray-25:#fcfcfb; --p-gray-50:#f6f5f3; --p-gray-100:#eceae6;
  --p-gray-200:#dedbd5; --p-gray-300:#c2beb6; --p-gray-400:#94908a; --p-gray-500:#6b6862;
  --p-gray-600:#4a4844; --p-gray-700:#33312e; --p-gray-800:#22201e; --p-gray-900:#141312;
  --p-accent-400:#7a6cf0; --p-accent-500:#5b4ce0; --p-accent-600:#4a3cc4;
  --p-amber-500:#b8860b; --p-red-500:#c0392b; --p-green-500:#2d7a4f; --p-blue-500:#2b6cb0;

  --p-font-display:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
  --p-font-body:ui-sans-serif,-apple-system,'Segoe UI',Inter,system-ui,sans-serif;
  --p-font-mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;

  --p-size-0:0.6875rem; --p-size-1:0.75rem;  --p-size-2:0.8125rem; --p-size-3:0.875rem;
  --p-size-4:0.9375rem; --p-size-5:1.0625rem; --p-size-6:1.375rem; --p-size-7:1.875rem;
  --p-size-8:2.5rem;

  --p-space-1:0.25rem; --p-space-2:0.5rem;  --p-space-3:0.75rem; --p-space-4:1rem;
  --p-space-5:1.5rem;  --p-space-6:2rem;    --p-space-7:3rem;    --p-space-8:4.5rem;

  --p-radius-0:0px; --p-radius-1:3px; --p-radius-2:6px; --p-radius-3:10px; --p-radius-4:18px;
  --p-dur-1:110ms; --p-dur-2:220ms; --p-dur-3:420ms;
  --p-weight-normal:400; --p-weight-medium:500; --p-weight-bold:650;
  --p-tracking-tight:-0.015em; --p-tracking-wide:0.06em;

/* ═══════════════════════════════════════════════════════════════════════
   TIER 2 — SEMANTIC   ← the brand contract. A brand overrides ONLY this.
   ═══════════════════════════════════════════════════════════════════════ */
  --surface-base:var(--p-gray-25);
  --surface-raised:var(--p-gray-0);
  --surface-sunken:var(--p-gray-50);
  --surface-inverse:var(--p-gray-900);

  --ink-primary:var(--p-gray-900);
  --ink-secondary:var(--p-gray-600);
  --ink-muted:var(--p-gray-400);
  --ink-inverse:var(--p-gray-0);

  --accent-base:var(--p-accent-500);
  --accent-hover:var(--p-accent-600);
  --accent-ink:var(--p-gray-0);
  --accent-wash:color-mix(in oklab, var(--accent-base) 8%, transparent);

  --border-subtle:var(--p-gray-200);
  --border-strong:var(--p-gray-300);
  --border-focus:var(--accent-base);

  --status-idle:var(--p-gray-400);
  --status-running:var(--p-blue-500);
  --status-done:var(--p-green-500);
  --status-stale:var(--p-amber-500);
  --status-error:var(--p-red-500);

  --font-display:var(--p-font-display);
  --font-body:var(--p-font-body);
  --font-mono:var(--p-font-mono);
  --weight-heading:var(--p-weight-bold);
  --tracking-heading:var(--p-tracking-tight);

  --radius-sm:var(--p-radius-1);
  --radius-md:var(--p-radius-2);
  --radius-lg:var(--p-radius-3);
  --radius-pill:999px;

  --elevation-1:0 1px 2px rgb(0 0 0 / 0.05), 0 1px 1px rgb(0 0 0 / 0.03);
  --elevation-2:0 2px 8px rgb(0 0 0 / 0.07), 0 1px 2px rgb(0 0 0 / 0.04);

  --motion-fast:var(--p-dur-1);
  --motion-base:var(--p-dur-2);
  --motion-slow:var(--p-dur-3);

/* ── TIER 3 — COMPONENT (aliases; the escape hatch) ─────────────────── */
  --cell-bg:var(--surface-raised);
  --cell-border:var(--border-subtle);
  --cell-index-ink:var(--ink-muted);
  --topbar-bg:var(--surface-base);
  --code-bg:var(--surface-sunken);
}

/* Dark pair — every brand ships both. Only Tier 2 is redefined. */
:root[data-mode="dark"] {
  --surface-base:var(--p-gray-900);
  --surface-raised:var(--p-gray-800);
  --surface-sunken:#0d0c0c;
  --surface-inverse:var(--p-gray-50);
  --ink-primary:var(--p-gray-50);
  --ink-secondary:var(--p-gray-300);
  --ink-muted:var(--p-gray-500);
  --ink-inverse:var(--p-gray-900);
  --accent-base:var(--p-accent-400);
  --accent-hover:#9184f5;
  --accent-ink:var(--p-gray-900);
  --border-subtle:#332f2c;
  --border-strong:#494540;
  --elevation-1:0 1px 2px rgb(0 0 0 / 0.4);
  --elevation-2:0 2px 10px rgb(0 0 0 / 0.5);
}

/* ═══════════════════════════════════════════════════════════════════════
   COMPONENTS — no literal colors, sizes, radii, or durations below.
   Enforced in CI by stylelint (see ENGINEERING-BRIEF §7).
   ═══════════════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box}

/* Numbers that sit in columns, tick upward, or get compared must not
   reflow as they change. Tabular everywhere a digit is data. */
.cell-index,.meta,.pip .n,.pass,.statusbar,.hero-count,.out-table td,.var-table{
  font-variant-numeric:tabular-nums;
}

html,body{background:var(--surface-base); color:var(--ink-primary); font-family:var(--font-body)}

/* ── App shell ───────────────────────────────────────────────────────────
   Three rows: chrome, scrolling canvas, chrome. The canvas sits a level
   below the chrome and the cells sit a level above the canvas, so the
   surface hierarchy reads as a tool rather than a document. All three
   grounds come from existing semantic tokens, so every brand inherits it. */
.nb-root{
  block-size:100dvh; display:grid; grid-template-rows:auto minmax(0,1fr) auto;
  background:var(--surface-base); color:var(--ink-primary);
  font-family:var(--font-body); font-size:var(--p-size-4); line-height:var(--line,1.55);
  -webkit-font-smoothing:antialiased; overflow:hidden;
  transition:background var(--motion-base), color var(--motion-base);
  /* Notched phones: chrome absorbs the inset; the canvas scrolls under it. */
  padding-inline:env(safe-area-inset-left, 0px) env(safe-area-inset-right, 0px);
  padding-block-start:env(safe-area-inset-top, 0px);
  padding-block-end:env(safe-area-inset-bottom, 0px);
  -webkit-tap-highlight-color:color-mix(in oklab, var(--accent-base) 18%, transparent);
  touch-action:manipulation;
}
.workspace{
  overflow-y:auto; overflow-x:hidden; background:var(--surface-sunken);
  scroll-behavior:smooth; overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
}
@media (prefers-reduced-motion:reduce){ .workspace{scroll-behavior:auto} }
.workspace-in{
  max-inline-size:80rem; margin-inline:auto; min-block-size:100%;
  display:grid; grid-template-columns:13.5rem minmax(0,1fr); align-items:start;
  gap:var(--p-space-5);
  padding:var(--p-space-6) var(--p-space-5) var(--p-space-7);
}
.workspace-in.solo{grid-template-columns:minmax(0,1fr)}
.workspace-in.solo .rail{display:none}
.shell{max-inline-size:none; margin:0; padding:0; min-inline-size:0}
.nb-root h1,.nb-root h2,.nb-root h3{
  font-family:var(--font-display); font-weight:var(--weight-heading);
  letter-spacing:var(--tracking-heading); line-height:1.15; margin:0;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:inherit}

/* ── Top bar ─────────────────────────────────────────────────────────── */
.topbar{
  z-index:20; background:var(--topbar-bg);
  border-block-end:1px solid var(--border-subtle);
}
.topbar-in{
  max-inline-size:80rem; margin-inline:auto; padding:var(--p-space-3) var(--p-space-5);
  display:flex; align-items:center; gap:var(--p-space-4);
}
.wordmark{
  display:flex; align-items:center; gap:var(--p-space-2);
  font-family:var(--font-display); font-weight:var(--weight-heading);
  font-size:var(--p-size-5); letter-spacing:var(--tracking-heading);
}
.wordmark .glyph{
  inline-size:var(--p-space-4); block-size:var(--p-space-4); flex:none;
  border-radius:var(--radius-sm); background:var(--accent-base);
  position:relative; overflow:hidden;
}
.wordmark .glyph::after{
  content:''; position:absolute; inset-inline-start:0; inset-block-start:50%;
  inline-size:100%; block-size:1px; background:var(--accent-ink); opacity:.9;
}
.spacer{flex:1}

.ghost{
  display:inline-flex; align-items:center; justify-content:center;
  padding:var(--p-space-1) var(--p-space-3); border-radius:var(--radius-md);
  color:var(--ink-secondary); font-size:var(--p-size-2);
  transition:background var(--motion-fast), color var(--motion-fast);
}
.ghost:hover{background:var(--surface-sunken); color:var(--ink-primary)}
.ghost[aria-pressed="true"]{background:var(--accent-wash); color:var(--accent-base)}

.btn{
  display:inline-flex; align-items:center; gap:var(--p-space-2);
  padding:var(--p-space-2) var(--p-space-4); border-radius:var(--radius-md);
  background:var(--accent-base); color:var(--accent-ink);
  font-size:var(--p-size-3); font-weight:var(--p-weight-medium);
  transition:background var(--motion-fast), transform var(--motion-fast);
}
.btn:hover{background:var(--accent-hover)}
.btn:active{background:var(--accent-hover)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn.secondary{
  background:transparent; color:var(--ink-primary);
  box-shadow:inset 0 0 0 1px var(--border-strong);
}
.btn.secondary:hover{background:var(--surface-sunken)}
.btn.tiny{padding:var(--p-space-1) var(--p-space-3); font-size:var(--p-size-1)}
.btn .i{inline-size:1em; block-size:1em; flex:none}
.btn.primary{font-weight:var(--p-weight-bold)}

/* Joined controls. They share edges because they are one control with
   several positions, which is what a group of related actions is. */
.seg-group{
  display:inline-flex; border-radius:var(--radius-md); overflow:hidden;
  box-shadow:inset 0 0 0 1px var(--border-strong);
}
.seg-group .btn.seg{
  border-radius:0; background:transparent; color:var(--ink-secondary);
  padding:var(--p-space-2) var(--p-space-3); font-size:var(--p-size-2);
  box-shadow:none;
}
.seg-group .btn.seg + .btn.seg{box-shadow:inset 1px 0 0 var(--border-strong)}
.seg-group .btn.seg:hover{background:var(--surface-sunken); color:var(--ink-primary)}
.seg-group .btn.seg:active{background:var(--accent-wash); color:var(--accent-base)}
.nb-actions{position:relative}

.share-pop{
  position:absolute; z-index:25; inset-block-start:calc(100% + var(--p-space-2));
  inset-inline-end:0; inline-size:min(26rem, 82vw);
  padding:var(--p-space-4); background:var(--surface-raised);
  border:1px solid var(--border-strong); border-radius:var(--radius-md);
  box-shadow:var(--elevation-2);
  display:flex; flex-direction:column; gap:var(--p-space-2);
}
.share-status{margin:0; font-size:var(--p-size-2); font-weight:var(--p-weight-medium)}
.share-url{font-family:var(--font-mono); font-size:var(--p-size-0)}
.share-hint{margin:0; font-size:var(--p-size-1); color:var(--ink-muted); line-height:1.5}

:where(button,select,input,textarea,a):focus-visible{
  outline:2px solid var(--border-focus); outline-offset:2px; border-radius:var(--radius-sm);
}

/* ── Shell ───────────────────────────────────────────────────────────── */
.shell{max-width:74rem; margin-inline:auto; padding:var(--p-space-6) var(--p-space-5) var(--p-space-8)}
.eyebrow{
  font-size:var(--p-size-0); text-transform:uppercase; font-feature-settings:'kern' 1;
  letter-spacing:var(--p-tracking-wide); color:var(--ink-muted);
  font-weight:var(--p-weight-medium);
}
.lede{color:var(--ink-secondary); max-width:60ch; margin-block-start:var(--p-space-3)}

/* ── Library ─────────────────────────────────────────────────────────── */
.hero{max-inline-size:46rem; margin-block-end:var(--p-space-7)}
.hero h1{font-size:clamp(2rem, 5.5vw, 3rem); margin-block-start:var(--p-space-3); max-inline-size:18ch}
.hero-count{
  margin-block-start:var(--p-space-4); font-size:var(--p-size-1);
  color:var(--ink-muted); font-family:var(--font-mono);
}

/* The featured notebook earns its place by being the one that does something
   the others do not — not by being newest. */
.feature{
  display:grid; grid-template-columns:1.4fr 1fr; gap:var(--p-space-6);
  padding:var(--p-space-6); margin-block-end:var(--p-space-7);
  background:var(--surface-raised); border:1px solid var(--border-subtle);
  border-radius:var(--radius-lg); box-shadow:var(--elevation-1);
}
.feature h2{font-size:var(--p-size-7); margin-block:var(--p-space-2) var(--p-space-3)}
.feature p{margin:0; color:var(--ink-secondary); font-size:var(--p-size-3); line-height:1.6}
.feature .btn{margin-block-start:var(--p-space-4)}
.feature-aside{
  padding-inline-start:var(--p-space-6); border-inline-start:1px solid var(--border-subtle);
}
.feature-aside p{font-size:var(--p-size-2); margin-block-start:var(--p-space-2)}
.feature-aside b{color:var(--ink-primary)}

/* ── Browse ──────────────────────────────────────────────────────────── */
.browse{display:flex; flex-direction:column; gap:var(--p-space-4)}
.filter-bar{
  display:flex; align-items:flex-end; gap:var(--p-space-3); flex-wrap:wrap;
  position:sticky; inset-block-start:0; z-index:6;
  padding-block:var(--p-space-3); margin-block-start:calc(var(--p-space-2) * -1);
  background:var(--surface-sunken);
}
.search{flex:1; min-inline-size:14rem}
.search input{inline-size:100%}
.sort{display:flex; flex-direction:column; gap:var(--p-space-1)}
.sort select{inline-size:auto; min-inline-size:9rem}

.facet{display:flex; align-items:baseline; gap:var(--p-space-3); flex-wrap:wrap}
.facet-label{
  flex:none; inline-size:4rem; font-size:var(--p-size-0); text-transform:uppercase;
  letter-spacing:var(--p-tracking-wide); color:var(--ink-muted);
}
.chips{display:flex; gap:var(--p-space-2); flex-wrap:wrap; flex:1}
.chip-btn{
  display:inline-flex; align-items:center; gap:var(--p-space-2);
  padding:var(--p-space-1) var(--p-space-3); border-radius:var(--radius-pill);
  font-size:var(--p-size-1); color:var(--ink-secondary);
  box-shadow:inset 0 0 0 1px var(--border-subtle);
  transition:box-shadow var(--motion-fast), color var(--motion-fast), background var(--motion-fast);
}
.chip-btn:hover{box-shadow:inset 0 0 0 1px var(--border-strong); color:var(--ink-primary)}
.chip-btn[aria-pressed="true"]{
  background:var(--accent-base); color:var(--accent-ink);
  box-shadow:inset 0 0 0 1px var(--accent-base);
}
.chip-btn .gl{font-size:var(--p-size-2); opacity:.8}
.chip-btn .ct{font-size:var(--p-size-0); opacity:.6; font-variant-numeric:tabular-nums}
.result-count{
  margin:0; font-size:var(--p-size-1); color:var(--ink-muted);
  font-variant-numeric:tabular-nums;
}
.card .eyebrow .gl{margin-inline-end:var(--p-space-2); opacity:.7}
.empty-outs{display:flex; gap:var(--p-space-2); flex-wrap:wrap; justify-content:center}
.empty{
  padding:var(--p-space-7) var(--p-space-5); text-align:center;
  display:flex; flex-direction:column; align-items:center; gap:var(--p-space-4);
  color:var(--ink-muted);
}

/* Stagger, capped. A 40-card grid animating in sequence is a loading screen;
   the cap keeps the last card under a quarter second. */
@media (prefers-reduced-motion:no-preference){
  .shelf .card{
    animation:cardIn var(--motion-base) both;
    animation-delay:calc(var(--i, 0) * 9ms);
  }
  @keyframes cardIn{
    from{opacity:0; transform:translateY(6px)}
    to{opacity:1; transform:none}
  }
}

.collection{margin-block-end:var(--p-space-7)}
.collection-head{
  display:flex; align-items:baseline; gap:var(--p-space-4);
  flex-wrap:wrap; margin-block-end:var(--p-space-4);
  padding-block-end:var(--p-space-3); border-block-end:1px solid var(--border-subtle);
}
.collection-head h2{font-size:var(--p-size-6)}
.collection-head p{margin:0; color:var(--ink-muted); font-size:var(--p-size-2)}

.shelf{
  display:grid; gap:var(--p-space-4);
  grid-template-columns:repeat(auto-fill,minmax(19rem,1fr));
}
.card.featured{border-color:color-mix(in oklab,var(--accent-base) 40%,var(--border-subtle))}
.tag.loop{color:var(--accent-base); background:var(--accent-wash)}
/* Surfaces blur what is behind them only when a theme asks for it. Default
   0px, so opaque themes pay nothing. */
/* Blur on .topbar / .menu creates a containing block: position:fixed
   children (the model menu on phones) get trapped inside the topbar and
   become untappable. Keep glass on content surfaces only. */
.card,.cell,.sheet{backdrop-filter:blur(var(--surface-blur, 0px))}

.card{
  text-align:start; display:flex; flex-direction:column; gap:var(--p-space-3);
  padding:var(--p-space-5); background:var(--surface-raised);
  border:1px solid var(--border-subtle); border-radius:var(--radius-lg);
  box-shadow:var(--elevation-1);
  transition:border-color var(--motion-fast), box-shadow var(--motion-base);
}
/* No lift on hover. A card that rises to meet the cursor is decoration
   pretending to be feedback; the border stating "this is now the one" is
   the same information with none of the theatre. */
.card:hover{border-color:var(--border-strong); box-shadow:var(--elevation-2)}
.card h3{font-size:var(--p-size-6)}
.card p{margin:0; color:var(--ink-secondary); font-size:var(--p-size-3); flex:1}
.card-foot{
  display:flex; align-items:center; gap:var(--p-space-3); flex-wrap:wrap;
  font-size:var(--p-size-1); color:var(--ink-muted);
  padding-block-start:var(--p-space-3); border-block-start:1px solid var(--border-subtle);
}
.tag{
  padding:var(--p-space-1) var(--p-space-2); border-radius:var(--radius-pill);
  background:var(--surface-sunken); color:var(--ink-secondary); font-size:var(--p-size-0);
}

/* ── Notebook ────────────────────────────────────────────────────────── */
.nb-head{
  display:flex; align-items:flex-start; gap:var(--p-space-5);
  flex-wrap:wrap;
}
.nb-title{flex:1; min-inline-size:min(100%, 16rem)}
.nb-head h1{font-size:var(--p-size-8); max-width:22ch}
.nb-actions{display:flex; gap:var(--p-space-2); align-items:center; flex-wrap:wrap}
.doc-head{padding-inline-end:calc(var(--p-space-6) + 2rem)}

/* ── The document ────────────────────────────────────────────────────────
   The canvas is the tool; this is the thing on it. Cells stop being floating
   cards and become sections of one page, divided by rules — which is what a
   notebook actually is, and it removes a level of nested elevation that made
   the cells fight the page for attention. */
/* The rail has zero width and full document height, so its sticky child
   travels the whole sheet and stops at its end rather than the viewport's. */
.doc-rail{
  position:absolute; inset-block:0; inset-inline-end:0;
  inline-size:0; z-index:12; pointer-events:none;
}
.doc-tools{
  position:sticky; inset-block-start:var(--p-space-5);
  display:flex; flex-direction:column; gap:1px;
  transform:translateX(50%);            /* half on the sheet, half off it */
  pointer-events:auto;
}
[dir="rtl"] .doc-tools{transform:translateX(-50%)}
.tool{
  position:relative;
  display:flex; align-items:center; justify-content:center;
  inline-size:2.25rem; block-size:2.25rem; padding:0;
  border-radius:var(--radius-md);
  background:var(--surface-raised); color:var(--ink-muted);
  box-shadow:inset 0 0 0 1px var(--border-subtle);
  transition:color var(--motion-fast), background var(--motion-fast),
             box-shadow var(--motion-fast);
}
.tool .i{inline-size:1em; block-size:1em; flex:none}
/* The label sits OUTSIDE the button box. A column flex container stretches
   its children to one shared width, so an in-flow label could never widen a
   single button — and widening the container would shift the straddle. */
.tool .lbl{
  position:absolute; inset-inline-end:calc(100% + var(--p-space-2)); inset-block:0;
  display:flex; align-items:center; white-space:nowrap;
  padding-inline:var(--p-space-3); border-radius:var(--radius-md);
  background:var(--surface-raised); color:var(--ink-primary);
  box-shadow:inset 0 0 0 1px var(--border-subtle);
  font-size:var(--p-size-1);
  opacity:0; pointer-events:none; transform:translateX(var(--p-space-2));

  font-family:var(--font-mono); font-size:var(--p-size-0);
  color:var(--ink-muted); font-variant-numeric:tabular-nums; flex:none;
}
.pip .lbl{flex:1; min-inline-size:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* A loop is drawn, not described: the spine doubles back beside the cells
   a gate can return to. */
.pip.in-loop::after{
  content:''; position:absolute; z-index:0;
  inset-block:-1px; inset-inline-start:calc(var(--p-space-3) - 1px);
  inline-size:1px; background:var(--accent-base); opacity:.5;
}
.pip.loop-start::after{inset-block-start:50%; border-start-start-radius:4px}
.pip.loop-end::after{inset-block-end:50%}
.pass{
  font-family:var(--font-mono); font-size:var(--p-size-0);
  color:var(--accent-base); flex:none;
}

/* ── Status bar ──────────────────────────────────────────────────────────
   Persistent, honest state: where your data lives, what is running, what
   is answering. */
.statusbar{
  display:flex; align-items:center; gap:var(--p-space-4);
  padding:var(--p-space-2) var(--p-space-5);
  border-block-start:1px solid var(--border-subtle);
  background:var(--topbar-bg);
  font-size:var(--p-size-0); color:var(--ink-muted);
  overflow-x:auto; white-space:nowrap;
}
.statusbar .seg{display:flex; align-items:center; gap:var(--p-space-2); flex:none}
.statusbar a{color:var(--ink-secondary)}
.statusbar .storage .short{display:none}
.progress{
  inline-size:5rem; block-size:3px; border-radius:var(--radius-pill);
  background:var(--border-subtle); overflow:hidden; flex:none;
}
.progress i{display:block; block-size:100%; background:var(--status-done); transition:inline-size var(--motion-base)}

.switch-wrap{position:relative}
.switcher{
  display:inline-flex; align-items:center; gap:var(--p-space-2);
  padding:var(--p-space-1) var(--p-space-3); border-radius:var(--radius-pill);
  font-size:var(--p-size-2); color:var(--ink-secondary);
  box-shadow:inset 0 0 0 1px var(--border-subtle);
  transition:box-shadow var(--motion-fast), color var(--motion-fast);
}
.switcher:hover{box-shadow:inset 0 0 0 1px var(--border-strong); color:var(--ink-primary)}
.switcher .chev{font-size:var(--p-size-0); color:var(--ink-muted)}
/* .menu sets display:flex, and a class selector beats the UA stylesheet's
   [hidden]{display:none} — so the popover renders open until told otherwise.
   The Artifact host supplies this rule in its own reset; a standalone deploy
   does not, which is why this only appeared in production. */
.menu{
  position:absolute; inset-block-start:calc(100% + var(--p-space-2)); inset-inline-start:0;
  z-index:30; min-inline-size:19rem; padding:var(--p-space-2);
  background:var(--surface-raised); border:1px solid var(--border-subtle);
  border-radius:var(--radius-lg); box-shadow:var(--elevation-2);
  display:flex; flex-direction:column; gap:1px;
}
.menu-label{
  padding:var(--p-space-2) var(--p-space-3) var(--p-space-1);
  font-size:var(--p-size-0); text-transform:uppercase;
  letter-spacing:var(--p-tracking-wide); color:var(--ink-muted);
}
.menu-item{
  display:flex; align-items:center; gap:var(--p-space-3); text-align:start;
  padding:var(--p-space-2) var(--p-space-3); border-radius:var(--radius-md);
  font-size:var(--p-size-2); transition:background var(--motion-fast);
}
.menu-item:hover:not(:disabled){background:var(--surface-sunken)}
.menu-item:disabled{opacity:.5; cursor:default}
.menu-item .grow{flex:1; min-inline-size:0}
.menu-item .sub{display:block; font-size:var(--p-size-0); color:var(--ink-muted)}
.menu-item .tick{color:var(--accent-base)}
.menu-sep{block-size:1px; background:var(--border-subtle); margin:var(--p-space-2) 0}
/* Desktop: unused. Phones: full-viewport dismiss layer behind the sheet menu. */
.menu-scrim{display:none}

.picker{display:inline-flex; align-items:center; gap:var(--p-space-2)}
.picker select{
  inline-size:auto; padding:var(--p-space-1) var(--p-space-2);
  font-size:var(--p-size-0); font-family:var(--font-mono);
  background:transparent; border-color:var(--border-subtle); color:var(--ink-secondary);
}
pre.raw{
  margin:0 0 var(--p-space-3); padding:var(--p-space-3); border-radius:var(--radius-md);
  background:var(--code-bg); font-family:var(--font-mono); font-size:var(--p-size-1);
  color:var(--ink-secondary); white-space:pre-wrap; word-break:break-word;
  max-block-size:11rem; overflow:auto;
}
.cell-edit{
  padding:var(--p-space-3) var(--p-space-6);
  padding-inline-start:calc(var(--p-space-6) + var(--p-space-6));
  background:var(--surface-sunken);
  border-block-start:1px dashed var(--border-subtle);
  display:flex; flex-direction:column; gap:var(--p-space-3);
}
.edit-row{display:flex; align-items:center; gap:var(--p-space-3); flex-wrap:wrap}
.field-inline{display:flex; align-items:center; gap:var(--p-space-2)}
.field-inline select{inline-size:auto; padding:var(--p-space-1) var(--p-space-2); font-size:var(--p-size-1)}
.edit-prompt > summary{
  cursor:pointer; font-size:var(--p-size-1); color:var(--ink-secondary);
  list-style:none; padding-block:var(--p-space-1);
}
.edit-prompt > summary::-webkit-details-marker{display:none}
.edit-prompt > summary::before{content:'▸ '; font-size:var(--p-size-0)}
.edit-prompt[open] > summary::before{content:'▾ '}
.edit-prompt textarea{font-family:var(--font-mono); font-size:var(--p-size-1); margin-block-start:var(--p-space-2)}
.edit-prompt .hint{font-size:var(--p-size-1); color:var(--ink-muted); margin-block:var(--p-space-2) 0}
.cell.off{opacity:.55}
.cell.off .cell-head{padding-block:var(--p-space-3)}
.pip.off{opacity:.4}
.pip.off .lbl{text-decoration:line-through}
.btn.seg.on{background:var(--accent-wash); color:var(--accent-base)}
.forked{
  display:flex; align-items:center; gap:var(--p-space-2); flex-wrap:wrap;
  margin-block-start:var(--p-space-3); font-size:var(--p-size-2); color:var(--ink-secondary);
}
.linkbtn{color:var(--accent-base); text-decoration:underline; font-size:inherit}

.mark{
  padding:var(--p-space-5) var(--p-space-6);
  border-block-start:1px solid var(--border-subtle);
  display:flex; align-items:center; gap:var(--p-space-4); flex-wrap:wrap;
  background:var(--surface-base);
}
.mark.marked{background:var(--accent-wash)}
.mark-q{flex:1; min-inline-size:16rem}
.mark-q strong{display:block; font-size:var(--p-size-3)}
.mark-q .hint{display:block; font-size:var(--p-size-1); color:var(--ink-muted); margin-block-start:var(--p-space-1)}
.mark-controls{display:flex; gap:var(--p-space-2); flex-wrap:wrap}
.btn.secondary.on{
  background:var(--accent-base); color:var(--accent-ink);
  box-shadow:inset 0 0 0 1px var(--accent-base);
}
.mark-note{flex-basis:100%; font-size:var(--p-size-2)}
.verdict{
  display:inline-block; inline-size:7px; block-size:7px; border-radius:var(--radius-pill);
  margin-inline-end:var(--p-space-2); vertical-align:middle;
}
.verdict.v-works{background:var(--status-done)}
.verdict.v-mixed{background:var(--status-stale)}
.verdict.v-no{background:var(--status-error)}
.card.mark-card{border-color:color-mix(in oklab,var(--accent-base) 25%,var(--border-subtle))}

.gate{
  padding:var(--p-space-4); border-radius:var(--radius-md);
  border:1px solid var(--border-subtle); background:var(--surface-sunken);
}
.gate.back{
  border-color:color-mix(in oklab, var(--accent-base) 35%, transparent);
  background:var(--accent-wash);
}
.gate-verdict{
  font-weight:var(--p-weight-medium); font-size:var(--p-size-2);
  margin-block-end:var(--p-space-2);
}
.gate.back .gate-verdict{color:var(--accent-base)}
.gate.through .gate-verdict{color:var(--status-done)}
.gate p{margin:0; font-size:var(--p-size-2); color:var(--ink-secondary); line-height:1.6}
.gate-rev{
  margin-block-start:var(--p-space-3); padding-block-start:var(--p-space-3);
  border-block-start:1px solid var(--border-subtle);
}
.gate-rev .eyebrow{display:block; margin-block-end:var(--p-space-2)}
.gate-rev p{color:var(--ink-primary)}
.badge.pass-badge{color:var(--accent-base); background:var(--accent-wash)}

.class-note{
  display:flex; align-items:center; gap:var(--p-space-3); flex-wrap:wrap;
  padding:var(--p-space-3); margin-block-end:var(--p-space-3);
  border-radius:var(--radius-md); font-size:var(--p-size-1);
  background:color-mix(in oklab,var(--status-stale) 9%,transparent);
  border:1px solid color-mix(in oklab,var(--status-stale) 28%,transparent);
}
.class-note > span{flex:1; min-inline-size:16rem; color:var(--ink-secondary)}
.class-note b{color:var(--ink-primary)}
.prov{
  padding:var(--p-space-4); border:1px solid var(--border-subtle);
  border-radius:var(--radius-md); display:flex; flex-direction:column; gap:var(--p-space-3);
}
.prov.on{border-color:color-mix(in oklab,var(--status-done) 40%,var(--border-subtle))}
.prov-head{display:flex; gap:var(--p-space-3); align-items:flex-start}
.prov-head .hint{font-size:var(--p-size-1); color:var(--ink-muted); margin-block-start:var(--p-space-1)}
.prov-row{display:flex; gap:var(--p-space-2); align-items:center; flex-wrap:wrap}
.prov-row input[type="password"]{flex:2; min-inline-size:9rem}
.prov-row input[type="text"]{flex:1; min-inline-size:8rem; font-family:var(--font-mono); font-size:var(--p-size-1)}
a.link{color:var(--accent-base); text-decoration:none; font-size:var(--p-size-1)}
a.link:hover{text-decoration:underline}
.prov-result{
  padding:var(--p-space-2) var(--p-space-3); border-radius:var(--radius-sm);
  font-size:var(--p-size-1); font-family:var(--font-mono); word-break:break-word;
}
.prov-result.ok{background:color-mix(in oklab,var(--status-done) 12%,transparent); color:var(--status-done)}
.prov-result.bad{background:color-mix(in oklab,var(--status-error) 10%,transparent); color:var(--status-error)}

.sr{position:absolute; inline-size:1px; block-size:1px; overflow:hidden; clip-path:inset(50%)}
/* ═══════════════════════════════════════════════════════════════════════
   RESPONSIVE
   Fluid where fluid works, restructured where it does not. The tables are
   the real case: three columns of prose cannot narrow, so below 640px they
   stop being a table and become labelled rows. The edge-straddling tool
   rail is the other: hanging half off the sheet works on a wide canvas and
   is clipped dead by overflow-x:hidden on a phone — so it re-enters the
   document flow.
   ═══════════════════════════════════════════════════════════════════════ */

/* Fluid display type — no step changes, no sudden reflow. */
.nb-head h1{font-size:clamp(1.75rem, 6vw, 2.5rem)}
.shell > h1{font-size:clamp(1.875rem, 7vw, 2.5rem)}
.card h3{font-size:clamp(1.125rem, 3.4vw, 1.375rem)}

/* Topbar: the switcher must never wrap — it is a pill, and a wrapped pill
   becomes an oval blob. Truncate instead. */
.topbar-actions{
  margin-inline-start:auto; display:flex; align-items:center;
  gap:var(--p-space-1); flex-wrap:nowrap; justify-content:flex-end; flex:none;
}
.switcher{max-inline-size:min(18rem, 42vw); white-space:nowrap; min-inline-size:0}
.switcher #model-name{overflow:hidden; text-overflow:ellipsis; min-inline-size:0}
.switcher .dot{flex:none}
.switch-wrap{min-inline-size:0; flex:1 1 auto; max-inline-size:100%}

/* Tables scroll rather than crush — but only while they are still tables. */
.table-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch}
table.out-table{min-inline-size:32rem}

/* iPad and below: the notebook actions keep their icons and lose their words,
   in the order least-to-most ambiguous. Run all keeps its label at every size
   because it is the one button whose meaning must never be guessed. */
@media (max-width:1024px){
  .seg-group .btn.seg .lbl{display:none}
  .seg-group .btn.seg{padding-inline:var(--p-space-4)}
}

@media (max-width:900px){
  .topbar-in{
    flex-wrap:nowrap; row-gap:var(--p-space-2);
    padding-inline:var(--p-space-4); gap:var(--p-space-2);
  }
  /* The rail stops being a sidebar and becomes a scrollable strip above the
     canvas — same information, one axis fewer. */
  .workspace-in{grid-template-columns:minmax(0,1fr); gap:var(--p-space-3);
    padding:var(--p-space-4) var(--p-space-4) var(--p-space-6)}
  .rail{
    /* Sticky here too — a nav that scrolls away is not a nav. Needs its own
       ground or the canvas shows through it. */
    position:sticky; inset-block-start:calc(var(--p-space-4) * -1); z-index:5;
    flex-direction:row; align-items:center; gap:var(--p-space-1);
    overflow-x:auto; padding-block:var(--p-space-2);
    margin-block-start:calc(var(--p-space-4) * -1);
    background:var(--surface-sunken);
    border-block-end:1px solid var(--border-subtle);
    -webkit-overflow-scrolling:touch; overscroll-behavior-x:contain;
    scroll-snap-type:x proximity; scrollbar-width:none;
  }
  .rail::-webkit-scrollbar{display:none}
  .rail-label{display:none}
  .rail-list{flex-direction:row; align-items:center; gap:var(--p-space-1)}
  /* The spine turns with the list. */
  .rail-list::before{
    inset-block:auto; inset-block-start:calc(50% - 0.5px);
    inset-inline:1.4rem; inline-size:auto; block-size:1px;
  }
  .pip{inline-size:auto; flex:none; padding-inline:var(--p-space-3); scroll-snap-align:start}
  .pip .lbl{max-inline-size:9rem}
  .pip.in-loop::after{
    inset-block:auto; inset-block-end:2px; inset-inline:-1px;
    inline-size:auto; block-size:1px;
  }
  .pip.loop-start::after{inset-inline-start:50%}
  .pip.loop-end::after{inset-inline-end:50%}

  /* Edge-straddling tools are clipped by .workspace{overflow-x:hidden} once
     the sheet fills the viewport. Re-enter the flow as a labelled strip. */
  .doc{display:flex; flex-direction:column}
  .doc-head{order:1; padding-inline-end:var(--p-space-5)}
  .doc-rail{
    position:static; inset:auto; inline-size:auto; order:2;
    pointer-events:auto;
    border-block-end:1px solid var(--border-subtle);
  }
  .doc-tools{
    position:static; transform:none;
    flex-direction:row; flex-wrap:nowrap; justify-content:stretch;
    gap:var(--p-space-1);
    padding:var(--p-space-2) var(--p-space-4);
  }
  [dir="rtl"] .doc-tools{transform:none}
  .doc-tools .tool{
    flex:1 1 0; inline-size:auto; block-size:auto; min-block-size:2.75rem;
    flex-direction:column; gap:2px; padding:var(--p-space-2);
  }
  .doc-tools .tool .lbl{
    position:static; inset:auto; display:block;
    opacity:1; pointer-events:none; transform:none;
    padding:0; background:transparent; box-shadow:none;
    color:inherit; font-size:var(--p-size-0); white-space:nowrap;
  }
  .doc-tools .share-pop{
    inset-block-start:calc(100% + var(--p-space-2));
    inset-inline-end:0; inset-inline-start:auto;
  }
  .doc > .cell{order:3}
  .doc > .cells{order:4}
  .doc > .mark{order:5}
  .shell{padding-inline:0; max-inline-size:none}
}

@media (max-width:640px){
  /* Titles go; the number and state dot carry the information. */
  .pip .lbl{display:none}
  .pip{gap:var(--p-space-2); min-block-size:44px; min-inline-size:44px;
    justify-content:center; padding-inline:var(--p-space-3)}
  .workspace-in{padding:var(--p-space-3) var(--p-space-3) var(--p-space-5); gap:var(--p-space-2)}
  .statusbar{
    padding-inline:var(--p-space-3); gap:var(--p-space-2);
    flex-wrap:wrap; white-space:normal; row-gap:var(--p-space-1);
    padding-block:var(--p-space-2);
  }
  .statusbar .storage .full{display:none}
  .statusbar .storage .short{display:inline}
  .statusbar .status-src{display:none}
  .topbar-actions .ghost{
    min-inline-size:44px; min-block-size:44px; padding-inline:var(--p-space-2);
  }
  .topbar-actions .ghost .lbl{display:none}
  .topbar-actions .ghost .ico{margin-inline-end:0}
  .nb-actions{inline-size:100%; flex-direction:column; align-items:stretch}
  .nb-actions .btn.primary{inline-size:100%; justify-content:center; min-block-size:48px}
  .nb-title{min-inline-size:0; inline-size:100%}
  .sheet-tabs{padding-inline:var(--p-space-4); gap:0}

  /* Popovers become fixed sheets — a 19rem menu from a centred trigger
     runs off a 360px screen, and share from the new tool strip needs room. */
  .menu{
    position:fixed; inset-inline:var(--p-space-3); inset-block-start:auto;
    inset-block-end:calc(var(--p-space-3) + env(safe-area-inset-bottom, 0px));
    min-inline-size:0; max-inline-size:none; inline-size:auto;
    max-block-size:min(70dvh, calc(100dvh - 5rem)); overflow-y:auto;
    -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
    z-index:50; box-shadow:var(--elevation-2);
  }
  /* Scrim behind the model menu so outside taps dismiss and the sheet
     reads as a real control, not a clipped topbar fragment. */
  .menu-scrim{
    display:block; position:fixed; inset:0; z-index:45;
    background:rgb(0 0 0 / 0.28);
    -webkit-tap-highlight-color:transparent;
  }
  .menu-scrim[hidden]{display:none !important}
  .share-pop{
    position:fixed; z-index:35;
    inset-inline:var(--p-space-3);
    inset-block-end:calc(var(--p-space-3) + env(safe-area-inset-bottom, 0px));
    inset-block-start:auto;
    inline-size:auto; max-inline-size:none;
  }

  .shell{padding:var(--p-space-4) 0 var(--p-space-6)}
  .topbar-in{padding-block:var(--p-space-2); padding-inline:var(--p-space-3); gap:var(--p-space-2)}
  /* Connect / Appearance: bottom sheet — thumb-reach, full width, own scroll. */
  .sheet-backdrop{
    align-items:flex-end; justify-content:stretch;
    padding:0; padding-block-start:var(--p-space-8);
  }
  .sheet,.sheet.wide{
    inline-size:100%; max-inline-size:none;
    max-block-size:92dvh; display:flex; flex-direction:column;
    border-radius:var(--radius-lg) var(--radius-lg) 0 0;
    border-block-end:0;
  }
  .sheet-head{
    position:relative; flex:none;
    padding:calc(var(--p-space-3) + 4px) var(--p-space-4) var(--p-space-4);
  }
  .sheet-head::before{
    content:''; position:absolute; inset-inline-start:50%; inset-block-start:var(--p-space-2);
    transform:translateX(-50%); inline-size:2.5rem; block-size:4px;
    border-radius:var(--radius-pill); background:var(--border-strong);
  }
  .sheet-body{padding:var(--p-space-4); gap:var(--p-space-4);
    overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
    flex:1; min-block-size:0}
  .sheet-body.flush{overflow-y:auto; overscroll-behavior:contain; flex:1; min-block-size:0}
  /* Connect panel: one column, chosen provider first — on a phone the list
     is a menu you leave, not a sidebar you sit beside. */
  .connect{grid-template-columns:1fr; min-block-size:0; flex:1}
  .connect-list{border-inline-end:0; border-block-start:1px solid var(--border-subtle);
    max-block-size:40dvh; order:2}
  .connect-detail{order:1; max-block-size:none; padding:var(--p-space-4)}
  .connect-foot{padding-inline:var(--p-space-4)}
  .cell-edit{padding:var(--p-space-3) var(--p-space-4)}
  .mark{padding:var(--p-space-4)}
  .cell-head{padding:var(--p-space-4) var(--p-space-4) var(--p-space-2)}
  .cell-body,.cell-foot{
    padding-inline:var(--p-space-4);
    padding-inline-start:var(--p-space-4);
  }
  .cell-body{padding-block-end:var(--p-space-4)}
  .cell-foot{padding-block:var(--p-space-3) var(--p-space-4); flex-wrap:wrap; row-gap:var(--p-space-2)}
  .doc-head{padding:var(--p-space-5) var(--p-space-4) var(--p-space-4)}
  .doc-tools{padding-inline:var(--p-space-3)}
  .card{padding:var(--p-space-4)}
  .shelf{grid-template-columns:1fr}
  .wordmark span:last-child{
    max-inline-size:0; overflow:hidden; opacity:0; margin-inline-start:calc(var(--p-space-2) * -1);
  }
  .switcher{max-inline-size:100%; inline-size:100%; justify-content:flex-start}
  .switch-wrap{flex:1 1 auto}

  /* Tables become labelled rows. Three columns of prose cannot be narrowed
     into 360px, and horizontal scroll on the primary content is a worse
     answer than restructuring it. */
  table.out-table{min-inline-size:0; display:block}
  .out-table thead{display:none}
  .out-table tbody,.out-table tr{display:block}
  .out-table tr{
    padding-block:var(--p-space-3);
    border-block-end:1px solid var(--border-subtle);
  }
  .out-table tr:last-child{border-block-end:0}
  .out-table td{
    display:grid; grid-template-columns:minmax(5.5rem,30%) 1fr;
    gap:var(--p-space-3); border:0; padding:var(--p-space-1) 0;
  }
  .out-table td::before{
    content:attr(data-col);
    font-size:var(--p-size-0); text-transform:uppercase;
    letter-spacing:var(--p-tracking-wide); color:var(--ink-muted);
    line-height:1.5;
  }

  .prov-row{flex-direction:column; align-items:stretch}

.score{

}

.diff{display:flex; flex-direction:column; gap:var(--p-space-3)}

   THROUGHLINE — MVP
   Single-file build. No dependencies, no build step, path-agnostic.

   Module boundaries below mirror packages/* in ENGINEERING-BRIEF §3.
   `engine` touches no DOM. `storage` is a swappable adapter. Components
   read only Tier-2/3 tokens. Kept in one file for MVP portability; split

/* ═════════ notebooks/ — THE LIBRARY. Content as data.
   Per PRODUCT-BRIEF §3 this is the product; the runtime is the viewer.
   The full shelf lives in library.json and is fetched relatively so the app
   stays droppable at any subpath. A small seed paints immediately (R6).
   `demo` / `demoPass` hydrate into functions at load. ═════════ */

function hydrateCell(c){
  const cell = {...c};
  if (cell.demoPass){
    const passes = cell.demoPass;
    cell.demo = (bag) => {
      const i = Math.max(0, Math.min(passes.length - 1, (bag?.__pass ?? 1) - 1));
      return structuredClone(passes[i]);
    };
    delete cell.demoPass;
  } else if (cell.demo !== undefined && typeof cell.demo !== 'function'){
    const v = cell.demo;
    cell.demo = () => structuredClone(v);
  }
  return cell;
}
function hydrateNotebook(nb){
  return {...nb, cells: nb.cells.map(hydrateCell)};
}

nt or willing to sit slightly off the happy path.\n\nAnd the availability of two engineers is not an argument for building. It is an argument that you have two engineers. Those are different, and conflating them is how organisations end up owning software they never chose to own."}, {"id": "falsifiers", "title": "What would change your mind", "intent": "Turns each assumption into something checkable this week. This is the cell that makes the notebook actionable rather than merely clever.", "inputs": ["assumptions"], "output": {"name": "falsifiers", "type": "table"}, "requires": "reasoning", "prompt": "For each assumption, state what observation would disprove it and the cheapest way to check within one week. Return a table with columns: Assumption, Would be disproved by, Check this week. Respond in {{locale.outputLanguage}}.\n\n{{assumptions}}", "demo": {"cols": ["Assumption", "Would be disproved by", "Cheapest check this week"], "rows": [["Requirements are genuinely unusual", "A vendor demo that handles 80% of them out of the box", "Send your top 10 requirements to two vendors and ask them to mark each yes/no/partial"], ["Six weeks is the real cost", "Any comparable internal build that shipped and stayed shipped at estimate", "Pull the last three internal tools you built. Compare estimate to actual, and check who maintains them now"], ["The engineers stay available", "Either one being pulled onto something else in the last two quarters", "Ask their manager for a written commitment through the window. The answer itself is the data"], ["Onboarding is build-once", "Your onboarding changing more than twice a year", "Count the onboarding-related tickets from the last 12 months"], ["The decision is reversible", "No credible path back to a vendor after 6 months in", "Ask what the migration off your own build would cost. If nobody can answer, it is not reversible"]]}}, {"id": "verdict", "title": "Where this leaves you", "intent": "A position, not a summary. The notebook should end by being useful.", "inputs": ["counter", "falsifiers"], "output": {"name": "verdict", "type": "prose"}, "requires": "reasoning", "prompt": "Given the counter-argument and the falsification tests, state plainly what the decision now looks like and what should happen next. Take a position. Respond in {{locale.outputLanguage}}.\n\n{{counter}}\n\n{{falsifiers}}", "demo": "The decision is not wrong, but it is currently being made on the wrong evidence. Three of the five load-bearing assumptions can be tested for roughly a day of effort each, and two of them — maintenance cost and engineer availability — have historical data sitting in systems you already own.\n\nRun the vendor requirement-marking exercise and pull the estimate-versus-actual on your last three internal builds. If vendors clear 80% and your internal builds ran at 2x, buy. If vendors clear under half and your builds land near estimate, build with confidence you do not currently have.\n\nThe thing not to do is decide this week on the grounds that two engineers happen to be free."}], "persona": "manager"}, {"id": "pre-mortem", "schemaVersion": "1.0.0", "realm": "business", "concept": "plan", "title": "Pre-Mortem", "blurb": "Assumes the thing already failed, eighteen months from now, and works backwards to find out why. Reliably surfaces risks a forward-looking review misses.", "teaches": "Prospective hindsight", "tags": ["planning", "risk"], "input": {"id": "plan", "label": "What you are about to commit to", "placeholder": "The initiative, the bet, the hire, the launch.", "seed": "We are going to build an internal AI assistant for our support team. Six months, three engineers, trained on our help centre and past tickets. Goal is to cut first-response time in half."}, "cells": [{"id": "obit", "title": "It is eighteen months later. It failed.", "intent": "Not \"what could go wrong\" — it already did. The certainty is what unlocks the honest answers.", "inputs": ["input.plan"], "output": {"name": "obit", "type": "prose"}, "requires": "reasoning", "prompt": "It is 18 months later and this failed completely. Write the short, unsparing account of what happened, in past tense, as if it is already known. Respond in {{locale.outputLanguage}}.\n\n{{input.plan}}", "demo": "It shipped on time and nobody used it.\n\nThe assistant answered the questions the help centre already answered well, which were not the questions arriving in tickets. Support agents tried it for about three weeks, found that checking its answer took longer than writing their own, and quietly stopped. First-response time did not move.\n\nBy month nine the team had been reassigned. The assistant stayed up because nobody wanted to be the person who turned it off, and it slowly drifted out of date as the product changed. It is still running."}, {"id": "causes", "title": "Working backwards", "intent": "Each cause, ranked by how early it was already true.", "inputs": ["obit"], "output": {"name": "causes", "type": "table"}, "requires": "reasoning", "prompt": "From this failure account, work backwards to root causes. For each give the earliest point it was already true and whether it was knowable then. Return a table: Cause, Already true by, Knowable then?. Respond in {{locale.outputLanguage}}.\n\n{{obit}}", "demo": {"cols": ["Cause", "Already true by", "Knowable then?"], "rows": [["Training data was the help centre, but tickets are the questions the help centre failed to answer", "Before a line of code", "Yes — one afternoon reading 50 tickets"], ["Verification cost exceeded writing cost, so agents rationally stopped", "Design, not build", "Yes — but only if anyone had timed it"], ["Success was measured as response time, which agents do not control alone", "Goal-setting", "Yes — agents would have said so if asked"], ["No owner after launch", "The staffing plan", "Yes — the plan funded a build, not a service"], ["Nobody was accountable for turning it off", "Never decided", "No — this one is a governance gap, not a foresight one"]]}}, {"id": "earliest", "title": "The cheapest moment to have known", "intent": "Of all of it, the one check that would have changed the most, done before anything is committed.", "inputs": ["causes"], "output": {"name": "earliest", "type": "prose"}, "requires": "reasoning", "prompt": "Identify the single earliest, cheapest check that would most likely have prevented this failure, and say exactly how to run it this week. Respond in {{locale.outputLanguage}}.\n\n{{causes}}", "demo": "Read fifty real tickets against the help centre, and mark each one: already answered there, answered but hard to find, or not answered at all.\n\nThat single afternoon separates the three futures. If most tickets are already answered and merely hard to find, you do not need an assistant — you need search, and it is a far smaller project. If most are not answered anywhere, an assistant trained on the help centre cannot possibly work and the whole plan is aimed at the wrong corpus. Only the middle case justifies what is proposed.\n\nIt costs one person one afternoon and it can be done before anyone is hired, scoped, or committed. Every other cause in the table is downstream of getting this wrong."}, {"id": "tripwires", "title": "Tripwires", "intent": "Signals to agree on now, while it is still cheap to admit them.", "inputs": ["causes", "earliest"], "output": {"name": "tripwires", "type": "list"}, "requires": "reasoning", "prompt": "Give specific, observable tripwires with thresholds and dates that would tell the team early that this is failing. No vague monitoring advice. Respond in {{locale.outputLanguage}}.\n\n{{causes}}\n\n{{earliest}}", "demo": ["**Week 3 after launch: daily active agents below 40% of the team.** Adoption never recovers from a bad first fortnight; if it is low here it will be lower at week 12.", "**Median time-to-verify an answer exceeds median time-to-write one.** Time it directly with five agents. This is the number that actually decides whether the tool is used.", "**Fewer than 30% of answers are sent without edit.** Heavy editing means agents are using it as a rough draft, which is a different and much less valuable product than the one being funded.", "**No named owner with allocated time by launch day.** Not a tripwire that fires later — check it on the day, because after that nobody will.", "**Agree the shutdown criterion now, in writing.** The failure account has it running eighteen months after it stopped working, and that is the cheapest thing on this list to prevent."]}], "persona": "product"}, {"id": "flaky-test", "realm": "tech", "concept": "diagnose", "title": "Why This Test Is Flaky", "blurb": "Separates the four reasons a test fails intermittently, then tells you which one you have.", "teaches": "Differential diagnosis", "tags": ["testing", "debugging"], "input": {"id": "test", "label": "The test, and what you have observed", "placeholder": "Paste the test or describe it. Include how often it fails.", "seed": "An integration test for checkout fails maybe 1 in 15 runs in CI, never locally. It asserts the order total after a discount is applied. Started about three weeks ago."}, "cells": [{"id": "class", "title": "Which kind of flake", "intent": "There are only a few. Naming yours narrows the search enormously.", "inputs": ["input.test"], "output": {"name": "kind", "type": "table"}, "requires": "reasoning", "prompt": "Classify this flake against the standard causes — timing/async, shared state, ordering, environment, real intermittent bug. Score each. Table: Cause, Fits?, Why. Respond in {{locale.outputLanguage}}.\n\n{{input.test}}", "demo": {"cols": ["Cause", "Fits?", "Why"], "rows": [["Shared state between tests", "Likely", "Passes alone, fails in CI where tests run together. Discounts are usually global config."], ["Timing / async", "Possible", "Checkout is multi-step; an unawaited write would produce exactly this rate."], ["Test ordering", "Likely", "Same evidence as shared state, and CI probably randomises order."], ["Environment", "Unlikely", "Would fail far more than 1 in 15, and would not have started three weeks ago."], ["A real intermittent bug", "Do not rule out", "1 in 15 in checkout is a customer-facing rate. This is the expensive branch."]]}}, {"id": "discriminate", "title": "The experiment that separates them", "intent": "One change that gives a different answer per cause.", "inputs": ["kind"], "output": {"name": "exp", "type": "list"}, "requires": "reasoning", "prompt": "Give experiments that discriminate between the remaining causes — each must produce a different result depending on which is true. Respond in {{locale.outputLanguage}}.\n\n{{kind}}", "demo": ["**Run the test 200 times alone, in a loop.** Fails: not shared state. Passes: it is the neighbours.", "**Pin the seed so CI runs tests in the same order every time.** If the flake becomes deterministic, it is ordering.", "**Log the discount config at assertion time, not setup time.** If it differs on failures, another test is mutating it.", "**Check what changed three weeks ago.** A flake with a start date has a commit. This is the cheapest step and the one most often skipped."]}, {"id": "fix", "title": "Fix versus suppress", "intent": "Retry annotations are a decision. This makes it an explicit one.", "inputs": ["kind", "exp"], "output": {"name": "fix", "type": "prose"}, "requires": "reasoning", "prompt": "Say what to fix and what it would mean to merely retry it. Take a position. Respond in {{locale.outputLanguage}}.\n\n{{kind}}\n\n{{exp}}", "demo": "Do not add a retry. Not because retries are always wrong, but because this test asserts a money value in checkout — the one place where an intermittent failure might be reporting a real intermittent bug rather than a test defect.\n\nIf the loop-200-times run passes, it is shared state and the fix is isolation: build discount config per test rather than mutating a shared object. That is an afternoon and it fixes every other test that will hit this later.\n\nIf it fails alone, you have a race in checkout that customers hit at some rate you have not measured. Retrying would hide it, and that is the outcome worth avoiding."}], "schemaVersion": "1.0.0", "persona": "engineer"}, {"id": "design-crit", "realm": "design", "concept": "critique", "title": "Crit This Without Being Nice", "blurb": "Separates taste from function, so the feedback that matters is not lost among the feedback that is merely preference.", "teaches": "Separating taste from failure", "tags": ["design", "feedback"], "input": {"id": "work", "label": "Describe the design and what it has to do", "placeholder": "The job first, then the design. The job is what makes crit possible.", "seed": "A pricing page with three tiers. Job: get self-serve users to pick the middle tier without a sales call. Currently: three equal cards, feature checklists, middle one has a \"Popular\" badge, CTA is \"Get started\" on all three."}, "cells": [{"id": "split", "title": "Function, convention, taste", "intent": "Only the first is arguable on evidence. Conflating them is why crits go badly.", "inputs": ["input.work"], "output": {"name": "split", "type": "table"}, "requires": "reasoning", "prompt": "Split the critique into failures of function, breaks with convention, and matters of taste. Table: Observation, Kind, Consequence. Respond in {{locale.outputLanguage}}.\n\n{{input.work}}", "demo": {"cols": ["Observation", "Kind", "Consequence"], "rows": [["Three equal cards", "Function", "If the job is to steer to the middle, equal weight actively fights it"], ["Same CTA on all three", "Function", "No differentiation in the one element people click"], ["\"Popular\" badge", "Convention", "Works, but it is the weakest available signal and it is doing all the steering"], ["Feature checklists", "Convention", "Fine. Optimises for comparison, which is what a checklist is for"], ["Card ordering cheap→expensive", "Convention", "Expected. Reversing is a real option but a bigger swing"], ["Card corner radius, spacing", "Taste", "Not crit. Do not spend the room on it"]]}}, {"id": "against", "title": "What the design is arguing", "intent": "Every layout makes an argument. Naming it shows whether it is the one you meant.", "inputs": ["split", "input.work"], "output": {"name": "arg", "type": "prose"}, "requires": "reasoning", "prompt": "State the argument this design makes to a visitor, and whether it matches the stated job. Respond in {{locale.outputLanguage}}.\n\n{{split}}\n\n{{input.work}}", "demo": "The design argues: \"here are three comparable options, you decide.\"\n\nThe job is: \"take the middle one.\"\n\nThose are different pages. Three equal cards with identical CTAs is a comparison table with rounded corners — it is optimised for a careful evaluator who wants to weigh features, and the stated user is a self-serve buyer who wants to be told what to pick.\n\nThe \"Popular\" badge is the only element doing the actual job, and it is doing it alone, in the smallest type on the page."}, {"id": "moves", "title": "Three moves, by size", "intent": "What to try, ordered by how much has to change.", "inputs": ["arg"], "output": {"name": "moves", "type": "list"}, "requires": "reasoning", "prompt": "Give specific changes ordered smallest to largest, each tied to the job. Respond in {{locale.outputLanguage}}.\n\n{{arg}}", "demo": ["**Differentiate the CTAs.** Middle becomes \"Start free trial\"; outer two become \"Choose Basic\" / \"Contact sales\". Costs nothing and stops the page treating three choices as one.", "**Break the symmetry.** Middle card larger, raised, with the others visually subordinate. This is what the design is currently refusing to do, and it is the whole job.", "**Lead with the recommendation and demote comparison.** One card, prominent, with \"compare all plans\" below it. Biggest change, most aligned with the stated user — and the one worth testing rather than debating."]}], "schemaVersion": "1.0.0", "persona": "designer"}, {"id": "five-audiences", "schemaVersion": "1.0.0", "realm": "business", "concept": "translate", "title": "One Idea, Five Audiences", "blurb": "Renders the same concept for five different readers, then shows you which version you could not write — because that is where your own understanding is thin.", "teaches": "Range, and self-diagnosis", "tags": ["communication"], "input": {"id": "concept", "label": "The thing you need to explain", "placeholder": "A technical concept, a strategy, a decision.", "seed": "We are moving from a monolith to event-driven services, starting with the billing domain."}, "cells": [{"id": "core", "title": "The load-bearing idea", "intent": "Strip it to the one sentence everything else is decoration on.", "inputs": ["input.concept"], "output": {"name": "core", "type": "prose"}, "requires": "fast", "prompt": "Reduce this to the single load-bearing idea in one sentence, with no jargon. Respond in {{locale.outputLanguage}}.\n\n{{input.concept}}", "demo": "Parts of the system that currently have to agree with each other in real time will instead tell each other what happened and carry on — starting with billing, because that is where the cost of waiting is highest."}, {"id": "renderings", "title": "Five renderings", "intent": "Same idea, five readers. Note the third column — what each version deliberately throws away.", "inputs": ["core", "input.concept"], "output": {"name": "renderings", "type": "table"}, "requires": "reasoning", "prompt": "Render this idea for five audiences: an executive, a new engineer, a skeptical senior engineer, a customer, and a ten-year-old. For each, note what the version deliberately sacrifices. Respond in {{locale.outputLanguage}}.\n\n{{core}}\n\n{{input.concept}}", "demo": {"cols": ["Audience", "Version", "What it drops"], "rows": [["Executive", "Billing is currently the slowest thing we do and the most expensive thing to change. We are separating it so it can move without the rest of the system holding it up. Six months, one team, no customer-visible change.", "All mechanism. An exec who asks \"how\" will get nothing from this."], ["New engineer", "Instead of billing calling six services and waiting, it publishes an event and the others react. You will write handlers, not call chains. The hard part is that ordering is no longer guaranteed.", "The reason. Tells them what to do, not why anyone chose it."], ["Skeptical senior engineer", "Yes, we are trading strong consistency for availability in one domain, and yes, that means eventual consistency bugs. We think billing is where that trade pays because reconciliation already exists there as a batch process. If it does not pay there, we stop.", "Confidence. Deliberately — this reader distrusts certainty more than they distrust risk."], ["Customer", "Nothing changes for you. Invoices, timing, and totals stay exactly as they are.", "Everything. Which is correct — the honest version of this for a customer is that it is none of their business."], ["Ten-year-old", "Right now one kid has to ask five others before doing anything, and everyone waits. We are letting them shout what they did and keep going.", "Precision, entirely. But it is the version that reveals whether you understand it."]]}}, {"id": "diagnosis", "title": "Which one was hard", "intent": "The version you struggle to write is a map of your own uncertainty. This is the cell people do not expect.", "inputs": ["renderings"], "output": {"name": "diagnosis", "type": "prose"}, "requires": "reasoning", "prompt": "Looking at these five renderings, identify which was hardest to make honest and what that reveals about gaps in the underlying understanding or plan. Respond in {{locale.outputLanguage}}.\n\n{{renderings}}", "demo": "The skeptical senior engineer version is the one that could not be written confidently, and the reason is not rhetorical.\n\nEvery other version can be produced from the intent alone. That one requires you to have an actual answer to \"what happens when ordering breaks and a customer is billed twice,\" and the version above does not have one — it has a reason to believe billing is a good place to find out, which is a different thing wearing similar clothes.\n\nThat is a real gap in the plan, not a gap in the explanation. If the honest version of your pitch to your most skeptical reader is \"we think this is where the trade pays,\" you have a hypothesis and a schedule, and the schedule is currently more specific than the hypothesis.\n\nThe customer version being trivially easy is the confirming signal: it is easy precisely because it is the one where nothing is actually being claimed."}], "persona": "marketer"}, {"id": "plant-diagnosis", "realm": "garden", "concept": "diagnose", "title": "What Is Wrong With This Plant", "blurb": "Works from the pattern of damage rather than the plant, which is how you tell water from disease from pests.", "teaches": "Pattern-first diagnosis", "tags": ["gardening", "plants"], "input": {"id": "symptoms", "label": "What you see, and where on the plant", "placeholder": "Which leaves, what pattern, how fast, plus watering and light.", "seed": "Tomato in a raised bed. Lower leaves yellowing between the veins, working upward slowly over two weeks. Some brown spots with a yellow halo on the worst leaves. Watering daily, full sun, fed once at planting six weeks ago."}, "cells": [{"id": "pattern", "title": "Read the pattern, not the plant", "intent": "Where and in what order tells you more than what it looks like.", "inputs": ["input.symptoms"], "output": {"name": "pattern", "type": "table"}, "requires": "reasoning", "prompt": "Analyse the distribution and progression of symptoms and what each pattern implies. Table: Observation, Implies, Rules out. Respond in {{locale.outputLanguage}}.\n\n{{input.symptoms}}", "demo": {"cols": ["Observation", "Implies", "Rules out"], "rows": [["Lower leaves first, moving up", "A mobile nutrient being withdrawn from old growth to feed new", "Most fungal issues start opportunistically, not bottom-up"], ["Yellowing between veins, veins staying green", "Magnesium or nitrogen — interveinal is classic Mg", "Overwatering, which yellows whole leaves uniformly"], ["Two weeks, slow", "Deficiency, not infection", "Blight, which moves in days"], ["Brown spots with yellow halo", "A secondary fungal issue on already-weakened tissue", "Nothing — but it is likely a consequence, not the cause"], ["Fed once, six weeks ago", "Tomatoes in a bed are heavy feeders and that is long past", "—"]]}}, {"id": "ranked", "title": "Most to least likely", "intent": "With the confirming test for each.", "inputs": ["pattern"], "output": {"name": "ranked", "type": "list"}, "requires": "reasoning", "prompt": "Rank causes by likelihood with a confirming check for each. Respond in {{locale.outputLanguage}}.\n\n{{pattern}}", "demo": ["**Magnesium deficiency — most likely.** Interveinal, bottom-up, slow, six weeks unfed. Confirm: Epsom salts foliar spray; new growth greens within a week if right.", "**Nitrogen deficiency — close second, often alongside.** Confirm: yellowing is more uniform than interveinal on the oldest leaves.", "**Early blight — secondary.** The halo spots fit, but blight starting bottom-up on stressed lower leaves is a passenger here, not the driver.", "**Overwatering — worth checking, unlikely as stated.** Daily in a raised bed in full sun is usually fine, but check drainage. Root problems mimic deficiency because the roots cannot take nutrients up."]}, {"id": "do", "title": "What to do this week", "intent": "In order, with the one thing not to do.", "inputs": ["ranked"], "output": {"name": "do", "type": "list"}, "requires": "fast", "prompt": "Give an ordered action list for this week, including what not to do. Respond in {{locale.outputLanguage}}.\n\n{{ranked}}", "demo": ["**Remove the spotted leaves and bin them, not compost.** Stops the secondary issue spreading while you fix the cause.", "**Feed with a balanced tomato feed, and add Epsom salts** — a tablespoon in 4 litres, watered in. Both deficiencies covered without guessing between them.", "**Mulch.** Splash from soil onto lower leaves is how the fungal spots got there.", "**Then wait a week and look at NEW growth only.** Damaged leaves never recover, and judging by them will make you think the fix failed.", "**Do not spray a fungicide yet.** The spots are a symptom of a hungry plant. Fix the feeding and they usually stop appearing."]}], "schemaVersion": "1.0.0", "persona": "householder"}, {"id": "concept-check", "realm": "learning", "concept": "teach", "title": "Find the Hole in What You Know", "blurb": "Asks you to explain something, then locates the exact sentence where your understanding stops.", "teaches": "Self-locating ignorance", "tags": ["learning", "study"], "input": {"id": "explain", "label": "Explain something you think you understand", "placeholder": "Write it as if to a colleague. Do not look anything up.", "seed": "A database index makes queries faster because it stores a sorted copy of the column, so the database can jump straight to the row instead of scanning the whole table."}, "cells": [{"id": "solid", "title": "What you actually have", "intent": "The parts that are correct, stated back precisely.", "inputs": ["input.explain"], "output": {"name": "solid", "type": "list"}, "requires": "reasoning", "prompt": "List what is correct in this explanation. Be specific and generous. Respond in {{locale.outputLanguage}}.\n\n{{input.explain}}", "demo": ["Correct: an index is a separate structure, not a property of the table.", "Correct: it is ordered, and the ordering is what enables the speedup.", "Correct: the alternative is a scan, and avoiding the scan is the point.", "Correct in effect: lookups become roughly logarithmic rather than linear."]}, {"id": "edge", "title": "The edge of it", "intent": "The precise sentence where the explanation stops being load-bearing.", "inputs": ["input.explain", "solid"], "output": {"name": "edge", "type": "prose"}, "requires": "reasoning", "prompt": "Identify exactly where the understanding runs out, and what question would expose it. Respond in {{locale.outputLanguage}}.\n\n{{input.explain}}\n\n{{solid}}", "demo": "\"Jump straight to the row\" is where it stops.\n\nThe explanation knows the index is sorted and knows that helps, but it does not say *how* sorted data is searched — which means it cannot answer why an index on a low-cardinality column (a boolean, say) is often useless, or why range queries behave differently from equality ones, or why the query planner sometimes ignores an index you built.\n\nThe question that exposes it: **why is an index on a column with two possible values usually worse than no index at all?** If the answer is \"because it still has to jump,\" the model is a lookup table rather than a tree, and the gap is B-trees and selectivity."}, {"id": "next", "title": "The one thing to learn next", "intent": "Not a syllabus. The single concept that unlocks the rest.", "inputs": ["edge"], "output": {"name": "next", "type": "prose"}, "requires": "reasoning", "prompt": "Name the single next concept and why it unlocks the others. Respond in {{locale.outputLanguage}}.\n\n{{edge}}", "demo": "Selectivity.\n\nNot B-trees — that is the mechanism, and you can hold it later. Selectivity is the idea that an index is only worth using when it eliminates most of the rows, and it is the concept that makes every confusing index behaviour suddenly obvious.\n\nOnce you have it: low-cardinality indexes are useless because they eliminate half the table at best. The planner ignores your index because it estimated poor selectivity. Composite index column order matters because the most selective column should come first. Range queries differ because they eliminate less than equality does.\n\nOne idea, four mysteries. Learn that before the tree structure, not after."}], "schemaVersion": "1.0.0", "persona": "scholar"}].map(hydrateNotebook);;

let NOTEBOOKS = SEED_NOTEBOOKS.slice();
let libraryStatus = 'loading'; /* loading | ready | error */

async function loadLibrary(){
  try {
    const res = await fetch(new URL('library.json', import.meta.url));
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const all = await res.json();
    NOTEBOOKS = all.map(hydrateNotebook);
    libraryStatus = 'ready';
  } catch (e) {
    console.warn('library.json failed to load', e);
    libraryStatus = 'error';
  }
  /* Share links (?n=) are applied at boot against the seed shelf. Re-apply
     once the full library lands so deep links to non-seed notebooks work. */
  applyShareState();
  render();
}


/* ═════════ packages/storage — swappable adapter (ENG-BRIEF §4.1)
   Nothing else in the app knows how persistence works. capabilities()
   is not decoration: the UI must tell the user honestly whether their
   data is durable (PRODUCT-BRIEF §6.3 / R9). ═════════ */

const MemoryAdapter = () => {
  const m = new Map();
  return {
    id:'memory', label:'Session memory',
    async list(){ return [...m.values()].map(d=>({id:d.id,title:d.title,updated:d.updated})) },
    async read(id){ return m.get(id) ?? null },
    async write(id,doc){ m.set(id,{...doc,id,updated:Date.now()}) },
    async remove(id){ m.delete(id) },
    capabilities:()=>({durable:false, external:false, label:'Nothing is kept. Closing the tab ends it.'})
  };
};

const IdbAdapter = () => {
  const DB='throughline', STORE='docs'; let dbp=null;
  const open = () => dbp ??= new Promise((res,rej)=>{
    const r = indexedDB.open(DB,1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE,{keyPath:'id'});
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  const tx = async (mode,fn) => { const db=await open(); return new Promise((res,rej)=>{
    const t=db.transaction(STORE,mode), q=fn(t.objectStore(STORE));
    q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); };
  let persisted = false;
  return {
    id:'idb', label:'This browser',
    async init(){ try{ persisted = await navigator.storage?.persist?.() ?? false; }catch{ persisted=false } },
    async list(){ return (await tx('readonly',s=>s.getAll())).map(d=>({id:d.id,title:d.title,updated:d.updated})) },
    async read(id){ return (await tx('readonly',s=>s.get(id))) ?? null },
    async write(id,doc){ await tx('readwrite',s=>s.put({...doc,id,updated:Date.now()})) },
    async remove(id){ await tx('readwrite',s=>s.delete(id)) },
    capabilities:()=>({ durable:persisted, external:false,
      label: persisted
        ? 'Stored in this browser, marked persistent. Still local to this device.'
        : 'Stored in this browser. The browser may clear it — export anything you want to keep.' })
  };
};

/* ═════════ packages/engine — model adapters
   Wrapped behind our own interface so the underlying SDK is replaceable.
   NOTE ON CORS (ENG-BRIEF §6.1): a key does not fix CORS. Providers that

const FREE_NOTE = 'Free tier. Key is free to obtain and stays in this tab.';

/* Chrome's Prompt API (on-device Gemini Nano) and localhost providers only
   work on a computer. Phone browsers — Chrome for Android and every browser
   on iOS — expose neither LanguageModel nor a reachable localhost host.
   Detect so Connect can say so plainly instead of implying a download or a
   local server will fix it. Feature probe still wins when the API exists. */
function isMobileClient(){
  const ua = navigator.userAgent || '';
  if (/Android|iPhone|iPod|webOS|BlackBerry|IEMobile|Opera Mini/i.test(ua)) return true;
  /* iPadOS 13+ often claims desktop Safari; touch points still give it away. */
  if (navigator.platform === 'MacIntel' && (navigator.maxTouchPoints || 0) > 1) return true;
  return false;
}

let _deviceProfile = null;
async function deviceProfile(){
  if (_deviceProfile) return _deviceProfile;
  const ua = navigator.userAgent || '';
  const ios = /iPhone|iPod/i.test(ua)
    || (navigator.platform === 'MacIntel' && (navigator.maxTouchPoints || 0) > 1);
  const android = /Android/i.test(ua);
  const mobile = isMobileClient();
  const appleDesktop = /Macintosh/i.test(ua) && !ios;
  let webgpu = false;
  try {
    if (navigator.gpu){
      const a = await navigator.gpu.requestAdapter();
      webgpu = !!a;
    }
  } catch { /* no WebGPU */ }
  const mem = navigator.deviceMemory || (mobile ? 4 : 8);
  const kind = ios ? 'ios' : android ? 'android' : mobile ? 'phone' : 'desktop';
  const family = (ios || appleDesktop) ? 'apple' : android ? 'android' : 'other';
  const label = ios ? 'iPhone / iPad'
    : android ? 'Android phone'
    : mobile ? 'Phone'
    : appleDesktop ? 'Mac'
    : 'Computer';
  _deviceProfile = { kind, family, mobile, ios, android, appleDesktop, webgpu, mem, label };
  return _deviceProfile;
}

function scoreLocalModel(m, p){
  if (m.needsGpu && !p.webgpu) return -1;
  if (p.mobile && m.mb > 500 && p.mem < 6) return -1;
  let s = 20 - Math.min(m.mb / 40, 15);
  if (p.ios){
    if (m.id === 'smol135') s += 40;
    if (m.id === 'smol360') s += 25;
    if (m.id === 'qwen05') s += 5;
  } else if (p.android){
    if (m.id === 'smol360') s += 35;
    if (m.id === 'smol135') s += 28;
    if (m.id === 'qwen05') s += p.webgpu || p.mem >= 6 ? 30 : 12;
    if (m.id === 'llama32' && p.webgpu) s += 22;
  } else {
    if (m.id === 'llama32' && p.webgpu) s += 45;
    if (m.id === 'qwen05') s += p.webgpu ? 20 : 35;
    if (m.id === 'smol360') s += 15;
    if (m.id === 'smol135') s += 8;
    if (p.appleDesktop && m.id === 'qwen05') s += 5;
  }
  return s;
}

function rankedLocalModels(profile){
  const p = profile || { kind:'desktop', family:'other', mobile:false, ios:false, android:false, webgpu:false, mem:8 };
  return Object.values(LOCAL_MODELS)
    .map(m => ({ ...m, score: scoreLocalModel(m, p) }))
    .filter(m => m.score >= 0)
    .sort((a,b) => b.score - a.score);
}

function recommendLocalModel(profile){
  return rankedLocalModels(profile)[0] ?? LOCAL_MODELS.smol135;
}
