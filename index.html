<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Throughline</title>
<meta name="description" content="Runnable notebooks that show you what AI can actually do.">

<style>
/* Baseline reset — harmless duplication when this file is published as an
   Artifact (which supplies its own), required when it is served standalone
   from a static host at any path. */
html,body{margin:0}
img{max-width:100%}

/* A class that sets `display` outranks the UA stylesheet's [hidden] rule, so
   `el.hidden = true` silently does nothing. This has already caused two bugs
   (the model popover, the appearance tabs) — fix the pattern once. */
[hidden]{display:none !important}

/* ═══════════════════════════════════════════════════════════════════════
   TIER 1 — PRIMITIVES
   Raw values. Never referenced by a component rule. Brands replace these
   wholesale. Everything below Tier 2 is the brand contract.
   ═══════════════════════════════════════════════════════════════════════ */
:root {
  --p-gray-0:#ffffff; --p-gray-25:#fcfcfb; --p-gray-50:#f6f5f3; --p-gray-100:#eceae6;
  --p-gray-200:#dedbd5; --p-gray-300:#c2beb6; --p-gray-400:#94908a; --p-gray-500:#6b6862;
  --p-gray-600:#4a4844; --p-gray-700:#33312e; --p-gray-800:#22201e; --p-gray-900:#141312;
  --p-accent-400:#7a6cf0; --p-accent-500:#5b4ce0; --p-accent-600:#4a3cc4;
  --p-amber-500:#b8860b; --p-red-500:#c0392b; --p-green-500:#2d7a4f; --p-blue-500:#2b6cb0;

  --p-font-display:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
  --p-font-body:ui-sans-serif,-apple-system,'Segoe UI',Inter,system-ui,sans-serif;
  --p-font-mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;

  --p-size-0:0.6875rem; --p-size-1:0.75rem;  --p-size-2:0.8125rem; --p-size-3:0.875rem;
  --p-size-4:0.9375rem; --p-size-5:1.0625rem; --p-size-6:1.375rem; --p-size-7:1.875rem;
  --p-size-8:2.5rem;

  --p-space-1:0.25rem; --p-space-2:0.5rem;  --p-space-3:0.75rem; --p-space-4:1rem;
  --p-space-5:1.5rem;  --p-space-6:2rem;    --p-space-7:3rem;    --p-space-8:4.5rem;

  --p-radius-0:0px; --p-radius-1:3px; --p-radius-2:6px; --p-radius-3:10px; --p-radius-4:18px;
  --p-dur-1:110ms; --p-dur-2:220ms; --p-dur-3:420ms;
  --p-weight-normal:400; --p-weight-medium:500; --p-weight-bold:650;
  --p-tracking-tight:-0.015em; --p-tracking-wide:0.06em;

/* ═══════════════════════════════════════════════════════════════════════
   TIER 2 — SEMANTIC   ← the brand contract. A brand overrides ONLY this.
   ═══════════════════════════════════════════════════════════════════════ */
  --surface-base:var(--p-gray-25);
  --surface-raised:var(--p-gray-0);
  --surface-sunken:var(--p-gray-50);
  --surface-inverse:var(--p-gray-900);

  --ink-primary:var(--p-gray-900);
  --ink-secondary:var(--p-gray-600);
  --ink-muted:var(--p-gray-400);
  --ink-inverse:var(--p-gray-0);

  --accent-base:var(--p-accent-500);
  --accent-hover:var(--p-accent-600);
  --accent-ink:var(--p-gray-0);
  --accent-wash:color-mix(in oklab, var(--accent-base) 8%, transparent);

  --border-subtle:var(--p-gray-200);
  --border-strong:var(--p-gray-300);
  --border-focus:var(--accent-base);

  --status-idle:var(--p-gray-400);
  --status-running:var(--p-blue-500);
  --status-done:var(--p-green-500);
  --status-stale:var(--p-amber-500);
  --status-error:var(--p-red-500);

  --font-display:var(--p-font-display);
  --font-body:var(--p-font-body);
  --font-mono:var(--p-font-mono);
  --weight-heading:var(--p-weight-bold);
  --tracking-heading:var(--p-tracking-tight);

  --radius-sm:var(--p-radius-1);
  --radius-md:var(--p-radius-2);
  --radius-lg:var(--p-radius-3);
  --radius-pill:999px;

  --elevation-1:0 1px 2px rgb(0 0 0 / 0.05), 0 1px 1px rgb(0 0 0 / 0.03);
  --elevation-2:0 2px 8px rgb(0 0 0 / 0.07), 0 1px 2px rgb(0 0 0 / 0.04);

  --motion-fast:var(--p-dur-1);
  --motion-base:var(--p-dur-2);
  --motion-slow:var(--p-dur-3);

/* ── TIER 3 — COMPONENT (aliases; the escape hatch) ─────────────────── */
  --cell-bg:var(--surface-raised);
  --cell-border:var(--border-subtle);
  --cell-index-ink:var(--ink-muted);
  --topbar-bg:var(--surface-base);
  --code-bg:var(--surface-sunken);
}

/* Dark pair — every brand ships both. Only Tier 2 is redefined. */
:root[data-mode="dark"] {
  --surface-base:var(--p-gray-900);
  --surface-raised:var(--p-gray-800);
  --surface-sunken:#0d0c0c;
  --surface-inverse:var(--p-gray-50);
  --ink-primary:var(--p-gray-50);
  --ink-secondary:var(--p-gray-300);
  --ink-muted:var(--p-gray-500);
  --ink-inverse:var(--p-gray-900);
  --accent-base:var(--p-accent-400);
  --accent-hover:#9184f5;
  --accent-ink:var(--p-gray-900);
  --border-subtle:#332f2c;
  --border-strong:#494540;
  --elevation-1:0 1px 2px rgb(0 0 0 / 0.4);
  --elevation-2:0 2px 10px rgb(0 0 0 / 0.5);
}

/* ═══════════════════════════════════════════════════════════════════════
   COMPONENTS — no literal colors, sizes, radii, or durations below.
   Enforced in CI by stylelint (see ENGINEERING-BRIEF §7).
   ═══════════════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box}

/* Numbers that sit in columns, tick upward, or get compared must not
   reflow as they change. Tabular everywhere a digit is data. */
.cell-index,.meta,.pip .n,.pass,.statusbar,.hero-count,.out-table td,.var-table{
  font-variant-numeric:tabular-nums;
}

html,body{background:var(--surface-base); color:var(--ink-primary); font-family:var(--font-body)}

/* ── App shell ───────────────────────────────────────────────────────────
   Three rows: chrome, scrolling canvas, chrome. The canvas sits a level
   below the chrome and the cells sit a level above the canvas, so the
   surface hierarchy reads as a tool rather than a document. All three
   grounds come from existing semantic tokens, so every brand inherits it. */
.nb-root{
  block-size:100dvh; display:grid; grid-template-rows:auto minmax(0,1fr) auto;
  background:var(--surface-base); color:var(--ink-primary);
  font-family:var(--font-body); font-size:var(--p-size-4); line-height:var(--line,1.55);
  -webkit-font-smoothing:antialiased; overflow:hidden;
  transition:background var(--motion-base), color var(--motion-base);
}
.workspace{
  overflow-y:auto; overflow-x:hidden; background:var(--surface-sunken);
  scroll-behavior:smooth;
}
@media (prefers-reduced-motion:reduce){ .workspace{scroll-behavior:auto} }
.workspace-in{
  max-inline-size:80rem; margin-inline:auto; min-block-size:100%;
  display:grid; grid-template-columns:13.5rem minmax(0,1fr); align-items:start;
  gap:var(--p-space-5);
  padding:var(--p-space-6) var(--p-space-5) var(--p-space-7);
}
.workspace-in.solo{grid-template-columns:minmax(0,1fr)}
.workspace-in.solo .rail{display:none}
.shell{max-inline-size:none; margin:0; padding:0; min-inline-size:0}
.nb-root h1,.nb-root h2,.nb-root h3{
  font-family:var(--font-display); font-weight:var(--weight-heading);
  letter-spacing:var(--tracking-heading); line-height:1.15; margin:0;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:inherit}

/* ── Top bar ─────────────────────────────────────────────────────────── */
.topbar{
  z-index:20; background:var(--topbar-bg);
  border-block-end:1px solid var(--border-subtle);
}
.topbar-in{
  max-inline-size:80rem; margin-inline:auto; padding:var(--p-space-3) var(--p-space-5);
  display:flex; align-items:center; gap:var(--p-space-4);
}
.wordmark{
  display:flex; align-items:center; gap:var(--p-space-2);
  font-family:var(--font-display); font-weight:var(--weight-heading);
  font-size:var(--p-size-5); letter-spacing:var(--tracking-heading);
}
.wordmark .glyph{
  inline-size:var(--p-space-4); block-size:var(--p-space-4); flex:none;
  border-radius:var(--radius-sm); background:var(--accent-base);
  position:relative; overflow:hidden;
}
.wordmark .glyph::after{
  content:''; position:absolute; inset-inline-start:0; inset-block-start:50%;
  inline-size:100%; block-size:1px; background:var(--accent-ink); opacity:.9;
}
.spacer{flex:1}

.ghost{
  padding:var(--p-space-1) var(--p-space-3); border-radius:var(--radius-md);
  color:var(--ink-secondary); font-size:var(--p-size-2);
  transition:background var(--motion-fast), color var(--motion-fast);
}
.ghost:hover{background:var(--surface-sunken); color:var(--ink-primary)}
.ghost[aria-pressed="true"]{background:var(--accent-wash); color:var(--accent-base)}

.btn{
  display:inline-flex; align-items:center; gap:var(--p-space-2);
  padding:var(--p-space-2) var(--p-space-4); border-radius:var(--radius-md);
  background:var(--accent-base); color:var(--accent-ink);
  font-size:var(--p-size-3); font-weight:var(--p-weight-medium);
  transition:background var(--motion-fast), transform var(--motion-fast);
}
.btn:hover{background:var(--accent-hover)}
.btn:active{background:var(--accent-hover)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn.secondary{
  background:transparent; color:var(--ink-primary);
  box-shadow:inset 0 0 0 1px var(--border-strong);
}
.btn.secondary:hover{background:var(--surface-sunken)}
.btn.tiny{padding:var(--p-space-1) var(--p-space-3); font-size:var(--p-size-1)}
.btn .i{inline-size:1em; block-size:1em; flex:none}
.btn.primary{font-weight:var(--p-weight-bold)}

/* Joined controls. They share edges because they are one control with
   several positions, which is what a group of related actions is. */
.seg-group{
  display:inline-flex; border-radius:var(--radius-md); overflow:hidden;
  box-shadow:inset 0 0 0 1px var(--border-strong);
}
.seg-group .btn.seg{
  border-radius:0; background:transparent; color:var(--ink-secondary);
  padding:var(--p-space-2) var(--p-space-3); font-size:var(--p-size-2);
  box-shadow:none;
}
.seg-group .btn.seg + .btn.seg{box-shadow:inset 1px 0 0 var(--border-strong)}
.seg-group .btn.seg:hover{background:var(--surface-sunken); color:var(--ink-primary)}
.seg-group .btn.seg:active{background:var(--accent-wash); color:var(--accent-base)}
.nb-actions{position:relative}

.share-pop{
  position:absolute; z-index:25; inset-block-start:calc(100% + var(--p-space-2));
  inset-inline-end:0; inline-size:min(26rem, 82vw);
  padding:var(--p-space-4); background:var(--surface-raised);
  border:1px solid var(--border-strong); border-radius:var(--radius-md);
  box-shadow:var(--elevation-2);
  display:flex; flex-direction:column; gap:var(--p-space-2);
}
.share-status{margin:0; font-size:var(--p-size-2); font-weight:var(--p-weight-medium)}
.share-url{font-family:var(--font-mono); font-size:var(--p-size-0)}
.share-hint{margin:0; font-size:var(--p-size-1); color:var(--ink-muted); line-height:1.5}

:where(button,select,input,textarea,a):focus-visible{
  outline:2px solid var(--border-focus); outline-offset:2px; border-radius:var(--radius-sm);
}

/* ── Shell ───────────────────────────────────────────────────────────── */
.shell{max-width:74rem; margin-inline:auto; padding:var(--p-space-6) var(--p-space-5) var(--p-space-8)}
.eyebrow{
  font-size:var(--p-size-0); text-transform:uppercase; font-feature-settings:'kern' 1;
  letter-spacing:var(--p-tracking-wide); color:var(--ink-muted);
  font-weight:var(--p-weight-medium);
}
.lede{color:var(--ink-secondary); max-width:60ch; margin-block-start:var(--p-space-3)}

/* ── Library ─────────────────────────────────────────────────────────── */
.hero{max-inline-size:46rem; margin-block-end:var(--p-space-7)}
.hero h1{font-size:clamp(2rem, 5.5vw, 3rem); margin-block-start:var(--p-space-3); max-inline-size:18ch}
.hero-count{
  margin-block-start:var(--p-space-4); font-size:var(--p-size-1);
  color:var(--ink-muted); font-family:var(--font-mono);
}

/* The featured notebook earns its place by being the one that does something
   the others do not — not by being newest. */
.feature{
  display:grid; grid-template-columns:1.4fr 1fr; gap:var(--p-space-6);
  padding:var(--p-space-6); margin-block-end:var(--p-space-7);
  background:var(--surface-raised); border:1px solid var(--border-subtle);
  border-radius:var(--radius-lg); box-shadow:var(--elevation-1);
}
.feature h2{font-size:var(--p-size-7); margin-block:var(--p-space-2) var(--p-space-3)}
.feature p{margin:0; color:var(--ink-secondary); font-size:var(--p-size-3); line-height:1.6}
.feature .btn{margin-block-start:var(--p-space-4)}
.feature-aside{
  padding-inline-start:var(--p-space-6); border-inline-start:1px solid var(--border-subtle);
}
.feature-aside p{font-size:var(--p-size-2); margin-block-start:var(--p-space-2)}
.feature-aside b{color:var(--ink-primary)}

/* ── Browse ──────────────────────────────────────────────────────────── */
.browse{display:flex; flex-direction:column; gap:var(--p-space-4)}
.filter-bar{
  display:flex; align-items:flex-end; gap:var(--p-space-3); flex-wrap:wrap;
  position:sticky; inset-block-start:0; z-index:6;
  padding-block:var(--p-space-3); margin-block-start:calc(var(--p-space-2) * -1);
  background:var(--surface-sunken);
}
.search{flex:1; min-inline-size:14rem}
.search input{inline-size:100%}
.sort{display:flex; flex-direction:column; gap:var(--p-space-1)}
.sort select{inline-size:auto; min-inline-size:9rem}

.facet{display:flex; align-items:baseline; gap:var(--p-space-3); flex-wrap:wrap}
.facet-label{
  flex:none; inline-size:4rem; font-size:var(--p-size-0); text-transform:uppercase;
  letter-spacing:var(--p-tracking-wide); color:var(--ink-muted);
}
.chips{display:flex; gap:var(--p-space-2); flex-wrap:wrap; flex:1}
.chip-btn{
  display:inline-flex; align-items:center; gap:var(--p-space-2);
  padding:var(--p-space-1) var(--p-space-3); border-radius:var(--radius-pill);
  font-size:var(--p-size-1); color:var(--ink-secondary);
  box-shadow:inset 0 0 0 1px var(--border-subtle);
  transition:box-shadow var(--motion-fast), color var(--motion-fast), background var(--motion-fast);
}
.chip-btn:hover{box-shadow:inset 0 0 0 1px var(--border-strong); color:var(--ink-primary)}
.chip-btn[aria-pressed="true"]{
  background:var(--accent-base); color:var(--accent-ink);
  box-shadow:inset 0 0 0 1px var(--accent-base);
}
.chip-btn .gl{font-size:var(--p-size-2); opacity:.8}
.chip-btn .ct{font-size:var(--p-size-0); opacity:.6; font-variant-numeric:tabular-nums}
.result-count{
  margin:0; font-size:var(--p-size-1); color:var(--ink-muted);
  font-variant-numeric:tabular-nums;
}
.card .eyebrow .gl{margin-inline-end:var(--p-space-2); opacity:.7}
.empty-outs{display:flex; gap:var(--p-space-2); flex-wrap:wrap; justify-content:center}
.empty{
  padding:var(--p-space-7) var(--p-space-5); text-align:center;
  display:flex; flex-direction:column; align-items:center; gap:var(--p-space-4);
  color:var(--ink-muted);
}

/* Stagger, capped. A 40-card grid animating in sequence is a loading screen;
   the cap keeps the last card under a quarter second. */
@media (prefers-reduced-motion:no-preference){
  .shelf .card{
    animation:cardIn var(--motion-base) both;
    animation-delay:calc(var(--i, 0) * 9ms);
  }
  @keyframes cardIn{
    from{opacity:0; transform:translateY(6px)}
    to{opacity:1; transform:none}
  }
}

.collection{margin-block-end:var(--p-space-7)}
.collection-head{
  display:flex; align-items:baseline; gap:var(--p-space-4);
  flex-wrap:wrap; margin-block-end:var(--p-space-4);
  padding-block-end:var(--p-space-3); border-block-end:1px solid var(--border-subtle);
}
.collection-head h2{font-size:var(--p-size-6)}
.collection-head p{margin:0; color:var(--ink-muted); font-size:var(--p-size-2)}

.shelf{
  display:grid; gap:var(--p-space-4);
  grid-template-columns:repeat(auto-fill,minmax(19rem,1fr));
}
.card.featured{border-color:color-mix(in oklab,var(--accent-base) 40%,var(--border-subtle))}
.tag.loop{color:var(--accent-base); background:var(--accent-wash)}
/* Surfaces blur what is behind them only when a theme asks for it. Default
   0px, so opaque themes pay nothing. */
.card,.cell,.sheet,.menu,.topbar{backdrop-filter:blur(var(--surface-blur, 0px))}

.card{
  text-align:start; display:flex; flex-direction:column; gap:var(--p-space-3);
  padding:var(--p-space-5); background:var(--surface-raised);
  border:1px solid var(--border-subtle); border-radius:var(--radius-lg);
  box-shadow:var(--elevation-1);
  transition:border-color var(--motion-fast), box-shadow var(--motion-base);
}
/* No lift on hover. A card that rises to meet the cursor is decoration
   pretending to be feedback; the border stating "this is now the one" is
   the same information with none of the theatre. */
.card:hover{border-color:var(--border-strong); box-shadow:var(--elevation-2)}
.card h3{font-size:var(--p-size-6)}
.card p{margin:0; color:var(--ink-secondary); font-size:var(--p-size-3); flex:1}
.card-foot{
  display:flex; align-items:center; gap:var(--p-space-3); flex-wrap:wrap;
  font-size:var(--p-size-1); color:var(--ink-muted);
  padding-block-start:var(--p-space-3); border-block-start:1px solid var(--border-subtle);
}
.tag{
  padding:var(--p-space-1) var(--p-space-2); border-radius:var(--radius-pill);
  background:var(--surface-sunken); color:var(--ink-secondary); font-size:var(--p-size-0);
}

/* ── Notebook ────────────────────────────────────────────────────────── */
.nb-head{
  display:flex; align-items:flex-start; gap:var(--p-space-5);
  flex-wrap:wrap;
}
.nb-head h1{font-size:var(--p-size-8); max-width:22ch}
.nb-actions{display:flex; gap:var(--p-space-2); align-items:center; flex-wrap:wrap}
.doc-head{padding-inline-end:calc(var(--p-space-6) + 2rem)}

/* ── The document ────────────────────────────────────────────────────────
   The canvas is the tool; this is the thing on it. Cells stop being floating
   cards and become sections of one page, divided by rules — which is what a
   notebook actually is, and it removes a level of nested elevation that made
   the cells fight the page for attention. */
/* The rail has zero width and full document height, so its sticky child
   travels the whole sheet and stops at its end rather than the viewport's. */
.doc-rail{
  position:absolute; inset-block:0; inset-inline-end:0;
  inline-size:0; z-index:12; pointer-events:none;
}
.doc-tools{
  position:sticky; inset-block-start:var(--p-space-5);
  display:flex; flex-direction:column; gap:1px;
  transform:translateX(50%);            /* half on the sheet, half off it */
  pointer-events:auto;
}
[dir="rtl"] .doc-tools{transform:translateX(-50%)}
.tool{
  position:relative;
  display:flex; align-items:center; justify-content:center;
  inline-size:2.25rem; block-size:2.25rem; padding:0;
  border-radius:var(--radius-md);
  background:var(--surface-raised); color:var(--ink-muted);
  box-shadow:inset 0 0 0 1px var(--border-subtle);
  transition:color var(--motion-fast), background var(--motion-fast),
             box-shadow var(--motion-fast);
}
.tool .i{inline-size:1em; block-size:1em; flex:none}
/* The label sits OUTSIDE the button box. A column flex container stretches
   its children to one shared width, so an in-flow label could never widen a
   single button — and widening the container would shift the straddle. */
.tool .lbl{
  position:absolute; inset-inline-end:calc(100% + var(--p-space-2)); inset-block:0;
  display:flex; align-items:center; white-space:nowrap;
  padding-inline:var(--p-space-3); border-radius:var(--radius-md);
  background:var(--surface-raised); color:var(--ink-primary);
  box-shadow:inset 0 0 0 1px var(--border-subtle);
  font-size:var(--p-size-1);
  opacity:0; pointer-events:none; transform:translateX(var(--p-space-2));
  transition:opacity var(--motion-fast), transform var(--motion-base);
}
.tool:hover,.tool:focus-visible{color:var(--ink-primary); box-shadow:inset 0 0 0 1px var(--border-strong)}
.tool:hover .lbl,.tool:focus-visible .lbl{opacity:1; transform:none}
@media (pointer:coarse){ .tool .lbl{display:none} }
.tool.on{color:var(--accent-base); box-shadow:inset 0 0 0 1px var(--accent-base)}
.doc-tools .share-pop{
  inset-block-start:0; inset-inline-end:calc(100% + var(--p-space-3));
  inset-inline-start:auto;
}

.doc{
  position:relative;
  background:var(--surface-raised);
  border:1px solid var(--border-subtle);
  border-radius:var(--radius-lg);
  box-shadow:var(--elevation-1);
}
.doc > :last-child{
  border-end-start-radius:var(--radius-lg); border-end-end-radius:var(--radius-lg);
}
.doc-head{padding:var(--p-space-6) var(--p-space-6) var(--p-space-5)}
.cells{display:flex; flex-direction:column}
.doc .cell{
  background:transparent; border:0; border-radius:0;
  border-block-start:1px solid var(--border-subtle);
}
/* State reads as a tinted band plus a soft inline rule — no hard card edge. */
.doc .cell[data-state="running"],.doc .cell[data-state="streaming"]{
  background:color-mix(in oklab, var(--status-running) 5%, transparent);
  box-shadow:inset 3px 0 0 var(--status-running);
}
.doc .cell[data-state="stale"]{
  background:color-mix(in oklab, var(--status-stale) 5%, transparent);
  box-shadow:inset 3px 0 0 var(--status-stale);
}
.doc .cell[data-state="error"]{
  background:color-mix(in oklab, var(--status-error) 5%, transparent);
  box-shadow:inset 3px 0 0 var(--status-error);
}
.doc .cell-foot{background:transparent}
.doc .cell:first-child{border-block-start:0}

.cell{
  background:var(--cell-bg); border:1px solid var(--cell-border);
  border-radius:var(--radius-lg); overflow:hidden;
  transition:border-color var(--motion-base), box-shadow var(--motion-base);
}
.cell[data-state="running"],.cell[data-state="streaming"]{
  border-color:var(--status-running); box-shadow:0 0 0 3px color-mix(in oklab,var(--status-running) 12%,transparent);
}
.cell[data-state="error"]{border-color:var(--status-error)}
.cell[data-state="stale"]{border-color:var(--status-stale); border-style:dashed}

.cell-head{
  display:flex; align-items:flex-start; gap:var(--p-space-3);
  padding:var(--p-space-5) var(--p-space-6) var(--p-space-3);
}
.cell-index{
  font-family:var(--font-mono); font-size:var(--p-size-1); color:var(--cell-index-ink);
  padding-block-start:var(--p-space-1); font-variant-numeric:tabular-nums; flex:none;
}
.cell-titles{flex:1; min-width:0}
.cell-titles h3{font-size:var(--p-size-5); font-family:var(--font-body); font-weight:var(--p-weight-bold)}
.cell-intent{color:var(--ink-secondary); font-size:var(--p-size-2); margin-block-start:var(--p-space-1)}

.io-line{
  display:flex; gap:var(--p-space-3); flex-wrap:wrap;
  font-family:var(--font-mono); font-size:var(--p-size-0); color:var(--ink-muted);
  margin-block-start:var(--p-space-2);
}
.io-line b{font-weight:var(--p-weight-normal); color:var(--ink-secondary)}

.badge{
  display:inline-flex; align-items:center; gap:var(--p-space-1); flex:none;
  padding:var(--p-space-1) var(--p-space-2); border-radius:var(--radius-pill);
  font-size:var(--p-size-0); font-weight:var(--p-weight-medium);
  text-transform:uppercase; letter-spacing:var(--p-tracking-wide);
  background:var(--surface-sunken); color:var(--ink-muted);
}
.badge::before{content:''; inline-size:6px; block-size:6px; border-radius:var(--radius-pill); background:currentColor}
.badge[data-s="running"],.badge[data-s="streaming"]{color:var(--status-running)}
.badge[data-s="done"]{color:var(--status-done)}
.badge[data-s="stale"]{color:var(--status-stale)}
.badge[data-s="error"]{color:var(--status-error)}
@media (prefers-reduced-motion:no-preference){
  .badge[data-s="running"]::before,.badge[data-s="streaming"]::before{animation:pulse 1.1s ease-in-out infinite}
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

.cell-body{padding:0 var(--p-space-6) var(--p-space-4); padding-inline-start:calc(var(--p-space-6) + var(--p-space-6))}
.cell-foot{
  display:flex; align-items:center; gap:var(--p-space-2);
  padding:var(--p-space-3) var(--p-space-6) var(--p-space-5);
  padding-inline-start:calc(var(--p-space-6) + var(--p-space-6));
}
.meta{font-size:var(--p-size-0); color:var(--ink-muted); font-family:var(--font-mono)}

.out{font-size:var(--p-size-3); line-height:1.65}
.out p{margin:0 0 var(--p-space-3)}
.out p:last-child{margin-block-end:0}
.out ul{margin:0; padding-inline-start:var(--p-space-5); display:flex; flex-direction:column; gap:var(--p-space-2)}
.out strong{font-weight:var(--p-weight-bold)}
.out em{color:var(--ink-secondary)}
.caret{
  display:inline-block; inline-size:0.5em; block-size:1.05em; vertical-align:text-bottom;
  background:var(--accent-base); margin-inline-start:2px;
}
@media (prefers-reduced-motion:no-preference){ .caret{animation:pulse .9s steps(2) infinite} }

table.out-table{border-collapse:collapse; inline-size:100%; font-size:var(--p-size-2)}
table.out-table th,table.out-table td{
  text-align:start; padding:var(--p-space-2) var(--p-space-3);
  border-block-end:1px solid var(--border-subtle); vertical-align:top;
}
table.out-table th{
  font-size:var(--p-size-0); text-transform:uppercase; letter-spacing:var(--p-tracking-wide);
  color:var(--ink-muted); font-weight:var(--p-weight-medium);
}
.flag{color:var(--status-stale); font-weight:var(--p-weight-medium)}

.field{display:flex; flex-direction:column; gap:var(--p-space-2)}
.field label{font-size:var(--p-size-2); font-weight:var(--p-weight-medium)}
.field .hint{font-size:var(--p-size-1); color:var(--ink-muted)}
textarea,input[type="text"],input[type="password"],select{
  inline-size:100%; padding:var(--p-space-3); background:var(--surface-base);
  border:1px solid var(--border-strong); border-radius:var(--radius-md);
  font-size:var(--p-size-3); font-family:inherit;
  transition:border-color var(--motion-fast);
}
textarea{min-block-size:6.5rem; resize:vertical; line-height:1.55}
textarea:focus,input:focus,select:focus{border-color:var(--border-focus); outline:none}
select{cursor:pointer}

.error-box{
  padding:var(--p-space-3) var(--p-space-4); border-radius:var(--radius-md);
  background:color-mix(in oklab,var(--status-error) 8%,transparent);
  border:1px solid color-mix(in oklab,var(--status-error) 30%,transparent);
  color:var(--status-error); font-size:var(--p-size-2);
}
.stale-note{
  display:flex; align-items:center; gap:var(--p-space-2);
  font-size:var(--p-size-1); color:var(--status-stale); margin-block-end:var(--p-space-3);
}

/* ── Variable inspector ──────────────────────────────────────────────── */
details.vars{
  margin-block-start:var(--p-space-4); border:1px solid var(--border-subtle);
  border-radius:var(--radius-lg); background:var(--surface-raised); overflow:hidden;
}
details.vars > summary{
  padding:var(--p-space-3) var(--p-space-5); cursor:pointer; font-size:var(--p-size-2);
  color:var(--ink-secondary); list-style:none; display:flex; align-items:center; gap:var(--p-space-2);
}
details.vars > summary::-webkit-details-marker{display:none}
details.vars > summary::before{content:'▸'; transition:transform var(--motion-fast); font-size:var(--p-size-1)}
details.vars[open] > summary::before{transform:rotate(90deg)}
.var-table{
  padding:0 var(--p-space-5) var(--p-space-4);
  font-family:var(--font-mono); font-size:var(--p-size-1);
  display:grid; grid-template-columns:auto auto 1fr; gap:var(--p-space-2) var(--p-space-4);
}
.var-table .k{color:var(--accent-base)}
.var-table .t{color:var(--ink-muted)}
.var-table .v{color:var(--ink-secondary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* ── Panels / sheet ──────────────────────────────────────────────────── */
.sheet-backdrop{
  position:fixed; inset:0; z-index:40; background:rgb(0 0 0 / 0.32);
  display:flex; align-items:flex-start; justify-content:center; padding:var(--p-space-6) var(--p-space-4);
  overflow:auto;
}
.sheet{
  inline-size:min(38rem,100%); background:var(--surface-raised);
  border:1px solid var(--border-subtle); border-radius:var(--radius-lg);
  box-shadow:var(--elevation-2); overflow:hidden;
}
.sheet-head{
  display:flex; align-items:center; gap:var(--p-space-3);
  padding:var(--p-space-4) var(--p-space-5); border-block-end:1px solid var(--border-subtle);
}
.sheet-head h2{font-size:var(--p-size-6); flex:1}
.sheet-body{padding:var(--p-space-5); display:flex; flex-direction:column; gap:var(--p-space-5)}
.sheet-sec{display:flex; flex-direction:column; gap:var(--p-space-3)}
.sheet-sec > h3{font-size:var(--p-size-2); text-transform:uppercase; letter-spacing:var(--p-tracking-wide); color:var(--ink-muted); font-family:var(--font-body)}

.sheet-tabs{
  display:flex; gap:1px; padding:0 var(--p-space-5);
  border-block-end:1px solid var(--border-subtle); overflow-x:auto;
}
.sheet-tab{
  padding:var(--p-space-3) var(--p-space-4); font-size:var(--p-size-2);
  color:var(--ink-muted); white-space:nowrap;
  border-block-end:2px solid transparent; margin-block-end:-1px;
  transition:color var(--motion-fast), border-color var(--motion-fast);
}
.sheet-tab:hover{color:var(--ink-primary)}
.sheet-tab[aria-selected="true"]{color:var(--ink-primary); border-block-end-color:var(--accent-base)}
.tabpane{display:flex; flex-direction:column; gap:var(--p-space-5)}

.opts{display:flex; flex-direction:column; gap:1px}
.opt{
  display:flex; align-items:center; gap:var(--p-space-3); text-align:start;
  padding:var(--p-space-3); border-radius:var(--radius-md);
  transition:background var(--motion-fast);
}
.opt:hover{background:var(--surface-sunken)}
.opt[aria-pressed="true"]{background:var(--accent-wash)}
.opt .grow{flex:1; min-inline-size:0}
.opt strong{display:block; font-size:var(--p-size-3); font-weight:var(--p-weight-medium)}
.opt .sub{display:block; font-size:var(--p-size-1); color:var(--ink-muted)}
.opt .tick{color:var(--accent-base); opacity:0; flex:none}
.opt[aria-pressed="true"] .tick{opacity:1}

.ghost .ico{display:inline-flex; vertical-align:-0.15em; margin-inline-end:var(--p-space-2)}
.ghost .ico .i{inline-size:1em; block-size:1em}

.swatches{display:flex; gap:var(--p-space-2); flex-wrap:wrap}
.swatch{
  text-align:start;
  display:flex; flex-direction:column; gap:var(--p-space-2); align-items:flex-start;
  padding:var(--p-space-3); border-radius:var(--radius-md);
  border:1px solid var(--border-subtle); background:var(--surface-base);
  font-size:var(--p-size-1); min-inline-size:7.5rem;
  transition:border-color var(--motion-fast);
}
.swatch[aria-pressed="true"]{border-color:var(--accent-base); box-shadow:inset 0 0 0 1px var(--accent-base)}
.swatch .chips{display:flex; gap:var(--p-space-1)}
.swatch .chip{inline-size:var(--p-space-4); block-size:var(--p-space-4); border-radius:var(--radius-sm); border:1px solid rgb(0 0 0 / .1)}

.status-row{
  display:flex; align-items:center; gap:var(--p-space-3);
  padding:var(--p-space-3) var(--p-space-4); border-radius:var(--radius-md);
  background:var(--surface-sunken); font-size:var(--p-size-2);
}
.dot{inline-size:8px; block-size:8px; border-radius:var(--radius-pill); flex:none}
.dot.ok{background:var(--status-done)} .dot.warn{background:var(--status-stale)} .dot.off{background:var(--ink-muted)}

/* ── Desktop upsell ──────────────────────────────────────────────────── */
.desktop-strip{
  margin-block-start:var(--p-space-7); padding:var(--p-space-5);
  border:1px solid var(--border-subtle); border-radius:var(--radius-lg);
  background:var(--surface-raised);
  display:flex; gap:var(--p-space-5); align-items:center; flex-wrap:wrap;
}
.desktop-strip .grow{flex:1; min-inline-size:18rem}
.desktop-strip h3{font-size:var(--p-size-5); margin-block-end:var(--p-space-2)}
.desktop-strip p{margin:0; color:var(--ink-secondary); font-size:var(--p-size-2)}
.cap-list{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));
  gap:var(--p-space-2) var(--p-space-4); margin-block-start:var(--p-space-4);
  font-size:var(--p-size-2); color:var(--ink-secondary);
}
.cap-list div{display:flex; gap:var(--p-space-2); align-items:baseline}
.cap-list .y{color:var(--status-done)} .cap-list .n{color:var(--ink-muted)}

.foot{
  margin-block-start:var(--p-space-8); padding-block-start:var(--p-space-5);
  border-block-start:1px solid var(--border-subtle);
  font-size:var(--p-size-1); color:var(--ink-muted);
  display:flex; gap:var(--p-space-4); flex-wrap:wrap; align-items:center;
}
.foot a{color:var(--ink-secondary)}

/* ── Cell rail ───────────────────────────────────────────────────────────
   Not decoration: it is the run's state at a glance. Which cells are done,
   which went stale when you edited the input, which failed — the thing you
   most want to know without scrolling to find out. */
.rail{
  position:sticky; inset-block-start:0; align-self:start;
  display:flex; flex-direction:column; gap:1px;
  padding-block:var(--p-space-2);
}
.rail-label{
  padding:var(--p-space-2) var(--p-space-3) var(--p-space-2);
  font-size:var(--p-size-0); text-transform:uppercase;
  letter-spacing:var(--p-tracking-wide); color:var(--ink-muted);
}
.rail-list{position:relative; display:flex; flex-direction:column; gap:1px}
/* The spine. A notebook is a sequence, so the nav should look like one —
   a thread with nodes on it, not a stack of rows with a hard active edge. */
.rail-list::before{
  content:''; position:absolute; z-index:0;
  inset-block:1.05rem; inset-inline-start:calc(var(--p-space-3) + 5px);
  inline-size:1px; background:var(--border-subtle);
}
.pip{
  position:relative; z-index:1;
  display:flex; align-items:center; gap:var(--p-space-3); text-align:start;
  padding:var(--p-space-2) var(--p-space-3); border-radius:var(--radius-md);
  font-size:var(--p-size-1); color:var(--ink-secondary);
  transition:background var(--motion-fast), color var(--motion-fast);
  inline-size:100%;
}
.pip:hover{background:var(--surface-raised); color:var(--ink-primary)}
.pip[aria-current="true"]{background:var(--surface-raised); color:var(--ink-primary)}
.pip .node{
  inline-size:11px; block-size:11px; border-radius:var(--radius-pill); flex:none;
  background:var(--surface-sunken);
  box-shadow:0 0 0 1.5px var(--border-strong) inset, 0 0 0 3px var(--surface-sunken);
  transition:background var(--motion-fast), box-shadow var(--motion-base);
}
.pip[aria-current="true"] .node{box-shadow:0 0 0 3px var(--surface-sunken), 0 0 0 5px var(--accent-wash)}
.pip .node[data-s="done"]{background:var(--status-done); box-shadow:0 0 0 3px var(--surface-sunken)}
.pip .node[data-s="running"],.pip .node[data-s="streaming"]{background:var(--status-running); box-shadow:0 0 0 3px var(--surface-sunken)}
.pip .node[data-s="stale"]{background:var(--status-stale); box-shadow:0 0 0 3px var(--surface-sunken)}
.pip .node[data-s="error"]{background:var(--status-error); box-shadow:0 0 0 3px var(--surface-sunken)}
.pip[aria-current="true"] .node[data-s]{box-shadow:0 0 0 3px var(--surface-sunken), 0 0 0 5px var(--accent-wash)}
@media (prefers-reduced-motion:no-preference){
  .pip .node[data-s="running"],.pip .node[data-s="streaming"]{animation:pulse 1.1s ease-in-out infinite}
}
.pip .n{
  font-family:var(--font-mono); font-size:var(--p-size-0);
  color:var(--ink-muted); font-variant-numeric:tabular-nums; flex:none;
}
.pip .lbl{flex:1; min-inline-size:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* A loop is drawn, not described: the spine doubles back beside the cells
   a gate can return to. */
.pip.in-loop::after{
  content:''; position:absolute; z-index:0;
  inset-block:-1px; inset-inline-start:calc(var(--p-space-3) - 1px);
  inline-size:1px; background:var(--accent-base); opacity:.5;
}
.pip.loop-start::after{inset-block-start:50%; border-start-start-radius:4px}
.pip.loop-end::after{inset-block-end:50%}
.pass{
  font-family:var(--font-mono); font-size:var(--p-size-0);
  color:var(--accent-base); flex:none;
}

/* ── Status bar ──────────────────────────────────────────────────────────
   Persistent, honest state: where your data lives, what is running, what
   is answering. */
.statusbar{
  display:flex; align-items:center; gap:var(--p-space-4);
  padding:var(--p-space-2) var(--p-space-5);
  border-block-start:1px solid var(--border-subtle);
  background:var(--topbar-bg);
  font-size:var(--p-size-0); color:var(--ink-muted);
  overflow-x:auto; white-space:nowrap;
}
.statusbar .seg{display:flex; align-items:center; gap:var(--p-space-2); flex:none}
.statusbar a{color:var(--ink-secondary)}
.progress{
  inline-size:5rem; block-size:3px; border-radius:var(--radius-pill);
  background:var(--border-subtle); overflow:hidden; flex:none;
}
.progress i{display:block; block-size:100%; background:var(--status-done); transition:inline-size var(--motion-base)}

.switch-wrap{position:relative}
.switcher{
  display:inline-flex; align-items:center; gap:var(--p-space-2);
  padding:var(--p-space-1) var(--p-space-3); border-radius:var(--radius-pill);
  font-size:var(--p-size-2); color:var(--ink-secondary);
  box-shadow:inset 0 0 0 1px var(--border-subtle);
  transition:box-shadow var(--motion-fast), color var(--motion-fast);
}
.switcher:hover{box-shadow:inset 0 0 0 1px var(--border-strong); color:var(--ink-primary)}
.switcher .chev{font-size:var(--p-size-0); color:var(--ink-muted)}
/* .menu sets display:flex, and a class selector beats the UA stylesheet's
   [hidden]{display:none} — so the popover renders open until told otherwise.
   The Artifact host supplies this rule in its own reset; a standalone deploy
   does not, which is why this only appeared in production. */
.menu{
  position:absolute; inset-block-start:calc(100% + var(--p-space-2)); inset-inline-start:0;
  z-index:30; min-inline-size:19rem; padding:var(--p-space-2);
  background:var(--surface-raised); border:1px solid var(--border-subtle);
  border-radius:var(--radius-lg); box-shadow:var(--elevation-2);
  display:flex; flex-direction:column; gap:1px;
}
.menu-label{
  padding:var(--p-space-2) var(--p-space-3) var(--p-space-1);
  font-size:var(--p-size-0); text-transform:uppercase;
  letter-spacing:var(--p-tracking-wide); color:var(--ink-muted);
}
.menu-item{
  display:flex; align-items:center; gap:var(--p-space-3); text-align:start;
  padding:var(--p-space-2) var(--p-space-3); border-radius:var(--radius-md);
  font-size:var(--p-size-2); transition:background var(--motion-fast);
}
.menu-item:hover:not(:disabled){background:var(--surface-sunken)}
.menu-item:disabled{opacity:.5; cursor:default}
.menu-item .grow{flex:1; min-inline-size:0}
.menu-item .sub{display:block; font-size:var(--p-size-0); color:var(--ink-muted)}
.menu-item .tick{color:var(--accent-base)}
.menu-sep{block-size:1px; background:var(--border-subtle); margin:var(--p-space-2) 0}

.picker{display:inline-flex; align-items:center; gap:var(--p-space-2)}
.picker select{
  inline-size:auto; padding:var(--p-space-1) var(--p-space-2);
  font-size:var(--p-size-0); font-family:var(--font-mono);
  background:transparent; border-color:var(--border-subtle); color:var(--ink-secondary);
}
pre.raw{
  margin:0 0 var(--p-space-3); padding:var(--p-space-3); border-radius:var(--radius-md);
  background:var(--code-bg); font-family:var(--font-mono); font-size:var(--p-size-1);
  color:var(--ink-secondary); white-space:pre-wrap; word-break:break-word;
  max-block-size:11rem; overflow:auto;
}
.cell-edit{
  padding:var(--p-space-3) var(--p-space-6);
  padding-inline-start:calc(var(--p-space-6) + var(--p-space-6));
  background:var(--surface-sunken);
  border-block-start:1px dashed var(--border-subtle);
  display:flex; flex-direction:column; gap:var(--p-space-3);
}
.edit-row{display:flex; align-items:center; gap:var(--p-space-3); flex-wrap:wrap}
.field-inline{display:flex; align-items:center; gap:var(--p-space-2)}
.field-inline select{inline-size:auto; padding:var(--p-space-1) var(--p-space-2); font-size:var(--p-size-1)}
.edit-prompt > summary{
  cursor:pointer; font-size:var(--p-size-1); color:var(--ink-secondary);
  list-style:none; padding-block:var(--p-space-1);
}
.edit-prompt > summary::-webkit-details-marker{display:none}
.edit-prompt > summary::before{content:'▸ '; font-size:var(--p-size-0)}
.edit-prompt[open] > summary::before{content:'▾ '}
.edit-prompt textarea{font-family:var(--font-mono); font-size:var(--p-size-1); margin-block-start:var(--p-space-2)}
.edit-prompt .hint{font-size:var(--p-size-1); color:var(--ink-muted); margin-block:var(--p-space-2) 0}
.cell.off{opacity:.55}
.cell.off .cell-head{padding-block:var(--p-space-3)}
.pip.off{opacity:.4}
.pip.off .lbl{text-decoration:line-through}
.btn.seg.on{background:var(--accent-wash); color:var(--accent-base)}
.forked{
  display:flex; align-items:center; gap:var(--p-space-2); flex-wrap:wrap;
  margin-block-start:var(--p-space-3); font-size:var(--p-size-2); color:var(--ink-secondary);
}
.linkbtn{color:var(--accent-base); text-decoration:underline; font-size:inherit}

.mark{
  padding:var(--p-space-5) var(--p-space-6);
  border-block-start:1px solid var(--border-subtle);

{
  id:'meeting-commitments', schemaVersion:'1.0.0', realm:'business', concept:'extract', collection:'work',
  title:'Meeting Notes → Commitments',
  blurb:'Separates what was actually decided from what was merely discussed, then finds every commitment nobody owns. The orphans are the point.',
  teaches:'Extraction with a judgment layer', tags:['work','extraction'], capability:'fast',
  input:{ id:'notes', label:'Raw meeting notes — messy is fine',
    placeholder:'Paste whatever you actually typed during the meeting.',
    seed:`Q3 planning sync — Tues\n- Priya walked through the churn numbers, worse in SMB than we thought\n- long discussion about whether pricing is the cause. Dan thinks packaging, Priya thinks onboarding\n- agreed we're not changing price this quarter\n- someone should pull the cohort data by plan tier before we decide anything\n- Marco mentioned the enterprise renewal list needs a pass, said he'd look\n- maybe worth talking to 5-10 churned accounts? felt like everyone nodded\n- Dan to draft the packaging alternatives, before the exec review\n- we didn't get to the roadmap item, pushed to next week\n- Priya raised that support ticket volume is up 30%, no one picked it up` },
  cells:[
  { id:'split', title:'Decisions vs. discussion',
    intent:'Meetings blur these constantly. A thing said with confidence is not a thing decided.',
    inputs:['input.notes'], output:{name:'split', type:'table'}, requires:'fast',
    prompt:'Classify each substantive item in these notes as Decided, Discussed only, or Deferred. Include the evidence phrase. Respond in {{locale.outputLanguage}}.\n\n{{input.notes}}',
    demo:()=>({cols:['Item','Status','Evidence in the notes'],rows:[
      ['No price change this quarter','Decided','"agreed we\'re not changing price this quarter"'],
      ['Cause of SMB churn — packaging vs onboarding','Discussed only','Two named positions, no resolution'],
      ['Talking to churned accounts','Discussed only','"felt like everyone nodded" — this is not agreement'],
      ['Roadmap item','Deferred','"pushed to next week"'],
      ['Support ticket volume up 30%','Raised, not discussed','"no one picked it up"']]}) },
  { id:'commitments', title:'Commitments, with owners',
    intent:'Every action, who holds it, and how confident that ownership actually is.',
    inputs:['input.notes','split'], output:{name:'commitments', type:'table'}, requires:'fast',
    prompt:'Extract every action item. For each give the owner if one was named, the due date if stated, and rate ownership confidence as Firm, Soft, or None. Respond in {{locale.outputLanguage}}.\n\n{{input.notes}}\n\n{{split}}',
    demo:()=>({cols:['Commitment','Owner','Due','Ownership'],rows:[
      ['Draft packaging alternatives','Dan','Before exec review','Firm'],
      ['Pass over enterprise renewal list','Marco','—','Soft — "said he\'d look" is not a commitment'],
      ['Pull cohort data by plan tier','—','Before any decision','None — "someone should"'],
      ['Interview 5–10 churned accounts','—','—','None — nodding is not ownership'],
      ['Investigate 30% support volume rise','—','—','None — raised and dropped']]}) },
  { id:'orphans', title:'The orphans',
    intent:'The three or four things everyone assumes are handled and nobody is holding. This is where meetings actually fail.',
    inputs:['commitments'], output:{name:'orphans', type:'list'}, requires:'reasoning',
    prompt:'List the commitments with no firm owner or no date, and for each say what will happen if nothing changes. Be blunt. Respond in {{locale.outputLanguage}}.\n\n{{commitments}}',
    demo:()=>['**Cohort data by plan tier** — no owner. This is a prerequisite for the packaging-vs-onboarding decision, which means that decision is currently blocked on nobody.',
      '**Churned account interviews** — no owner. Group nods are the single most reliable predictor of a task that never happens.',
      '**Support volume up 30%** — no owner, and it was raised in a churn conversation. Nobody connected it to the churn discussion happening in the same room.',
      '**Enterprise renewal pass** — Marco, softly. "Said he\'d look" survives about nine days without a date attached.'] },
  { id:'followup', title:'The message that fixes it',
    intent:'A follow-up that names the orphans without blaming anyone. Ready to send.',
    inputs:['split','commitments','orphans'], output:{name:'followup', type:'markdown'}, requires:'fast',
    prompt:'Write a short follow-up message. State what was decided, then ask directly for owners on the unowned items. Neutral tone, no blame, no preamble. Respond in {{locale.outputLanguage}}.\n\n{{split}}\n\n{{commitments}}\n\n{{orphans}}',
    demo:()=>'**Q3 planning — what we settled and what we did not**\n\nDecided: no price change this quarter.\n\nStill open: whether SMB churn is a packaging or an onboarding problem. Dan and Priya have opposing reads and we did not resolve it.\n\nCarrying:\n- **Dan** — packaging alternatives, before exec review\n- **Marco** — enterprise renewal pass. Can you put a date on it?\n\nFour things came up that nobody picked up, and one of them is blocking the churn decision:\n\n1. **Cohort data by plan tier.** We cannot settle packaging-vs-onboarding without it. Who owns this?\n2. **Churned account interviews, 5–10.** There was general agreement but no name attached.\n3. **Support ticket volume, up 30%.** Raised at the end and not discussed — worth noting we were talking about churn at the time.\n4. Roadmap item, moved to next week.\n\nIf I have mischaracterised anything, correct me and I will re-send.' }
  ]
},
{
  id:'find-the-hole', schemaVersion:'1.0.0', realm:'business', concept:'plan', collection:'judgment',
  title:'Find the Hole in This Plan',
  blurb:'Reads a plan for its dependency structure rather than its content, then names the failure that is both most likely and least watched.',
  teaches:'Structural critique', tags:['planning','risk'], capability:'reasoning',
  input:{ id:'plan', label:'The plan, in whatever shape it exists',
    placeholder:'Bullet points are fine. Prose is fine.',
    seed:`Launch the new billing system by end of Q4.\n- Nov: finish the migration script, dual-write to old and new\n- Nov 15: finance signs off on the reconciliation report\n- Dec 1: cut over 10% of accounts, monitor for a week\n- Dec 8: cut over the rest\n- Dec 15: decommission the old system\n- Sarah leads, one backend engineer, finance reviews weekly\n- Comms to customers go out Dec 1` },
  cells:[
  { id:'chain', title:'The dependency chain nobody drew',
    intent:'Plans are written as timelines and executed as dependency graphs. This makes the graph visible.',
    inputs:['input.plan'], output:{name:'chain', type:'list'}, requires:'reasoning',
    prompt:'Extract the real dependency chain from this plan — what must be true before each step can begin. Respond in {{locale.outputLanguage}}.\n\n{{input.plan}}',
    demo:()=>['Migration script complete → dual-write can begin → reconciliation data exists',
      'Reconciliation data exists → finance can review → finance sign-off (Nov 15)',
      'Finance sign-off → 10% cutover (Dec 1)',
      '10% cutover + one clean week → full cutover (Dec 8)',
      'Full cutover + stability → decommission (Dec 15)',
      'Customer comms (Dec 1) → runs in parallel, gated on nothing, reversible by nothing'] },
  { id:'spof', title:'Single points of failure',
    intent:'Where the chain has no redundancy — in people, in time, and in the ability to undo.',
    inputs:['chain','input.plan'], output:{name:'spof', type:'table'}, requires:'reasoning',
    prompt:'Identify single points of failure across people, schedule, and reversibility. For each give the impact if it fails. Respond in {{locale.outputLanguage}}.\n\n{{chain}}\n\n{{input.plan}}',
    demo:()=>({cols:['Point','Type','If it fails'],rows:[
      ['One backend engineer','Person','No second person can debug the migration script. Illness or attrition stops the chain entirely.'],
      ['Finance sign-off, Nov 15','Schedule','Every downstream date is hard-wired to it. A one-week slip lands the full cutover on Dec 15 — decommission day.'],
      ['Dec 8 → Dec 15 gap','Schedule','Seven days between full cutover and decommissioning the only fallback. Billing problems surface on a monthly cycle, not a weekly one.'],
      ['Customer comms, Dec 1','Reversibility','Sent at 10% cutover. Once sent, the timeline is public and slipping becomes an external event, not an internal one.'],
      ['Holiday period','Schedule','Dec 15–31 has the thinnest staffing of the year and the plan puts decommissioning at its edge.']]}) },
  { id:'blindspot', title:'Most likely, least watched',
    intent:'Risk registers list everything. This names the one that will actually happen.',
    inputs:['spof'], output:{name:'blindspot', type:'prose'}, requires:'reasoning',
    prompt:'Of these failure points, identify the one that is simultaneously most probable and least attended to in the plan. Explain why it is invisible. Respond in {{locale.outputLanguage}}.\n\n{{spof}}',
    demo:()=>'The seven days between full cutover and decommissioning.\n\nIt is the most likely to hurt because billing is a monthly-cycle system, and a week of monitoring cannot surface a class of bug that only appears at month-end close, on proration, on annual renewals, or on any account whose cycle falls outside that window. You will have decommissioned your only fallback before the first full billing cycle completes on the new system.\n\nAnd it is invisible because it does not look like a risk. It looks like a schedule. Every other item in this plan has a person or a review attached; this one is just two dates sitting next to each other, and the gap between them was almost certainly set by the quarter boundary rather than by anything about billing.\n\nThe finance sign-off date gets attention because it has a name on it. This one has nobody, which is exactly why it will be the one.' },
  { id:'insurance', title:'Cheapest insurance',
    intent:'What to change, ordered by cost. Not "add buffer" — specific moves.',
    inputs:['blindspot','spof'], output:{name:'insurance', type:'list'}, requires:'reasoning',
    prompt:'Give the cheapest specific changes that most reduce risk, ordered by cost. No generic advice. Respond in {{locale.outputLanguage}}.\n\n{{blindspot}}\n\n{{spof}}',
    demo:()=>['**Move decommission to after one full billing cycle closes on the new system.** Costs nothing but a date change, and removes the highest-probability failure in the plan outright.',
      '**Delay customer comms to Dec 8.** Nothing customer-visible happens at 10% cutover. Sending on Dec 1 buys no benefit and converts every subsequent slip into a public one.',
      '**Have a second engineer read the migration script.** Half a day. Turns the single person-dependency into a two-person one for the part that matters.',
      '**Put a named date on what "monitor for a week" means passing.** Right now the Dec 8 gate is a vibe. Define the three numbers that must hold.',
      '**Ask finance for a provisional sign-off on the report format now**, so Nov 15 is a data review and not a format argument. This is where sign-offs actually slip.'] }
  ]
},
{
  id:'five-audiences', schemaVersion:'1.0.0', realm:'business', concept:'translate', collection:'communication',
  title:'One Idea, Five Audiences',
  blurb:'Renders the same concept for five different readers, then shows you which version you could not write — because that is where your own understanding is thin.',
  teaches:'Range, and self-diagnosis', tags:['communication'], capability:'fast',
  input:{ id:'concept', label:'The thing you need to explain',
    placeholder:'A technical concept, a strategy, a decision.',
    seed:'We are moving from a monolith to event-driven services, starting with the billing domain.' },
  cells:[
  { id:'core', title:'The load-bearing idea',
    intent:'Strip it to the one sentence everything else is decoration on.',
    inputs:['input.concept'], output:{name:'core', type:'prose'}, requires:'fast',
    prompt:'Reduce this to the single load-bearing idea in one sentence, with no jargon. Respond in {{locale.outputLanguage}}.\n\n{{input.concept}}',
    demo:()=>'Parts of the system that currently have to agree with each other in real time will instead tell each other what happened and carry on — starting with billing, because that is where the cost of waiting is highest.' },
  { id:'renderings', title:'Five renderings',
    intent:'Same idea, five readers. Note the third column — what each version deliberately throws away.',
    inputs:['core','input.concept'], output:{name:'renderings', type:'table'}, requires:'reasoning',
    prompt:'Render this idea for five audiences: an executive, a new engineer, a skeptical senior engineer, a customer, and a ten-year-old. For each, note what the version deliberately sacrifices. Respond in {{locale.outputLanguage}}.\n\n{{core}}\n\n{{input.concept}}',
    demo:()=>({cols:['Audience','Version','What it drops'],rows:[
      ['Executive','Billing is currently the slowest thing we do and the most expensive thing to change. We are separating it so it can move without the rest of the system holding it up. Six months, one team, no customer-visible change.','All mechanism. An exec who asks "how" will get nothing from this.'],
      ['New engineer','Instead of billing calling six services and waiting, it publishes an event and the others react. You will write handlers, not call chains. The hard part is that ordering is no longer guaranteed.','The reason. Tells them what to do, not why anyone chose it.'],
      ['Skeptical senior engineer','Yes, we are trading strong consistency for availability in one domain, and yes, that means eventual consistency bugs. We think billing is where that trade pays because reconciliation already exists there as a batch process. If it does not pay there, we stop.','Confidence. Deliberately — this reader distrusts certainty more than they distrust risk.'],
      ['Customer','Nothing changes for you. Invoices, timing, and totals stay exactly as they are.','Everything. Which is correct — the honest version of this for a customer is that it is none of their business.'],
      ['Ten-year-old','Right now one kid has to ask five others before doing anything, and everyone waits. We are letting them shout what they did and keep going.','Precision, entirely. But it is the version that reveals whether you understand it.']]}) },
  { id:'diagnosis', title:'Which one was hard',
    intent:'The version you struggle to write is a map of your own uncertainty. This is the cell people do not expect.',
    inputs:['renderings'], output:{name:'diagnosis', type:'prose'}, requires:'reasoning',
    prompt:'Looking at these five renderings, identify which was hardest to make honest and what that reveals about gaps in the underlying understanding or plan. Respond in {{locale.outputLanguage}}.\n\n{{renderings}}',
    demo:()=>'The skeptical senior engineer version is the one that could not be written confidently, and the reason is not rhetorical.\n\nEvery other version can be produced from the intent alone. That one requires you to have an actual answer to "what happens when ordering breaks and a customer is billed twice," and the version above does not have one — it has a reason to believe billing is a good place to find out, which is a different thing wearing similar clothes.\n\nThat is a real gap in the plan, not a gap in the explanation. If the honest version of your pitch to your most skeptical reader is "we think this is where the trade pays," you have a hypothesis and a schedule, and the schedule is currently more specific than the hypothesis.\n\nThe customer version being trivially easy is the confirming signal: it is easy precisely because it is the one where nothing is actually being claimed.' }
  ]
},
{
  id:'steelman', schemaVersion:'1.0.0', realm:'business', concept:'critique', collection:'judgment',
  title:'Steelman Yourself',
  blurb:'Builds the strongest possible case against a position you hold, finds where the other side is genuinely right, and scores how much of your view survives.',
  teaches:'Adversarial self-review', tags:['reasoning','judgment'], capability:'reasoning',
  input:{ id:'position', label:'A position you hold and would defend',
    placeholder:'State it as you would to someone who disagrees.',
    seed:'Design systems should be owned by a central team, not federated across product teams. Federation sounds collaborative but in practice produces four versions of every component and nobody accountable for the drift.' },
  cells:[
  { id:'precise', title:'State it precisely',
    intent:'Most positions are less specific than their holder thinks. Precision is what makes a position falsifiable.',
    inputs:['input.position'], output:{name:'precise', type:'prose'}, requires:'reasoning',
    prompt:'Restate this position as precisely as possible: what exactly is being claimed, under what conditions, and what would count as the claim being wrong. Respond in {{locale.outputLanguage}}.\n\n{{input.position}}',
    demo:()=>'Claim: in organisations above some size threshold, central ownership of a design system produces lower component duplication and clearer accountability for consistency than federated ownership.\n\nConditions left unstated in the original: the size threshold, whether "owned" means authored-by or approved-by, and whether the central team is resourced to keep up with product velocity.\n\nIt would be wrong if federated teams in comparable organisations produced equal or lower drift, or if central ownership reduced drift while producing a worse outcome elsewhere — slower product teams, or a system nobody adopts because it never fits.' },
  { id:'opposing', title:'The strongest case against',
    intent:'Written by someone who wants to win, not someone being fair.',
    inputs:['precise'], output:{name:'opposing', type:'prose'}, requires:'reasoning',
    prompt:'Write the strongest argument against this position, as an intelligent advocate for the opposite view. Do not hedge or balance. Respond in {{locale.outputLanguage}}.\n\n{{precise}}',
    demo:()=>'Central ownership does not eliminate drift. It relocates it, into a queue.\n\nWhen a product team needs a component variant the central team has not built, they do not wait — the deadline does not move because the design system has a backlog. They build it locally and mark it as temporary. Now you have the same four versions, except three of them are undocumented, unowned, and invisible to the central team that believes it owns consistency.\n\nFederation is usually measured against an idealised central model rather than a real one. The real one is a team of four supporting sixty, whose adoption rate is the number that actually predicts consistency — and adoption is driven by fit, which central teams are structurally worst positioned to judge.\n\nThe accountability argument is the weakest part. A central team accountable for consistency it cannot enforce is not accountability, it is blame with a roadmap. Federated ownership with a shared contract and an automated drift check gets you the same consistency with none of the queue.' },
  { id:'concede', title:'Where they are actually right',
    intent:'The concessions that cost you something. If the list is comfortable, it is not honest.',
    inputs:['opposing','precise'], output:{name:'concede', type:'list'}, requires:'reasoning',
    prompt:'List the specific points on which the opposing case is genuinely correct, including any that materially weaken the original position. Respond in {{locale.outputLanguage}}.\n\n{{opposing}}\n\n{{precise}}',
    demo:()=>['**The queue is real and it was not accounted for.** The original position compares central ownership to federated chaos, not to central ownership under realistic resourcing.',
      '**Adoption rate is the better metric than duplication count**, and the original position never mentioned it. A system with zero duplication and 30% adoption is worse than the reverse.',
      '**"Accountable" was doing unearned work.** A central team cannot enforce consistency without either merge rights or a lint gate, and the position assumed accountability without naming the mechanism.',
      '**Automated drift detection changes the arithmetic.** Much of the case for centralisation was really a case for visibility, and visibility can now be tooling rather than org structure.'] },
  { id:'survives', title:'What survives',
    intent:'Not a winner. What is left of the original once the honest concessions are made.',
    inputs:['concede','opposing','precise'], output:{name:'survives', type:'prose'}, requires:'reasoning',
    prompt:'State what remains defensible in the original position after these concessions, what must be abandoned, and how the position should be restated. Respond in {{locale.outputLanguage}}.\n\n{{concede}}\n\n{{opposing}}\n\n{{precise}}',
    demo:()=>'What survives is narrower and better: central ownership of the *contract* — the token layer, the accessibility floor, the API shape — with federated authorship of components against it.\n\nWhat has to be abandoned is the claim as stated. "Design systems should be owned by a central team" does not survive, because it was never really an argument about ownership; it was an argument about drift visibility, and drift visibility turns out to be a tooling problem that centralisation solved by accident and expensively.\n\nRestated: *the contract should be central and enforced automatically; the components should be federated and their conformance should be measured, not reviewed.* That version keeps everything the original was actually worried about and drops the part that was org-chart preference wearing an argument.\n\nNote what happened — the concession about automated drift detection did most of the damage. The position was formed before that tooling was cheap, and had not been re-examined since.' }
  ]
}
,
{
  id:'until-it-holds', schemaVersion:'1.1.0', realm:'business', concept:'critique', collection:'judgment', featured:true,
  title:'Revise Until It Holds',
  blurb:'Attacks your claim, and if it does not survive, sends the run back to restate it — up to three times. The notebook loops until the claim stops falling over.',
  teaches:'Recursion — the notebook decides to try again', tags:['reasoning','loop'], capability:'reasoning',
  input:{ id:'claim', label:'A claim you want to make stick',
    placeholder:'One sentence. The stronger the better.',
    seed:'Remote work makes engineering teams less productive.' },
  cells:[
  { id:'sharpen', title:'Sharpen the claim',
    intent:'Vague claims cannot fail, which is why they feel safe. This makes it specific enough to be attacked.',
    inputs:['input.claim'], output:{name:'sharp', type:'prose'}, requires:'reasoning',
    prompt:'Restate this claim as precisely as possible — scope, conditions, and what would count as it being wrong. If a revision is supplied, sharpen that instead. Respond in {{locale.outputLanguage}}.\n\nClaim: {{input.claim}}\nRevision, if any: {{revision}}',
    demo:(b)=> (b.__pass ?? 1) === 1
      ? 'Claim: engineering teams working fully remotely ship less per engineer per quarter than comparable co-located teams. Scope is unstated — team size, seniority, and domain are all unspecified, and "productive" is being measured as shipped output rather than outcome. It would be wrong if comparable remote teams matched or exceeded co-located output on the same measure.'
      : 'Claim: engineering teams that moved to remote WITHOUT changing how they coordinate ship less per quarter, because the practices they relied on were co-located ones. Scope: teams above roughly eight people, in their first year after the change. Measured as cycle time from ready to merged. It would be wrong if such teams matched their own prior cycle time within a year without changing coordination practices.' },

  { id:'attack', title:'Attack it',
    intent:'The strongest available objection, written by someone who wants the claim to fall.',
    inputs:['sharp'], output:{name:'attack', type:'prose'}, requires:'reasoning',
    prompt:'Write the strongest objection to this claim. Aim to break it. Respond in {{locale.outputLanguage}}.\n\n{{sharp}}',
    demo:(b)=> (b.__pass ?? 1) === 1
      ? 'The claim confuses a change with a cause. Teams that went remote also went remote during a pandemic, changed hiring, lost people, and absorbed a macro shock — attributing the output drop to remoteness requires ruling out all of it, and the claim does not.\n\nWorse, "productive" is doing the heavy lifting unexamined. Shipped output per engineer is the measure most sensitive to coordination overhead and least sensitive to whether the right thing was built. Plenty of co-located teams ship more of the wrong thing faster.'
      : 'This is much harder to attack, because it has stopped claiming remoteness causes the drop and started claiming unchanged coordination does. That is nearly tautological — teams that do not adapt to a change do worse after it — but it is not empty, since it makes a testable prediction about the first year and about cycle time specifically.\n\nThe remaining weakness is the eight-person threshold. Nothing in the argument produces that number; it is asserted.' },

  { id:'gate', title:'Does it hold?',
    intent:'The gate. If the claim survives, the run continues. If it does not, this cell rewrites it and sends the run back to cell 01.',
    inputs:['sharp','attack'], output:{name:'gateOut', type:'gate'}, requires:'reasoning',
    gate:{ to:'sharpen', writes:'revision', maxPasses:3 },
    prompt:'Judge whether the claim survives the objection. If it does not, write a revised claim that would. Respond in {{locale.outputLanguage}}.\n\nClaim: {{sharp}}\n\nObjection: {{attack}}',
    demo:(b)=> (b.__pass ?? 1) === 1
      ? { verdict:'revise',
          reason:'It does not hold. The objection identifies a confound the claim cannot rule out — remoteness arrived alongside several other changes — and the measure chosen is the one most flattering to the conclusion. As written, the claim would be defended by anyone who already believed it and dismissed by anyone who did not.',
          revision:'Engineering teams that moved to remote without changing how they coordinate ship less, because the practices they depended on were co-located ones — measured as cycle time, in the first year after the change.' }
      : { verdict:'continue',
          reason:'It holds now. The revised claim survives the objection because it no longer asserts that remoteness itself causes the drop — it names unchanged coordination as the mechanism, which is testable and which the objection does not touch. The unearned eight-person threshold is a real weakness, but a weakness in precision rather than in the argument.' } },

  { id:'standing', title:'What you can now say',
    intent:'Only reached once the claim survives, or once the passes run out. Either way you learn something true.',
    inputs:['sharp','gateOut'], output:{name:'standing', type:'prose'}, requires:'reasoning',
    prompt:'State the claim that survived and what it costs to hold it. Respond in {{locale.outputLanguage}}.\n\n{{sharp}}\n\n{{gateOut}}',
    demo:()=>'What survived: teams that went remote without changing their coordination practices lost cycle time, and the cause is the unchanged practices rather than the remoteness.\n\nWhat it costs you: the original claim was an argument against remote work, and this one is not. It is an argument for changing how you coordinate when the conditions change — which applies equally to a team that moves offices, doubles in size, or splits across time zones. You have traded a position people will fight you about for one they will mostly agree with, and that is usually what happens when a claim is made precise enough to test.\n\nWhat it still owes: the eight-person threshold is asserted, not derived. Either find the number or drop it.' }
  ]
},
{
  id:'pre-mortem', schemaVersion:'1.0.0', realm:'business', concept:'plan', collection:'judgment',
  title:'Pre-Mortem',
  blurb:'Assumes the thing already failed, eighteen months from now, and works backwards to find out why. Reliably surfaces risks a forward-looking review misses.',
  teaches:'Prospective hindsight', tags:['planning','risk'], capability:'reasoning',
  input:{ id:'plan', label:'What you are about to commit to',
    placeholder:'The initiative, the bet, the hire, the launch.',
    seed:'We are going to build an internal AI assistant for our support team. Six months, three engineers, trained on our help centre and past tickets. Goal is to cut first-response time in half.' },
  cells:[
  { id:'obit', title:'It is eighteen months later. It failed.',
    intent:'Not "what could go wrong" — it already did. The certainty is what unlocks the honest answers.',
    inputs:['input.plan'], output:{name:'obit', type:'prose'}, requires:'reasoning',
    prompt:'It is 18 months later and this failed completely. Write the short, unsparing account of what happened, in past tense, as if it is already known. Respond in {{locale.outputLanguage}}.\n\n{{input.plan}}',
    demo:()=>'It shipped on time and nobody used it.\n\nThe assistant answered the questions the help centre already answered well, which were not the questions arriving in tickets. Support agents tried it for about three weeks, found that checking its answer took longer than writing their own, and quietly stopped. First-response time did not move.\n\nBy month nine the team had been reassigned. The assistant stayed up because nobody wanted to be the person who turned it off, and it slowly drifted out of date as the product changed. It is still running.' },
  { id:'causes', title:'Working backwards',
    intent:'Each cause, ranked by how early it was already true.',
    inputs:['obit'], output:{name:'causes', type:'table'}, requires:'reasoning',
    prompt:'From this failure account, work backwards to root causes. For each give the earliest point it was already true and whether it was knowable then. Return a table: Cause, Already true by, Knowable then?. Respond in {{locale.outputLanguage}}.\n\n{{obit}}',
    demo:()=>({cols:['Cause','Already true by','Knowable then?'],rows:[
      ['Training data was the help centre, but tickets are the questions the help centre failed to answer','Before a line of code','Yes — one afternoon reading 50 tickets'],
      ['Verification cost exceeded writing cost, so agents rationally stopped','Design, not build','Yes — but only if anyone had timed it'],
      ['Success was measured as response time, which agents do not control alone','Goal-setting','Yes — agents would have said so if asked'],
      ['No owner after launch','The staffing plan','Yes — the plan funded a build, not a service'],
      ['Nobody was accountable for turning it off','Never decided','No — this one is a governance gap, not a foresight one']]}) },
  { id:'earliest', title:'The cheapest moment to have known',
    intent:'Of all of it, the one check that would have changed the most, done before anything is committed.',
    inputs:['causes'], output:{name:'earliest', type:'prose'}, requires:'reasoning',
    prompt:'Identify the single earliest, cheapest check that would most likely have prevented this failure, and say exactly how to run it this week. Respond in {{locale.outputLanguage}}.\n\n{{causes}}',
    demo:()=>'Read fifty real tickets against the help centre, and mark each one: already answered there, answered but hard to find, or not answered at all.\n\nThat single afternoon separates the three futures. If most tickets are already answered and merely hard to find, you do not need an assistant — you need search, and it is a far smaller project. If most are not answered anywhere, an assistant trained on the help centre cannot possibly work and the whole plan is aimed at the wrong corpus. Only the middle case justifies what is proposed.\n\nIt costs one person one afternoon and it can be done before anyone is hired, scoped, or committed. Every other cause in the table is downstream of getting this wrong.' },
  { id:'tripwires', title:'Tripwires',
    intent:'Signals to agree on now, while it is still cheap to admit them.',
    inputs:['causes','earliest'], output:{name:'tripwires', type:'list'}, requires:'reasoning',
    prompt:'Give specific, observable tripwires with thresholds and dates that would tell the team early that this is failing. No vague monitoring advice. Respond in {{locale.outputLanguage}}.\n\n{{causes}}\n\n{{earliest}}',
    demo:()=>['**Week 3 after launch: daily active agents below 40% of the team.** Adoption never recovers from a bad first fortnight; if it is low here it will be lower at week 12.',
      '**Median time-to-verify an answer exceeds median time-to-write one.** Time it directly with five agents. This is the number that actually decides whether the tool is used.',
      '**Fewer than 30% of answers are sent without edit.** Heavy editing means agents are using it as a rough draft, which is a different and much less valuable product than the one being funded.',
      '**No named owner with allocated time by launch day.** Not a tripwire that fires later — check it on the day, because after that nobody will.',
      '**Agree the shutdown criterion now, in writing.** The failure account has it running eighteen months after it stopped working, and that is the cheapest thing on this list to prevent.'] }
  ]
},
{
  id:'ambiguity-report', schemaVersion:'1.0.0', realm:'tech', concept:'extract', collection:'work',
  title:'Spec → Ambiguity Report',
  blurb:'Finds every sentence two competent people would implement differently. The disagreements you find now are the ones you do not find in review.',
  teaches:'Reading for divergence', tags:['work','specs'], capability:'reasoning',
  input:{ id:'spec', label:'A spec, ticket, or requirement',
    placeholder:'Paste it as written.',
    seed:'Users should be able to export their data. The export should include all their content and be delivered quickly. Large exports may be processed in the background. Users should be notified when it is ready.' },
  cells:[
  { id:'ambig', title:'Where two people would diverge',
    intent:'Not unclear writing — writing that is clear, and clearly means two different things.',
    inputs:['input.spec'], output:{name:'ambig', type:'table'}, requires:'reasoning',
    prompt:'Find every phrase that two competent engineers would implement differently. Give the phrase, the two readings, and which is more expensive. Return a table: Phrase, Reading A, Reading B. Respond in {{locale.outputLanguage}}.\n\n{{input.spec}}',
    demo:()=>({cols:['Phrase','Reading A','Reading B'],rows:[
      ['"all their content"','Everything they authored','Everything visible to them, including shared items they do not own — a permissions problem, not an export one'],
      ['"delivered quickly"','Under a few seconds, synchronous','Same day, asynchronous. The next sentence implies B, contradicting this one'],
      ['"large exports"','Above a size threshold','Above a time threshold. Different code, different failure modes'],
      ['"may be processed in the background"','Implementation is free to choose','A stated requirement that it must support async. "May" is doing dangerous work here'],
      ['"notified"','In-app','Email. Also unstated: what happens if they are offline when it completes']]}) },
  { id:'unasked', title:'The questions the spec assumes are answered',
    intent:'Not ambiguities — absences. What it never occurred to anyone to write down.',
    inputs:['input.spec','ambig'], output:{name:'unasked', type:'list'}, requires:'reasoning',
    prompt:'List the important questions this spec never addresses at all. Respond in {{locale.outputLanguage}}.\n\n{{input.spec}}\n\n{{ambig}}',
    demo:()=>['**What format?** Not mentioned once. CSV, JSON and a zip of originals are three different projects.',
      '**How long is the export available, and where does it live?** An export is a copy of everything a user has — a file nobody scoped the retention or access control for.',
      '**Can they export twice?** Rate limiting is unstated, and this is the endpoint most attractive to abuse.',
      '**What happens to deleted content?** Regulation may require it; users may expect it excluded. The spec takes no position.',
      '**Is this a GDPR/portability obligation or a convenience feature?** The answer changes the deadline, the format, and who signs off — and it is the single most consequential thing not written down.'] },
  { id:'rewrite', title:'The unambiguous version',
    intent:'Same intent, no room to diverge. This is what should have been written.',
    inputs:['ambig','unasked'], output:{name:'rewrite', type:'markdown'}, requires:'reasoning',
    prompt:'Rewrite the spec so it cannot be read two ways. Mark decisions that still need a human with TBD and who should decide. Respond in {{locale.outputLanguage}}.\n\n{{ambig}}\n\n{{unasked}}',
    demo:()=>'**Data export**\n\nA user can request an export of all content they authored. Content shared with them but owned by others is excluded — **TBD (Legal): does portability oblige us to include shared content?**\n\nThe export is generated asynchronously in all cases. There is no synchronous path; "quickly" is replaced by a stated target: **95% of exports available within 15 minutes**, and the user is told the estimate at request time.\n\nFormat is a single zip containing JSON for structured records and original files at original resolution. **TBD (Product): is CSV needed for spreadsheet users?**\n\nOn completion the user receives an email with a signed link, valid for **7 days**, after which the artefact is deleted. The link is single-user and does not require an active session.\n\nOne export per user per **24 hours**. A second request inside the window returns the existing artefact rather than generating a new one.\n\nDeleted content is excluded. **TBD (Legal): retention obligations may override this.**\n\nThis is a **TBD (Product): obligation or convenience?** — if obligation, the 15-minute target and 7-day window both need Legal review before build.' }
  ]
},
{
  id:'feedback-patterns', schemaVersion:'1.0.0', realm:'business', concept:'extract', collection:'analysis',
  title:'Feedback → Patterns',
  blurb:'Turns a pile of comments into themes, separates the signal from the loudest voice, and names what to deliberately ignore.',
  teaches:'Synthesis with a discard pile', tags:['analysis','research'], capability:'reasoning',
  input:{ id:'feedback', label:'Raw feedback — reviews, survey text, notes',
    placeholder:'One per line is fine. Messy is fine.',
    seed:`- Setup took me three tries, the docs skip a step\n- Love it once it works\n- Too expensive for what it does\n- I can never find the export button\n- Why is there no dark mode??\n- Crashed twice on large files\n- The onboarding video is great\n- Setup instructions assume you already have an account\n- Pricing page is confusing, I still don't know what tier I'm on\n- Export is buried\n- It's fine\n- Would pay double if it had an API\n- Large file handling is unusable, this is a dealbreaker\n- Docs are out of date in places` },
  cells:[
  { id:'themes', title:'Themes, by weight',
    intent:'Grouped by what people mean, not the words they used.',
