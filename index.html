/* ═════════ notebooks/ — THE LIBRARY. Content as data.
   Per PRODUCT-BRIEF §3 this is the product; the runtime is the viewer.
   The full shelf lives in library.json and is fetched relatively so the app
   stays droppable at any subpath. A small seed paints immediately (R6).
   `demo` / `demoPass` hydrate into functions at load. ═════════ */

function hydrateCell(c){
  const cell = {...c};
  if (cell.demoPass){
    const passes = cell.demoPass;
    cell.demo = (bag) => {
      const i = Math.max(0, Math.min(passes.length - 1, (bag?.__pass ?? 1) - 1));
      return structuredClone(passes[i]);
    };
    delete cell.demoPass;
  } else if (cell.demo !== undefined && typeof cell.demo !== 'function'){
    const v = cell.demo;
    cell.demo = () => structuredClone(v);
  }
  return cell;
}
function hydrateNotebook(nb){
  return {...nb, cells: nb.cells.map(hydrateCell)};
}

/* Seed: featured plus one from enough personas that first paint is not a
   single-shelf lie while library.json is still in flight. */
const SEED_NOTEBOOKS = [{"id":"until-it-holds","schemaVersion":"1.2.0","realm":"business","concept":"critique","featured":true,"title":"Revise Until It Holds","blurb":"Attacks your claim, and if it does not survive, sends the run back to restate it — up to three times. The notebook loops until the claim stops falling over.","teaches":"Recursion — the notebook decides to try again","tags":["reasoning","loop"],"input":{"id":"claim","label":"A claim you want to make stick","placeholder":"One sentence. The stronger the better.","seed":"Remote work makes engineering teams less productive.\ncontext: Said in a leadership offsite; people nodded; nobody defined productive.\nwant: A claim that can survive attack — or die cleanly."},"cells":[{"id":"sharpen","title":"Sharpen the claim","intent":"Vague claims cannot fail, which is why they feel safe. This makes it specific enough to be attacked.","inputs":["input.claim"],"output":{"name":"sharp","type":"prose"},"requires":"reasoning","prompt":"Restate this claim as precisely as possible — scope, conditions, and what would count as it being wrong. If a revision is supplied, sharpen that instead. Respond in {{locale.outputLanguage}}.\n\nClaim: {{input.claim}}\nRevision, if any: {{revision}}","demoPass":["Claim: engineering teams working fully remotely ship less per engineer per quarter than comparable co-located teams. Scope is unstated — team size, seniority, and domain are all unspecified, and \"productive\" is being measured as shipped output rather than outcome. It would be wrong if comparable remote teams matched or exceeded co-located output on the same measure.","Claim: engineering teams that moved to remote WITHOUT changing how they coordinate ship less per quarter, because the practices they relied on were co-located ones. Scope: teams above roughly eight people, in their first year after the change. Measured as cycle time from ready to merged. It would be wrong if such teams matched their own prior cycle time within a year without changing coordination practices."]},{"id":"attack","title":"Attack it","intent":"The strongest available objection, written by someone who wants the claim to fall.","inputs":["sharp"],"output":{"name":"attack","type":"prose"},"requires":"reasoning","prompt":"Write the strongest objection to this claim. Aim to break it. Respond in {{locale.outputLanguage}}.\n\n{{sharp}}","demoPass":["The claim confuses a change with a cause. Teams that went remote also went remote during a pandemic, changed hiring, lost people, and absorbed a macro shock — attributing the output drop to remoteness requires ruling out all of it, and the claim does not.\n\nWorse, \"productive\" is doing the heavy lifting unexamined. Shipped output per engineer is the measure most sensitive to coordination overhead and least sensitive to whether the right thing was built. Plenty of co-located teams ship more of the wrong thing faster.","This is much harder to attack, because it has stopped claiming remoteness causes the drop and started claiming unchanged coordination does. That is nearly tautological — teams that do not adapt to a change do worse after it — but it is not empty, since it makes a testable prediction about the first year and about cycle time specifically.\n\nThe remaining weakness is the eight-person threshold. Nothing in the argument produces that number; it is asserted."]},{"id":"gate","title":"Does it hold?","intent":"The gate. If the claim survives, the run continues. If it does not, this cell rewrites it and sends the run back to cell 01.","inputs":["sharp","attack"],"output":{"name":"gateOut","type":"gate"},"requires":"reasoning","gate":{"to":"sharpen","writes":"revision","maxPasses":3},"prompt":"Judge whether the claim survives the objection. If it does not, write a revised claim that would. Respond in {{locale.outputLanguage}}.\n\nClaim: {{sharp}}\n\nObjection: {{attack}}","demoPass":[{"verdict":"revise","reason":"It does not hold. The objection identifies a confound the claim cannot rule out — remoteness arrived alongside several other changes — and the measure chosen is the one most flattering to the conclusion. As written, the claim would be defended by anyone who already believed it and dismissed by anyone who did not.","revision":"Engineering teams that moved to remote without changing how they coordinate ship less, because the practices they depended on were co-located ones — measured as cycle time, in the first year after the change."},{"verdict":"continue","reason":"It holds now. The revised claim survives the objection because it no longer asserts that remoteness itself causes the drop — it names unchanged coordination as the mechanism, which is testable and which the objection does not touch. The unearned eight-person threshold is a real weakness, but a weakness in precision rather than in the argument."}]},{"id":"standing","title":"What you can now say","intent":"Only reached once the claim survives, or once the passes run out. Either way you learn something true.","inputs":["sharp","gateOut"],"output":{"name":"standing","type":"prose"},"requires":"reasoning","prompt":"State the claim that survived and what it costs to hold it. Respond in {{locale.outputLanguage}}.\n\n{{sharp}}\n\n{{gateOut}}","demo":"What survived: teams that went remote without changing their coordination practices lost cycle time, and the cause is the unchanged practices rather than the remoteness.\n\nWhat it costs you: the original claim was an argument against remote work, and this one is not. It is an argument for changing how you coordinate when the conditions change — which applies equally to a team that moves offices, doubles in size, or splits across time zones. You have traded a position people will fight you about for one they will mostly agree with, and that is usually what happens when a claim is made precise enough to test.\n\nWhat it still owes: the eight-person threshold is asserted, not derived. Either find the number or drop it."}],"persona":"founder"},{"id":"interrogate-decision","schemaVersion":"1.0.0","realm":"business","concept":"critique","title":"Interrogate a Decision","blurb":"Takes a decision you have already half-made and finds the assumptions you did not know you were making — then tells you what evidence would change your mind.","teaches":"Critique — attack it before reality does","tags":["reasoning","judgment"],"input":{"id":"decision","label":"The decision you are leaning toward, and why","placeholder":"e.g. We should rebuild the onboarding flow in-house rather than buy, because…","seed":"We should build our onboarding flow in-house rather than buying a vendor solution. Our needs are unusual, the vendors we looked at all assume a self-serve signup, and we think we can ship it in about six weeks with the two engineers currently between projects."},"cells":[{"id":"stated","title":"Extract the case you actually made","intent":"Separates the argument from the conclusion. Most people cannot see their own reasoning until it is listed back to them.","inputs":["input.decision"],"output":{"name":"stated","type":"list"},"requires":"reasoning","prompt":"Read the decision below. List only the claims the author actually made, one per line, in their own terms. Do not evaluate them. Respond in {{locale.outputLanguage}}.\n\n{{input.decision}}","demo":["Our requirements are unusual enough that vendor products will not fit.","Every vendor evaluated assumes a self-serve signup motion.","Two engineers are currently available with no competing commitment.","The build is roughly a six-week effort.","Building is therefore cheaper or better than buying."]},{"id":"assumptions","title":"Surface what was assumed, not argued","intent":"The load-bearing beliefs that were never stated out loud — because they felt too obvious to say.","inputs":["stated"],"output":{"name":"assumptions","type":"list"},"requires":"reasoning","prompt":"Below are the explicit claims. Identify the unstated assumptions each one rests on — the beliefs that must be true for the claim to hold, but which were never argued. Respond in {{locale.outputLanguage}}.\n\n{{stated}}","demo":["That \"unusual requirements\" are genuinely structural, rather than habits that hardened into requirements.","That the six-week estimate covers a first version, and that a first version is what ships — no ongoing maintenance is priced in anywhere.","That the two engineers stay available for the whole six weeks, which has not been true of any previous window.","That onboarding is a solved problem once built, rather than a surface that changes every time the product does.","That the cost of being wrong is symmetric — that an in-house build is as reversible as a vendor contract. It is not."]},{"id":"counter","title":"Build the strongest case against","intent":"Not a list of risks. The actual argument a smart person who disagrees with you would make.","inputs":["stated","assumptions"],"output":{"name":"counter","type":"prose"},"requires":"reasoning","prompt":"Write the strongest possible argument against this decision, as a colleague who respects the reasoning but reaches the opposite conclusion. Be specific and concrete, not cautionary. Respond in {{locale.outputLanguage}}.\n\nClaims:\n{{stated}}\n\nAssumptions:\n{{assumptions}}","demo":"The six weeks is not the cost. The cost is the next four years, during which onboarding is the surface most exposed to every product change you make, and the two engineers who built it have moved on. A vendor amortises that maintenance across every customer; you would be amortising it across one.\n\nThe \"unusual requirements\" claim is also doing more work than it can bear. Every team believes this, and it is true perhaps a fifth of the time. The evaluation found that vendors assume self-serve signup — but that is one requirement, not an architecture, and it is the kind of thing a vendor will meet if you are a large enough account or willing to sit slightly off the happy path.\n\nAnd the availability of two engineers is not an argument for building. It is an argument that you have two engineers. Those are different, and conflating them is how organisations end up owning software they never chose to own."},{"id":"falsifiers","title":"What would change your mind","intent":"Turns each assumption into something checkable this week. This is the cell that makes the notebook actionable rather than merely clever.","inputs":["assumptions"],"output":{"name":"falsifiers","type":"table"},"requires":"reasoning","prompt":"For each assumption, state what observation would disprove it and the cheapest way to check within one week. Return a table with columns: Assumption, Would be disproved by, Check this week. Respond in {{locale.outputLanguage}}.\n\n{{assumptions}}","demo":{"cols":["Assumption","Would be disproved by","Cheapest check this week"],"rows":[["Requirements are genuinely unusual","A vendor demo that handles 80% of them out of the box","Send your top 10 requirements to two vendors and ask them to mark each yes/no/partial"],["Six weeks is the real cost","Any comparable internal build that shipped and stayed shipped at estimate","Pull the last three internal tools you built. Compare estimate to actual, and check who maintains them now"],["The engineers stay available","Either one being pulled onto something else in the last two quarters","Ask their manager for a written commitment through the window. The answer itself is the data"],["Onboarding is build-once","Your onboarding changing more than twice a year","Count the onboarding-related tickets from the last 12 months"],["The decision is reversible","No credible path back to a vendor after 6 months in","Ask what the migration off your own build would cost. If nobody can answer, it is not reversible"]]}},{"id":"verdict","title":"Where this leaves you","intent":"A position, not a summary. The notebook should end by being useful.","inputs":["counter","falsifiers"],"output":{"name":"verdict","type":"prose"},"requires":"reasoning","prompt":"Given the counter-argument and the falsification tests, state plainly what the decision now looks like and what should happen next. Take a position. Respond in {{locale.outputLanguage}}.\n\n{{counter}}\n\n{{falsifiers}}","demo":"The decision is not wrong, but it is currently being made on the wrong evidence. Three of the five load-bearing assumptions can be tested for roughly a day of effort each, and two of them — maintenance cost and engineer availability — have historical data sitting in systems you already own.\n\nRun the vendor requirement-marking exercise and pull the estimate-versus-actual on your last three internal builds. If vendors clear 80% and your internal builds ran at 2x, buy. If vendors clear under half and your builds land near estimate, build with confidence you do not currently have.\n\nThe thing not to do is decide this week on the grounds that two engineers happen to be free."}],"persona":"manager","featured":true},{"id":"ambiguity-report","schemaVersion":"1.0.0","realm":"tech","concept":"extract","title":"Spec → Ambiguity Report","blurb":"Finds every sentence two competent people would implement differently. The disagreements you find now are the ones you do not find in review.","teaches":"Extract — pull structure out of mess","tags":["work","specs"],"input":{"id":"spec","label":"A spec, ticket, or requirement","placeholder":"Paste it as written.","seed":"Users should be able to export their data. The export should include all their content and be delivered quickly. Large exports may be processed in the background. Users should be notified when it is ready."},"cells":[{"id":"ambig","title":"Where two people would diverge","intent":"Not unclear writing — writing that is clear, and clearly means two different things.","inputs":["input.spec"],"output":{"name":"ambig","type":"table"},"requires":"reasoning","prompt":"Find every phrase that two competent engineers would implement differently. Give the phrase, the two readings, and which is more expensive. Return a table: Phrase, Reading A, Reading B. Respond in {{locale.outputLanguage}}.\n\n{{input.spec}}","demo":{"cols":["Phrase","Reading A","Reading B"],"rows":[["\"all their content\"","Everything they authored","Everything visible to them, including shared items they do not own — a permissions problem, not an export one"],["\"delivered quickly\"","Under a few seconds, synchronous","Same day, asynchronous. The next sentence implies B, contradicting this one"],["\"large exports\"","Above a size threshold","Above a time threshold. Different code, different failure modes"],["\"may be processed in the background\"","Implementation is free to choose","A stated requirement that it must support async. \"May\" is doing dangerous work here"],["\"notified\"","In-app","Email. Also unstated: what happens if they are offline when it completes"]]}},{"id":"unasked","title":"The questions the spec assumes are answered","intent":"Not ambiguities — absences. What it never occurred to anyone to write down.","inputs":["input.spec","ambig"],"output":{"name":"unasked","type":"list"},"requires":"reasoning","prompt":"List the important questions this spec never addresses at all. Respond in {{locale.outputLanguage}}.\n\n{{input.spec}}\n\n{{ambig}}\n\nBe concrete. Prefer named actors, numbers, and falsifiable statements over general advice.","demo":["**What format?** Not mentioned once. CSV, JSON and a zip of originals are three different projects.","**How long is the export available, and where does it live?** An export is a copy of everything a user has — a file nobody scoped the retention or access control for.","**Can they export twice?** Rate limiting is unstated, and this is the endpoint most attractive to abuse.","**What happens to deleted content?** Regulation may require it; users may expect it excluded. The spec takes no position.","**Is this a GDPR/portability obligation or a convenience feature?** The answer changes the deadline, the format, and who signs off — and it is the single most consequential thing not written down."]},{"id":"rewrite","title":"The unambiguous version","intent":"Same intent, no room to diverge. This is what should have been written.","inputs":["ambig","unasked"],"output":{"name":"rewrite","type":"markdown"},"requires":"reasoning","prompt":"Rewrite the spec so it cannot be read two ways. Mark decisions that still need a human with TBD and who should decide. Respond in {{locale.outputLanguage}}.\n\n{{ambig}}\n\n{{unasked}}","demo":"**Data export**\n\nA user can request an export of all content they authored. Content shared with them but owned by others is excluded — **TBD (Legal): does portability oblige us to include shared content?**\n\nThe export is generated asynchronously in all cases. There is no synchronous path; \"quickly\" is replaced by a stated target: **95% of exports available within 15 minutes**, and the user is told the estimate at request time.\n\nFormat is a single zip containing JSON for structured records and original files at original resolution. **TBD (Product): is CSV needed for spreadsheet users?**\n\nOn completion the user receives an email with a signed link, valid for **7 days**, after which the artefact is deleted. The link is single-user and does not require an active session.\n\nOne export per user per **24 hours**. A second request inside the window returns the existing artefact rather than generating a new one.\n\nDeleted content is excluded. **TBD (Legal): retention obligations may override this.**\n\nThis is a **TBD (Product): obligation or convenience?** — if obligation, the 15-minute target and 7-day window both need Legal review before build."}],"persona":"product","featured":true},{"id":"five-audiences","schemaVersion":"1.0.0","realm":"business","concept":"translate","title":"One Idea, Five Audiences","blurb":"Renders the same concept for five different readers, then shows you which version you could not write — because that is where your own understanding is thin.","teaches":"Translate — same idea, different reader","tags":["communication"],"input":{"id":"concept","label":"The thing you need to explain","placeholder":"A technical concept, a strategy, a decision.","seed":"We are moving from a monolith to event-driven services, starting with the billing domain.\nconstraint: Be specific enough that two colleagues would disagree about the next step — that disagreement is the point of this notebook (The thing you need to explain)."},"cells":[{"id":"core","title":"The load-bearing idea","intent":"Strip it to the one sentence everything else is decoration on.","inputs":["input.concept"],"output":{"name":"core","type":"prose"},"requires":"fast","prompt":"Reduce this to the single load-bearing idea in one sentence, with no jargon. Respond in {{locale.outputLanguage}}.\n\n{{input.concept}}\n\nBe concrete. Prefer named actors, numbers, and falsifiable statements over general advice.","demo":"Parts of the system that currently have to agree with each other in real time will instead tell each other what happened and carry on — starting with billing, because that is where the cost of waiting is highest."},{"id":"renderings","title":"Five renderings","intent":"Same idea, five readers. Note the third column — what each version deliberately throws away.","inputs":["core","input.concept"],"output":{"name":"renderings","type":"table"},"requires":"reasoning","prompt":"Render this idea for five audiences: an executive, a new engineer, a skeptical senior engineer, a customer, and a ten-year-old. For each, note what the version deliberately sacrifices. Respond in {{locale.outputLanguage}}.\n\n{{core}}\n\n{{input.concept}}","demo":{"cols":["Audience","Version","What it drops"],"rows":[["Executive","Billing is currently the slowest thing we do and the most expensive thing to change. We are separating it so it can move without the rest of the system holding it up. Six months, one team, no customer-visible change.","All mechanism. An exec who asks \"how\" will get nothing from this."],["New engineer","Instead of billing calling six services and waiting, it publishes an event and the others react. You will write handlers, not call chains. The hard part is that ordering is no longer guaranteed.","The reason. Tells them what to do, not why anyone chose it."],["Skeptical senior engineer","Yes, we are trading strong consistency for availability in one domain, and yes, that means eventual consistency bugs. We think billing is where that trade pays because reconciliation already exists there as a batch process. If it does not pay there, we stop.","Confidence. Deliberately — this reader distrusts certainty more than they distrust risk."],["Customer","Nothing changes for you. Invoices, timing, and totals stay exactly as they are.","Everything. Which is correct — the honest version of this for a customer is that it is none of their business."],["Ten-year-old","Right now one kid has to ask five others before doing anything, and everyone waits. We are letting them shout what they did and keep going.","Precision, entirely. But it is the version that reveals whether you understand it."]]}},{"id":"diagnosis","title":"Which one was hard","intent":"The version you struggle to write is a map of your own uncertainty. This is the cell people do not expect.","inputs":["renderings"],"output":{"name":"diagnosis","type":"prose"},"requires":"reasoning","prompt":"Looking at these five renderings, identify which was hardest to make honest and what that reveals about gaps in the underlying understanding or plan. Respond in {{locale.outputLanguage}}.\n\n{{renderings}}","demo":"The skeptical senior engineer version is the one that could not be written confidently, and the reason is not rhetorical.\n\nEvery other version can be produced from the intent alone. That one requires you to have an actual answer to \"what happens when ordering breaks and a customer is billed twice,\" and the version above does not have one — it has a reason to believe billing is a good place to find out, which is a different thing wearing similar clothes.\n\nThat is a real gap in the plan, not a gap in the explanation. If the honest version of your pitch to your most skeptical reader is \"we think this is where the trade pays,\" you have a hypothesis and a schedule, and the schedule is currently more specific than the hypothesis.\n\nThe customer version being trivially easy is the confirming signal: it is easy precisely because it is the one where nothing is actually being claimed."}],"persona":"marketer","featured":true},{"id":"hired-for","schemaVersion":"1.2.0","realm":"business","concept":"diagnose","persona":"product","title":"What They Actually Hired It For","blurb":"Diagnoses the real job customers hire your product to do by separating buying language from operational outcomes.","teaches":"Infer JTBD from behavior, constraints, and replacement alternatives rather than feature requests.","tags":["product","business","diagnose","jtbd","research"],"input":{"id":"signals","label":"Customer Signals","placeholder":"Paste notes from interviews, tickets, and win/loss calls.","seed":"Admins say they bought us for 'visibility,' but usage spikes whenever weekly audit prep starts. Churned accounts mention setup complexity, while retained accounts automate recurring compliance exports in month one. Competitor swaps happen most often when export formatting breaks downstream workflows."},"cells":[{"id":"struggle-extract","title":"Underlying Struggles","intent":"Extract the recurring struggle patterns that drive adoption and churn behavior.","inputs":["input.signals"],"output":{"name":"struggles","type":"list"},"requires":"reasoning","prompt":"Extract recurring user struggles and desired progress from the signals. Respond in {{locale.outputLanguage}}.\n\n{{input.signals}}\n\nBe concrete. Prefer named actors, numbers, and falsifiable statements over general advice.","demo":["Teams need reliable weekly evidence for audit deadlines","Initial setup friction blocks time-to-value","Downstream workflow breakage causes trust loss","Automation of repetitive compliance tasks predicts retention"]},{"id":"clarify","title":"What did they hire it to replace?","intent":"The run pauses here. Without this answer the later diagnosis is guessing.","inputs":["struggles"],"output":{"name":"clarification","type":"prose"},"requires":"fast","ask":{"label":"What was the previous way of doing this job?","placeholder":"e.g. A weekly spreadsheet emailed to three managers…"},"prompt":"If the user has not answered, ask what prior process or tool this product was hired to replace. Respond in {{locale.outputLanguage}}.\n\n{{struggles}}","demo":"A shared spreadsheet updated every Friday, then summarized in a Monday standup. Nobody trusted the numbers by Wednesday."},{"id":"jtbd-statement","title":"Actual Job Statement","intent":"Form a direct JTBD statement grounded in observed behavior, not marketing language.","inputs":["struggles","input.signals","clarification"],"output":{"name":"jtbd","type":"prose"},"requires":"reasoning","prompt":"Write one primary jobs-to-be-done statement using the struggles and behavioral signals. Respond in {{locale.outputLanguage}}.\n\nstruggles:\n{{struggles}}\n\nsignals:\n{{input.signals}}\n\nclarification:\n{{clarification}}","demo":"Customers hire this product to produce audit-ready evidence on a repeatable schedule with minimal manual prep, so compliance reporting does not interrupt operating work or create deadline risk."},{"id":"evidence-map","title":"Evidence and Alternatives","intent":"Map behavioral evidence to the JTBD and identify what alternatives users switch to when the job fails.","inputs":["jtbd","input.signals"],"output":{"name":"evidenceMap","type":"table"},"requires":"reasoning","prompt":"Build a table linking evidence to the JTBD and likely alternative when unmet. Respond in {{locale.outputLanguage}}.\n\nJTBD:\n{{jtbd}}\n\nSignals:\n{{input.signals}}","demo":{"cols":["Evidence","Supports JTBD claim","Fallback alternative"],"rows":[["Usage spikes before weekly audits","Product is hired for deadline reliability","Manual spreadsheet assembly"],["Retained accounts automate exports quickly","Automation is central to value realization","BI script plus analyst handoffs"],["Churn linked to setup complexity","Time-to-value is part of the core job","Simpler but less complete competitor tool"],["Switches when export formatting breaks","Workflow continuity matters as much as insight","Custom internal reporting pipeline"]]}}],"featured":true},{"id":"true-first","schemaVersion":"1.2.0","realm":"tech","concept":"plan","persona":"product","title":"What Has to Be True First","blurb":"Builds a dependency-first launch plan that orders work by what must become true before launch can safely proceed.","teaches":"Convert launch ambition into dependency events with explicit rationale and sequence.","tags":["product","tech","plan","launch","dependencies"],"input":{"id":"launch","label":"Launch Plan Draft","placeholder":"Paste launch goals and constraints.","seed":"We want to launch API usage alerts by end of month for enterprise accounts. Current blockers include noisy event streams, unfinished alert templates, and unclear on-call ownership. Sales has two late-stage deals waiting on this feature."},"cells":[{"id":"assumptions","title":"Critical Assumptions","intent":"Name assumptions that must be validated before launch sequencing is credible.","inputs":["input.launch"],"output":{"name":"truths","type":"list"},"requires":"reasoning","prompt":"Extract the assumptions that must hold true for a safe and useful launch. Respond in {{locale.outputLanguage}}.\n\n{{input.launch}}\n\nBe concrete. Prefer named actors, numbers, and falsifiable statements over general advice.","demo":["Event stream quality can support actionable alerts","Alert templates are complete for top enterprise use cases","On-call ownership and escalation path are defined","Pilot accounts can validate alert relevance before GA"]},{"id":"dependency-timeline","title":"Dependency Timeline","intent":"Order prerequisite events by dependency so launch date reflects real readiness.","inputs":["truths","input.launch"],"output":{"name":"dependencyPlan","type":"timeline"},"requires":"reasoning","prompt":"Create a dependency-first timeline from prerequisites to launch decision. Respond in {{locale.outputLanguage}}.\n\ntruths:\n{{truths}}\n\nlaunch:\n{{input.launch}}","demo":{"events":[{"when":"Week 1","what":"Stabilize event stream and define alert quality threshold","why":"Noisy signals invalidate downstream template work"},{"when":"Week 2","what":"Finalize template set for top five enterprise scenarios","why":"Templates are required to prove customer-visible value"},{"when":"Week 3","what":"Run pilot with two enterprise design partners","why":"Pilot feedback de-risks false positives before broad release"},{"when":"Week 4","what":"Confirm on-call runbook and launch go/no-go review","why":"Operational ownership must be true before external launch"}]}},{"id":"launch-gate","title":"Launch Gate","intent":"Set a final gate decision tied to dependency completion and required revision if blocked.","inputs":["dependencyPlan","truths"],"output":{"name":"gateResult","type":"gate"},"gate":{"to":"dependency-timeline","writes":"launchGate","maxPasses":2},"requires":"reasoning","prompt":"Issue a launch gate verdict based on dependency completion, with reason and required revision if not ready. Respond in {{locale.outputLanguage}}.\n\nTimeline:\n{{dependencyPlan}}\n\nTruths:\n{{truths}}","demo":{"verdict":"revise","reason":"Pilot evidence and on-call ownership are not yet complete, so launch readiness is unproven.","revision":"Hold GA date, complete pilot success criteria, and rerun gate after runbook sign-off."}}],"featured":true},{"id":"should-this-go-up","schemaVersion":"1.2.0","realm":"business","concept":"compare","persona":"manager","title":"Should This Go Up","blurb":"Compares escalation paths with cost and consequence so you escalate intentionally, not reactively — then leaves you with a concrete next step you can take without re-reading the model output.","teaches":"Separate urgency from importance and pick the least expensive path that still protects outcome.","tags":["manager","business","compare","escalation","decision"],"input":{"id":"issue","label":"Issue to Escalate","placeholder":"Describe the issue and current context.","seed":"A partner integration has slipped twice, and the partner lead is now asking for executive involvement. Our engineering manager believes one more week can recover without executive attention. Sales says the account may churn if we miss the next milestone."},"cells":[{"id":"escalation-frame","title":"Escalation Factors","intent":"Lay out impact, timeline risk, and local resolution odds before choosing an escalation path.","inputs":["input.issue"],"output":{"name":"factors","type":"table"},"requires":"reasoning","prompt":"Extract key decision factors: business impact, time sensitivity, local ownership health, and downside of delay. Respond in {{locale.outputLanguage}}.\n\n{{input.issue}}","demo":{"cols":["Factor","Observation","Decision weight"],"rows":[["Business impact","Potential account churn","High"],["Time sensitivity","Next milestone is critical","High"],["Local recovery odds","Team believes one-week recovery possible","Medium"],["Cost of over-escalation","Can damage working trust","Medium"]]}},{"id":"pick-path","title":"Escalation Choice","intent":"Offer clear escalation options with explicit cost so a single path can be selected.","inputs":["factors"],"output":{"name":"decision","type":"choice"},"choice":{"writes":"picked"},"requires":"reasoning","prompt":"Based on factors, present escalation options with cost and select none automatically. Respond in {{locale.outputLanguage}}.\n\n{{factors}}\n\nBe concrete. Prefer named actors, numbers, and falsifiable statements over general advice.","demo":{"options":[{"id":"a","label":"Keep at manager level for 5 business days","cost":"Low","note":"Preserves team ownership but risks another visible miss"},{"id":"b","label":"Escalate to director for cross-team unblock now","cost":"Medium","note":"Adds authority while keeping escalation one level up"},{"id":"c","label":"Escalate to VP and involve partner executives immediately","cost":"High","note":"Fastest pressure path but highest coordination overhead"}],"selected":null}},{"id":"next-message","title":"Message to Send","intent":"Draft the immediate communication tied to the selected escalation path.","inputs":["picked","factors"],"output":{"name":"message","type":"prose"},"requires":"reasoning","prompt":"Draft a short, direct message aligned to the selected option in picked and grounded in factors. If picked is null, provide a neutral hold message. Respond in {{locale.outputLanguage}}.\n\npicked:\n{{picked}}\n\nfactors:\n{{factors}}","demo":"Given the account churn risk and milestone timing, I am escalating this to director level today to secure cross-team support while keeping execution ownership with the delivery team. We will return with a recovery plan and daily checkpoint cadence by tomorrow 10am."}],"featured":true},{"id":"ten-headlines","schemaVersion":"1.2.0","realm":"writing","concept":"generate","persona":"marketer","title":"Ten Headlines, Three Strategies","blurb":"Generate headline options by strategy, then evaluate which strategy earns testing priority — then leaves you with a concrete next step you can take without re-reading the model output.","teaches":"Generate — options worth choosing between","tags":["headlines","generation","strategy","writing"],"input":{"id":"offer","label":"Offer and audience","placeholder":"Describe your offer and who it is for.","seed":"Offer: automated reporting for B2B SaaS teams.\nconstraint: Be specific enough that two colleagues would disagree about the next step — that disagreement is the point of this notebook (Offer and audience)."},"cells":[{"id":"strategies","title":"Strategies","intent":"Three strategies worth writing headlines for — not ten random angles.","inputs":["input.offer"],"output":{"name":"strategies","type":"list"},"requires":"reasoning","prompt":"Write in {{locale.outputLanguage}}. From {{input.offer}}, produce exactly 3 headline strategies.\n\nBe concrete. Prefer named actors, numbers, and falsifiable statements over general advice.","demo":["speed-to-insight","cost-efficiency","decision-confidence"]},{"id":"headline-map","title":"Headline Map","intent":"Headlines per strategy, so you can judge the strategy not the line.","inputs":["strategies"],"output":{"name":"headlinemap","type":"list"},"requires":"reasoning","prompt":"Write in {{locale.outputLanguage}}. For {{strategy}}, produce 3-4 headlines rooted in {{input.offer}}.\n\nstrategies:\n{{strategies}}\n\nBe concrete. Prefer named actors, numbers, and falsifiable statements over general advice.","demo":["Speed-to-insight: Weekly reports in minutes, not Mondays.","Speed-to-insight: See pipeline changes before your standup.","Cost-efficiency: Automated reporting without another analytics hire.","Cost-efficiency: Reduce manual reporting hours by half.","Decision-confidence: Reports you can trust before you present.","Decision-confidence: Make budget calls with cleaner numbers."],"map":{"over":"strategies","as":"strategy"}},{"id":"strategy-rank","title":"Strategy Rank","intent":"Rank strategies by clarity, distinctiveness, and proof-readiness.","inputs":["headlinemap"],"output":{"name":"strategyrank","type":"ranking"},"requires":"reasoning","prompt":"Write in {{locale.outputLanguage}}. Rank strategies from {{strategies}} using examples from {{headline-map.output}}.\n\nheadlinemap:\n{{headlinemap}}","demo":{"criteria":["clarity","distinctiveness","proof-readiness"],"items":[{"name":"speed-to-insight","scores":{"clarity":5,"distinctiveness":4,"proof-readiness":4},"total":13,"note":"Concrete time claim can be tested quickly."},{"name":"cost-efficiency","scores":{"clarity":4,"distinctiveness":3,"proof-readiness":5},"total":12,"note":"Strong if labor-hour evidence is available."},{"name":"decision-confidence","scores":{"clarity":3,"distinctiveness":4,"proof-readiness":3},"total":10,"note":"Needs clearer proof mechanism."}]}}],"featured":true},{"id":"write-a-notebook","schemaVersion":"1.2.0","realm":"learning","concept":"teach","persona":"scholar","featured":true,"title":"Write a Notebook","blurb":"Turns a capability you want someone to feel into a Throughline notebook — cell by cell — and emits paste-ready JSON. This is how the library grows.","teaches":"Teach — authorship as a runnable pipeline","tags":["authoring","dogfood","schema","library"],"input":{"id":"capability","label":"The capability to make legible","placeholder":"One sentence: what should someone understand after running this?","seed":"A hiring manager should feel the difference between a polished job description and the operating needs the team actually has — then leave with interview questions aimed at those needs."},"cells":[{"id":"move","title":"Name the move","intent":"Every notebook teaches one kind of thinking. If you cannot name it, you do not have a notebook yet.","inputs":["input.capability"],"output":{"name":"move","type":"table"},"requires":"reasoning","prompt":"From this capability, propose: title, persona, realm, concept (critique|extract|diagnose|generate|compare|plan|translate|teach), one-line teaches, and the single input the user must bring. Return a table with columns Field, Value. Respond in {{locale.outputLanguage}}.\n\n{{input.capability}}","demo":{"cols":["Field","Value"],"rows":[["title","What This Role Actually Needs"],["persona","people"],["realm","business"],["concept","extract"],["teaches","Extract — strip job-ad language to operating needs"],["input","Job req plus what the team is failing at today"]]}},{"id":"shape","title":"Pick the shape","intent":"Linear prose is the default. Gate, choice, map, and ask exist for when the capability is the control flow.","inputs":["move","input.capability"],"output":{"name":"shape","type":"choice"},"choice":{"writes":"pickedShape"},"requires":"reasoning","prompt":"Choose the notebook shape that best teaches this capability. Options must include cost. Do not auto-select. Respond in {{locale.outputLanguage}}.\n\n{{move}}\n\n{{input.capability}}","demo":{"options":[{"id":"linear","label":"Linear — three cells, typed handoffs","cost":"Lowest","note":"Default. Use when reading top to bottom already teaches the move."},{"id":"choice","label":"Choice — force a pick with cost before the last cell","cost":"Medium","note":"When the capability is deciding, not summarizing."},{"id":"gate","label":"Gate — loop until the work holds","cost":"Higher","note":"When failure to revise is the failure mode."},{"id":"ask","label":"Ask — pause for a human fact the model must not invent","cost":"Medium","note":"When a later cell is garbage without one answer only the user has."},{"id":"map","label":"Map — run one prompt per item in a list","cost":"Medium","note":"When the capability is coverage across items, not one answer."}],"selected":null}},{"id":"cells","title":"Draft the cells","intent":"Each cell needs intent (why it exists), typed output, and a prompt that interpolates prior bag keys.","inputs":["pickedShape","move","input.capability"],"output":{"name":"cellDraft","type":"markdown"},"requires":"reasoning","prompt":"Draft 3–5 cells for this notebook. For each cell give: id, title, intent (one sentence), output type (prose|list|table|markdown|score|diff|ranking|timeline|choice|gate), inputs (bag keys), and a prompt that interpolates locale.outputLanguage and every input bag key. Honor the selected shape ({{pickedShape}}): if choice/gate/ask/map, include that control on the appropriate cell. Respond in {{locale.outputLanguage}}.\n\nshape:\n{{pickedShape}}\n\nmove:\n{{move}}\n\ncapability:\n{{input.capability}}","demo":"### c1 strip\n- type: prose · inputs: input.brief\n- intent: Rewrite the job req as blunt operating needs.\n- prompt: includes the brief via template\n\n### success-ask\n- type: prose · ask · inputs: c1\n- intent: Pause for what must be true in 90 days.\n\n### c2 evidence\n- type: table · inputs: c1, success\n\n### c3 interview\n- type: list · inputs: c2, success"},{"id":"quality","title":"Quality gate","intent":"If the draft would not teach anything as static text, send it back — runtime cannot rescue a thin notebook.","inputs":["cellDraft","move","pickedShape"],"output":{"name":"quality","type":"gate"},"gate":{"to":"cells","writes":"revision","maxPasses":2},"requires":"reasoning","prompt":"Judge whether this notebook draft would be compelling as static text and correctly uses the chosen shape. Verdict pass or revise. If revise, say what cell or input must change. Respond in {{locale.outputLanguage}}.\n\ndraft:\n{{cellDraft}}\n\nmove:\n{{move}}\n\nshape:\n{{pickedShape}}","demo":{"verdict":"pass","reason":"The ask is load-bearing, intents explain why each cell exists, and the input is specific enough to run.","revision":""}},{"id":"emit","title":"Emit library JSON","intent":"Paste-ready notebook object matching Throughline schema 1.2.0 — demos included.","inputs":["quality","cellDraft","move","pickedShape","input.capability"],"output":{"name":"notebookJson","type":"markdown"},"requires":"reasoning","prompt":"Emit a single Throughline notebook as a markdown fenced json block. Required fields: id, schemaVersion (1.2.0), realm, concept, persona, title, blurb, teaches, tags, input {{id,label,placeholder,seed}}, cells[{{id,title,intent,inputs,output,requires,prompt,demo}}]. Include choice/gate/ask/map keys where the shape needs them. Demos must match output types. Prompts must interpolate every declared input. Respond in {{locale.outputLanguage}}.\n\ngate:\n{{quality}}\n\ndraft:\n{{cellDraft}}\n\nmove:\n{{move}}\n\nshape:\n{{pickedShape}}\n\ncapability:\n{{input.capability}}","demo":"```json\n{\n  \"id\": \"role-operating-needs\",\n  \"schemaVersion\": \"1.2.0\",\n  \"realm\": \"business\",\n  \"concept\": \"extract\",\n  \"persona\": \"people\",\n  \"title\": \"What This Role Actually Needs\",\n  \"blurb\": \"Strip job-ad language to operating needs, ask what 90-day success looks like, then draft interview prompts.\",\n  \"teaches\": \"Extract — then ask before you hire\",\n  \"tags\": [\"hiring\", \"people\"],\n  \"input\": {\"id\": \"brief\", \"label\": \"Job req and team state\", \"placeholder\": \"Paste the JD and what is failing today.\", \"seed\": \"…\"},\n  \"cells\": []\n}\n```"}]},{"id":"feedback-usable","schemaVersion":"1.2.0","realm":"business","concept":"teach","persona":"people","featured":true,"title":"Make This Feedback Usable","blurb":"Turns vague praise or criticism into observable behaviors, a weekly practice, and the four questions that force the giver to mean something specific.","teaches":"Teach — translate fog into something a person can practice","tags":["feedback","people","management"],"input":{"id":"brief","label":"The vague feedback and the role it landed in","placeholder":"Paste the phrase exactly, plus role, level, and what was happening in the review.","seed":"feedback: \"You need to be more strategic.\"\nrole: Mid-level product manager, three years in seat.\ncontext: Annual review. Strong execution scores. Promotion held for \"strategic altitude.\" Manager could not name a decision they wished this person had owned."},"cells":[{"id":"decode","title":"Decode the fog","intent":"Vague feedback usually names a missing altitude, not a missing skill. Name what the phrase is almost saying.","inputs":["input.brief"],"output":{"name":"decode","type":"prose"},"requires":"reasoning","prompt":"Read the feedback and context. Restate what the giver is almost saying — the missing altitude, ownership, or judgment — without inventing praise or punishment. Respond in {{locale.outputLanguage}}.\n\n{{input.brief}}","demo":"\"More strategic\" here means: stop waiting for a framed problem. The manager wants this PM to name the trade-off before the roadmap meeting, pick a bet with a kill criterion, and defend it without escalating every ambiguity upstairs. Execution is not the issue — initiation and framing are."},{"id":"behaviors","title":"Observable translation","intent":"If it cannot be seen in a week, it is still fog. Behavior, evidence, practice — one row each.","inputs":["decode","input.brief"],"output":{"name":"behaviors","type":"table"},"requires":"reasoning","prompt":"Translate the decoded feedback into a table: vague phrase, observable behavior, what evidence would count in two weeks, weekly practice. Respond in {{locale.outputLanguage}}.\n\n{{decode}}\n\n{{input.brief}}","demo":{"cols":["Vague phrase","Observable behavior","Evidence in two weeks","Weekly practice"],"rows":[["More strategic","Opens planning with a one-page bet: problem, option cut, kill criterion","Two bets written before roadmap, one kill criterion used","Friday: draft next week's framing page before standups"],["More strategic","Names the customer segment the work is for — and who it is not for","Every PRD has an explicit non-goal audience","Add a 'not for' line to every brief before sharing"],["More strategic","Escalates only after stating a recommendation","Slack escalations include 'I recommend X because…'","Rewrite one escalation per week to lead with the call"]]}},{"id":"align","title":"Force alignment","intent":"The giver must confirm the translation. Without this, you practiced the wrong thing.","inputs":["behaviors","decode"],"output":{"name":"align","type":"list"},"requires":"reasoning","prompt":"Write four clarifying questions that force the feedback-giver to confirm or correct this translation. Make them specific to the table. Respond in {{locale.outputLanguage}}.\n\n{{behaviors}}\n\n{{decode}}","demo":["If I open the next two roadmap meetings with a one-page bet and a kill criterion, does that count as 'more strategic' — or do you mean something else?","Which recent decision do you wish I had owned end-to-end, and what would owning it have looked like on calendar?","When I escalate with a recommendation first, is that the altitude you want — or do you still want me to bring options only?","In ninety days, what single artifact would convince you this feedback is resolved?"]},{"id":"commit","title":"Pick the practice","intent":"One practice beats three aspirations. Choose what you will actually do for two weeks.","inputs":["align","behaviors"],"output":{"name":"commit","type":"choice"},"requires":"reasoning","prompt":"Offer three two-week practices drawn from the translation. Each needs cost in hours and what evidence it produces. Do not auto-select. Respond in {{locale.outputLanguage}}.\n\n{{behaviors}}\n\n{{align}}","demo":{"options":[{"id":"bets","label":"Two framing bets before every roadmap","cost":"~90 min / week","note":"Highest signal if initiation was the real gap."},{"id":"nongoal","label":"Explicit 'not for' on every brief","cost":"~20 min / brief","note":"Cheaper; tests whether focus was the issue."},{"id":"escalate","label":"Lead every escalation with a recommendation","cost":"Habit only","note":"Use if judgment-under-ambiguity was the complaint."}],"selected":null},"choice":{"writes":"picked"}},{"id":"contract","title":"Two-week contract","intent":"A short note you can send the manager — practice, evidence, check-in date.","inputs":["picked","behaviors","align"],"output":{"name":"contract","type":"prose"},"requires":"reasoning","prompt":"Write a short two-week contract to the feedback-giver based on the selected practice. Include what you will do, what evidence they will see, and when you will review. Respond in {{locale.outputLanguage}}.\n\npicked:\n{{picked}}\n\n{{behaviors}}\n\n{{align}}","demo":"For the next two weeks I will open both roadmap sessions with a one-page bet that names the problem, the option I cut, and a kill criterion. You will see those pages in the invite agenda. We review on the 21st: if those bets are not the 'strategic' you meant, we rewrite the feedback that day — I will not keep practicing a guess."}]},{"id":"who-bears-risk","schemaVersion":"1.2.0","realm":"money","concept":"extract","persona":"operator","featured":true,"title":"Who Bears the Risk","blurb":"Pulls liability, indemnity, payment, and termination clauses out of \"standard\" contract language, shows who eats the failure, and names the five redlines worth spending political capital on.","teaches":"Extract — standard paper still assigns the downside","tags":["contracts","procurement","risk","money"],"input":{"id":"context","label":"Contract clauses and what the deal is for","placeholder":"Paste liability, indemnity, payment, SLA, and termination sections — plus deal value and what breaks if the vendor fails.","seed":"deal: Annual SaaS for customer-support tooling, $180k ARR, 400 seats. We are the customer.\nclauses:\n- Liability capped at fees paid in the prior 12 months; excludes data breach \"to the extent permitted by law.\"\n- We indemnify vendor for misuse by our agents; vendor indemnifies us only for IP claims.\n- Payment net 15; late fees 1.5%/month; auto-renew 30-day notice.\n- SLA 99.5% monthly; credits capped at 10% of monthly fee; sole remedy.\n- Termination for convenience: customer 90 days; vendor 30 days.\nfailure mode we fear: Ticket history export fails during a migration week; agents lose context on VIP accounts."},"cells":[{"id":"c1-clauses","title":"Risk clauses on the table","intent":"Extract only the language that moves money or operational pain when something fails.","inputs":["input.context"],"output":{"name":"clauses","type":"table"},"requires":"reasoning","prompt":"Extract clauses that allocate financial or operational risk. Table columns: Clause, Who benefits if it fires, Downside for us, How often it could fire. Respond in {{locale.outputLanguage}}.\n\n{{input.context}}","demo":{"cols":["Clause","Who benefits","Downside for us","Fire frequency"],"rows":[["Liability cap = prior 12 months fees","Vendor","Breach or outage above ~$180k is our loss","Rare, catastrophic"],["Breach carved out of cap \"where permitted\"","Ambiguous — often vendor","May still leave us holding notification cost","Low probability, high cost"],["We indemnify misuse; they only do IP","Vendor","Agent error becomes our unlimited problem","Medium"],["SLA credits capped at 10% month","Vendor","Migration-week outage barely compensated","Medium"],["Vendor can terminate in 30 days","Vendor","Forced re-platform under duress","Low, leverage-heavy"]]}},{"id":"c2-allocation","title":"Who eats the realistic failure","intent":"Pick the failure mode that actually happens — not the courtroom hypothetical — and say who pays.","inputs":["clauses","input.context"],"output":{"name":"allocation","type":"prose"},"requires":"reasoning","prompt":"Summarize who bears the largest downside under the realistic failure scenario in the input. Be concrete about money and operations. Respond in {{locale.outputLanguage}}.\n\n{{clauses}}\n\n{{input.context}}","demo":"Under a migration-week export failure, we eat almost everything: VIP context loss, overtime, customer goodwill, and any consequential churn. SLA credits top out around $1.5k for a month that could cost a six-figure account. The liability cap and narrow vendor indemnity mean the vendor's worst day is a fee refund; ours is operational and reputational. On this paper, we are the insurance policy."},{"id":"c3-redlines","title":"Five redlines worth the fight","intent":"Not a wish list — the smallest set of changes that rebalance the failure you actually fear.","inputs":["allocation","clauses"],"output":{"name":"redlines","type":"list"},"requires":"reasoning","prompt":"List the top five redline asks that rebalance risk for the realistic failure mode, ordered by leverage-to-effort. Respond in {{locale.outputLanguage}}.\n\n{{allocation}}\n\n{{clauses}}","demo":["Carve data-export and migration failures out of the SLA credit cap — require a recovery runbook and a defined restore window.","Raise liability for confidentiality/data events to a fixed multiple (e.g. 3× ARR) or uncapped for willful breach.","Mutualize indemnity for claims arising from vendor negligence in hosting or subprocessors — not only IP.","Customer termination for convenience at 30 days to match vendor; or vendor termination only for cause.","Delete auto-renew trap: require affirmative renewal or 60-day notice with calendar reminder obligation on vendor."]},{"id":"spend-capital","title":"Where to spend political capital","intent":"You will not win all five. Choose the two worth burning favor on.","inputs":["redlines","allocation"],"output":{"name":"spend","type":"choice"},"requires":"reasoning","prompt":"Offer three packages of redlines (pairs or singles) with political cost. Do not auto-select. Respond in {{locale.outputLanguage}}.\n\n{{redlines}}\n\n{{allocation}}","demo":{"options":[{"id":"ops","label":"Export/migration carve-out + restore window","cost":"Low — vendor ops can usually give this","note":"Matches the failure you named; highest practical value."},{"id":"liability","label":"Data-event liability multiple + mutual negligence indemnity","cost":"High — legal will resist","note":"Worth it if VIP data sensitivity is real."},{"id":"exit","label":"Symmetric termination + kill auto-renew","cost":"Medium","note":"Leverage play; use if switching costs are your real fear."}],"selected":null},"choice":{"writes":"picked"}},{"id":"ask-mail","title":"The ask to send","intent":"A short note to vendor counsel/AE that names the package without sounding like a rewrite of the MSA.","inputs":["picked","redlines","allocation"],"output":{"name":"askmail","type":"prose"},"requires":"reasoning","prompt":"Draft a short commercial ask aligned to the selected package. Calm, specific, deal-preserving. Respond in {{locale.outputLanguage}}.\n\npicked:\n{{picked}}\n\n{{redlines}}\n\n{{allocation}}","demo":"We are aligned on commercial terms and want to sign this week. One operational gap blocks us: migration-week export failure is our realistic risk, and today's SLA credit cap leaves us unprotected. Please carve data-export/migration failures out of the 10% credit cap, add a documented restore window, and confirm a joint runbook before go-live. Happy to take the rest of the paper as marked if we close that gap."}]},{"id":"wrong-model","schemaVersion":"1.2.0","realm":"learning","concept":"teach","persona":"scholar","featured":true,"title":"The Wrong Model They Arrive With","blurb":"Names the misconception model a learner brings in, maps why it feels true, and gives diagnostic prompts that surface it in the first ten minutes — before you teach the right model into a conflict.","teaches":"Teach — diagnose the model before you deliver the lecture","tags":["pedagogy","misconception","learning"],"input":{"id":"brief","label":"Topic and the wrong line students keep arriving with","placeholder":"Name the topic, the exact wrong sentence, and where you hear it (exam, office hours, forum).","seed":"topic: Natural selection\ncommonLine: \"Animals evolve because they need to survive.\"\nwhereHeard: Intro bio midterm short answers; also office hours after lecture 4.\nwhatYouTaught: Variation, heritability, differential survival — in that order.\nfrustration: Students can recite the steps and still write the need-sentence on the exam."},"cells":[{"id":"c1","title":"Name the incoming model","intent":"Not the wrong fact — the coherent wrong theory underneath it.","inputs":["input.brief"],"output":{"name":"c1","type":"prose"},"requires":"reasoning","prompt":"Describe the misconception model behind the student statement — its internal logic, not just that it is wrong. Respond in {{locale.outputLanguage}}.\n\n{{input.brief}}","demo":"This is an intention model of adaptation: organisms change because need directs change, the way a person practices a skill. Variation is treated as a response to pressure, not as raw material that precedes it. The model feels moral and agentive — which is why reciting \"variation then selection\" does not displace it."},{"id":"c2","title":"Misconception map","intent":"Belief, why it feels true, and the hinge that breaks it.","inputs":["c1","input.brief"],"output":{"name":"c2","type":"table"},"requires":"reasoning","prompt":"Table: student belief, why intuitive, corrective hinge (the smallest idea that breaks it). Respond in {{locale.outputLanguage}}.\n\n{{c1}}\n\n{{input.brief}}","demo":{"cols":["Student belief","Why intuitive","Corrective hinge"],"rows":[["Need causes traits","Agency feels natural; effort→improvement in daily life","Variation exists before pressure; need cannot invent alleles"],["Individuals evolve within a lifetime","Personal growth analogy","Populations change frequencies; individuals live or die"],["The best traits always win","Simple progress story","Fitness is relative to environment — and environments move"],["Reciting steps means understanding","School rewards sequence memory","Ask them to predict a result when need and variation conflict"]]}},{"id":"c3","title":"Diagnostic prompts","intent":"Questions that make the wrong model speak out loud in the first ten minutes.","inputs":["c2","c1"],"output":{"name":"c3","type":"list"},"requires":"reasoning","prompt":"List five diagnostic prompts that surface this misconception early — usable in lecture or office hours. Respond in {{locale.outputLanguage}}.\n\n{{c2}}\n\n{{c1}}","demo":["Did the trait appear before the pressure, or because of it — and how would you tell?","If an individual \"needs\" a trait and dies without offspring, what happened to the need?","Name a trait that is useful in one environment and harmful in another. Who \"decided\"?","A population has no useful variation for a new toxin. Does need create it? What happens instead?","Rewrite \"animals evolve because they need to survive\" without using need, holder":"Bank balance, monthly burn, committed inflows, raise target, and what \"slip\" means in weeks.","seed":"cash in bank: $2.4M\nmonthly net burn: $310k (payroll 220, cloud 45, other 45)\ncommitted inflows: $80k ARR collections next 30 days already in forecast\nraise: targeting $8M seed extension; first close hoped in 9 weeks; no term sheet yet\npayroll growth: two offers out (+$28k/mo) starting next month if signed\nfear: raise slips to 16 weeks and offers land anyway"},"cells":[{"id":"runway","title":"Honest runway timeline","intent":"Months of runway are a slogan. Build the week-by-week cash story under the slip case.","inputs":["input.cash"],"output":{"name":"runway","type":"timeline"},"requires":"reasoning","prompt":"Build a cash timeline for the raise-slip case (use the longer slip if given). Events: cash milestones, hire landings, default-alive checkpoints. Respond in {{locale.outputLanguage}}.\n\n{{input.cash}}","demo":{"events":[{"when":"Week 0","what":"Cash $2.4M; burn $310k; offers unsigned","why":"Baseline before optimism"},{"when":"Week 4","what":"If offers accept: burn ≈ $338k; cash ≈ $1.45M","why":"Hiring is a burn decision disguised as recruiting"},{"when":"Week 9","what":"Hoped first close — treat as miss in slip case","why":"No term sheet means week 9 is not money"},{"when":"Week 12","what":"Cash ≈ $0.7M at elevated burn; <3 months left","why":"Board conversation becomes survival, not strategy"},{"when":"Week 16","what":"Default-dead without cut or bridge","why":"Slip case end-state"}]}},{"id":"call","title":"Cut, raise harder, or extend","intent":"Three paths with cost. Pick one before the calendar picks for you.","inputs":["runway","input.cash"],"output":{"name":"call","type":"choice"},"requires":"reasoning","prompt":"Present three paths: cut burn now, accelerate raise with bridge risk, or extend runway by delaying hires. Each needs cost. Do not auto-select. Respond in {{locale.outputLanguage}}.\n\n{{runway}}\n\n{{input.cash}}","demo":{"opti /* ═════════ packages/storage — swappable adapter (ENG-BRIEF §4.1)
   Nothing else in the app knows how persistence works. capabilities()
   is not decoration: the UI must tell the user honestly whether their
   data is durable (PRODUCT-BRIEF §6.3 / R9). ═════════ */

const MemoryAdapter = () => {
  const m = new Map();
  return {
    id:'memory', label:'Session memory',
    async list(){ return [...m.values()].map(d=>({id:d.id,title:d.title,updated:d.updated})) },
    async read(id){ return m.get(id) ?? null },
    async write(id,doc){ m.set(id,{...doc,id,updated:Date.now()}) },
    async remove(id){ m.delete(id) },
    capabilities:()=>({durable:false, external:false, label:'Nothing is kept. Closing the tab ends it.'})
  };
};

const IdbAdapter = () => {
  const DB='throughline', STORE='docs'; let dbp=null;
  const open = () => dbp ??= new Promise((res,rej)=>{
    const r = indexedDB.open(DB,1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE,{keyPath:'id'});
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  const tx = async (mode,fn) => { const db=await open(); return new Promise((res,rej)=>{
    const t=db.transaction(STORE,mode), q=fn(t.objectStore(STORE));
    q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); };
  let persisted = false;
  return {
    id:'idb', label:'This browser',
    async init(){ try{ persisted = await navigator.storage?.persist?.() ?? false; }catch{ persisted=false } },
    async list(){ return (await tx('readonly',s=>s.getAll())).map(d=>({id:d.id,title:d.title,updated:d.updated})) },
    async read(id){ return (await tx('readonly',s=>s.get(id))) ?? null },
    async write(id,doc){ await tx('readwrite',s=>s.put({...doc,id,updated:Date.now()})) },
    async remove(id){ await tx('readwrite',s=>s.delete(id)) },
    capabilities:()=>({ durable:persisted, external:false,
      label: persisted
        ? 'Stored in this browser, marked persistent. Still local to this device.'
        : 'Stored in this browser. The browser may clear it — export anything you want to keep.' })
  };
};

/* T2 (File System Access), T3 (Tauri FS + keychain) and T4 (self-hosted)
   implement this same interface. Feature-detect, never assume:
   const T2_AVAILABLE = typeof window.showDirectoryPicker === 'function'  // Chromium only */
const T2_AVAILABLE = typeof window.showDirectoryPicker === 'function';

/* ── Desktop shell bridge (Tauri) ─────────────────────────────────────
   Web stays unchanged. Desktop gains CORS-free fetch, a real folder on
   disk, and OS keychain — the three ceilings the browser cannot lift. */
const isDesktopShell = () =>
  window.__THROUGHLINE_SHELL__ === 'desktop'
  || !!(window.__TAURI_INTERNALS__ || window.__TAURI__);

const tauriCore = () => window.__TAURI__?.core ?? null;

async function desktopCaps(){
  const core = tauriCore();
  if (!core) return isDesktopShell()
    ? { shell:'desktop', cors:true, disk:true, keychain:true, version:'?' }
    : null;
  try { return await core.invoke('desktop_caps'); }
  catch { return { shell:'desktop', cors:true, disk:true, keychain:true, version:'?' }; }
}

/** Native fetch that bypasses CORS — Response with a live body stream. */
async function netFetch(url, init = {}){
  const core = tauriCore();
  if (!isDesktopShell() || !core?.invoke || !core.Channel) return fetch(url, init);

  const headers = {};
  if (init.headers){
    const h = init.headers instanceof Headers ? init.headers : new Headers(init.headers);
    h.forEach((v, k) => { headers[k] = v; });
  }
  const body = init.body == null ? null : String(init.body);

  return new Promise((resolve, reject) => {
    const onChunk = new core.Channel();
    let controller = null;
    let lastLen = 0;
    let settled = false;
    onChunk.onmessage = (msg) => {
      if (msg.kind === 'meta' && !settled){
        settled = true;
        const stream = new ReadableStream({ start(c){ controller = c; } });
        resolve(new Response(stream, {
          status: msg.status || 200,
          headers: { 'content-type': 'text/event-stream; charset=utf-8' }
        }));
      }
      if (msg.kind === 'text' && msg.text != null && controller){
        const add = msg.text.slice(lastLen);
        lastLen = msg.text.length;
        if (add) controller.enqueue(new TextEncoder().encode(add));
      }
      if (msg.kind === 'done'){
        if (msg.text != null && controller && msg.text.length > lastLen)
          controller.enqueue(new TextEncoder().encode(msg.text.slice(lastLen)));
        try { controller?.close(); } catch {}
      }
      if (msg.kind === 'error'){
        const err = new Error(msg.error || msg.text || 'native fetch failed');
        if (!settled) reject(err);
        else try { controller?.error(err); } catch {}
      }
    };
    core.invoke('native_fetch', {
      req: { url, method: init.method || 'GET', headers, body },
      onChunk
    }).catch(err => {
      if (!settled) reject(err);
      else try { controller?.error(err); } catch {}
    });
  });
}

const DiskAdapter = (rootPath) => {
  const core = () => tauriCore();
  const notebooksDir = () => `${rootPath.replace(/\/$/, '')}/notebooks`;
  return {
    id:'disk', label:'Folder on disk',
    async list(){
      const files = await core().invoke('list_json_files', { dir: notebooksDir() });
      const out = [];
      for (const path of files){
        try {
          const raw = await core().invoke('read_text_file', { path });
          if (!raw) continue;
          const doc = JSON.parse(raw);
          out.push({ id: doc.id || path.split('/').pop(), title: doc.title || path, updated: doc.updated || 0, path });
        } catch {}
      }
      return out;
    },
    async read(id){
      const path = `${notebooksDir()}/${id}.json`;
      try {
        const raw = await core().invoke('read_text_file', { path });
        return raw ? JSON.parse(raw) : null;
      } catch { return null; }
    },
    async write(id, doc){
      const path = `${notebooksDir()}/${id}.json`;
      const payload = { ...doc, id, updated: Date.now() };
      await core().invoke('write_text_file', { path, contents: JSON.stringify(payload, null, 2) });
    },
    async remove(id){
      const path = `${notebooksDir()}/${id}.json`;
      try { await core().invoke('write_text_file', { path, contents: '{}' }); } catch {}
    },
    capabilities:()=>({ durable:true, external:true, label:`On disk · ${rootPath}` }),
    rootPath
  };
};

async function desktopSaveKey(id, value){
  const core = tauriCore();
  if (!core) return;
  await core.invoke('save_secret_tracked', { provider: id, secret: value || '' });
}
async function desktopLoadKeys(){
  const core = tauriCore();
  if (!core) return;
  try {
    const ids = await core.invoke('list_secrets');
    for (const id of ids){
      const v = await core.invoke('load_secret', { provider: id });
      if (v) S.keys[id] = v;
    }
  } catch (e) { console.warn('keychain load', e); }
}
async function desktopExportRun(nb, run){
  const core = tauriCore();
  if (!core) return null;
  const root = await core.invoke('default_library_dir');
  const path = `${root}/runs/${nb.id}-${Date.now()}.json`;
  const payload = JSON.stringify({ notebook: nb.id, title: nb.title, at: Date.now(), bag: run.bag, cells: run.cells }, null, 2);
  await core.invoke('write_text_file', { path, contents: payload });
  return path;
}

const servesImage = id => !!PROVIDERS[id]?.classes.includes('image');
const servesVision = id => !!PROVIDERS[id]?.classes.includes('vision');

const TIER_RANK = { frontier:4, paid:3.5, free:3, local:2, device:1, demo:0, blocked:-1 };
const TIER_LABEL = { demo:'Ready now', device:'On your device', local:'On your machine',
  free:'Free', paid:'Paid', frontier:'Paid', blocked:'Not from a web page' };
const GROUPS = [
  {id:'nosetup', name:'Ready now, or nearly', note:'No account, no card, nothing to sign up for.'},
  {id:'free',    name:'Free, with a key',      note:'A key is free and takes about a minute to get.'},
  {id:'paid',    name:'Paid accounts',         note:'If you already have one.'}
];

/* Connected = usable right now. Demo always is; the on-device model is if the
   browser exposes it; downloaded HF models once loaded; everything else needs
   a key the user pasted. */
const builtIn = () => self.LanguageModel ?? self.ai?.languageModel ?? null;
const hasBuiltIn = () => !!builtIn();

/* Origins the local-download runtime reaches. Listed so check.sh can verify
   connect-src, and so CSP updates stay deliberate rather than tribal knowledge. */
const CSP_CONNECT = [
  'https://cdn.jsdelivr.net',
  'https://huggingface.co',
  'https://cdn-lfs.huggingface.co',
  'https://cdn-lfs-us-1.huggingface.co',
  /* HF Xet CDN — ONNX weights redirect here from huggingface.co/resolve/… */
  'https://us.aws.cdn.hf.co',
  'https://eu.aws.cdn.hf.co',
  /* Image generation. Bytes are fetched and turned into a data URL rather
     than rendered from a remote src, so img-src stays 'self' data:. */
  'https://image.pollinations.ai',
];

/* Curated Transformers.js / ONNX chat models. Ranked per device at runtime —
   phones get the tiny ones; WebGPU desktops can take the 1B. */
const LOCAL_MODELS = {
  smol135: {
    id:'smol135', hf:'HuggingFaceTB/SmolLM2-135M-Instruct', label:'SmolLM2 135M',
    size:'~90 MB', mb:90, dtype:'q4', needsGpu:false,
    blurb:'Smallest. Default on Android and iPhone so Run all stays responsive.' },
  smol360: {
    id:'smol360', hf:'HuggingFaceTB/SmolLM2-360M-Instruct', label:'SmolLM2 360M',
    size:'~250 MB', mb:250, dtype:'q4', needsGpu:false,
    blurb:'Better answers. Fine cell-by-cell on phones; prefer demo for Run all.' },
  qwen05: {
    id:'qwen05', hf:'onnx-community/Qwen2.5-0.5B-Instruct', label:'Qwen2.5 0.5B',
    size:'~400 MB', mb:400, dtype:'q4', needsGpu:false,
    blurb:'Stronger mid-size. Prefer on Android with headroom, or desktop without WebGPU.' },
  llama32: {
    id:'llama32', hf:'onnx-community/Llama-3.2-1B-Instruct-q4f16', label:'Llama 3.2 1B',
    size:'~800 MB', mb:800, dtype:'q4f16', needsGpu:true,
    blurb:'Best quality in this list. Needs WebGPU — desktop Chrome/Edge, some Androids.' }
