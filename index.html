/* ── Edits ───────────────────────────────────────────────────────────────
   A template you cannot change is a demo. Editing one forks it into YOUR
   copy — stored on this device, exportable as a file, resettable to the
   original at any time (P4: the notebook is a file, not a record).

   Overrides are stored as a sparse diff against the shipped notebook, not a
   full copy. So when a shipped notebook improves, your edits still apply to
   the new version instead of pinning you to the old one. */
const EDIT_DOC = 'edits';
const editsFor = id => S.edits[id] ?? {};
const isEdited = id => Object.keys(editsFor(id)).length > 0;

/* The effective cell: shipped definition with your overrides on top. Every
   read path goes through this, so nothing can accidentally use the original. */
function eff(nbId, cell){
  const o = editsFor(nbId)[cell.id];
  if (!o) return cell;
  return { ...cell, ...o,
    output: { ...cell.output, ...(o.outType ? {type:o.outType} : {}) } };
}

async function saveEdits(){
  try { await S.storage?.write(EDIT_DOC, {title:'Edits', items:S.edits}); }
  catch(e){ console.warn('edits not persisted', e); }
}
async function loadEdits(){
  try { S.edits = (await S.storage?.read(EDIT_DOC))?.items ?? {}; }
  catch { S.edits = {}; }
}
async function setEdit(nbId, cellId, patch){
  const nbEdits = S.edits[nbId] ??= {};
  const cur = nbEdits[cellId] ??= {};
  Object.assign(cur, patch);
  for (const [k,v] of Object.entries(cur)) if (v === null || v === '') delete cur[k];
  if (!Object.keys(cur).length) delete nbEdits[cellId];
  if (!Object.keys(nbEdits).length) delete S.edits[nbId];
  await saveEdits();
  render();
}
async function resetEdits(nbId){
  delete S.edits[nbId]; await saveEdits();
  delete S.runs[nbId];
  render();
}

/* ── Marks ───────────────────────────────────────────────────────────────
   Rating, stored on this device only. That is a real limitation and it
   changes what the feature is: you cannot see anyone else's marks, because
   there is no server that could hold them (P3). What you get instead is your
   own record of what worked, and a link to hand someone when it did — which
   makes showing off a combination a peer-to-peer act rather than a leaderboard.

   A mark captures the SETUP, not just the verdict, so "this worked" is
   reproducible rather than a memory. */
const MARK_DOC = 'marks';

async function loadMarks(){
  try { S.marks = (await S.storage?.read(MARK_DOC))?.items ?? {}; }
  catch { S.marks = {}; }
}
async function saveMark(nb, verdict, note){
  const run = getRun(nb);
  if (verdict === null) delete S.marks[nb.id];
  else S.marks[nb.id] = {
    verdict, note: note ?? '', at: Date.now(),
    setup: { brand:S.brand, locale:S.locale, provider:S.provider,
             input: run.bag['input.'+nb.input.id] ?? '' }
  };
  try { await S.storage?.write(MARK_DOC, {title:'Marks', items:S.marks}); }
  catch(e){ console.warn('mark not persisted', e); }
  render();
}
const markOf = nbId => S.marks?.[nbId];

/* Replays the setup a mark captured, so a remembered success is repeatable
   rather than merely recorded. */
function restoreMark(nb){
  const m = markOf(nb.id); if (!m?.setup) return;
  if (BRANDS[m.setup.brand]) S.brand = m.setup.brand;
  if (LOCALES[m.setup.locale]) S.locale = m.setup.locale;
  if (m.setup.provider === 'auto' || PROVIDERS[m.setup.provider]) S.provider = m.setup.provider;
  if (m.setup.input) getRun(nb).bag['input.'+nb.input.id] = m.setup.input;
  applyTheme();
}

function markHTML(nb){
  const m = markOf(nb.id);
  return `<section class="mark ${m?'marked':''}">
    <div class="mark-q">
      <strong>${m ? 'You marked this' : 'Did this work?'}</strong>
      <span class="hint">${m
        ? `Saved on this device ${esc(new Date(m.at).toLocaleDateString())} — with the brand, language, model and input you used.`
        : 'Kept on this device only. Nobody else sees it, because there is no server that could.'}</span>
    </div>
    <div class="mark-controls">
      <button class="btn secondary tiny ${m?.verdict==='works'?'on':''}" data-mark="works">Worked</button>
      <button class="btn secondary tiny ${m?.verdict==='mixed'?'on':''}" data-mark="mixed">Mixed</button>
      <button class="btn secondary tiny ${m?.verdict==='no'?'on':''}" data-mark="no">Didn't</button>
      ${m ? `<button class="btn secondary tiny" data-mark="clear">Clear</button>` : ''}
    </div>
    ${m ? `<input type="text" id="mark-note" class="mark-note" placeholder="What made it work? (optional)" value="${esc(m.note)}">` : ''}
  </section>`;
}

/* ── Shareable permutations ──────────────────────────────────────────────
   A combination worth showing off is: which notebook, which brand, which
   language, which model, and what you put in. All five fit in a URL, so the
   link is the record and nothing needs to be stored anywhere. */
const b64 = {
  /* Chunk the encode: spread into fromCharCode blows the arg limit on large
     Unicode pastes, which made Share throw instead of copying a link. */
  enc: str => {
    const bytes = new TextEncoder().encode(str);
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000)
      bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
    return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  },
  dec: str => { try{
    const b = atob(str.replace(/-/g,'+').replace(/_/g,'/'));
    return new TextDecoder().decode(Uint8Array.from(b, c=>c.charCodeAt(0)));
  }catch{ return ''; } }
};

/* The permutation goes in the query; the CONTENT goes in the fragment.
   That split is not cosmetic. A query string is transmitted with every
   request — it reaches the server, the access log, the analytics pipeline,
   and any Referer header the page emits. A fragment is never sent at all;
   it exists only in the recipient's browser.
   So which notebook, brand, language and model someone shared is legible
   (and is exactly the aggregate signal worth having), while what they typed
   into it is not. */
function shareURL(nb){
  const run = getRun(nb);
  const p = new URLSearchParams();
  p.set('n', nb.id);
  if (S.brand !== 'rams')  p.set('b', S.brand);
  if (S.locale !== 'en')   p.set('l', S.locale);
  if (S.provider !== 'auto') p.set('m', S.provider);
  const input = run.bag['input.'+nb.input.id] ?? '';
  const frag = (input && input !== nb.input.seed) ? `#i=${b64.enc(input)}` : '';
  return `${location.origin}${location.pathname}?${p}${frag}`;
}

function applyShareState(){
  const p = new URLSearchParams(location.search);
  if (p.get('b') && BRANDS[p.get('b')]) S.brand = p.get('b');
  if (p.get('l') && LOCALES[p.get('l')]) S.locale = p.get('l');
  if (p.get('m') && (p.get('m')==='auto' || PROVIDERS[p.get('m')])) S.provider = p.get('m');
  /* Share links can name a provider this client cannot use (e.g. chrome on
     a phone). Keep Auto so Run still works; the recipient can connect a key. */
  if (S.provider !== 'auto' && !isConnected(S.provider)) S.provider = 'auto';
  const nb = NOTEBOOKS.find(n => n.id === p.get('n'));
  if (nb){
    S.view = 'notebook'; S.nbId = nb.id;
    /* Read the input from the fragment. `?i=` is still honoured so links
       shared before this change keep working — but it is immediately
       rewritten out of the address bar, because leaving it there keeps
       feeding it to history and to any onward Referer. */
    const legacy = p.get('i');
    const frag = new URLSearchParams(location.hash.slice(1)).get('i');
    const text = b64.dec(frag ?? legacy ?? '');
    if (text) getRun(nb).bag['input.'+nb.input.id] = text;
    if (legacy){
      p.delete('i');
      history.replaceState(null, '', `${location.pathname}?${p}${text?`#i=${b64.enc(text)}`:''}`);
    }
  }
}

/* Whoever holds the link can read the input. That is the point of sharing,
   but it should be said once rather than assumed. */
/* Feedback floats above the layout rather than reflowing it. The earlier
   version injected an input into the button group, which pushed the last
   button onto a second line — feedback should never move the thing you
   just clicked. */
function sharePopover(anchor, url, copied){
  document.querySelector('.share-pop')?.remove();
  const has = url.includes('#i=');
  const el = document.createElement('div');
  el.className = 'share-pop';
  el.innerHTML = `
    <p class="share-status">${copied ? 'Link copied' : 'Copy this link'}</p>
    <input class="share-url" readonly value="${esc(url)}">
    <p class="share-hint">${has
      ? 'Carries your input in the fragment — kept out of server logs, but anyone with the link can read it.'
      : 'Setup only. Your input is not included.'}</p>`;
  anchor.closest('.doc-tools').appendChild(el);
  if (!copied) el.querySelector('.share-url').select();
  const close = e => { if (!el.contains(e.target)){ el.remove(); removeEventListener('click', close); } };
  setTimeout(()=>addEventListener('click', close), 0);
}

async function copyShare(nb, btn){
  const url = shareURL(nb);
  let copied = false;
  try { await navigator.clipboard.writeText(url); copied = true; }
  catch { /* refused in plenty of contexts — show the link instead */ }
  sharePopover(btn, url, copied);
}

/* ── Boot ───────────────────────────────────────────────────────────── */
/* Canvas content does not survive innerHTML, and the app re-renders on every
   state change. So scenes are repainted after each render from the camera in
   S — the same reason the run's values live in S rather than in the DOM. */
function paintScenes(){
  for (const canvas of view.querySelectorAll('[data-scene-canvas]')){
    const id = canvas.dataset.sceneCanvas;
    const nb = NOTEBOOKS.find(n => n.id === S.nbId);
    const value = nb && S.runs[nb.id]?.cells[id]?.value;
    if (!isSceneVal(value)) continue;
    const camera = S.scenes[id] ??= defaultView();
    drawScene(canvas, value, camera);
    let drag = null;
    canvas.onpointerdown = e => {
      drag = {x:e.clientX, y:e.clientY, yaw:camera.yaw, pitch:camera.pitch};
      canvas.setPointerCapture(e.pointerId);
    };
    canvas.onpointermove = e => {
      if (!drag) return;
      camera.yaw = drag.yaw + (e.clientX - drag.x) * 0.01;
      /* Clamp the pitch just short of the poles — past them the ground grid
         flips and the scene reads as upside down. */
      camera.pitch = Math.max(-1.45, Math.min(1.45, drag.pitch + (e.clientY - drag.y) * 0.01));
      drawScene(canvas, value, camera);
    };
    const stop = e => { drag = null; canvas.releasePointerCapture?.(e.pointerId); };
    canvas.onpointerup = stop; canvas.onpointercancel = stop;
    canvas.onwheel = e => {
      e.preventDefault();
      camera.zoom = Math.max(0.3, Math.min(6, camera.zoom * (e.deltaY > 0 ? 0.92 : 1.08)));
      drawScene(canvas, value, camera);
    };
  }
}
addEventListener('resize', () => { if (S.view === 'notebook') paintScenes(); });

function render(){
  const focus = document.activeElement?.id;
  const scroll = workspace.scrollTop;
  S.view === 'library' ? renderLibrary() : renderNotebook();
  renderSwitcher(); renderRail(); renderStatusbar();
  if (S.view !== 'library') paintScenes();
  if (focus === 'nb-input'){
    const ta = $('#nb-input');
    if (ta){ const end = ta.value.length; ta.focus(); ta.setSelectionRange(end,end); }
  }
  workspace.scrollTop = scroll;
}

$('#btn-model').onclick = e => {
  e.stopPropagation();
  const m = $('#model-menu');
  if (m.hidden) openMenu();
  else closeMenu();
};
$('#model-scrim')?.addEventListener('click', e => {
  e.stopPropagation();
  closeMenu();
});
addEventListener('click', e => {
  const m = $('#model-menu');
  if (!m || m.hidden) return;
  if (e.target.closest('.switch-wrap') || e.target.closest('#model-menu') || e.target.closest('#model-scrim')) return;
  closeMenu();
});
$('#home').onclick = () => { S.view='library'; S.nbId=null; render(); scrollTop(); };
$('#btn-look').querySelector('.ico').innerHTML = ICONS.look;
$('#btn-settings').querySelector('.ico').innerHTML = ICONS.plug;
$('#btn-look').onclick = () => { S.sheet = S.sheet==='look'?null:'look'; renderSheet(); };
$('#btn-settings').onclick = () => {
  S.sheet = S.sheet==='settings'?null:'settings';
  if (S.sheet==='settings' && !S.connectSel)
    S.connectSel = isMobileClient() ? 'localdl' : 'google';
  renderSheet();
};
addEventListener('keydown', e => { if (e.key==='Escape' && S.sheet){ S.sheet=null; renderSheet(); } });

(async function boot(){
  S.mode = resolveMode();
  new MutationObserver(() => { if (S.modePref==='system'){ S.mode = resolveMode(); applyTheme(); } })
    .observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (S.modePref==='system'){ S.mode = resolveMode(); applyTheme(); } });
  S.device = await deviceProfile();
  /* Phones default into the short shelf so exploration does not open on a
     looping notebook that freezes Run all with an on-device model. */
  if (isMobileClient() && F.pace == null) F.pace = 'phone';
  const rec = recommendLocalModel(S.device);
  if (!S.models.localdl) S.models.localdl = rec.id;
  await probeBuiltIn();
  /* On-device is the default when it is genuinely ready: free, no key, and
     nothing leaves the machine. Otherwise Auto, which falls back to the
     scripted demo so the library is never gated behind setup. */
  if (isConnected('chrome')) S.provider = 'chrome';
  else if (S.provider === 'chrome') S.provider = 'auto';
  if (!S.connectSel) S.connectSel = isMobileClient() ? 'localdl' : (isDesktopShell() ? 'gateway' : 'google');
  if (isDesktopShell() && tauriCore()){
    try {
      const root = await tauriCore().invoke('default_library_dir');
      S.storage = DiskAdapter(root);
      await desktopLoadKeys();
      S.desktop = await desktopCaps();
    } catch (e) {
      console.warn('desktop storage', e);
      try { const a = IdbAdapter(); await a.init(); S.storage = a; }
      catch { S.storage = MemoryAdapter(); }
    }
  } else {
    try { const a = IdbAdapter(); await a.init(); S.storage = a; }
    catch { S.storage = MemoryAdapter(); }
  }
  await loadMarks();
  await loadEdits();
  applyShareState();
  applyTheme(); render();
  loadLibrary(); /* async; re-renders when the full shelf arrives */
  /* Bind desktop-only actions that live outside the view root. */
  document.addEventListener('click', async (e) => {
    const btn = e.target.closest?.('#open-library-folder');
    if (!btn || !tauriCore()) return;
    try {
      const root = S.storage?.rootPath || await tauriCore().invoke('default_library_dir');
      await tauriCore().invoke('plugin:opener|open_path', { path: root }).catch(async () => {
        /* opener API shape varies — fall back to shell open via plugin */
        const { openPath } = window.__TAURI__?.opener || {};
        if (openPath) await openPath(root);
        else alert(`Library folder:\n${root}`);
      });
    } catch {
      alert(`Library folder:\n${S.storage?.rootPath || '~/Documents/Throughline'}`);
    }
  });
})();
</script>
