    inputs:['input.feedback'], output:{name:'themes', type:'table'}, requires:'reasoning',
    prompt:'Group this feedback into themes by underlying meaning. Give a count and the strongest verbatim for each. Return a table: Theme, Mentions, Representative quote. Respond in {{locale.outputLanguage}}.\n\n{{input.feedback}}',
    demo:()=>({cols:['Theme','Mentions','Representative quote'],rows:[
      ['Setup fails partway','3','"Setup instructions assume you already have an account"'],
      ['Export is undiscoverable','2','"I can never find the export button"'],
      ['Large files break it','2','"Large file handling is unusable, this is a dealbreaker"'],
      ['Pricing is unclear','2','"I still don\'t know what tier I\'m on"'],
      ['Docs are stale','2','"Docs are out of date in places"'],
      ['Dark mode','1','"Why is there no dark mode??"'],
      ['Wants an API','1','"Would pay double if it had an API"']]}) },
  { id:'signal', title:'Frequency is not importance',
    intent:'Separates what is mentioned most from what actually costs you something.',
    inputs:['themes'], output:{name:'signal', type:'prose'}, requires:'reasoning',
    prompt:'Distinguish frequently-mentioned issues from consequential ones. Say which themes are loud but cheap, and which are quiet but expensive. Respond in {{locale.outputLanguage}}.\n\n{{themes}}',
    demo:()=>'Setup is the most-mentioned and it is also genuinely the most costly, which is unusual — normally the loudest theme is not the most expensive one. Three mentions in fourteen, and every one describes a user who nearly did not get in at all. Everything downstream is conditional on this.\n\nLarge file handling is the quiet expensive one. Two mentions, but one of them says "dealbreaker" and the other says "unusable" — that is not a complaint, that is a churn event that already happened and got written down politely.\n\nThe API request is a single mention and worth more attention than its count suggests, because it is the only feedback here attached to willingness to pay more. One data point is not a strategy, but it is a question worth asking the next ten customers.\n\nDark mode is the reverse: emphatic, memorable, and cheap to ignore. It got two question marks and that is doing all the work.' },
  { id:'ignore', title:'The discard pile',
    intent:'Naming what you will not act on, and why, so it stops resurfacing in every meeting.',
    inputs:['themes','signal'], output:{name:'ignore', type:'list'}, requires:'reasoning',
    prompt:'List what should be deliberately not acted on, with the reason. Be willing to say a popular request should be declined. Respond in {{locale.outputLanguage}}.\n\n{{themes}}\n\n{{signal}}',
    demo:()=>['**"It\'s fine" and "Love it once it works."** No action available. Keep them for morale, exclude them from analysis — undifferentiated positives inflate your sense of how you are doing.',
      '**Dark mode, for now.** Real but not load-bearing. The honest reason is priority, not disagreement — say that out loud rather than letting it die silently, or it returns every quarter.',
      '**"Too expensive for what it does."** Not actionable as stated, and price complaints are usually value-communication complaints. It belongs with the pricing-clarity theme, not with pricing.',
      '**The onboarding video praise.** Genuinely good news, and a trap: the video works while the written setup fails, which means you may be tempted to make more videos instead of fixing the docs.'] }
  ]
},
{
  id:'difficult-message', schemaVersion:'1.0.0', realm:'business', concept:'translate', collection:'communication',
  title:'The Difficult Message',
  blurb:'Drafts something hard to say, then reads it back as the person receiving it on their worst day — and shows you which sentence does the damage.',
  teaches:'Adversarial reading of your own words', tags:['communication'], capability:'reasoning',
  input:{ id:'situation', label:'What you need to say, and to whom',
    placeholder:'The situation, plainly. You do not need to be diplomatic here.',
    seed:'I need to tell a contractor we are not renewing. Their work was fine but we are bringing it in-house. They have been with us two years and I think they assume this is going to be renewed. They have not done anything wrong.' },
  cells:[
  { id:'draft', title:'The plain draft',
    intent:'What you actually mean, before it gets softened into something that says nothing.',
    inputs:['input.situation'], output:{name:'draft', type:'markdown'}, requires:'fast',
    prompt:'Write this message directly and kindly. Lead with the decision. No euphemism, no padding. Respond in {{locale.outputLanguage}}.\n\n{{input.situation}}',
    demo:()=>'Hi —\n\nI want to tell you directly rather than let you find out from a silence: we are not renewing the contract when it ends. This is not about your work, which has been consistently good. We are moving this function in-house.\n\nI know you have been planning around this continuing, and I am sorry to be the reason that changes. I would like to give you as much runway as I can — the contract runs to the end of March, and I am happy to talk about how we use that time.\n\nI would also like to be a reference for you, and I mean that as a specific offer rather than a polite one.\n\nCan we talk this week?' },
  { id:'worst-read', title:'Read on their worst day',
    intent:'The same words, received by someone who is worried about money and half-expecting bad news.',
    inputs:['draft','input.situation'], output:{name:'worstRead', type:'table'}, requires:'reasoning',
    prompt:'For each part of this message, give the most damaging plausible reading by a recipient who is anxious and expecting bad news. Return a table: Sentence, How it may land. Respond in {{locale.outputLanguage}}.\n\n{{draft}}\n\n{{input.situation}}',
    demo:()=>({cols:['Sentence','How it may land'],rows:[
      ['"rather than let you find out from a silence"','Implies you considered doing exactly that. Reads as a favour rather than the baseline.'],
      ['"This is not about your work"','The sentence everyone hears as "this is about your work." Denial before accusation invites the accusation.'],
      ['"moving this function in-house"','Sounds cheaper and permanent. Reads as: you were the expensive stopgap.'],
      ['"I know you have been planning around this continuing"','Slightly presumptuous, and reminds them of the plans they now have to unmake.'],
      ['"as much runway as I can"','Hedged. "As I can" sounds like there is a constraint they have not been told about.'],
      ['"I mean that as a specific offer"','Good — the strongest line in the message, and the only one that costs you something.']]}) },
  { id:'revision', title:'The version that survives that reading',
    intent:'Not softer. The same decision, with the sentences that do collateral damage removed.',
    inputs:['draft','worstRead'], output:{name:'revision', type:'markdown'}, requires:'reasoning',
    prompt:'Rewrite so the damaging readings are not available, without softening the decision or adding padding. Respond in {{locale.outputLanguage}}.\n\n{{draft}}\n\n{{worstRead}}',
    demo:()=>'Hi —\n\nWe are not renewing the contract when it ends in March. I wanted to tell you now so you have the most time possible.\n\nThe decision is about where the work sits, not about how it has been done. We are building the capability internally, and that was decided above this contract rather than because of it. Your work has been good and I would say so to anyone who asked.\n\nOn that: I will be a reference, and I will write it this month rather than waiting to be asked.\n\nThe contract runs to 31 March and I am not looking to shorten it. If a shorter or longer wind-down suits you better, tell me and I will try to make it work.\n\nCan we talk this week?' },
  { id:'cost', title:'What this still costs',
    intent:'What no wording fixes. Knowing this stops you rewriting it a sixth time.',
    inputs:['revision','worstRead'], output:{name:'cost', type:'prose'}, requires:'reasoning',
    prompt:'State plainly what remains painful regardless of wording, and what the sender should accept rather than keep editing. Respond in {{locale.outputLanguage}}.\n\n{{revision}}\n\n{{worstRead}}',
    demo:()=>'They are losing income they were counting on, and no arrangement of sentences changes that. The revision removes the readings that would have added insult, which is the entire available win. It does not make the message good news and you should stop trying to.\n\nOne thing genuinely improved and it was not the wording: "I will write the reference this month rather than waiting to be asked" is a commitment with a date. The original offered to be a reference, which is what everyone says. This one can be checked.\n\nThe thing to accept: they may respond badly, and that will not mean you wrote it wrong. Two years of work ending is worth a bad reaction. Send it, then be available.' }
  ]
},
{ id:'flaky-test', realm:'tech', concept:'diagnose', title:'Why This Test Is Flaky',
  blurb:'Separates the four reasons a test fails intermittently, then tells you which one you have.',
  teaches:'Differential diagnosis', tags:['testing','debugging'], capability:'reasoning',
  input:{ id:'test', label:'The test, and what you have observed',
    placeholder:'Paste the test or describe it. Include how often it fails.',
    seed:'An integration test for checkout fails maybe 1 in 15 runs in CI, never locally. It asserts the order total after a discount is applied. Started about three weeks ago.' },
  cells:[
  { id:'class', title:'Which kind of flake', intent:'There are only a few. Naming yours narrows the search enormously.',
    inputs:['input.test'], output:{name:'kind',type:'table'}, requires:'reasoning',
    prompt:'Classify this flake against the standard causes — timing/async, shared state, ordering, environment, real intermittent bug. Score each. Table: Cause, Fits?, Why. Respond in {{locale.outputLanguage}}.\n\n{{input.test}}',
    demo:()=>({cols:['Cause','Fits?','Why'],rows:[
      ['Shared state between tests','Likely','Passes alone, fails in CI where tests run together. Discounts are usually global config.'],
      ['Timing / async','Possible','Checkout is multi-step; an unawaited write would produce exactly this rate.'],
      ['Test ordering','Likely','Same evidence as shared state, and CI probably randomises order.'],
      ['Environment','Unlikely','Would fail far more than 1 in 15, and would not have started three weeks ago.'],
      ['A real intermittent bug','Do not rule out','1 in 15 in checkout is a customer-facing rate. This is the expensive branch.']]}) },
  { id:'discriminate', title:'The experiment that separates them', intent:'One change that gives a different answer per cause.',
    inputs:['kind'], output:{name:'exp',type:'list'}, requires:'reasoning',
    prompt:'Give experiments that discriminate between the remaining causes — each must produce a different result depending on which is true. Respond in {{locale.outputLanguage}}.\n\n{{kind}}',
    demo:()=>['**Run the test 200 times alone, in a loop.** Fails: not shared state. Passes: it is the neighbours.',
      '**Pin the seed so CI runs tests in the same order every time.** If the flake becomes deterministic, it is ordering.',
      '**Log the discount config at assertion time, not setup time.** If it differs on failures, another test is mutating it.',
      '**Check what changed three weeks ago.** A flake with a start date has a commit. This is the cheapest step and the one most often skipped.'] },
  { id:'fix', title:'Fix versus suppress', intent:'Retry annotations are a decision. This makes it an explicit one.',
    inputs:['kind','exp'], output:{name:'fix',type:'prose'}, requires:'reasoning',
    prompt:'Say what to fix and what it would mean to merely retry it. Take a position. Respond in {{locale.outputLanguage}}.\n\n{{kind}}\n\n{{exp}}',
    demo:()=>'Do not add a retry. Not because retries are always wrong, but because this test asserts a money value in checkout — the one place where an intermittent failure might be reporting a real intermittent bug rather than a test defect.\n\nIf the loop-200-times run passes, it is shared state and the fix is isolation: build discount config per test rather than mutating a shared object. That is an afternoon and it fixes every other test that will hit this later.\n\nIf it fails alone, you have a race in checkout that customers hit at some rate you have not measured. Retrying would hide it, and that is the outcome worth avoiding.' }]},

{ id:'error-message', realm:'tech', concept:'critique', title:'Rewrite This Error Message',
  blurb:'Judges an error against the only three things an error owes the reader, then rewrites it.',
  teaches:'Writing for the worst moment', tags:['ux','writing'], capability:'fast',
  input:{ id:'err', label:'The error message', placeholder:'Paste it exactly.',
    seed:'Error: Something went wrong. Please try again later. (code: ERR_UNSPECIFIED_500)' },
  cells:[
  { id:'audit', title:'What it owes', intent:'What happened, why, and what to do. Most errors deliver one.',
    inputs:['input.err'], output:{name:'audit',type:'table'}, requires:'fast',
    prompt:'Score this error on: says what happened, says why, says what to do next. Table: Obligation, Met?, Evidence. Respond in {{locale.outputLanguage}}.\n\n{{input.err}}',
    demo:()=>({cols:['Obligation','Met?','Evidence'],rows:[
      ['Says what happened','No','"Something went wrong" names nothing.'],
      ['Says why','No','A 500 code is our failure, and the message implies the user caused it.'],
      ['Says what to do','Partly','"Try again later" is advice only if retrying could work — and nothing says it could.'],
      ['Is honest about fault','No','The passive voice puts an internal failure on the reader.']]}) },
  { id:'variants', title:'Three rewrites', intent:'One per plausible underlying cause, because a generic error is a refusal to find out.',
    inputs:['audit','input.err'], output:{name:'variants',type:'table'}, requires:'fast',
    prompt:'Write three replacements, each for a different plausible cause, each stating what happened and what to do. Table: If the cause is, Message. Respond in {{locale.outputLanguage}}.\n\n{{audit}}\n\n{{input.err}}',
    demo:()=>({cols:['If the cause is','Message'],rows:[
      ['A timeout downstream','We could not reach the payment service. Nothing was charged. Try again in a minute — if it keeps failing, this is on us and support has the reference EX-4821.'],
      ['Bad input we failed to validate','The card expiry date is not a real date. Check the month and year and try again.'],
      ['A genuine unknown','Something failed on our side and we do not yet know what. Nothing was charged. We have logged it as EX-4821 — send that to support and they can see exactly what happened.']]}) },
  { id:'rule', title:'The rule this suggests', intent:'One error is an instance. The pattern is what you fix.',
    inputs:['variants'], output:{name:'rule',type:'prose'}, requires:'reasoning',
    prompt:'State the general rule this rewrite implies for error messages in this product. Respond in {{locale.outputLanguage}}.\n\n{{variants}}',
    demo:()=>'Every error carries a reference the user can hand to support, and every error says whether anything was charged or changed.\n\nThose two facts do more than any amount of tone work. The first turns a dead end into a route; the second answers the question the user is actually asking, which is never "what went wrong" but "am I now in trouble."\n\nThe generic fallback stays — you will always have unknowns — but it must be the third message, not the first. Reaching for it when you do know the cause is what made the original bad.' }]},

{ id:'chord-intent', realm:'music', concept:'diagnose', title:'What This Progression Is Doing',
  blurb:'Reads a chord progression for its function rather than its names, then tells you why the third bar feels wrong.',
  teaches:'Function over labels', tags:['theory','writing'], capability:'reasoning',
  input:{ id:'prog', label:'The progression, and where it feels off',
    placeholder:'Chords in order. Key if you know it.',
    seed:'Key of A minor. Am - F - C - E7 - Am. The E7 feels dramatic but the F before it feels like it arrives too early and kills the build.' },
  cells:[
  { id:'function', title:'Function, not names', intent:'What each chord does to tension, regardless of what it is called.',
    inputs:['input.prog'], output:{name:'fn',type:'table'}, requires:'reasoning',
    prompt:'Analyse each chord by harmonic function and its effect on tension. Table: Chord, Function, Tension. Respond in {{locale.outputLanguage}}.\n\n{{input.prog}}',
    demo:()=>({cols:['Chord','Function','Tension'],rows:[
      ['Am','Tonic — home','Zero. The reference everything else is heard against.'],
      ['F','Submediant, VI — the soft departure','Low. Warm, unhurried, no pull.'],
      ['C','Relative major, III','Lower still. This is the problem: it releases rather than builds.'],
      ['E7','Dominant with a raised third — the strongest pull in the key','Maximum, and arriving from near-zero.'],
      ['Am','Resolution','Release.']]}) },
  { id:'why', title:'Why the third bar undoes you', intent:'The diagnosis is a shape, not a chord.',
    inputs:['fn'], output:{name:'why',type:'prose'}, requires:'reasoning',
    prompt:'Explain the tension shape and why it disappoints. Respond in {{locale.outputLanguage}}.\n\n{{fn}}',
    demo:()=>'The tension curve is flat, flat, flatter, then a cliff. F and C are both consonant resting places, so bars two and three are the same emotional event twice — and C is actually more restful than F, so the progression relaxes just before it needs to be climbing.\n\nThe E7 then does all the work alone. That is why it reads as dramatic rather than earned: it has no ramp behind it. You are not hearing a build, you are hearing a jump-scare with a very pleasant three bars in front of it.' },
  { id:'options', title:'Four ways out', intent:'Ordered by how much of the original survives.',
    inputs:['why'], output:{name:'options',type:'list'}, requires:'reasoning',
    prompt:'Give specific alternatives, ordered by how little they change. Name actual chords. Respond in {{locale.outputLanguage}}.\n\n{{why}}',
    demo:()=>['**Swap C for Dm.** One chord. Dm is subdominant minor — it leans toward E7 instead of resting. The curve now climbs.',
      '**Keep C but put it first: Am - C - F - E7.** Same chords, and now the motion is home → bright → warm → pull, which rises.',
      '**Make the third bar F/G or Fmaj7.** Keeps the colour, adds instability so it stops being a landing.',
      '**Delay the E7 by two beats and put Bdim in front of it.** Most change, biggest payoff — the diminished chord is a ramp, and it is the classical answer to exactly this problem.'] }]},

{ id:'mix-notes', realm:'music', concept:'critique', title:'Translate the Mix Note',
  blurb:'Turns "make it punchier" into an actual decision about frequency, dynamics, or arrangement.',
  teaches:'Vague feedback into parameters', tags:['production','feedback'], capability:'reasoning',
  input:{ id:'note', label:'The note you were given', placeholder:'In their words, not yours.',
    seed:'The client says the chorus "needs more energy" but also that it is "already too loud."' },
  cells:[
  { id:'decode', title:'What they might mean', intent:'Contradictory notes usually name a real problem badly.',
    inputs:['input.note'], output:{name:'decode',type:'list'}, requires:'reasoning',
    prompt:'List the plausible technical meanings behind this note, including why the contradiction may be consistent. Respond in {{locale.outputLanguage}}.\n\n{{input.note}}',
    demo:()=>['**The chorus is loud but not louder than the verse.** Energy is relative; if the verse is already at the ceiling there is nowhere to go, and the mix reads as flat rather than quiet.',
      '**It is dense, not energetic.** More elements playing at once reads as busier, not bigger, and busier is fatiguing — which is what "too loud" often means.',
      '**The transient information is gone.** Heavy limiting removes attack. The result measures loud and feels soft, which is exactly this pair of complaints.',
      '**Nothing changes at the chorus except level.** No new register, no new rhythm, no lift. The arrangement is the problem, not the mix.'] },
  { id:'tests', title:'How to tell which', intent:'Each meaning has a two-minute check.',
    inputs:['decode'], output:{name:'tests',type:'table'}, requires:'reasoning',
    prompt:'For each meaning give a quick check and what result confirms it. Table: Meaning, Check, Confirms if. Respond in {{locale.outputLanguage}}.\n\n{{decode}}',
    demo:()=>({cols:['Meaning','Check','Confirms if'],rows:[
      ['No relative lift','Measure LUFS on verse vs chorus','Under 1 LU difference'],
      ['Density, not energy','Mute two chorus-only parts','It feels bigger with less'],
      ['Transients crushed','Bypass the limiter, match level','Attack returns and it reads louder at the same loudness'],
      ['Arrangement is flat','Play verse into chorus with drums only','Nothing changes but volume']]}) },
  { id:'reply', title:'What to say back', intent:'A reply that gets you a better note next time.',
    inputs:['decode','tests'], output:{name:'reply',type:'markdown'}, requires:'fast',
    prompt:'Draft a short reply that offers options rather than asking them to be more technical. Respond in {{locale.outputLanguage}}.\n\n{{decode}}\n\n{{tests}}',
    demo:()=>'I think those two notes are the same note, and I think you are right.\n\nThe chorus is loud but it is not *louder* — it sits about the same level as the verse, so it never lifts. My instinct is to pull the verse down rather than push the chorus up, which should give you the energy without adding volume.\n\nI have made two versions:\n\n- **A** — verse down 1.5 dB, chorus untouched\n- **B** — same, plus the limiter eased so the drums get their attack back\n\nBoth are quieter overall and should feel bigger. If B is the one, we lose a little competitive loudness for a lot of punch, and I would take that trade — but tell me if you would not.' }]},
{ id:'world-consistency', realm:'fantasy', concept:'critique', title:'Break Your Own World',
  blurb:'Finds the rule your setting states and the scene that violates it — then decides which one to keep.',
  teaches:'Internal consistency auditing', tags:['worldbuilding','fiction'], capability:'reasoning',
  input:{ id:'world', label:'The rule, and roughly what happens', placeholder:'Magic system, tech level, political constraint — plus a scene or two.',
    seed:'Magic requires a blood price: any working costs the caster physical vitality proportional to the effect. A healer can mend a wound but ages doing it. In act two my protagonist levels a city wall and is tired but fine by the next chapter.' },
  cells:[
  { id:'rules', title:'The rules you have actually set', intent:'Stated, implied, and the ones your scenes assume without saying.',
    inputs:['input.world'], output:{name:'rules',type:'list'}, requires:'reasoning',
    prompt:'Extract the rules this world has committed to — stated and implied. Respond in {{locale.outputLanguage}}.\n\n{{input.world}}',
    demo:()=>['Stated: magic costs vitality in proportion to effect.','Stated: the cost is physical and visible — the healer ages.','Implied: cost is paid immediately, since ageing is described as happening during the working.','Implied: there is no external battery — the caster is the only fuel.','Assumed by act two: cost can be survived and recovered from at scales that should be lethal.'] },
  { id:'break', title:'Where it breaks', intent:'The specific contradiction, named plainly.',
    inputs:['rules','input.world'], output:{name:'break',type:'prose'}, requires:'reasoning',
    prompt:'Identify the contradiction and say what a careful reader will conclude. Respond in {{locale.outputLanguage}}.\n\n{{rules}}\n\n{{input.world}}',
    demo:()=>'A city wall is orders of magnitude past a mended wound. If a healed cut costs visible years, a levelled wall costs a lifetime — and your protagonist is fine in a chapter.\n\nWhat a careful reader concludes is not "the magic is inconsistent." It is that the cost is not real, which retroactively removes the tension from every earlier scene where it was. The healer ageing was the moment the reader agreed to take the system seriously; act two is the moment they stop.\n\nThis is the expensive kind of break, because it damages what you already spent.' },
  { id:'choose', title:'Which do you keep', intent:'You cannot keep both. This is the decision, with the cost of each.',
    inputs:['break'], output:{name:'choose',type:'table'}, requires:'reasoning',
    prompt:'Give the ways to resolve it, with what each costs the story. Table: Resolution, What it costs, Best if. Respond in {{locale.outputLanguage}}.\n\n{{break}}',
    demo:()=>({cols:['Resolution','What it costs','Best if'],rows:[
      ['The wall nearly kills her; act three has her diminished','Rewrites your protagonist’s capability for the rest of the book','The cost is your theme — then this is not a cost, it is the point'],
      ['She used an external source, established earlier','Requires planting it in act one, and weakens the "caster is the only fuel" rule','You want the set piece and can afford one exception with a name'],
      ['The wall becomes something smaller — a gate, a section','Loses spectacle','The scene’s job is her resolve, not the scale'],
      ['Cost scales with intent, not effect','Elegant, but rewrites the healer scene','You are early enough to change the system rather than the scene']]}) }]},

{ id:'shot-list', realm:'photo', concept:'plan', title:'Shot List From an Intent',
  blurb:'Turns "I want it to feel lonely" into a list of decisions about lens, light, distance and time.',
  teaches:'Feeling into parameters', tags:['photography','planning'], capability:'reasoning',
  input:{ id:'brief', label:'What you want it to feel like, and what you are shooting',
    placeholder:'The feeling first. Constraints second.',
    seed:'Portraits of a family running a bakery that is closing after 40 years. I want it to feel like the end of something without being sentimental. One morning, available light only.' },
  cells:[
  { id:'decisions', title:'The choices that carry the feeling', intent:'Each craft decision, and which way it leans for this brief.',
    inputs:['input.brief'], output:{name:'dec',type:'table'}, requires:'reasoning',
    prompt:'Map the feeling onto concrete craft decisions. Table: Decision, This brief wants, Why. Respond in {{locale.outputLanguage}}.\n\n{{input.brief}}',
    demo:()=>({cols:['Decision','This brief wants','Why'],rows:[
      ['Distance','Further than feels comfortable','Closeness reads as intimacy, which tips into sentiment. Space reads as ending.'],
      ['Lens','Normal, 35–50mm','Wide dramatises, long flatters. Neither is honest here.'],
      ['Light','Window light, unmodified, let shadows go','Fill light is a kindness that removes the subject'],
      ['Moment','Between actions, not during','Working hands look like continuity. Pauses look like the last time.'],
      ['Frame','Include the room','A portrait of people is about people. This is about a place losing them.'],
      ['Colour','Whatever the room is','Grading it warm is the sentimentality you said you did not want']]}) },
  { id:'shots', title:'The list', intent:'Specific enough to shoot without thinking.',
    inputs:['dec','input.brief'], output:{name:'shots',type:'list'}, requires:'reasoning',
    prompt:'Write a shootable list of specific frames. Respond in {{locale.outputLanguage}}.\n\n{{dec}}\n\n{{input.brief}}',
    demo:()=>['**Wide, from the doorway, before anyone arrives.** Empty room, ovens off, window light only. This is the frame the whole set is measured against.',
      '**Full-length of one person at the bench, mid-room.** Not working. Standing.',
      '**Two of them talking, shot from the far side of the room, through the pass.** The barrier is the point.',
      '**Hands, but idle** — on a bench, in a pocket. Working hands are the cliché.',
      '**A wall detail with 40 years on it.** A rota, a burn mark, a taped note.',
      '**The group, arranged, looking at camera, from far enough back that the room wins.** Take it early. It is the one they will want.',
      '**The doorway again at the end of the morning.** Same frame, people in it. Pair with the first.'] },
  { id:'avoid', title:'Shots not to take', intent:'Naming the clichés so you notice yourself reaching for them.',
    inputs:['shots'], output:{name:'avoid',type:'list'}, requires:'reasoning',
    prompt:'List the shots that would undercut this brief, and why they are tempting. Respond in {{locale.outputLanguage}}.\n\n{{shots}}',
    demo:()=>['**Flour in the air, backlit.** Beautiful, and it is a photo about bread. You are not photographing bread.',
      '**A single tear or a hand on a shoulder.** If it happens, it happens — but going looking for it is how you get sentiment.',
      '**Tight close-up of a lined face.** Reads as reverence, which flattens a person into a symbol.',
      '**The "closed" sign.** Too literal. The room already says it.'] }]},

{ id:'tolerance-stack', realm:'making', concept:'diagnose', title:'Where the Tolerance Went',
  blurb:'Stacks the errors in an assembly to find which single dimension is eating your fit.',
  teaches:'Stack-up reasoning', tags:['engineering','quality'], capability:'reasoning',
  input:{ id:'assembly', label:'The assembly and the symptom', placeholder:'Parts, nominal dimensions, tolerances, and what goes wrong.',
    seed:'A three-part enclosure: base, gasket, lid. Bolts through all three. About one in eight units the lid will not seat flat and the gasket extrudes. Base flatness ±0.15, gasket thickness 2.0 ±0.1, lid flange ±0.1, bolt hole position ±0.2.' },
  cells:[
  { id:'stack', title:'The stack', intent:'Worst-case and statistical, because they disagree and the disagreement is informative.',
    inputs:['input.assembly'], output:{name:'stack',type:'table'}, requires:'reasoning',
    prompt:'Build the tolerance stack. Give each contributor, its range, and its share of the total. Table: Contributor, Range, Share. Respond in {{locale.outputLanguage}}.\n\n{{input.assembly}}',
    demo:()=>({cols:['Contributor','Range','Share of worst case'],rows:[
      ['Bolt hole position ±0.2','0.40 mm','36% — and it acts in-plane, not in the stack'],
      ['Base flatness ±0.15','0.30 mm','27%'],
      ['Gasket thickness ±0.1','0.20 mm','18%'],
      ['Lid flange ±0.1','0.20 mm','18%'],
      ['Worst case total','1.10 mm','Statistical (RSS) total is ~0.55 mm — half']]}) },
  { id:'suspect', title:'The one that is not like the others', intent:'A stack tells you the size. This tells you the mechanism.',
    inputs:['stack','input.assembly'], output:{name:'suspect',type:'prose'}, requires:'reasoning',
    prompt:'Identify the most likely actual cause and explain why the failure rate is a clue. Respond in {{locale.outputLanguage}}.\n\n{{stack}}\n\n{{input.assembly}}',
    demo:()=>'One in eight is the tell. A pure stack-up failure would be far rarer — worst case needs every contributor at its limit in the same direction, which at these tolerances is a fraction of a percent. One in eight means something is not random.\n\nBolt hole position is the suspect, and not because it is the biggest. It is the only contributor acting in-plane. If holes are off-position, the bolts pull the lid sideways as they tighten, and the gasket extrudes because it is being sheared rather than compressed. That produces a bimodal result — fine or clearly bad, no middle — which matches a 1-in-8 rate far better than a smooth distribution would.\n\nCheck whether failures cluster by fixture or by shift. If they do, it is position, and the fix is upstream of every tolerance on this list.' },
  { id:'cheapest', title:'Cheapest effective change', intent:'Tightening everything is the expensive answer. This is the ordered one.',
    inputs:['suspect','stack'], output:{name:'cheap',type:'list'}, requires:'reasoning',
    prompt:'Give changes ordered by cost-to-benefit, including ones that cost nothing. Respond in {{locale.outputLanguage}}.\n\n{{suspect}}\n\n{{stack}}',
    demo:()=>['**Clearance the lid holes by 0.5 mm.** Costs a drill change. Removes the in-plane constraint entirely and lets the gasket compress instead of shear.',
      '**Specify a tightening sequence and torque.** Free. Cross-pattern tightening on an unsequenced assembly is a common cause of exactly this.',
      '**Measure 30 units and plot the failures against fixture.** Costs an hour and tells you whether the above is right before you change anything.',
      '**Tighten base flatness to ±0.08.** Real money, real machining time, and it addresses 27% of a stack that is probably not your problem. Last, not first.'] }]},

{ id:'plant-diagnosis', realm:'garden', concept:'diagnose', title:'What Is Wrong With This Plant',
  blurb:'Works from the pattern of damage rather than the plant, which is how you tell water from disease from pests.',
  teaches:'Pattern-first diagnosis', tags:['gardening','plants'], capability:'reasoning',
  input:{ id:'symptoms', label:'What you see, and where on the plant', placeholder:'Which leaves, what pattern, how fast, plus watering and light.',
    seed:'Tomato in a raised bed. Lower leaves yellowing between the veins, working upward slowly over two weeks. Some brown spots with a yellow halo on the worst leaves. Watering daily, full sun, fed once at planting six weeks ago.' },
  cells:[
  { id:'pattern', title:'Read the pattern, not the plant', intent:'Where and in what order tells you more than what it looks like.',
    inputs:['input.symptoms'], output:{name:'pattern',type:'table'}, requires:'reasoning',
    prompt:'Analyse the distribution and progression of symptoms and what each pattern implies. Table: Observation, Implies, Rules out. Respond in {{locale.outputLanguage}}.\n\n{{input.symptoms}}',
    demo:()=>({cols:['Observation','Implies','Rules out']  ,rows:[
      ['Lower leaves first, moving up','A mobile nutrient being withdrawn from old growth to feed new','Most fungal issues start opportunistically, not bottom-up'],
      ['Yellowing between veins, veins staying green','Magnesium or nitrogen — interveinal is classic Mg','Overwatering, which yellows whole leaves uniformly'],
      ['Two weeks, slow','Deficiency, not infection','Blight, which moves in days'],
      ['Brown spots with yellow halo','A secondary fungal issue on already-weakened tissue','Nothing — but it is likely a consequence, not the cause'],
      ['Fed once, six weeks ago','Tomatoes in a bed are heavy feeders and that is long past','—']]}) },
  { id:'ranked', title:'Most to least likely', intent:'With the confirming test for each.',
    inputs:['pattern'], output:{name:'ranked',type:'list'}, requires:'reasoning',
    prompt:'Rank causes by likelihood with a confirming check for each. Respond in {{locale.outputLanguage}}.\n\n{{pattern}}',
    demo:()=>['**Magnesium deficiency — most likely.** Interveinal, bottom-up, slow, six weeks unfed. Confirm: Epsom salts foliar spray; new growth greens within a week if right.',
      '**Nitrogen deficiency — close second, often alongside.** Confirm: yellowing is more uniform than interveinal on the oldest leaves.',
      '**Early blight — secondary.** The halo spots fit, but blight starting bottom-up on stressed lower leaves is a passenger here, not the driver.',
      '**Overwatering — worth checking, unlikely as stated.** Daily in a raised bed in full sun is usually fine, but check drainage. Root problems mimic deficiency because the roots cannot take nutrients up.'] },
  { id:'do', title:'What to do this week', intent:'In order, with the one thing not to do.',
    inputs:['ranked'], output:{name:'do',type:'list'}, requires:'fast',
    prompt:'Give an ordered action list for this week, including what not to do. Respond in {{locale.outputLanguage}}.\n\n{{ranked}}',
    demo:()=>['**Remove the spotted leaves and bin them, not compost.** Stops the secondary issue spreading while you fix the cause.',
      '**Feed with a balanced tomato feed, and add Epsom salts** — a tablespoon in 4 litres, watered in. Both deficiencies covered without guessing between them.',
      '**Mulch.** Splash from soil onto lower leaves is how the fungal spots got there.',
      '**Then wait a week and look at NEW growth only.** Damaged leaves never recover, and judging by them will make you think the fix failed.',
      '**Do not spray a fungicide yet.** The spots are a symptom of a hungry plant. Fix the feeding and they usually stop appearing.'] }]},
{ id:'recipe-scale', realm:'food', concept:'diagnose', title:'Why Scaling Broke It',
  blurb:'Finds which ingredient does not scale linearly — usually salt, leavening, or time.',
  teaches:'Non-linear scaling', tags:['cooking','baking'], capability:'reasoning',
  input:{ id:'recipe', label:'The recipe, the scale factor, and what went wrong',
    seed:'Doubled a brownie recipe for a party. Same tin size doubled up to a bigger tin. Came out dense and slightly bitter, and the edges were overdone while the middle was raw.',
    placeholder:'What you scaled and how it failed.' },
  cells:[
  { id:'nonlinear', title:'What does not scale', intent:'Most ingredients double. A few emphatically do not.',
    inputs:['input.recipe'], output:{name:'nl',type:'table'}, requires:'reasoning',
    prompt:'Identify what does not scale linearly here and why. Table: Element, Scales?, Consequence. Respond in {{locale.outputLanguage}}.\n\n{{input.recipe}}',
    demo:()=>({cols:['Element','Scales?','Consequence'],rows:[
      ['Flour, sugar, fat, eggs','Linear','Fine'],
      ['Leavening (baking powder/soda)','Sub-linear','Doubled soda in a brownie gives a soapy bitterness and a cakey crumb — this is your bitter note'],
      ['Salt','Roughly linear, but perception is not','Tastes stronger in a denser bake'],
      ['Bake time','Not linear at all — governed by depth, not volume','A deeper tin needs longer at a LOWER temperature'],
      ['Tin geometry','Depth is the variable that matters','Doubling volume in a deeper tin is the actual cause of raw middle and burnt edge']]}) },
  { id:'cause', title:'The actual cause', intent:'One of these is doing most of the damage.',
    inputs:['nl'], output:{name:'cause',type:'prose'}, requires:'reasoning',
    prompt:'Name the dominant cause and explain the mechanism. Respond in {{locale.outputLanguage}}.\n\n{{nl}}',
    demo:()=>'Depth, not quantity. Heat travels inward from every surface, so bake time scales with the *thickness* of the batter, not its volume. A tin that is twice the volume but also deeper needs substantially longer — and at a lower temperature, or the outside is finished long before the middle starts.\n\nThat single change produces both symptoms at once: burnt edges and raw centre are what happens when you give a thicker bake the same time and temperature as a thinner one.\n\nThe doubled leavening explains the bitterness separately, and the density is downstream of both — underbaked centre plus over-risen-then-collapsed crumb.' },
  { id:'redo', title:'How to run it again', intent:'Specific numbers, not principles.',
    inputs:['cause','nl'], output:{name:'redo',type:'list'}, requires:'fast',
    prompt:'Give the corrected approach with specific numbers. Respond in {{locale.outputLanguage}}.\n\n{{cause}}\n\n{{nl}}',
    demo:()=>['**Use two tins of the original size, not one bigger one.** Same depth, same time, same temperature. This is the whole fix and it costs nothing.',
      '**If you must use one tin: drop the oven 15°C and add 10–15 minutes**, then test the centre rather than the timer.',
      '**Scale leavening by about 1.5×, not 2×.** For most bakes this is close enough and avoids the soapy note.',
      '**Scale salt fully.** It is not the problem, and under-salting a doubled bake is how you get flat-tasting brownies.',
      '**Test with a skewer at the true centre and one third of the way in.** Two readings tell you whether it is depth or temperature.'] }]},

{ id:'strength-plateau', realm:'health', concept:'diagnose', title:'Why the Progress Stopped',
  blurb:'Separates the four reasons a training plateau happens, since three have opposite fixes to the fourth.',
  teaches:'Opposite-fix diagnosis', tags:['training','fitness'], capability:'reasoning',
  input:{ id:'plateau', label:'The lift, the history, and the rest of your life',
    placeholder:'Include sleep and stress — they are usually the answer.',
    seed:'Squat stuck at 120kg for seven weeks. Training four days a week, adding 2.5kg a session until it stopped. Sleeping about six hours. Work has been heavy since February. Bodyweight flat.' },
  cells:[
  { id:'four', title:'The four causes', intent:'They look identical from inside and have contradictory fixes.',
    inputs:['input.plateau'], output:{name:'four',type:'table'}, requires:'reasoning',
    prompt:'Assess against the standard plateau causes: under-recovery, under-eating, technique breakdown at load, and programme exhaustion. Table: Cause, Evidence for, Fix direction. Respond in {{locale.outputLanguage}}.\n\n{{input.plateau}}',
    demo:()=>({cols:['Cause','Evidence for','Fix direction'],rows:[
      ['Under-recovery','Six hours sleep, high work stress, four sessions a week','Do LESS'],
      ['Under-eating','Bodyweight flat while training hard','Eat more'],
      ['Technique breaking at load','Linear progression usually ends here','Reduce load, fix pattern'],
      ['Programme exhausted','2.5kg a session cannot continue indefinitely for anyone','Change structure — this is normal and expected'],
      ['—','Note that the first three all say "back off" and the fourth says "change"','They are not the same instruction']]}) },
  { id:'likely', title:'Which one is yours', intent:'The evidence usually points somewhere unwelcome.',
    inputs:['four'], output:{name:'likely',type:'prose'}, requires:'reasoning',
    prompt:'Say which cause dominates and be direct about it. Respond in {{locale.outputLanguage}}.\n\n{{four}}',
    demo:()=>'Sleep. Six hours with elevated work stress is the answer, and everything else here is a passenger.\n\nLinear progression ending at seven weeks is completely normal and would have happened anyway — but it ends *earlier* and *harder* when recovery is short. Flat bodyweight while training four days a week says you are also eating at maintenance, which compounds it.\n\nThe unwelcome part: no programme change fixes this. You can restructure the training and you will get another few weeks, then stall again lower. The variable that is actually limiting you is not in the gym.' },
  { id:'plan', title:'What to change, in order', intent:'Ordered by effect, which is not the same as ordered by appeal.',
    inputs:['likely','four'], output:{name:'plan',type:'list'}, requires:'reasoning',
    prompt:'Give an ordered plan, honest about which parts are unpopular. Respond in {{locale.outputLanguage}}.\n\n{{likely}}\n\n{{four}}',
    demo:()=>['**Sleep, for two weeks, before changing anything else.** Seven and a half hours minimum. If the squat moves on that alone, you have your answer and you saved yourself a programme rewrite.',
      '**Drop to three sessions.** Counterintuitive and correct. Four sessions on six hours sleep is four sessions of accumulating fatigue.',
      '**Eat 200–300 kcal above maintenance.** Flat weight while progressing is only sustainable early.',
      '**Then, and only then, change the programme.** Stop adding 2.5kg a session; move to weekly progression or a wave. This is the fun part and it is fourth for a reason.',
      '**Film a set at 110kg.** Cheap, and rules out technique in one video.'] }]},

{ id:'concept-check', realm:'learning', concept:'teach', title:'Find the Hole in What You Know',
  blurb:'Asks you to explain something, then locates the exact sentence where your understanding stops.',
  teaches:'Self-locating ignorance', tags:['learning','study'], capability:'reasoning',
  input:{ id:'explain', label:'Explain something you think you understand',
    placeholder:'Write it as if to a colleague. Do not look anything up.',
    seed:'A database index makes queries faster because it stores a sorted copy of the column, so the database can jump straight to the row instead of scanning the whole table.' },
  cells:[
  { id:'solid', title:'What you actually have', intent:'The parts that are correct, stated back precisely.',
    inputs:['input.explain'], output:{name:'solid',type:'list'}, requires:'reasoning',
    prompt:'List what is correct in this explanation. Be specific and generous. Respond in {{locale.outputLanguage}}.\n\n{{input.explain}}',
    demo:()=>['Correct: an index is a separate structure, not a property of the table.','Correct: it is ordered, and the ordering is what enables the speedup.','Correct: the alternative is a scan, and avoiding the scan is the point.','Correct in effect: lookups become roughly logarithmic rather than linear.'] },
  { id:'edge', title:'The edge of it', intent:'The precise sentence where the explanation stops being load-bearing.',
    inputs:['input.explain','solid'], output:{name:'edge',type:'prose'}, requires:'reasoning',
    prompt:'Identify exactly where the understanding runs out, and what question would expose it. Respond in {{locale.outputLanguage}}.\n\n{{input.explain}}\n\n{{solid}}',
    demo:()=>'"Jump straight to the row" is where it stops.\n\nThe explanation knows the index is sorted and knows that helps, but it does not say *how* sorted data is searched — which means it cannot answer why an index on a low-cardinality column (a boolean, say) is often useless, or why range queries behave differently from equality ones, or why the query planner sometimes ignores an index you built.\n\nThe question that exposes it: **why is an index on a column with two possible values usually worse than no index at all?** If the answer is "because it still has to jump," the model is a lookup table rather than a tree, and the gap is B-trees and selectivity.' },
  { id:'next', title:'The one thing to learn next', intent:'Not a syllabus. The single concept that unlocks the rest.',
    inputs:['edge'], output:{name:'next',type:'prose'}, requires:'reasoning',
    prompt:'Name the single next concept and why it unlocks the others. Respond in {{locale.outputLanguage}}.\n\n{{edge}}',
    demo:()=>'Selectivity.\n\nNot B-trees — that is the mechanism, and you can hold it later. Selectivity is the idea that an index is only worth using when it eliminates most of the rows, and it is the concept that makes every confusing index behaviour suddenly obvious.\n\nOnce you have it: low-cardinality indexes are useless because they eliminate half the table at best. The planner ignores your index because it estimated poor selectivity. Composite index column order matters because the most selective column should come first. Range queries differ because they eliminate less than equality does.\n\nOne idea, four mysteries. Learn that before the tree structure, not after.' }]},

{ id:'quote-check', realm:'home', concept:'compare', title:'Read This Quote Properly',
  blurb:'Finds what a trade quote leaves out, which is where the second invoice comes from.',
  teaches:'Reading for absence', tags:['home','contracts'], capability:'reasoning',
  input:{ id:'quote', label:'The quote, as written', placeholder:'Paste it. Include the total and any exclusions.',
    seed:'Bathroom refit, £6,400. Includes: strip out, first fix plumbing, tiling, fit supplied suite, second fix, making good. Excludes: tiles, suite, electrics. 10 working days. 50% deposit.' },
  cells:[
  { id:'gaps', title:'What is not in it', intent:'The costed items are easy. The uncosted ones decide the final number.',
    inputs:['input.quote'], output:{name:'gaps',type:'table'}, requires:'reasoning',
    prompt:'Identify what this quote does not cover or leaves ambiguous, and the likely cost impact. Table: Gap, Why it matters, Ask them. Respond in {{locale.outputLanguage}}.\n\n{{input.quote}}',
    demo:()=>({cols:['Gap','Why it matters','Ask them'],rows:[
      ['"Making good" is undefined','Can mean filled and sanded, or plastered and painted — hundreds apart','What standard, and does it include paint?'],
      ['Electrics excluded but not scoped','A bathroom needs certified work; excluding it does not remove it','Who does it, when in the sequence, and does your schedule depend on them?'],
      ['Waste removal not mentioned','A strip-out fills a skip','Skip included or extra?'],
      ['No allowance for what is behind the wall','Rot, old pipework, non-standard joists — common in a refit','What is the hourly rate for unforeseen work, agreed in advance?'],
      ['"10 working days" with no start date','A quote is not a booking','Start date in writing'],
      ['50% deposit is high','Material cost is excluded, so what is the deposit funding?','Can it be 25% now, 25% on first fix?']]}) },
  { id:'questions', title:'The email to send', intent:'Six questions, answerable in writing, that turn a quote into a contract.',
    inputs:['gaps'], output:{name:'email',type:'markdown'}, requires:'fast',
    prompt:'Draft a short, non-adversarial email asking for the missing detail. Respond in {{locale.outputLanguage}}.\n\n{{gaps}}',
    demo:()=>'Hi —\n\nThanks for this, the price looks reasonable. Before I confirm, six things I would like in writing so we both know where we stand:\n\n1. What does "making good" cover — is that plastered and painted, or prepared for me to decorate?\n2. Electrics are excluded — are you arranging a certified electrician, or am I? And where do they sit in the sequence?\n3. Is skip hire and waste removal included?\n4. If you open the wall and find something unexpected, what is the rate, and can we agree that anything over £200 gets a call before it happens?\n5. Can we put a start date in writing alongside the 10 working days?\n6. Would you consider 25% deposit and 25% at first fix? Materials are on me, so I would rather stage it.\n\nNone of this is a problem, I would just rather ask now than halfway through.' },
  { id:'walk', title:'What would make you walk', intent:'Deciding this before you are invested is the only time it is easy.',
    inputs:['gaps'], output:{name:'walk',type:'list'}, requires:'reasoning',
    prompt:'List the answers that should end the conversation, and why. Respond in {{locale.outputLanguage}}.\n\n{{gaps}}',
    demo:()=>['**Refusing to put a start date in writing.** The most common source of a job that runs months.',
      '**"We will sort the electrics out."** Bathroom electrics are notifiable work. Vagueness here is a certificate you will not get.',
      '**No answer on unforeseen-work rates.** This is the single largest cost risk and a professional will have a ready answer.',
      '**Pressure on the deposit.** A trade that needs 50% up front on a job where they buy no materials has a cashflow problem, and you would be funding it.',
      '**Irritation at being asked.** Six reasonable questions in writing is a normal request. How they respond is the most useful information in the whole exchange.'] }]},
{ id:'design-crit', realm:'design', concept:'critique', title:'Crit This Without Being Nice',
  blurb:'Separates taste from function, so the feedback that matters is not lost among the feedback that is merely preference.',
  teaches:'Separating taste from failure', tags:['design','feedback'], capability:'reasoning',
  input:{ id:'work', label:'Describe the design and what it has to do',
    placeholder:'The job first, then the design. The job is what makes crit possible.',
    seed:'A pricing page with three tiers. Job: get self-serve users to pick the middle tier without a sales call. Currently: three equal cards, feature checklists, middle one has a "Popular" badge, CTA is "Get started" on all three.' },
  cells:[
  { id:'split', title:'Function, convention, taste', intent:'Only the first is arguable on evidence. Conflating them is why crits go badly.',
    inputs:['input.work'], output:{name:'split',type:'table'}, requires:'reasoning',
    prompt:'Split the critique into failures of function, breaks with convention, and matters of taste. Table: Observation, Kind, Consequence. Respond in {{locale.outputLanguage}}.\n\n{{input.work}}',
    demo:()=>({cols:['Observation','Kind','Consequence'],rows:[
      ['Three equal cards','Function','If the job is to steer to the middle, equal weight actively fights it'],
      ['Same CTA on all three','Function','No differentiation in the one element people click'],
      ['"Popular" badge','Convention','Works, but it is the weakest available signal and it is doing all the steering'],
      ['Feature checklists','Convention','Fine. Optimises for comparison, which is what a checklist is for'],
      ['Card ordering cheap→expensive','Convention','Expected. Reversing is a real option but a bigger swing'],
      ['Card corner radius, spacing','Taste','Not crit. Do not spend the room on it']]}) },
  { id:'against', title:'What the design is arguing', intent:'Every layout makes an argument. Naming it shows whether it is the one you meant.',
    inputs:['split','input.work'], output:{name:'arg',type:'prose'}, requires:'reasoning',
    prompt:'State the argument this design makes to a visitor, and whether it matches the stated job. Respond in {{locale.outputLanguage}}.\n\n{{split}}\n\n{{input.work}}',
    demo:()=>'The design argues: "here are three comparable options, you decide."\n\nThe job is: "take the middle one."\n\nThose are different pages. Three equal cards with identical CTAs is a comparison table with rounded corners — it is optimised for a careful evaluator who wants to weigh features, and the stated user is a self-serve buyer who wants to be told what to pick.\n\nThe "Popular" badge is the only element doing the actual job, and it is doing it alone, in the smallest type on the page.' },
  { id:'moves', title:'Three moves, by size', intent:'What to try, ordered by how much has to change.',
    inputs:['arg'], output:{name:'moves',type:'list'}, requires:'reasoning',
    prompt:'Give specific changes ordered smallest to largest, each tied to the job. Respond in {{locale.outputLanguage}}.\n\n{{arg}}',
    demo:()=>['**Differentiate the CTAs.** Middle becomes "Start free trial"; outer two become "Choose Basic" / "Contact sales". Costs nothing and stops the page treating three choices as one.',
      '**Break the symmetry.** Middle card larger, raised, with the others visually subordinate. This is what the design is currently refusing to do, and it is the whole job.',
      '**Lead with the recommendation and demote comparison.** One card, prominent, with "compare all plans" below it. Biggest change, most aligned with the stated user — and the one worth testing rather than debating.'] }]},

{ id:'hypothesis-audit', realm:'science', concept:'critique', title:'Is This Actually Testable',
  blurb:'Checks whether a hypothesis could ever come out false, which is the only property that makes testing it worthwhile.',

/* ═════════ packages/storage — swappable adapter (ENG-BRIEF §4.1)
   Nothing else in the app knows how persistence works. capabilities()
   is not decoration: the UI must tell the user honestly whether their
   data is durable (PRODUCT-BRIEF §6.3 / R9). ═════════ */

const MemoryAdapter = () => {
  const m = new Map();
  return {
    id:'memory', label:'Session memory',
    async list(){ return [...m.values()].map(d=>({id:d.id,title:d.title,updated:d.updated})) },
    async read(id){ return m.get(id) ?? null },
    async write(id,doc){ m.set(id,{...doc,id,updated:Date.now()}) },
    async remove(id){ m.delete(id) },
    capabilities:()=>({durable:false, external:false, label:'Nothing is kept. Closing the tab ends it.'})
  };
};

const IdbAdapter = () => {
  const DB='throughline', STORE='docs'; let dbp=null;
  const open = () => dbp ??= new Promise((res,rej)=>{
    const r = indexedDB.open(DB,1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE,{keyPath:'id'});
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  const tx = async (mode,fn) => { const db=await open(); return new Promise((res,rej)=>{
    const t=db.transaction(STORE,mode), q=fn(t.objectStore(STORE));
    q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); };
  let persisted = false;
  return {
    id:'idb', label:'This browser',
    async init(){ try{ persisted = await navigator.storage?.persist?.() ?? false; }catch{ persisted=false } },
    async list(){ return (await tx('readonly',s=>s.getAll())).map(d=>({id:d.id,title:d.title,updated:d.updated})) },
    async read(id){ return (await tx('readonly',s=>s.get(id))) ?? null },
    async write(id,doc){ await tx('readwrite',s=>s.put({...doc,id,updated:Date.now()})) },
    async remove(id){ await tx('readwrite',s=>s.delete(id)) },
    capabilities:()=>({ durable:persisted, external:false,
      label: persisted
        ? 'Stored in this browser, marked persistent. Still local to this device.'
        : 'Stored in this browser. The browser may clear it — export anything you want to keep.' })
  };
};

const modelOf = id => S.models[id] ?? PROVIDERS[id].model ?? '';

const TIER_RANK = { frontier:4, free:3, local:2, device:1, demo:0, blocked:-1 };
const TIER_LABEL = { demo:'No setup', device:'On your device', local:'On your machine',
  free:'Free tier · key required', frontier:'Paid', blocked:'Desktop only' };

/* Connected = usable right now. Demo always is; the on-device model is if the
   browser exposes it; everything else needs a key the user pasted. */
const builtIn = () => self.LanguageModel ?? self.ai?.languageModel ?? null;
const hasBuiltIn = () => !!builtIn();

/* Chrome's built-in model has three states, and conflating them is a trap:
   the API can be present while the weights are not, and calling create() in
   that state silently starts a multi-gigabyte download. So it counts as
   connected only once 'available', and the download is an explicit choice. */
async function probeBuiltIn(){
  const LM = builtIn();
  if (!LM){ S.builtin = 'absent'; return; }
  try {
    const a = await (LM.availability?.() ?? LM.capabilities?.().then(c=>c.available) ?? 'unavailable');
    S.builtin = String(a);
  } catch { S.builtin = 'unavailable'; }
}
async function downloadBuiltIn(onProgress){
  const LM = builtIn();
  if (!LM) throw new Error('No built-in model in this browser.');
  S.builtin = 'downloading';
  const session = await LM.create({ monitor(m){
    m.addEventListener('downloadprogress', e => onProgress(e.loaded, e.total));
  }});
  session.destroy?.();
  await probeBuiltIn();
  /* On-device is the default when it is genuinely ready: free, no key, and
     nothing leaves the machine. Otherwise Auto, which falls back to the
     scripted demo so the library is never gated behind setup. */
  if (isConnected('chrome')) S.provider = 'chrome';
}

const isConnected = id => {
  if (id === 'demo') return true;
  if (id === 'chrome') return S.builtin === 'available' || S.builtin === 'readily';
  /* Keyless network providers (Ollama) cannot be detected — only reached.
     A passing test is the evidence; there is nothing else to go on. */
  if (PROVIDERS[id].key === 'none') return S.tests[id]?.ok === true;
  return !!S.keys[id];
};
const connected = () => Object.keys(PROVIDERS).filter(isConnected);

/* Auto-resolution. The cell declares a capability class; the system picks the
   best connected provider that can serve it. The picker below shows the
   resolution rather than posing the question — PRODUCT-BRIEF §5.4. */
function autoPick(cell){
  const able = connected().filter(id => PROVIDERS[id].classes.includes(cell.requires) && PROVIDERS[id].tier !== 'blocked');
  const pool = able.length ? able : connected();
  return pool.sort((a,b) => TIER_RANK[PROVIDERS[b].tier] - TIER_RANK[PROVIDERS[a].tier])[0] ?? 'demo';
}
const resolveFor = cell =>
  S.cellProvider[cell.id] ?? (S.provider === 'auto' ? autoPick(cell) : S.provider);

/* True when the cell is running below the class it was written for. This is
   the moment the ceiling is actually felt, so it is where the upgrade lives. */
const belowClass = cell => {
  const p = PROVIDERS[resolveFor(cell)];
  return p.tier !== 'demo' && !p.classes.includes(cell.requires);
};

const sleep = ms => new Promise(r=>setTimeout(r,ms));

/* Scripted provider. Streams by *unit of the output type* — prose by clause,
   lists by item, tables by row — which is a small demonstration that the
   contract is typed all the way down rather than text pretending to be data. */
/* When the output type is overridden, the scripted value is RE-PRESENTED in
   the new shape — never regenerated. A demo that invented new content to fill
   a table you asked for would be lying about what the model would do. */
function reshape(v, to){
  const isTable = v && !Array.isArray(v) && typeof v === 'object' && v.cols;
  if (to === 'list'){
    if (Array.isArray(v)) return v;
    if (isTable) return v.rows.map(r => `**${r[0]}** — ${r.slice(1).join(' · ')}`);
    return String(v).split(/\n\n+/).filter(Boolean);
  }
  if (to === 'table'){
    if (isTable) return v;
    const rows = (Array.isArray(v) ? v : String(v).split(/\n\n+/)).filter(Boolean);
    return {cols:['—'], rows: rows.map(x=>[String(x)])};
  }
  if (Array.isArray(v)) return v.map(x=>`- ${x}`).join('\n');
  if (isTable) return v.rows.map(r=>`- **${r[0]}** — ${r.slice(1).join(' · ')}`).join('\n');
  return v;
}

async function runDemo(cell, bag, onDelta, signal){
  let value = cell.demo(bag);
  if (cell._reshapeTo) value = reshape(value, cell._reshapeTo);
  await sleep(180 + Math.random()*220);
  if (typeof value === 'string'){
    /* Reveal by slicing the original, never by re-joining fragments —
       re-joining silently eats paragraph breaks. */
    const stops = []; const re = /(?<=[.!?])\s+|\n\n+/g; let m;
    while ((m = re.exec(value))) stops.push(m.index + m[0].length);
    stops.push(value.length);
    for (const i of stops){ if(signal?.aborted) throw new Error('aborted');
      onDelta(value.slice(0, i)); await sleep(26 + Math.random()*48); }
    return value;
  }
  if (value && typeof value === 'object' && 'verdict' in value){
    await sleep(320); onDelta(value); return value;
  }
  if (Array.isArray(value)){
    const acc=[]; for(const it of value){ if(signal?.aborted) throw new Error('aborted');
      acc.push(it); onDelta([...acc]); await sleep(160 + Math.random()*180); }
    return acc;
  }
  const acc={cols:value.cols, rows:[]};
  for(const r of value.rows){ if(signal?.aborted) throw new Error('aborted');
    acc.rows.push(r); onDelta({cols:acc.cols, rows:[...acc.rows]}); await sleep(180 + Math.random()*160); }
  return acc;
}

const SHAPE = {
  prose:'Respond with plain prose. No preamble, no headings, no markdown fences.',
  markdown:'Respond in markdown. No preamble.',
  list:'Respond with a JSON array of strings and nothing else. No fences, no commentary.',
  table:'Respond with JSON of the form {"cols":["..."],"rows":[["..."]]} and nothing else. No fences, no commentary.',
  gate:'Respond with JSON of the form {"verdict":"continue"|"revise","reason":"...","revision":"..."} and nothing else. Use "revise" only if the work genuinely fails; put the improved version in "revision".'
};

function coerce(text, type){
  if (type==='gate'){
    const m = text.match(/\{[\s\S]*\}/);
    if (m){ try{
      const v = JSON.parse(m[0]);
      if (v?.verdict) return {verdict:v.verdict==='revise'?'revise':'continue', reason:String(v.reason??''), revision:String(v.revision??'')};
    }catch{} }
    return {verdict:'continue', reason:text.trim().slice(0,300), revision:''};
  }
  if (type==='prose' || type==='markdown') return text.replace(/^```[a-z]*\n?|\n?```$/g,'').trim();
  const m = text.match(/[\[{][\s\S]*[\]}]/);
  if (m){ try{ const v = JSON.parse(m[0]);
    if (type==='list' && Array.isArray(v)) return v.map(String);
    if (type==='table' && v?.cols && v?.rows) return v;
    if (type==='list' && v?.rows) return v.rows.map(r=>r.join(' — '));
  }catch{} }
  if (type==='list') return text.split('\n').map(l=>l.replace(/^\s*[-•*\d.]+\s*/,'').trim()).filter(Boolean);
  return {cols:['Result'], rows:[[text.trim()]]};
}

/* ── Transport helpers ──────────────────────────────────────────────── */
async function* sseLines(res){
  const reader = res.body.getReader(), dec = new TextDecoder(); let buf='';
  for(;;){ const {done, value} = await reader.read(); if (done) break;
    buf += dec.decode(value,{stream:true});
    const lines = buf.split('\n'); buf = lines.pop() ?? '';
    for (const line of lines){
      const s = line.trim();
      if (!s || s.startsWith(':')) continue;
      if (!s.startsWith('data:')) continue;
      const d = s.slice(5).trim();
      if (d === '[DONE]') return;
      try { yield JSON.parse(d); } catch {}
    }
  }
}
async function* ndjson(res){
  const reader = res.body.getReader(), dec = new TextDecoder(); let buf='';
  for(;;){ const {done, value} = await reader.read(); if (done) break;
    buf += dec.decode(value,{stream:true});
    const lines = buf.split('\n'); buf = lines.pop() ?? '';
    for (const line of lines){ if (!line.trim()) continue;
      try { yield JSON.parse(line); } catch {} }
  }
}
async function fail(res, label){
  const body = await res.text().catch(()=>'');
  let msg = body;
  try { const j = JSON.parse(body); msg = j.error?.message ?? j.message ?? body; } catch {}
  throw new Error(`${label} returned ${res.status}. ${String(msg).slice(0,200)}`);
}

/* ── Adapters. One shape in, text out. ──────────────────────────────── */
const ADAPTERS = {
  async chrome({sys, prompt, onText, signal}){
    const LM = self.LanguageModel ?? self.ai?.languageModel;
    if (!LM) throw new Error('This browser exposes no built-in model. Chrome 138+ on supported hardware does.');
    const avail = await (LM.availability?.() ?? LM.capabilities?.().then(c=>c.available) ?? 'unavailable');
    if (String(avail).includes('unavailable'))
      throw new Error('The built-in model is unavailable on this device — hardware requirements are not met.');
    if (String(avail) === 'downloadable' || String(avail) === 'downloading')
      throw new Error('The built-in model has not downloaded yet. Open Connect and download it first — it is a few gigabytes, so it should be your choice, not a side effect of pressing Run.');
    const session = await LM.create({ initialPrompts:[{role:'system', content:sys}] });
    try {
      if (session.promptStreaming){
        let acc = '';
        for await (const chunk of session.promptStreaming(prompt, {signal})){
          if (signal?.aborted) throw new Error('aborted');
          /* Chrome has shipped both cumulative and delta chunks. Handle both. */
          acc = (chunk.length >= acc.length && chunk.startsWith(acc)) ? chunk : acc + chunk;
          onText(acc);
        }
        return acc;
      }
      const out = await session.prompt(prompt, {signal}); onText(out); return out;
    } finally { session.destroy?.(); }
  },

  async ollama({sys, prompt, onText, signal, cfg}){
    let res;
    try {
      res = await fetch('http://localhost:11434/api/chat', { method:'POST', signal,
        headers:{'content-type':'application/json'},
        body: JSON.stringify({ model:cfg._model, stream:true,
          messages:[{role:'system',content:sys},{role:'user',content:prompt}] }) });
    } catch {
      throw new Error('Could not reach Ollama on localhost:11434. Either it is not running, or it is refusing this origin — start it with OLLAMA_ORIGINS set to allow this page. An https page also cannot call http://localhost at all.');
    }
    if (!res.ok) await fail(res, 'Ollama');
    let acc='';
    for await (const j of ndjson(res)){
      if (signal?.aborted) throw new Error('aborted');
      acc += j.message?.content ?? ''; onText(acc);
    }
    return acc;
  },

  async google({sys, prompt, onText, signal, cfg, key}){
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(cfg._model)}:streamGenerateContent?alt=sse`;
    /* Key travels in a header, never the query string. */
    const res = await fetch(url, { method:'POST', signal,
      headers:{'content-type':'application/json','x-goog-api-key':key},
      body: JSON.stringify({ systemInstruction:{parts:[{text:sys}]},
        contents:[{role:'user', parts:[{text:prompt}]}] }) });
    if (!res.ok) await fail(res, 'Google AI Studio');
    let acc='';
    for await (const j of sseLines(res)){
      if (signal?.aborted) throw new Error('aborted');
      for (const part of j.candidates?.[0]?.content?.parts ?? []) acc += part.text ?? '';
      onText(acc);
    }
    return acc;
  },

  async anthropic({sys, prompt, onText, signal, cfg, key}){
    const res = await fetch('https://api.anthropic.com/v1/messages', { method:'POST', signal,
      headers:{ 'content-type':'application/json', 'x-api-key':key,
        'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' },
      body: JSON.stringify({ model:cfg._model, max_tokens:2000, system:sys, stream:true,
        messages:[{role:'user', content:prompt}] }) });
    if (!res.ok) await fail(res, 'Anthropic');
    let acc='';
    for await (const j of sseLines(res)){
      if (signal?.aborted) throw new Error('aborted');
      if (j.type === 'content_block_delta' && j.delta?.text){ acc += j.delta.text; onText(acc); }
    }
    return acc;
  },

  /* Groq, OpenRouter and OpenAI all speak the same wire format. */
  async openaiCompatible({sys, prompt, onText, signal, cfg, key, label}){
    const res = await fetch(`${cfg.base}/chat/completions`, { method:'POST', signal,
      headers:{ 'content-type':'application/json', 'authorization':`Bearer ${key}` },
      body: JSON.stringify({ model:cfg._model, stream:true, messages:[
        {role:'system', content:sys},{role:'user', content:prompt}] }) });
    if (!res.ok) await fail(res, label);
    let acc='';
    for await (const j of sseLines(res)){
      if (signal?.aborted) throw new Error('aborted');
      acc += j.choices?.[0]?.delta?.content ?? ''; onText(acc);
    }
    return acc;
  }
};

const ADAPTER_FOR = { chrome:'chrome', ollama:'ollama', google:'google', anthropic:'anthropic',
  groq:'openaiCompatible', openrouter:'openaiCompatible', openai:'openaiCompatible' };

async function runLive(providerId, prompt, type, onDelta, onText, signal){
  const cfg = PROVIDERS[providerId];
  if (cfg.reach === 'blocked')
    throw new Error(`${cfg.label} does not permit browser requests (CORS). This is not a key problem — no credential changes it. Use the desktop build or a self-hosted deployment.`);
  const fn = ADAPTERS[ADAPTER_FOR[providerId]];
  if (!fn) throw new Error(`No adapter for ${cfg.label}.`);
  const runCfg = {...cfg, _model: modelOf(providerId)};
  const sys = `${SHAPE[type]}\nAnswer in ${LOCALES[S.locale].outputLanguage}.`;
  const structured = type === 'list' || type === 'table' || type === 'gate';
  const text = await fn({ sys, prompt, signal, cfg:runCfg, key:S.keys[providerId] ?? '', label:cfg.label,
    /* Prose streams straight into the cell. Structured output cannot be
       parsed half-formed, so its raw text streams into a progress view and
       the typed value lands once. */
    onText: acc => structured ? onText(acc) : onDelta(acc) });
  const value = coerce(text, type);
  onDelta(value);
  return value;
}

/* Operationalises ENG-BRIEF spike #1: does a browser actually reach this
   provider with this key? The only way to know is to try. */
async function testProvider(id){
  const cfg = PROVIDERS[id];
  if (id === 'demo') return {ok:true, msg:'Always available. No network involved.'};
  if (cfg.reach === 'blocked') return {ok:false, msg:'Blocked from any browser by CORS. Not a key problem.'};
  const t0 = performance.now();
  try {
    const out = await runLive(id, 'Reply with the single word: ready', 'prose', ()=>{}, ()=>{},
      AbortSignal.timeout(30000));
    return {ok:true, msg:`Reachable — ${Math.round(performance.now()-t0)} ms. Replied "${String(out).slice(0,40)}".`};
  } catch(e){ return {ok:false, msg:e.message || String(e)}; }
}

/* ═════════ packages/engine — run loop, variable bag, staleness
   NO DOM. NO FRAMEWORK. This is the seam that makes T3/T4/CLI cheap.
   ═════════ */

const producerOf = (nb, ref) => ref.startsWith('input.')
  ? null : nb.cells.find(c => eff(nb.id, c).output.name === ref)?.id ?? null;
const isOff = (nbId, cell) => !!editsFor(nbId)[cell.id]?.off;

/* Downstream closure of a cell. Trivially small graph on a linear list,
   but computed properly so branching cell types stay cheap to add later. */
function downstream(nb, cellId){
  const out = new Set(); const q=[cellId];
  while(q.length){ const cur=q.pop();
    for(const c of nb.cells){
      if (out.has(c.id) || c.id === cellId) continue;
      const deps = c.inputs.map(r=>producerOf(nb,r)).filter(Boolean);
      if (deps.includes(cur)){ out.add(c.id); q.push(c.id); }
    }
  }
  return [...out];
}

function renderPrompt(tpl, nb, run){
  return tpl.replace(/\{\{([\w.]+)\}\}/g, (_,ref)=>{
    if (ref === 'locale.outputLanguage') return LOCALES[S.locale].outputLanguage;
    const v = run.bag[ref];
    if (v == null) return '';
    if (typeof v === 'string') return v;
    if (Array.isArray(v)) return v.map(x=>`- ${x}`).join('\n');
    return [v.cols.join(' | '), ...v.rows.map(r=>r.join(' | '))].join('\n');
  });
}

const ready = (nb, cell, run) =>
  cell.inputs.every(r => run.bag[r] != null && String(run.bag[r]).length > 0);

async function execCell(nb, rawCell, run, onChange){
  const cell = eff(nb.id, rawCell);
  const cs = run.cells[cell.id];
  const providerId = resolveFor(cell);
  cs.state='running'; cs.error=null; cs.value=null; cs.raw=''; cs.via=providerId; onChange();
  const ctrl = new AbortController(); cs.ctrl = ctrl;
  const t0 = performance.now();
  try {
    const onDelta = v => { cs.value = v; cs.state='streaming'; onChange(); };
    const onText  = txt => { cs.raw = txt; cs.state='streaming'; onChange(); };
    const original = rawCell.output.type;
    const demoCell = cell.output.type !== original
      ? {...cell, _reshapeTo: cell.output.type} : cell;
    const value = providerId === 'demo'
      ? await runDemo(demoCell, {...run.bag, __pass: run.passes[cell.id] ?? 1}, onDelta, ctrl.signal)
      : await runLive(providerId, renderPrompt(cell.prompt, nb, run), cell.output.type,
                      onDelta, onText, ctrl.signal);
    cs.value = value; cs.raw=''; cs.state='done'; cs.ms = Math.round(performance.now()-t0);
    run.bag[cell.output.name] = value;
    /* Stale is a DISPLAY state, never an auto re-run. Never silently
       re-execute something the user paid for. (ENG-BRIEF §5.2) */
    for (const id of downstream(nb, cell.id)){
      const d = run.cells[id];
      if (d.state==='done' || d.state==='streaming') d.state='stale';
    }
  } catch(e){
    cs.state='error'; cs.error = e.message || String(e);
  } finally { cs.ctrl=null; onChange(); }
}

/* ── Recursion ───────────────────────────────────────────────────────────
   A gate cell judges the work so far and either lets the run continue or
   sends it back to an earlier cell with a revision. Per PRODUCT-BRIEF P1
   this is a CELL TYPE, not a change of topology: the notebook is still a
   linear list you read top to bottom. It just may run parts of it twice.

   Two rules make this safe rather than clever:
   - maxPasses is hard. When it is spent the gate continues anyway and says
     so, rather than looping or silently giving up.
   - Every pass is visible. Nothing re-runs without the reason on screen. */

const gateTargetIndex = (nb, cell) => nb.cells.findIndex(c => c.id === cell.gate.to);

async function runAll(nb, run, onChange){
  let i = 0, steps = 0;
  const HARD_CAP = nb.cells.length * 6;   // belt and braces against a cycle
  while (i < nb.cells.length && steps++ < HARD_CAP){
    const raw = nb.cells[i];
    if (isOff(nb.id, raw)){ i++; continue; }      // skipped cells are simply not run
    const cell = eff(nb.id, raw);
    if (!ready(nb, cell, run)) break;
    /* execCell must receive the RAW cell — it derives the effective one itself,
       and it needs the original to know whether the output type was overridden.
       Handing it the effective cell made the override invisible, so the demo
       returned its original shape while the cell claimed the new one. */
    await execCell(nb, raw, run, onChange);
    const st = run.cells[cell.id];
    if (st.state === 'error') break;

    if (cell.gate && st.value?.verdict === 'revise'){
      const passes = (run.passes[cell.id] ?? 1);
      if (passes < cell.gate.maxPasses){
        run.passes[cell.id] = passes + 1;
        /* The revision becomes the input the loop re-reads. */
        run.bag[cell.gate.writes] = st.value.revision;
        const back = gateTargetIndex(nb, cell);
        for (let k = back; k <= i; k++){
          const c = nb.cells[k];
          if (c.id !== cell.id) run.cells[c.id].state = 'idle';
          run.cells[c.id].pass = run.passes[cell.id];
        }
        onChange();
        i = back;
        continue;
      }
      st.exhausted = true;   // out of passes: continue, and say so
    }
    i++;
  }
  onChange();
}

/* Model output is untrusted input (ENG-BRIEF §6.2). Escape first, then
   allow a deliberately tiny inline subset. No raw HTML passthrough, ever.
   In the monorepo this becomes rehype-sanitize with a strict allowlist. */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inline = s => esc(s)
  .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')

function applyTheme(){
  const b = BRANDS[S.brand], html = document.documentElement;
  html.dataset.mode = S.mode;
  html.dir = LOCALES[S.locale].dir;
  html.lang = S.locale;
  for (const k of [...html.style].filter(k=>k.startsWith('--'))) html.style.removeProperty(k);
  for (const [k,v] of Object.entries({...(b.light||{}), ...(S.mode==='dark' ? (b.dark||{}) : {})}))
    html.style.setProperty(k, v);

  /* Type and density are layered ON TOP of the brand, so either can be
     changed without touching the other. */
  const ts = TYPESETS[S.typeset]?.tokens;
  if (ts) for (const [k,v] of Object.entries(ts)) html.style.setProperty(k, v);

  const d = DENSITY[S.density]?.scale ?? 1;
  if (d !== 1){
    for (const [tok, base] of [['--p-space-3',0.75],['--p-space-4',1],['--p-space-5',1.5],
                               ['--p-space-6',2],['--p-space-7',3]])
      html.style.setProperty(tok, `${(base*d).toFixed(3)}rem`);
    html.style.setProperty('--line', d < 1 ? '1.45' : d > 1 ? '1.7' : '1.55');
  } else html.style.setProperty('--line','1.55');
}

/* Counts come from the CURRENT result set, not the whole library, so a chip
   never offers a filter that would return nothing. */
function facetCounts(){
  const r = {}, c = {};

    if (!F.realm   || nb.realm   === F.realm)   c[nb.concept] = (c[nb.concept]??0)+1;
  }
  return {r, c};
}

}

            Object.keys(editsFor(nb.id)).length} cell${Object.keys(editsFor(nb.id)).length===1?'':'s'} changed.

        </p>`:''}
      </div>
      <div class="nb-actions">
        <button class="btn primary" id="run-all" ${busy?'disabled':''}>
